# cargo-fuzz targets for agent scripts. Outside the services workspace (cargo-fuzz builds with
# nightly and its own flags); run with
#   cargo +nightly fuzz run script_session -- -max_total_time=60
#   cargo +nightly fuzz run request -- -max_total_time=30
[package]
name = "trenova-scripts-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
monty-alloc = "=1.3.0"
serde_json = "1"
trenova-scripts = { path = ".." }

[patch.crates-io]
monty = { path = "../../../vendor/monty" }

[workspace]

[[bin]]
name = "script_session"
path = "fuzz_targets/script_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "request"
path = "fuzz_targets/request.rs"
test = false
doc = false
bench = false
