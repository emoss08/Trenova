# cargo-fuzz targets for Tariff. Outside the services workspace (cargo-fuzz builds with nightly
# and its own flags); run with
#   cargo +nightly fuzz run tariff_parse -- -max_total_time=60
#   cargo +nightly fuzz run tariff_format -- -max_total_time=60
#   cargo +nightly fuzz run tariff_check -- -max_total_time=60
#   cargo +nightly fuzz run tariff_evaluate -- -max_total_time=60
[package]
name = "trenova-rules-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
trenova-rules = { path = ".." }

[workspace]

[[bin]]
name = "tariff_parse"
path = "fuzz_targets/tariff_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tariff_format"
path = "fuzz_targets/tariff_format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tariff_check"
path = "fuzz_targets/tariff_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tariff_evaluate"
path = "fuzz_targets/tariff_evaluate.rs"
test = false
doc = false
bench = false
