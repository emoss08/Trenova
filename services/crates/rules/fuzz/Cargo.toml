# cargo-fuzz targets for the formula language service. Outside the services workspace
# (cargo-fuzz builds with nightly and its own flags); run with
#   cargo +nightly fuzz run formula_check -- -max_total_time=60
#   cargo +nightly fuzz run formula_format corpus/formula_format seeds/formula_format -- -max_total_time=60
# seeds/<target>/ holds the committed inputs (each a crash once found, kept so it stays fixed);
# corpus/ and artifacts/ are what a run writes, and are not committed.
[package]
name = "trenova-rules-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
trenova-rules = { path = ".." }

[workspace]

[[bin]]
name = "formula_check"
path = "fuzz_targets/formula_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formula_format"
path = "fuzz_targets/formula_format.rs"
test = false
doc = false
bench = false
