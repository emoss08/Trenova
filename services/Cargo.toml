[workspace]
resolver = "3"
members = ["imaging", "crates/*"]
exclude = ["tms", "postgres", "vendor", "imaging/fuzz", "crates/sandbox/fuzz", "crates/rules/fuzz", "crates/scripts/fuzz", "crates/edi/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "FSL-1.1-ALv2"
publish = false
repository = "https://github.com/emoss08/trenova"

[workspace.dependencies]
trenova-edi = { path = "crates/edi" }
trenova-imaging-core = { path = "crates/imaging-core" }
trenova-module-kit = { path = "crates/module-kit" }
trenova-proto = { path = "crates/proto" }
trenova-rules = { path = "crates/rules" }
trenova-sandbox = { path = "crates/sandbox" }
trenova-scripts = { path = "crates/scripts" }
trenova-service-kit = { path = "crates/service-kit" }

anyhow = { version = "1.0.100", default-features = false, features = ["std"] }
bytes = { version = "1.12", default-features = false, features = ["std"] }
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
fast_image_resize = { version = "6.1", default-features = false, features = ["std"] }
fax = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.9", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "server", "http1"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "tiff", "webp"] }
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
landlock = "0.4.7"
libc = "0.2.191"
libloading = "0.9"
libheif-rs = { version = "3.0", default-features = false }
monty = { version = "=1.3.0", default-features = false }
monty-alloc = { version = "=1.3.0", default-features = false }
monty-types = { version = "=1.3.0", default-features = false }
libwebp-sys = { version = "0.14.4", default-features = false, features = ["std", "parallel"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "rt-tokio"] }
pdf-writer = "0.15"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881"] }
prometheus-client = "0.25.1"
prost = { version = "0.14.4", default-features = false, features = ["std", "derive"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
regex-lite = { version = "0.1.9", default-features = false, features = ["std", "string"] }
prost-types = { version = "0.14.4", default-features = false, features = ["std"] }
protox = "0.10"
rust_decimal = { version = "1.43", default-features = false, features = ["std", "maths"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "net", "pipe", "thread", "mm", "param"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "multi_barcode_readers", "qrcode", "oned", "pdf417", "datamatrix", "aztec", "encoding_rs"] }
seccompiler = "0.5"
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "process"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["net"] }
tokio-util = { version = "0.7", default-features = false }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tonic = { version = "0.14.6", default-features = false, features = ["transport", "router", "codegen", "server", "channel", "tls-ring"] }
tonic-health = { version = "0.14.6", default-features = false }
tonic-prost = "0.14.6"
tonic-prost-build = { version = "0.14.6", default-features = false }
tonic-types = "0.14.6"
tower = { version = "0.5.3", default-features = false }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json", "env-filter", "registry", "ansi"] }

criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"

# Monty carries one patch until a release builds for wasm32-wasip1; see vendor/monty/TRENOVA.md.
[patch.crates-io]
monty = { path = "vendor/monty" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

# A service build that is fast to produce and close enough to release to run
# against: no LTO, parallel codegen, debug assertions off. `task rust:build-imaging`
# uses it; images and benchmarks use release.
[profile.service-dev]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = "none"
debug = "line-tables-only"

# The trenova-rules WebAssembly module (`task rust:wasm-rules`): release, tuned for size,
# since the browser downloads it and the server runs it in wazero.
[profile.wasm]
inherits = "release"
opt-level = "s"

# The trenova-scripts WebAssembly module (`task rust:wasm-scripts`): release, tuned for speed,
# since only the TMS runs it and an interpreter's time is in its dispatch loop.
[profile.wasm-server]
inherits = "release"
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 16
debug = "line-tables-only"
