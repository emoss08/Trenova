# Advisories the dependency scan accepts, each with why and until when.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = 2027-02-05
reason = "an unmaintained notice, not a vulnerability: atomic-polyfill comes in through postcard's heapless 0.7, which uses it only on targets without native atomics; none of ours lack them"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-05
reason = "an unmaintained notice with no affected function, not a vulnerability: chrono comes in through pdfium-render and rxing in the imaging worker and through monty and monty-types in the scripts crate, and the latest release of each (pdfium-render 0.9.5, rxing 0.9.4, monty 1.6.0) still requires chrono 0.4; the fix is those crates moving to jiff or time"
