{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#171717;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#fafafa;padding:32px 16px;">
<tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#ffffff;border:1px solid #ebebeb;border-radius:8px;">
<tr><td style="padding:32px 32px 8px 32px;font-size:15px;font-weight:600;letter-spacing:-0.01em;">{{.ProductName}}</td></tr>
<tr><td style="padding:8px 32px 32px 32px;font-size:14px;line-height:22px;">
{{template "content" .}}
</td></tr>
</table>
<p style="max-width:560px;margin:16px auto 0 auto;font-size:12px;line-height:18px;color:#8f8f8f;">You received this email because of activity on a {{.ProductName}} account. If this was not you, you can ignore it.</p>
</td></tr>
</table>
</body>
</html>{{end}}
