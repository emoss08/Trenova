# What the runtime does to a tool call's arguments before the tool sees them.
#
# aliases: aliasedArguments alone, which every read and write goes through.
# pipeline: what a tool receives, aliasing then holding the call to the whole
#   schema, checked on the function and end to end through Run. A case with
#   `want` reaches the tool with those arguments; one with `refused` never
#   reaches it, and the refusal names each listed path.
# malformed: calls whose argument text did not parse. The tool must not run.
aliases:
  - name: snake case names the required parameter
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
    args: {shipment_id: shp_1}
    want: {shipmentId: shp_1}
  - name: another capitalisation names the required parameter
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
    args: {ShipmentID: shp_1}
    want: {shipmentId: shp_1}
  - name: hyphens name the required parameter
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
    args: {shipment-id: shp_1}
    want: {shipmentId: shp_1}
  - name: a bare id fills the one missing id parameter
    schema:
      type: object
      properties: {shipmentId: {type: string}, note: {type: string}}
      required: [shipmentId]
    args: {id: shp_1, note: late}
    want: {shipmentId: shp_1, note: late}
  - name: a bare id is left alone when two id parameters are missing
    schema:
      type: object
      properties: {shipmentId: {type: string}, workerId: {type: string}}
      required: [shipmentId, workerId]
    args: {id: shp_1}
    want: {id: shp_1}
  - name: a bare id is left alone when the schema declares id
    schema:
      type: object
      properties: {id: {type: string}, shipmentId: {type: string}}
      required: [shipmentId]
    args: {id: rec_1}
    want: {id: rec_1}
  - name: nothing is renamed when every required parameter is present
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
    args: {shipmentId: shp_1, shipment_id: shp_2}
    want: {shipmentId: shp_1, shipment_id: shp_2}
  - name: a null required parameter counts as missing
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
    args: {shipmentId: null, shipment_id: shp_1}
    want: {shipmentId: shp_1}
  - name: an optional parameter is never a target
    schema:
      type: object
      properties: {shipmentId: {type: string}, note: {type: string}}
      required: [shipmentId]
    args: {shipmentId: shp_1, NOTE: late}
    want: {shipmentId: shp_1, NOTE: late}
  - name: a schema without properties leaves the arguments alone
    schema: {type: object}
    args: {shipment_id: shp_1}
    want: {shipment_id: shp_1}

pipeline:
  - name: arguments that fit reach the tool as sent
    schema:
      type: object
      properties: {subjectId: {type: string}, attemptSummary: {type: string}}
      required: [subjectId]
      additionalProperties: false
    args: {subjectId: shp_1, attemptSummary: no BOL}
    want: {subjectId: shp_1, attemptSummary: no BOL}
  - name: aliasing runs before the schema is checked
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
      additionalProperties: false
    args: {shipment_id: shp_1}
    want: {shipmentId: shp_1}
  - name: an argument the tool never declared is refused by name
    schema:
      type: object
      properties: {subjectId: {type: string}, attemptSummary: {type: string}}
      required: [subjectId]
      additionalProperties: false
    args: {subjectId: shp_1, attemptSummary: no BOL, runId: ar_made_up}
    refused: [runId]
  - name: a tenant the model names is refused
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
      additionalProperties: false
    args:
      shipmentId: shp_1
      organizationId: org_01JOTHERTENANT000000000000
      businessUnitId: bu_01JOTHERTENANT0000000000000
    refused: [organizationId, businessUnitId]
  - name: a tier the model asks for is refused
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
      additionalProperties: false
    args: {shipmentId: shp_1, autonomyTier: AutoExecute, heldBy: []}
    refused: [autonomyTier, heldBy]
  - name: the owner key is the runtime's and is set aside, never refused
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
      additionalProperties: false
    args: {shipmentId: shp_1, _owner: usr_other}
    want: {shipmentId: shp_1}
  - name: a missing required parameter is refused by name
    schema:
      type: object
      properties: {shipmentId: {type: string}, note: {type: string}}
      required: [shipmentId]
      additionalProperties: false
    args: {note: late}
    refused: [shipmentId]
  - name: a value outside the enum is refused
    schema:
      type: object
      properties:
        shipmentId: {type: string}
        priority: {type: string, enum: [Low, Normal, High, Urgent]}
      required: [shipmentId]
      additionalProperties: false
    args: {shipmentId: shp_1, priority: Critical}
    refused: [priority]
  - name: a value of the wrong type is refused
    schema:
      type: object
      properties:
        shipmentId: {type: string}
        occurredAt: {type: integer}
      required: [shipmentId]
      additionalProperties: false
    args: {shipmentId: shp_1, occurredAt: "2026-09-26T10:00:00Z"}
    refused: [occurredAt]
  - name: a nested key the tool never declared is refused at its path
    schema:
      type: object
      properties:
        shipment:
          type: object
          properties:
            moves:
              type: array
              items:
                type: object
                properties:
                  stops:
                    type: array
                    items:
                      type: object
                      properties:
                        locationId: {type: string}
                        type: {type: string, enum: [Pickup, Delivery]}
                        sequence: {type: integer}
                      required: [locationId, type]
                      additionalProperties: false
                required: [stops]
                additionalProperties: false
          required: [moves]
          additionalProperties: false
      required: [shipment]
      additionalProperties: false
    args:
      shipment:
        moves:
          - type: Linehaul
            stops:
              - {locationId: loc_1, type: Pickup, sequence: 0}
    refused: ["shipment.moves[0].type"]
  - name: a missing nested required value is refused at its path
    schema:
      type: object
      properties:
        shipment:
          type: object
          properties:
            moves:
              type: array
              items:
                type: object
                properties:
                  stops:
                    type: array
                    items:
                      type: object
                      properties:
                        locationId: {type: string}
                        type: {type: string, enum: [Pickup, Delivery]}
                        sequence: {type: integer}
                      required: [locationId, type]
                      additionalProperties: false
                required: [stops]
                additionalProperties: false
          required: [moves]
          additionalProperties: false
      required: [shipment]
      additionalProperties: false
    args:
      shipment:
        moves:
          - stops:
              - {type: Drop, sequence: "first"}
    refused:
      - "shipment.moves[0].stops[0].locationId"
      - "shipment.moves[0].stops[0].type"
      - "shipment.moves[0].stops[0].sequence"
  - name: an open schema keeps what it did not declare
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
      additionalProperties: true
    args: {shipmentId: shp_1, runId: ar_1}
    want: {shipmentId: shp_1, runId: ar_1}
  - name: a schema that does not close itself keeps what it did not declare
    schema:
      type: object
      properties: {shipmentId: {type: string}}
      required: [shipmentId]
    args: {shipmentId: shp_1, runId: ar_1}
    want: {shipmentId: shp_1, runId: ar_1}
  - name: a closed schema that declares nothing takes nothing
    schema:
      type: object
      additionalProperties: false
    args: {shipmentId: shp_1}
    refused: [shipmentId]
  - name: a numeral sent as text is read as the number
    schema:
      type: object
      properties: {shipmentId: {type: string}, limit: {type: integer}}
      required: [shipmentId]
      additionalProperties: false
    args: {shipmentId: shp_1, limit: "30"}
    want: {shipmentId: shp_1, limit: 30.0}
  - name: a lone value sent for a list is read as a list of one
    schema:
      type: object
      properties: {ids: {type: array, items: {type: string}}}
      required: [ids]
      additionalProperties: false
    args: {ids: shp_1}
    want: {ids: [shp_1]}
  - name: an enum value in another case is read as the declared one
    schema:
      type: object
      properties:
        shipmentId: {type: string}
        priority: {type: string, enum: [Low, Normal, High, Urgent]}
      required: [shipmentId]
      additionalProperties: false
    args: {shipmentId: shp_1, priority: urgent}
    want: {shipmentId: shp_1, priority: Urgent}
  - name: an optional parameter in another spelling is renamed
    schema:
      type: object
      properties: {shipmentId: {type: string}, note: {type: string}}
      required: [shipmentId]
      additionalProperties: false
    args: {shipmentId: shp_1, NOTE: late}
    want: {shipmentId: shp_1, note: late}
  - name: a null sent for an optional parameter is dropped
    schema:
      type: object
      properties: {shipmentId: {type: string}, note: {type: string}}
      required: [shipmentId]
      additionalProperties: false
    args: {shipmentId: shp_1, note: null}
    want: {shipmentId: shp_1}
  - name: a name sent where a record id was wanted is refused
    schema:
      type: object
      properties:
        customerId: {type: string, description: "The customer, from list_customers."}
      required: [customerId]
      additionalProperties: false
    args: {customerId: Acme Foods}
    refused: [customerId]

malformed:
  - name: text cut off by the output limit
    error: unexpected end of JSON input
  - name: a trailing comma
    error: "invalid character '}' looking for beginning of object key string"
  - name: a single-quoted object
    error: "invalid character '\\'' looking for beginning of object key string"
