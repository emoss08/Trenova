# Realistic requests and the capability that should answer each one first. A capability is an
# entity read (<entity>.list or <entity>.get, answered by records_query or record_get) or a
# specialized capability by name. The harness (capability_harness_test.go) scores search,
# calls per request, schema tokens per turn, false "not available" answers and proposals
# where a read was expected, and prints the table in docs/engineering/agent-capabilities.md.
#
# agent: universal (everything the person may do), dispatch, billing or safety (dedicated
# desks). denied: permissions the person lacks. status: what search must say about the
# expected capability (available, not_permitted, not_in_this_agent).
# includes: the related sections the answer needs from a get.
