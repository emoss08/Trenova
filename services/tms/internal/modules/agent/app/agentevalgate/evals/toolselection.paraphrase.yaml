  - request: what legs and charges sit under that PO
    expect: [order_get]
  - request: which partner transmissions got stuck
    expect: [edi_list_inbound_files]
  - request: show me exactly what the partner transmitted
    expect: [edi_get_inbound_file]
  - request: which electronic tenders are waiting on us
    expect: [edi_list_transfers]
  - request: is our electronic hookup with that shipper finished
    expect: [edi_get_partner]
  - request: what needs my attention right now
    expect: [exception_list_watchtower_items]
  - request: catch me up on this morning's summary
    expect: [insight_get_daily_briefing]
  - request: what have the automations been doing lately
    expect: [agent_list_runs, agent_get_run]
  - request: the rate the paperwork shows is right, keep it
    expect: [intake_accept_field]
  - request: take every reading the scan is sure about
    expect: [intake_accept_confident]
  - request: change the weight on this import to 42000 pounds
    expect: [intake_set_field]
  - request: make Acme the customer on this import
    expect: [intake_set_required_field]
  - request: tie the pickup to our Reno warehouse record
    expect: [intake_set_stop_location]
  - request: the delivery happens Tuesday at eight in the morning
    expect: [intake_set_stop_schedule]
  - request: add the consignee's warehouse as a new facility
    expect: [location_create]
  - request: which rating methods do we have
    expect: [formula_list_templates]
  - request: what shipment values can a rate formula reference
    expect: [formula_describe_language]
  - request: what would this pricing rule bill for that shipment
    expect: [formula_preview]
  - request: do the expectations in this formula still hold
    expect: [formula_run_tests]
  - request: write me a per mile rate with a floor of 350
    expect: [formula_propose]
nothing:
  - xyzzy plugh
  - quantum chromodynamics lattice
  - penguin sonnet
