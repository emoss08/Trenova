# Requests worded the way people talk, sharing no word with the name of the
# tool they need. Keyword ranking is measured on them and not gated; hybrid
# ranking is gated on them together with toolselection.yaml, against the
# hybrid floors in toolselection.floors.json. `nothing` lists requests no tool
# answers: find_tools must return nothing for them, by keyword and by meaning.
cases:
  - request: chase the shipper for paperwork
    expect: [shipment_request_documents]
  - request: who's out on leave this week
    expect: [worker_list_time_off]
  - request: is anyone's medical certificate about to lapse
    expect: [worker_list_credentials, worker_get_credential]
  - request: ping the trucker that pickup slipped to three
    expect: [worker_send_message]
  - request: let the buyer know we are running late
    expect: [customer_send_email]
  - request: freeze that load until we sort things out
    expect: [shipment_place_hold]
  - request: unfreeze that load, we are good to go
    expect: [shipment_release_hold]
  - request: how long can this operator legally keep rolling today
    expect: [worker_get_hos]
  - request: which power units are sidelined right now
    expect: [equipment_list_tractors]
  - request: who is the best person to haul this leg
    expect: [dispatch_rank_candidates]
  - request: offer this freight to outside haulers
    expect: [dispatch_create_tender, dispatch_create_tender_from_routing_guide, carrier_shop]
  - request: what is the going price to haul freight from Denver to Phoenix
    expect: [rate_quote, carrier_shop]
  - request: who still owes us money past thirty days
    expect: [invoice_list]
  - request: the client wired us funds, apply them to their bills
    expect: [receivable_post_customer_payment]
  - request: pull up what the broker wrote to our shared mailbox
    expect: [inbox_list_inbound_messages, inbox_get_inbound_message]
  - request: write back to that broker's note
    expect: [inbox_send_reply]
  - request: where are our rigs at the moment
    expect: [equipment_list_positions, shipment_get_tracking]
  - request: which loads are rolling out of the dock today
    expect: [shipment_list]
  - request: note down that Acme's dock shuts at four on Fridays
    expect: [agent_create_memory]
  - request: what have we jotted down about Acme before
    expect: [agent_list_memories]
  - request: storms threatening our lanes
    expect: [insight_list_weather_alerts]
  - request: sign off on Maria's vacation
    expect: [worker_approve_pto]
  - request: turn down the holiday she asked for
    expect: [worker_reject_pto]
  - request: forgive the waiting fee
    expect: [detention_waive]
  - request: log when the trucker pulled into the receiver
    expect: [dispatch_record_stop_actual]
  - request: how do I configure lane pricing grids
    expect: [agent_find_page]
  - request: chart revenue per client each month
    expect: [report_create_dashboard, report_run]
  - request: have a human look at this
    expect: [agent_raise_exception]
  - request: what's happening with safety scores on haulers we use
    expect: [carrier_list_intelligence_events, carrier_get_intelligence_event, carrier_acknowledge_intelligence_event, carrier_get]
  - request: which haulers lost their cover or operating permission lately
    expect: [carrier_list_intelligence_events, carrier_get_intelligence_event]
  - request: late deliveries last week and why
    expect: [exception_list_service_failures, exception_evaluate_service_failures]
  - request: book a new load for Acme out of Dallas
    expect: [shipment_create]
  - request: put Juan on the Houston leg with truck 42
    expect: [dispatch_assign_move]
  - request: who is dragging their feet paying us
    expect: [receivable_get_aging, receivable_list_collection_worklist, receivable_list_open_items]
  - request: which bills is this client still sitting on
    expect: [receivable_list_open_items, invoice_list]
  - request: send me everything this client was charged and what they paid back
    expect: [receivable_get_statement]
  - request: who do I phone about late money first
    expect: [receivable_list_collection_worklist]
  - request: what hit the books yesterday
    expect: [ledger_list_journal_entries]
  - request: break down that posting line by line
    expect: [ledger_get_journal_entry]
  - request: what bucket does diesel spend land in
    expect: [ledger_list_accounts]
  - request: which months are still open for posting
    expect: [ledger_list_fiscal_periods]
  - request: what is stopping us from finishing month end
    expect: [ledger_get_fiscal_close_blockers]
  - request: whose paychecks are ready to go out
    expect: [settlement_list_driver]
  - request: walk me through Juan's pay stub
    expect: [settlement_get_driver]
  - request: which trips has she been credited for
    expect: [settlement_list_pay_events]
  - request: what does he have coming that hasn't been paid out
    expect: [settlement_get_driver_earnings]
  - request: what's the trucker complaining about on his check
    expect: [settlement_get_dispute]
  - request: what do we owe the outside haulers this week
    expect: [settlement_list_carrier]
  - request: itemize what we're paying that hauler
    expect: [settlement_get_carrier]
  - request: which hauler bills don't agree with what we expected
    expect: [carrier_list_invoice_matches]
  - request: what pricing deals do we have with Acme
    expect: [rate_list_agreements]
  - request: what did we negotiate for the Chicago lane
    expect: [rate_get_agreement]
  - request: pull up the pricing grid behind that lane
    expect: [rate_get_matrix]
  - request: what are we adding for diesel right now
    expect: [rate_list_fuel_surcharge_programs]
  - request: which customer POs are still in progress
