# Questions about Trenova itself and the product guide pages agent_find_page
# should answer them from. A case passes top-1 when the first page is one of
# `expect`, and recall@5 when one of them is among the first five. Keyword and
# hybrid floors are in guideselection.floors.json, set with -update, never by
# hand. `nothing` lists questions no page answers.
cases:
  - request: how do I add a rate matrix
    expect: [/billing/configuration-files/rate-matrices]
  - request: where do I set up tariff grids for LTL
    expect: [/billing/configuration-files/rate-matrices]
  - request: where are the aged receivables
    expect: [/accounting/ar/aging]
  - request: how do I record a check a customer mailed us
    expect: [/accounting/ar/payments]
  - request: where do I match bank deposits
    expect: [/accounting/reconciliation/bank-receipts, /accounting/reconciliation/work-queue]
  - request: where do I book a manual journal entry
    expect: [/accounting/manual-journals]
  - request: profit and loss for last quarter
    expect: [/accounting/reports/income-statement]
  - request: where do I give someone access to billing
