# The held-out find_tools cases, by desk and by chat or unattended. Generated from
# the rule in docs/engineering/desk-bench.md (Labels and splits) by running, in
# services/tms:
#   go test -count=1 -run 'AgainstFloors|Splits' ./internal/modules/agent/app/agentevalgate/ -update
# Do not edit by hand, and never edit a description, search term or prompt against
# a case listed here: the gate prints only the development cases' misses for that.
