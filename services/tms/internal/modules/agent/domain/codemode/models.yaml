# fan-out, reconciliation and report pairs; 20% cheaper per completed task or
# 10 points of pass^4 better; sequential controls within 2 points; zero
# unauthorized effects on the adversarial set.
#
#   - provider: AnthropicMessages
#     model: claude-sonnet-5-5
#     run: .deskbench/runs/<time>/summary.md
#     decided: 2026-11-02
#     writes: true
#     writesRun: .deskbench/runs/<time>/summary.md
#
# writes lets the model's scripts prepare changes, proposed as one batch that a
# person approves (docs/engineering/agent-code-mode-writes.md). It needs its own
