# Every write a person can make in Trenova, and the agent tool that performs it or the
# reason none should. See docs/engineering/agent-write-coverage.md for the rule, the
# categories and how writes are found; regenerate that page after editing this file:
#   go generate ./internal/api/writecoverage/...
#
# Each entry takes exactly one of:
#   tools: [tool_name]                  an agent tool performs it
#   exempt: <category> + reason: <why>  no agent should (security, configuration,
#                                       user-preference, infrastructure,
#                                       agent-administration, counterparty, read-only,
#                                       attestation, duplicate)
#   pending: <what the tool would do>   no tool yet; counted, never failed
writes:
  # accessorialcharge
  "PATCH /api/v1/accessorial-charges/:accessorialChargeID/":
    exempt: configuration
    reason: "The accessorial charge catalog is a price list an administrator maintains; charges on a shipment use it."
  "POST /api/v1/accessorial-charges/":
    exempt: configuration
    reason: "The accessorial charge catalog is a price list an administrator maintains; charges on a shipment use it."
  "PUT /api/v1/accessorial-charges/:accessorialChargeID/":
    exempt: configuration
    reason: "The accessorial charge catalog is a price list an administrator maintains; charges on a shipment use it."

  # accountingcontrol
  "PUT /api/v1/accounting-controls/":
    exempt: configuration
    reason: "An organization-wide control an administrator sets once; every later write depends on it."

  # accountingsync
  "mutation applyAccountingInboundChange":
