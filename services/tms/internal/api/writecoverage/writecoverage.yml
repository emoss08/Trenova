  "mutation decideMyProposals":
    exempt: agent-administration
    reason: "Deciding what an agent proposed is the human check on agents; an agent cannot approve its own work."
  "mutation dismissAgentMemorySuggestion":
    exempt: agent-administration
    reason: "A person curating what agents remember; an agent writes memory through remember and agent_retire_memory."
  "mutation replayAgentRun":
    exempt: agent-administration
    reason: "Configures, evaluates or oversees the agents themselves; an agent doing it would be grading its own work."
  "mutation resolveAgentException":
    exempt: agent-administration
    reason: "An agent exception is an agent handing a case to a person; the person resolves it."
  "mutation reviewAgentMemory":
    exempt: agent-administration
    reason: "A person vouching for what an agent wrote after reading outside content; an agent clearing the taint on what it will read would undo the hold."
  "mutation setAgentMemoryStatus":
    tools: [agent_retire_memory]
  "mutation undoMyDecision":
    exempt: agent-administration
    reason: "Deciding what an agent proposed is the human check on agents; an agent cannot approve its own work."
  "mutation updateAgentControl":
    exempt: agent-administration
    reason: "The organization-wide switches and ceilings every agent runs under."
  "mutation updateAgentMemory":
    exempt: agent-administration
    reason: "A person curating what agents remember; an agent writes memory through remember and agent_retire_memory."

  # agent_profile
  "mutation addAgentOrganizationProfileGuidance":
    tools: [agent_guide_profile]
  "mutation addMyAgentProfileGuidance":
    tools: [agent_guide_profile]
  "mutation approveAgentOrganizationProfileGuidance":
    exempt: agent-administration
    reason: "An administrator keeping a line someone offered about the organization; an agent offers guidance through agent_guide_profile and never approves its own."
  "mutation dismissAgentOrganizationProfileGuidance":
    exempt: agent-administration
    reason: "An administrator turning down a line someone offered about the organization; an agent offers guidance through agent_guide_profile and never decides on it."
  "mutation regenerateAgentOrganizationProfile":
    exempt: agent-administration
    reason: "Asks for the organization's agent profile to be written again; agents read the profile, they do not decide when it is rewritten."
  "mutation regenerateMyAgentProfile":
    exempt: agent-administration
    reason: "Asks for a person's own agent profile to be written again; agents read the profile, they do not decide when it is rewritten."
  "mutation retireAgentOrganizationProfileGuidance":
    exempt: agent-administration
    reason: "A person curating what agents are told about the organization; an agent records guidance through agent_guide_profile and never retires what a person gave."
  "mutation retireMyAgentProfileGuidance":
    exempt: agent-administration
    reason: "A person curating what agents are told about their own work; an agent records guidance through agent_guide_profile and never retires what a person gave."

  # agentdefinition
  "DELETE /api/v1/agent-definitions/:agentID/":
    exempt: agent-administration
    reason: "Configures, evaluates or oversees the agents themselves; an agent doing it would be grading its own work."
  "POST /api/v1/agent-definitions/":
    exempt: agent-administration
    reason: "Configures, evaluates or oversees the agents themselves; an agent doing it would be grading its own work."
  "POST /api/v1/agent-definitions/preview-prompt/":
    exempt: read-only
    reason: "Renders an agent prompt for review and saves nothing."
  "PUT /api/v1/agent-definitions/:agentID/":
    exempt: agent-administration
    reason: "Configures, evaluates or oversees the agents themselves; an agent doing it would be grading its own work."
  "POST /api/v1/agent-definitions/dry-run/":
    exempt: read-only
    reason: "Tries a draft agent once with every write simulated; it saves and changes nothing."
  "mutation dismissAIProviderFailure":
    exempt: user-preference
    reason: "Puts away a notice on one person's own overview; it changes nothing anyone else sees."
  "mutation applyAITuneUp":
    exempt: agent-administration
    reason: "Applies a change to how agents and providers are set up that the runs suggested; it is the human check on AI setup."
  "mutation dismissAITuneUp":
    exempt: agent-administration
    reason: "Puts away a suggested change to AI setup; it changes no record an agent works on."
  "mutation restoreAITuneUp":
    exempt: agent-administration
    reason: "Brings back a suggested change to AI setup that was put away."
  "mutation restoreAIProviderFailure":
    exempt: user-preference
    reason: "Brings back a notice one person put away on their own overview."
  "mutation draftAgentFromDescription":
    exempt: read-only
    reason: "Asks a model to draft an agent from a description and returns the draft; it saves nothing, and saving it is the agent builder's create."
  "mutation tightenAgentInstructions":
    exempt: read-only
    reason: "Asks a model to shorten an agent's instructions and returns the text; it saves nothing."
  "mutation keepAgentTestPrompt":
    exempt: agent-administration
    reason: "Keeps a prompt a person tries an agent with in its builder; an agent has no use for keeping prompts to test itself."
  "mutation deleteAgentTestPrompt":
    exempt: agent-administration
    reason: "Removes a prompt a person kept in an agent's builder."
  "mutation setAgentAccess":
    exempt: security
    reason: "Decides which people may use which agents."
  "mutation setAgentUnattendedRole":
    exempt: security
    reason: "Decides what an agent may do when no person is present; an agent must not widen its own reach."
  "mutation setRoleAgentAccess":
    exempt: security
    reason: "Decides which roles may use which agents."
  "mutation updateAgentCapabilities":
    exempt: agent-administration
    reason: "Configures, evaluates or oversees the agents themselves; an agent doing it would be grading its own work."

  # agentextension
  "POST /api/v1/agent-extensions/:type/test/":
    exempt: read-only
    reason: "Tests the vendor credentials and returns the result."
  "PUT /api/v1/agent-extensions/:type/config/":
    exempt: agent-administration
    reason: "Configures a vendor account an organization turns on for its agents; it holds the vendor credentials."
  "POST /api/v1/agent-portals/sites/":
    exempt: agent-administration
    reason: "Adds a portal agents may read and act on, with its sign-in; an agent that could add one could choose where its own browser goes."
  "PUT /api/v1/agent-portals/sites/:siteID/":
    exempt: agent-administration
    reason: "Changes a portal's addresses, sign-in or whether agents may act on it, which bound what agents can reach; an agent must not widen its own reach."
  "DELETE /api/v1/agent-portals/sites/:siteID/":
    exempt: agent-administration
    reason: "Removes a portal from what agents may use, an administrator's decision about the agents themselves."
  "POST /api/v1/agent-portals/runs/:runID/sign-in-code/":
    exempt: security
    reason: "Relays a sign-in code a portal sent the person to the browser signing in for them; a second factor is given only by the person who received it, and never passes through an agent."
  "POST /api/v1/agent-web-watches/:watchID/stop/":
    tools: [web_stop_watch]
  "POST /api/v1/webhooks/agent-extensions/web-watches/:orgID/:buID/:watchID/":
    exempt: infrastructure
    reason: "A research vendor reporting a web watch's run, signed with the watch's secret; it only asks the watch to be checked now, and is not a person's decision."

