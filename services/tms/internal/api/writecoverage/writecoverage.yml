    reason: "Finishes the OAuth sign-in by choosing the company the authorization is for; a person holds the grant, never an agent."
  "mutation chooseAccountingSyncMode":
    exempt: configuration
    reason: "Chooses what the organization's accounting connection sends during setup; an administrator owns the connection and it is fixed once sync is enabled."
  "mutation clearAccountingMapping":
    tools: [accounting_clear_mapping]
  "mutation completeAccountingSetup":
    exempt: configuration
    reason: "Connects the organization to an outside system; an administrator owns the connection and its credentials."
  "mutation confirmAccountingMappings":
    tools: [accounting_confirm_mapping]
  "mutation createAccountingReferenceRecord":
    tools: [accounting_create_reference_record]
  "mutation connectAccountingWithCertificate":
    exempt: security
    reason: "Connects with a certificate an administrator uploaded in the accounting system's console; a person sets up the credential, never an agent."
  "mutation disconnectAccountingSystem":
    exempt: configuration
    reason: "Connects the organization to an outside system; an administrator owns the connection and its credentials."
  "mutation dismissAccountingDrift":
    tools: [accounting_dismiss_drift_finding]
  "mutation enableAccountingSync":
    exempt: configuration
    reason: "Connects the organization to an outside system; an administrator owns the connection and its credentials."
  "mutation finishAccountingAuthorization":
    exempt: security
    reason: "Handles the OAuth app and its credentials that let Trenova act in the accounting system."
  "mutation ignoreAccountingInboundChange":
    tools: [accounting_ignore_inbound_change]
  "mutation pauseAccountingSync":
    tools: [accounting_pause_sync]
  "mutation prepareAccountingCertificate":
    exempt: security
    reason: "Generates the key pair and certificate a person uploads in the accounting system's console to let Trenova act there."
  "mutation redateAccountingSync":
    tools: [accounting_redate_sync_record]
  "mutation refreshAccountingReferenceData":
    tools: [accounting_refresh_reference_data]
  "mutation rejectAccountingMapping":
    tools: [accounting_reject_mapping]
  "mutation releaseAccountingSync":
    tools: [accounting_release_sync_record]
  "mutation removeAccountingApp":
    exempt: security
    reason: "Handles the OAuth app and its credentials that let Trenova act in the accounting system."
  "mutation renewAccountingCertificate":
    exempt: security
    reason: "Swaps in a certificate a person uploaded in the accounting system's console; the credential is a person's act, never an agent's."
  "mutation requestAccountingBackfill":
    tools: [accounting_request_backfill]
  "mutation resolveAccountingDrift":
    tools: [accounting_resolve_drift_finding]
  "mutation resumeAccountingSync":
    tools: [accounting_resume_sync]
  "mutation retryAccountingSync":
    tools: [accounting_retry_sync_record]
  "mutation saveAccountingApp":
    exempt: security
    reason: "Handles the OAuth app and its credentials that let Trenova act in the accounting system."
  "mutation setAccountingMapping":
    tools: [accounting_set_mapping]
  "mutation skipAccountingSync":
    tools: [accounting_skip_sync_record]
  "mutation startAccountingAuthorization":
    exempt: security
    reason: "Handles the OAuth app and its credentials that let Trenova act in the accounting system."
  "mutation updateAccountingSyncSettings":
    exempt: configuration
    reason: "Connects the organization to an outside system; an administrator owns the connection and its credentials."

  # accountingwebhook
  "POST /api/v1/webhooks/accounting/:provider/":
    exempt: infrastructure
    reason: "An inbound webhook a provider calls with a signed token, not a person."

  # accounttype
  "PATCH /api/v1/account-types/:accountTypeID/":
    exempt: configuration
    reason: "The account types the chart of accounts is classified by for the financial statements; an accountant sets them up once and every account depends on them."
  "POST /api/v1/account-types/":
