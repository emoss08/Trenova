  "PUT /api/v1/account-types/:accountTypeID/":
    exempt: configuration
    reason: "The account types the chart of accounts is classified by for the financial statements; an accountant sets them up once and every account depends on them."

  # agent
  "mutation approveAgentMemorySuggestion":
    exempt: agent-administration
    reason: "A person curating what agents remember; an agent writes memory through remember and agent_retire_memory."
  "mutation commitMyDecisionNow":
    exempt: agent-administration
    reason: "Deciding what an agent proposed is the human check on agents; an agent cannot approve its own work."
  "mutation createAgentMemory":
    tools: [agent_create_memory]
  "mutation decideAgentPlan":
    exempt: agent-administration
    reason: "Deciding what an agent proposed is the human check on agents; an agent cannot approve its own work."
  "mutation decideAgentProposal":
    exempt: agent-administration
    reason: "Deciding what an agent proposed is the human check on agents; an agent cannot approve its own work."
  "mutation decideMyPlan":
