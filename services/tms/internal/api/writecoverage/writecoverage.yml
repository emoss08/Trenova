  # assistant
  "DELETE /api/v1/assistant/schedules/:scheduleID/":
    exempt: agent-administration
    reason: "Scheduling a conversation to run again is a person directing an agent's work; an agent that could schedule itself would set its own workload."
  "DELETE /api/v1/assistant/threads/:threadID/":
    exempt: agent-administration
    reason: "Talking to the assistant is how a person reaches an agent; agents hand work to one another through delegate_task instead."
  "DELETE /api/v1/assistant/threads/:threadID/case/":
    exempt: agent-administration
    reason: "A case is the person's own conversation: choosing which record it is about, or putting it out of sight until later, arranges their Desk and changes no record an agent acts on."
  "DELETE /api/v1/assistant/threads/:threadID/queue/:itemID/":
    exempt: agent-administration
    reason: "Arranging the messages a person queued for their own conversation; an agent never writes to a person's queue, and the messages reach it as the person's own words."
  "PATCH /api/v1/assistant/schedules/:scheduleID/":
