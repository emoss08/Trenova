# The agent tools that read through a persisted GraphQL operation. The
# operation each one reads is worked out by the rule in agentread/gen (the
# Desk's operation on the tool's root field, else the table's, else the only
# one); name an operation only to differ from the rule, with the reason.
# See docs/engineering/agent-graphql-reads.md.
reads:
  - tool: carrier_list
  - tool: carrier_get_intelligence_event
    operation: CarrierIntelEvent
    reason: The tool is named for the carrier it watches; its record is the event, read by carrierIntelEvent, which no rule finds from the name.
  - tool: customer_list
  - tool: location_list
  - tool: carrier_get
    operation: DeskCarrierCard
    reason: The carrier's own card; DeskCarrierIntel reads the same root for the intelligence panel.
  - tool: customer_get
    operation: DeskCustomerCard
    reason: The customer's own card; DeskCustomerUpdatePreferences reads the same root for the status update desk.
  - tool: customer_get_update_preferences
    operation: DeskCustomerUpdatePreferences
    reason: The tool reads one field set of the customer, its status update preference and recipients, which DeskCustomerCard does not select.
  - tool: location_get
  - tool: document_list_types
  - tool: ledger_list_fiscal_periods
  - tool: ledger_list_journal_entries
    operation: DeskJournalEntries
    reason: Every journal entry is read by journalEntries; journalReviewTable reads the same record but only the entries still waiting to be approved or posted.
  - tool: ledger_list_journal_reversals
  - tool: ledger_list_manual_journals
  - tool: ledger_get_journal_entry
    operation: DeskJournalEntryCard
    reason: The Desk's journal entry card, read by journalEntryCard, carries each line's account and the approval and reversal history the tool returns; journalEntry reads the bare entry.
  - tool: ledger_get_manual_journal
    operation: DeskManualJournalCard
    reason: The Desk's manual journal card, read by manualJournalCard, carries each line's account and the entries the journal became; no operation reads manualJournal alone.
  - tool: equipment_list_manufacturers
  - tool: equipment_list_tractors
  - tool: equipment_list_trailers
  - tool: equipment_get_tractor
  - tool: equipment_get_trailer
  - tool: equipment_list_positions
    operation: DeskVehiclePositions
    reason: The tool is named for positions, which no kind claims; its rows are each tractor's latest reading.
  - tool: equipment_list_types
  - tool: formula_list_templates
  - tool: formula_get_template
  - tool: formula_list_libraries
  - tool: formula_get_library
  - tool: fuel_list_cards
  - tool: fuel_list_purchases
  - tool: fuel_list_purchase_imports
    operation: DeskFuelPurchaseImports
    reason: A staged statement is the FuelPurchaseImportBatch record, read by fuelPurchaseImports.
  - tool: fuel_list_ifta_returns
    operation: DeskIftaReturns
    reason: The tool says IFTA where its record kind says ifta_return; the returns are read by iftaReturns.
  - tool: fuel_list_ifta_mileage_entries
    operation: DeskIftaMileageEntries
    reason: A mileage entry is the ifta_jurisdiction_mileage record, read by iftaMileageEntries.
  - tool: fuel_list_ifta_jurisdictions
    operation: DeskIftaJurisdictions
    reason: The jurisdictions fuel tax is reported by are one global list, read whole by iftaJurisdictions.
  - tool: location_list_categories
  - tool: masterdata_list_accessorial_charges
  - tool: masterdata_list_commodities
  - tool: masterdata_list_fleet_codes
  - tool: masterdata_list_hazardous_materials
  - tool: masterdata_list_hold_reasons
  - tool: masterdata_list_service_types
  - tool: masterdata_list_shipment_types
  - tool: worker_list
  - tool: worker_list_training_courses
  - tool: worker_list_time_off
    operation: WorkerPtoTable
    reason: Time off is the WorkerPTO record, read by workerPTOEntries.
  - tool: worker_list_checklists
    operation: DeskWorkerChecklists
    reason: A worker's checklists are read whole by workerChecklists, keyed by the worker.
    alongside: [DeskWorkerChecklistTemplates]
  - tool: worker_list_performance_reviews
    operation: DeskWorkerPerformanceReviews
    reason: A worker's reviews are read whole by workerPerformanceReviews, keyed by the worker.
    alongside: [DeskPerformanceReviewTemplates]
  - tool: worker_list_training
    operation: DeskWorkerTrainingRecords
    reason: A worker's training assignments are read whole by workerTrainingRecords, keyed by the worker.
  - tool: worker_list_dot_tests
    operation: DeskWorkerDotTests
    reason: Drug and alcohol tests are read by workerDotTests, one worker's or every worker's.
  - tool: worker_list_injuries
    operation: DeskWorkerInjuries
    reason: Injury cases are read by workerInjuries, one worker's or the whole log.
  - tool: worker_list_employment_verifications
    operation: DeskWorkerEmploymentVerifications
    reason: Previous employers are read by workerEmploymentVerifications, one driver's or every driver's.
  - tool: worker_list_leave_cases
    operation: DeskWorkerLeaveCases
    reason: Leave cases are read by workerLeaveCases, one worker's or every worker's.
  - tool: worker_list_safety_events
    operation: DeskWorkerSafetyEvents
    reason: Safety events are read by workerSafetyEvents, one worker's or every worker's.
    alongside: [DeskWorkerRecognitions]
  - tool: worker_list_credentials
    operation: DeskWorkerCredentialList
    reason: Credentials are read by workerCredentials, one worker's or those falling due across the organization.
    alongside: [DeskWorkerCredentialTypes]
  - tool: order_list
  - tool: order_get
    operation: DeskOrder
    reason: The agent reads an order with every leg it groups in one call; DeskOrderCard pages its legs through shipments.
  - tool: shipment_list_recurring
    operation: DeskRecurringShipments
    reason: Recurring shipments are the RecurringShipment record, read by recurringShipments, which no rule finds from the tool's name.
  - tool: exception_list_service_failure_reason_codes
  - tool: exception_list_service_failures
    operation: ServiceFailureTable
    reason: The register's row carries the version resolving a failure takes; DeskRecordFailures is one record's compact view without it.
  - tool: exception_get_service_failure
  - tool: detention_get_occurrence
    operation: DeskDetentionCard
    reason: A detention occurrence is read whole, with its evidence, notices and price now, by detentionOccurrence, which no rule finds from the tool's name.
    entity: github.com/emoss08/trenova/internal/modules/operations/domain/detention.DetentionOccurrence
  - tool: detention_list_occurrences
    operation: DeskDetentionOccurrences
    reason: The open clocks and the charges waiting on approval are read by detentionDesk, which no rule finds from the tool's name.
  - tool: dispatch_list_tenders
    operation: DeskShipmentTenders
    reason: A shipment's tenders are read whole by tendersByShipment, keyed by the shipment.
  - tool: accounting_get_connection
    operation: DeskAccountingConnection
    reason: The link to an accounting system is read by accountingSyncStatus, keyed by the system rather than by a record's id.
    alongside: [DeskAccountingSyncSummary]
  - tool: accounting_get_mapping
    operation: DeskAccountingMappingDetail
    reason: One mapping is read by accountingMappingDetail, named by its id or by what it maps, with the records it could be set to.
  - tool: accounting_get_sync_record
    operation: DeskAccountingSyncRecord
    reason: A sync record is a record kind of the accounting sync resource, read by accountingSyncRecord, which no rule finds from the resource.
    alongside: [DeskAccountingSyncAttempts]
  - tool: accounting_list_drift_findings
    operation: DeskAccountingDriftFindings
    reason: Drift findings are a record kind of the accounting sync resource, read by accountingDriftFindingTable for one accounting system.
    alongside: [DeskAccountingDriftOverview]
  - tool: accounting_list_inbound_changes
    operation: DeskAccountingInboundChanges
    reason: Inbound changes are a record kind of the accounting sync resource, read by accountingInboundChangeTable for one accounting system.
  - tool: accounting_list_mapping_gaps
    operation: DeskAccountingMappings
    reason: What still needs matching is the mappings in the Unmatched and Proposed states, read by accountingMappings.
    alongside: [DeskAccountingMappingSummary]
  - tool: accounting_list_sync_records
    operation: DeskAccountingSyncRecords
    reason: The sync ledger is read by accountingSyncRecords, whose typed filter matches the tool's; accountingSyncRecordTable reads the same records for the data table.
    instead: [DeskAccountingSyncObjectStates]
  - tool: edi_list_partners
    operation: DeskEdiPartners
    reason: A trading partner is a record kind of the EDI resource, read by ediPartners, which no rule finds from the resource.
  - tool: edi_list_inbound_files
    operation: DeskEdiInboundFiles
    reason: An inbound file is a record kind of the EDI resource, read by ediInboundFiles, which no rule finds from the resource.
  - tool: edi_list_transfers
    operation: DeskEdiTransfers
    reason: A load tender is a record kind of the EDI resource, read by ediTransfers one direction at a time, which no rule finds from the resource.
  - tool: edi_list_carrier_invoices
    operation: DeskEdiCarrierInvoices
    reason: A carrier invoice sent over EDI is read by ediCarrierInvoices under carrier invoice matching, which no rule finds from the record kind.
  - tool: edi_list_messages
    operation: DeskEdiMessages
    reason: Both Desk operations read ediMessages; DeskEdiPartnerMessages is one partner's messages on its card, and the tool lists every partner's.
  - tool: edi_get_partner
    operation: DeskEdiPartnerCard
    reason: A partner is read whole by ediPartnerCard, with its readiness, transports and activity, which no rule finds from the record kind.
  - tool: edi_get_inbound_file
    operation: DeskEdiInboundFile
    reason: An inbound file is read by ediInboundFile with the transaction sets parsed from it, a detail no rule finds from the record kind.
  - tool: edi_get_message
    operation: DeskEdiMessage
    reason: A message is read by ediMessage with its decoded document and findings, a detail no rule finds from the record kind.
  - tool: edi_get_transfer
    operation: DeskEdiTransfer
    reason: A load tender is read by ediTransfer with the mappings accepting it waits on, a detail no rule finds from the record kind.
  - tool: edi_get_ack_health
    operation: DeskEdiAckHealth
    reason: Acknowledgment health is read by ediAckHealth, keyed by its own arguments rather than a record's id.
  - tool: rate_list_agreements
    entity: github.com/emoss08/trenova/internal/modules/rating/domain/rateagreement.RateAgreement
  - tool: rate_get_agreement
    entity: github.com/emoss08/trenova/internal/modules/rating/domain/rateagreement.RateAgreement
  - tool: rate_list_fuel_index_prices
    operation: DeskFuelIndexPrices
    reason: A fuel index's prices are read whole by fuelIndexPriceHistory, keyed by the index.
  - tool: rate_list_fuel_surcharge_programs
    operation: DeskFuelProgramCurrentRates
    reason: The tool reads each active program's current rate, which fuelProgramCurrentRates computes, not the programs themselves.
  - tool: worker_get
  - tool: worker_get_credential
  - tool: worker_get_dot_random_draw
    operation: DotRandomDraw
    reason: A random testing round is a DOT random draw, read with its selections by dotRandomDraw, which no rule finds from the tool's name.
  - tool: worker_get_hos
    operation: WorkerHosState
    reason: A driver's hours of service are read by workerHosState, keyed by the worker; DeskWorkerHos reads the violations beside it, which the tool never returned.
  - tool: worker_get_schedule
    operation: WorkerShiftAssignments
    reason: A worker's schedule is read whole by workerShiftAssignments, keyed by the worker, with their stated availability and open swaps beside it.
    alongside: [WorkerAvailabilityPreferences, ShiftSwapRequests]
  - tool: worker_list_dot_random_draws
    operation: DotRandomDraws
    reason: Random testing rounds are read by dotRandomDraws, one pool's or every pool's, with the active pools beside them.
    alongside: [DotRandomPools]
  - tool: worker_list_shift_templates
    operation: ShiftTemplates
    reason: Shift patterns are read whole by shiftTemplates, which no rule binds because it does not page.
