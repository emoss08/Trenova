app:
  env: production
  debug: false

server:
  mode: release
  readTimeout: 30s
  readHeaderTimeout: 5s
  writeTimeout: 75s
  idleTimeout: 120s
  shutdownTimeout: 10s
  requestTimeout: 55s
  # server.trustedProxies defaults to loopback plus the private ranges, so a
  # reverse proxy on the same network is believed about the client IP and a
  # direct caller is not. When the API is reachable only through an edge that
  # overwrites its own client-IP header, name it here instead and
  # X-Forwarded-For is ignored entirely: cloudflare | google-app-engine | flyio.
  # trustedPlatform: cloudflare
  cors:
    enabled: true
    allowedOrigins:
      - https://trenova.app
      - https://app.trenova.app
      - https://cloud.trenova.app
    allowedMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowedHeaders:
      - Authorization
      - Content-Type
      - Accept
      - X-CSRF-Token
    credentials: true
    maxAge: 86400

database:
  sslMode: require
  maxIdleConns: 25
  maxOpenConns: 75
  statementTimeout: 10s
  lockTimeout: 5s
  idleInTransactionSessionTimeout: 30s

cache:
  poolSize: 50
  minIdleConns: 10

security:
  session:
    name: __Host-trenova_session
    secure: true # Force HTTPS cookies in production
    httpOnly: true
    sameSite: strict # Stricter CSRF protection
    path: /
    domain: ""
  rateLimit:
    requestsPerMinute: 30
  passwordReset:
    baseUrl: https://app.example.com # Origin the emailed reset link is built against. Not inferred from the request Host header; leave empty and no reset email is sent.
    tokenTtl: 30m # How long a reset link stays redeemable. It is a bearer credential sitting in a mailbox.
    maxRequestsPerHour: 5 # Reset links one account can be sent per hour, so the endpoint cannot flood an inbox.
  graphql:
    maxRequestBodyBytes: 1048576
    costBudget:
      enabled: true
      pointsPerMinute: 6000000
      burst: 3000000
  csrf:
    trustedOrigins:
      - https://trenova.app
      - https://app.trenova.app
      - https://cloud.trenova.app
    browserGuard:
      mode: enforce
  encryption:
    mode: envelope
    keyManager: gcp-autokey
    gcpKms:
      cryptoKey: projects/trenova-production/locations/us/keyRings/autokey/cryptoKeys/trenova-envelope
      credentialsMode: workload-identity
      timeout: 10s
      retryAttempts: 3

logging:
  level: info
  output: stdout

monitoring:
  metrics:
    enabled: true
    host: 127.0.0.1
    port: 9090
    path: /internal/metricsz
  health:
    path: /health
    readinessPath: /ready
    livenessPath: /live
  tracing:
    enabled: true
    provider: otlp
    endpoint: localhost:4317
    serviceName: trenova
    samplingRate: 1.0
  graphql:
    # Per-resolver metrics and spans stay off in production; enable temporarily
    # when investigating N+1 queries on a specific operation.
    resolverMetrics: false
    slowOperationAfter: 1s
    maxTrackedOperations: 2000

# HTML-to-PDF rendering sidecar. Must be reachable only from this process:
# internal network, no published port, never proxied.
renderer:
  gotenbergUrl: http://gotenberg:3000

system:
  # Instance-wide figures on the sign-in screen, served without a session. Off by
  # default: enabling it lets anyone who can load the login page read the shipment
  # volume and service level of every organization on this instance.
  networkPulse:
    enabled: false
    cacheTtl: 60s
