# Fast-reload variant of .air.toml for `task run-watch-fast`.
#
# Same build as .air.toml plus -ldflags='-s -w', which drops the symbol table
# and DWARF debug information. The link step is the largest part of a reload
# after a body-only edit, and a stripped link is markedly shorter.
#
# Delve cannot attach to this build: without DWARF there are no symbols or
# line tables to debug against. Use `task run-watch` when you need a debugger.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -tags nomsgpack -gcflags='github.com/emoss08/trenova/...=-N -l' -ldflags='-s -w' -o ./tmp/trenova-api-fast ./cmd/api"
bin = "./tmp/trenova-api-fast"
delay = 100
exclude_dir = ["assets", "tmp", "vendor", "ui", "platform", "microservices"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml"]
exclude_regex = ["_test\\.go"]
send_interrupt = false
stop_on_error = true
