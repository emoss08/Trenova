root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -tags nomsgpack -gcflags=all=-dwarf=false -gcflags='github.com/emoss08/trenova/...=-N -l -dwarf=false' -ldflags='-s -w' -o ./tmp/trenova-api ./cmd/api"
bin = "./tmp/trenova-api"
exclude_dir = ["assets", "tmp", "vendor", "ui", "platform", "microservices"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
follow_symlink = false
send_interrupt = true
stop_on_error = true
kill_delay = 2000
delay = 300

[log]
time = true

[misc]
clean_on_exit = true
