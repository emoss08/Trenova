root = "."
tmp_dir = "tmp"

[build]
# -N -l (no optimisation, no inlining) takes a resolver-edit reload from ~25s
# to ~17s and keeps private edits from changing a package's export data. It is
# scoped to first-party packages rather than `all=` so the stdlib and runtime
# stay optimised. -s -w leaves out the symbol table and DWARF, which only a
# debugger reads, so the linker writes less on every reload. Both apply only
# here and to run-worker-watch -- `task build-cli`, CI and the release image
# are unaffected.
#
# The reloaded server runs unoptimised code, so do not benchmark against it,
# and these flags key a separate build cache, so the first reload after
# changing them rebuilds every first-party package once.
cmd = "go build -tags nomsgpack -gcflags='github.com/emoss08/trenova/...=-N -l' -ldflags='-s -w' -o ./tmp/trenova-api ./cmd/api"
bin = "./tmp/trenova-api"
delay = 100
exclude_dir = ["assets", "tmp", "vendor", "ui", "platform", "microservices"]
include_ext = ["go", "tpl", "tmpl", "html", "yaml"]
exclude_regex = ["_test\\.go"]
send_interrupt = false
stop_on_error = true
