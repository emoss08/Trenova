      and moved the appointment. ServiceFailureDesk called shipment_get (detail full) twice and no
      result held a comment; it asked find_tools for "shipment comments list for a shipment" and
      was told nothing matched. It left the failure open ("the record does not show why").
    cause: >
      No tool lists a shipment's comments (the catalog has add, update, delete, pin, unpin and
      resolve). shipment_get folds in the 20 newest comments only when
      access.mayRead(ResourceShipmentComment) holds, and drops them with no word to the model
      when it does not, which is most likely the case under the template's unattended access.
      Confirm which by running the scenario as a chat turn of the same agent.
    fix: >
      Not fixed. Say in shipment_get's result when comments were left out for access, and either
      grant shipment_comment read to the templates that judge a load's history (ServiceFailureDesk,
      LoadMonitor, DetentionDesk) or add a shipment comment read with a paging cursor.
    files:
      - services/tms/internal/modules/agent/app/agentquerytoolservice/shipment_tools.go
      - services/tms/internal/modules/agent/domain/agentstarter/starters.go

