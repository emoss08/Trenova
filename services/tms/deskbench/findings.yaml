      SEED-SHP-001's missed pickup: 7 of 9 raise_exception calls were refused "this turn's tool
      budget of 12 is spent. Answer with what you have."
    cause: >
      The load monitor spends its twelve calls reading the board, and the budget check refused
      every call past it, the escalation included. For a run, ending "with what you have" means
      ending with nobody told.
