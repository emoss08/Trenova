  - id: DB-105
    title: Model requests carried the real clock and freshly minted ids, so recorded replays never matched
    status: fixed
    severity: medium
    area: agent runtime / eval cassettes
    found: 2026-10-10, TestCassetteReplay stale on every run
    problem: >
      OpenTurn read the real clock for the clock line, record ages and taint timestamps instead of the
      clock the context was built with, and filing results name a freshly minted proposal id, so every
      replay hashed differently and a real prompt change could not be told from noise.
    fix: >
      OpenTurn uses RuntimeContext.Now (turnNow), which production sets when the context is built; the
      cassette hash reads minted ids (ap_, apl_, art_, atrn_) by kind alone. Hashes refreshed after the
      requests were deterministic.
    fixedIn: uncommitted; two replays hash the same; TestHashRequest_IgnoresMintedIDsButNotRecordIDs
    files:
      - services/tms/internal/core/services/agentruntime/turn.go
      - services/tms/internal/core/services/agentevalgate/cassette.go

