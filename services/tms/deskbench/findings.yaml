  - id: DB-052
    title: Approvals the queue would refuse were proposed, and ones it would accept were called blocked
    status: fixed
    severity: high
    area: billing queue / approvals
    found: 2026-10-09, .deskbench/runs/20261009-215410-run and execution_error rows on agent_proposals
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      Four approve_billing_queue_item proposals today were approved by a person and then failed
      with "Settle the flagged check first": the tool's validation and preview checked detention
      holds but not open review issues, which the queue refuses on. The other way round,
      get_billing_queue_item said a ReadyForReview item "cannot be approved; it must be in review",
      though approving one takes it into review itself, so the agent gave up and sent the person to
      the queue page. Its description also said to propose only items "you reviewed and found
      clean", which kept Haiku from proposing an approval the person asked for in so many words.
    fix: >
      BillingQueueItem.OpenIssues lists unsettled flagged checks; approvalBlock (validate and
      preview, single and bulk) refuses on them, naming each. approvable() matches what the queue
      accepts: a waiting item is approvable, an open check or detention hold blocks. The approve
      descriptions: propose on your own only when clean; when the person asks, propose and say what
      could not be confirmed.
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-223506-run (approved from ReadyForReview, posted)
    files:
      - services/tms/internal/modules/billing/domain/billingqueue/review.go
      - services/tms/internal/modules/agent/app/agenttools/billingtools/billing_queue_decision_tools.go
      - services/tms/internal/modules/agent/app/agenttools/billingtools/preview_billing_decisions.go
      - services/tms/internal/modules/agent/app/agenttools/billingtools/approve_billing_queue_item.go
      - services/tms/internal/modules/agent/app/agenttools/invoicetools/invoice_bulk_tools.go
      - services/tms/internal/modules/agent/app/agentquerytoolservice/billing_queue_tools.go

  - id: DB-053
    title: A new organization could not post an invoice, and development had no fiscal year
    status: fixed
    severity: high
    area: accounting / onboarding
    found: 2026-10-09, .deskbench/runs/20261009-220717-run and 20261009-222354-run
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      Posting requires default receivable and revenue accounts. Tenant bootstrap set the receivable
      (1110), write-off and retained earnings accounts from the chart it creates, but never revenue,
      so every new organization's first post failed. The development seed also created no fiscal
      year, so posting failed again on "No fiscal period covers the invoice posting date", and the
      driver pay ledger seed silently skipped every entry.
    fix: >
      Bootstrap defaults revenue to 4010 Linehaul Revenue. Development seed FiscalYear opens the
      current calendar year with its monthly periods (GenerateMonthlyPeriods). Applied to the local
      database.
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-223506-run (invoice posted, load Invoiced)
    files:
      - services/tms/internal/infrastructure/postgres/tenantbootstrap/accounting.go
      - services/tms/internal/infrastructure/database/seeds/development/36_fiscal_year.go

