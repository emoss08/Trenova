  - id: DB-035
    title: Scenarios rotted as the seed aged and as runs approved real writes
    status: fixed
    severity: medium
    area: desk bench
    found: 2026-10-09, .deskbench/runs/20261009-164136-run
    scenarios:
      [
        assign-a-driver,
        reschedule-delivery,
        create-shipment-from-a-sentence,
        request-time-off,
      ]
    problem: >
      Seeded windows fell into the past ("the Dallas pickup window has already passed"), "Friday"
      became today, seeded time off covered the day a scenario asked for, and the lane a scenario
      named came to match several loads. Each turned a correct refusal or question into a failed
      case.
    fix: >
      A scenario can carry setup: single UPDATE, INSERT or DELETE statements the bench runs in one
      write transaction under the tenant's row-level scope before the case (no schema or grant
      statements). The write scenarios roll their load's windows forward from now, name a driver
      who is compliant and free, and say dates relative to the day.
