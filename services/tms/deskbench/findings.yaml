  - id: DB-155
    title: A created or updated record is not shown until the person asks for it
    status: fixed
    severity: medium
    area: Desk / artifacts
    found: 2026-10-11, reported in the Desk
    models: [gpt-6-luna, claude-haiku-5-5]
    scenarios: [shipment-from-scratch-with-a-new-customer, shipment-from-a-rate-confirmation-with-new-parties]
    problem: >
      After an approved create_shipment ran, the follow-up named the pro number and the person had
      to ask to see the shipment. Any create or update should show the record it wrote.
    cause: >
      Only a query result became a record card; an executed write produced none, so the model had
      nothing to point to and the follow-up turn never read the record again.
    fix: >
      An executed write, in the turn or as an approved proposal's follow-up, reads its record again
      through the record's get_ query tool (agentruntime.ReadRecord) and shows it as a linked card
      (written_cards.go); WrittenNote tells the model to point to it in the sentence that says what
      was done. Every write tool with a record ref gets one, not only shipments.
    files:
