  - id: DB-136
    title: The board called every past pickup "Late", hiding the one load actually late to deliver
    status: fixed
    severity: medium
    area: tool results / dispatch board
    found: 2026-10-10, .deskbench/runs/20261010-111436-run
    models: [claude-haiku-5-5, gpt-6-luna]
    scenarios: [note-on-a-load-approved, late-loads-this-morning]
    problem: >
      The board's urgency follows the pickup window, so a picked-up load reads Late whether or not it
      is behind on delivery. For "the late freshhaul reefer to LA" it showed SEED-SHP-010 (picked up,
      delivery window closed) beside ten unpicked FreshHaul reefers to Los Angeles, all eleven Late
      and Late defined only as a missed pickup, so Haiku asked which was meant and proposed no note.
      For "anything running late?" it reported 78 Late moves and listed 40, and gpt-6-luna named
      examples without the one Delayed load.
    fix: >
      In the agent's view of the board (the console is unchanged) each move carries lateTo, "pick up"
