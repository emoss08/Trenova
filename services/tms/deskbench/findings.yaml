  - id: DB-055
    title: explain_rate called a fuel surcharge program's charge unpriced; JSON sent as text was refused
    status: fixed
    severity: medium
    area: rating / argument contract
    found: 2026-10-09, .deskbench/runs/20261009-220717-run and 20261009-212705-run
    models: [claude-haiku-5-5]
