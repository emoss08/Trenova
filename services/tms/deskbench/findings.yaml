      - services/tms/internal/modules/agent/app/agentruntime/runner_test.go
      - docs/engineering/agent-runtime.md

  - id: DB-227
    title: The grounding guard's second reading re-flagged a figure the first found read
    status: fixed
    severity: medium
    area: agent runtime / grounding guard
    found: 2026-10-19, .deskbench/runs/20261019-154944-run
    models: [claude-haiku-5-5]
    scenarios: [correct-a-weight]
    problem: >
      A reply that said the commodity's unit weight is 2,000 lb, so 20 pieces come to 40,000 lb,
      was rewritten as naming "2,000" and "40,000" that the filed change does not hold, though
      shipment_get had returned "weightPerUnit":2000.
    evidence: >
      numberguard.SupportedFromTextAs on that JSON gives [20 2000 38000] read separated and
      [20 38000] read with codes apart: the stricter reading leaves out a bare year, and 2000
      looks like one.
    cause: >
      filedFigures and readFinding narrow the reply with ReadSeparated, then check the whole reply
      again with ReadCodesApart and return that second result, so a figure the first reading
      found read came back unread, and the working built on it (20 × 2,000) could not count.
    fix: >
      The second check only narrows the first (narrowed): it keeps a figure only if the first
      also found it unread, and the working's operands are the figures either reading found
      read. A figure nothing read is still caught (TestGroundingGuard_AFigureNoReadingSupportsIsStillCaught).
    files:
      - services/tms/internal/modules/agent/app/agentruntime/groundingguard.go
      - services/tms/internal/modules/agent/app/agentruntime/groundingguard_test.go
      - docs/engineering/agent-runtime.md
    fixedIn: >
      .deskbench/runs/20261019-165003-run: correct-a-weight 2/3 → 3/3; TestGroundingGuard_AReadQuantityThatLooksLikeAYearStaysRead pins it.

