  - id: DB-079
    title: A reassigned move could load its archived assignment or canceled carrier
    status: fixed
    severity: high
    area: shipments / repository
    found: 2026-10-10, reviewing fork A's note on carrier assignments
    problem: >
      A move keeps every assignment it had (archived driver assignments, canceled carrier
      assignments) beside its one live one, but the shipment repository joined Moves.Assignment and
      Moves.CarrierAssignment as plain has-one relations. With an archived duplicate present, a
      shipment read returned the archived assignment instead of the live one (confirmed against the
      local database in a rolled-back transaction), so a reassigned load could show its old driver
      or a canceled carrier.
    fix: >
      Both joins carry the live condition (assignment archived_at IS NULL; carrier assignment status
      not Canceled) through RelationOpts.AdditionalJoinOnConditions, matching what the move
      repository already hydrates.
    fixedIn: uncommitted; verified with a probe that fails without the condition and passes with it
    files:
      - services/tms/internal/modules/operations/adapters/postgres/shipmentrepository/helpers.go

