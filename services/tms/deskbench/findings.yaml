  - id: DB-022
    title: Three action tools refused every call because their schema held a null required list
    status: fixed
    severity: high
    area: agent tools / schemas
    found: 2026-10-09, .deskbench/runs/20261009-164136-run
    models: [gpt-6-luna, claude-haiku-5-5]
    scenarios: [random-drug-test-draw]
    problem: >
      run_dot_random_draw, create_invoice and record_training_completion have no required
      parameter. The receivable tool base wrote its nil required list as "required": null, which is
      not a JSON Schema, so the argument validator could not compile the schema and every call
      failed with "compile tool schema ... got null, want array". Both models then told the person
      the tool was broken. create_invoice is the step that turns delivered freight into a draft
      invoice, so no agent could invoice from the Desk at all.
    cause: >
      receivableTool.ParamSchema always set the required key; withSchema and receivableSpec leave
      it nil when nothing is required. Nothing compiled every tool's schema in CI.
    fix: >
      ParamSchema leaves required out when it is empty. toolschema.Compile is new, and
      TestEveryToolSchemaCompiles (agentevalgate) compiles every query and action tool's schema,
      so a schema the validator cannot read fails CI instead of every call. To verify in a run.
    files:
      - services/tms/internal/core/services/agenttoolservice/receivable_tool.go
      - services/tms/pkg/toolschema/validate.go
      - services/tms/internal/core/services/agentevalgate/catalog_schema_test.go
    fixedIn: .deskbench/runs/20261009-175153-run

