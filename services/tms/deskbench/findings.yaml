  - id: DB-174
    title: Any report reader can read a colleague's report run, including a private report's
    status: fixed
    severity: high
    area: reporting / permissions
    found: 2026-10-17, .deskbench/runs/20261017-223651-run and 20261017-225422-run
    models: [claude-haiku-5-5]
    scenarios: [analysis-colleague-report-run]
    problem: >
      Asked to analyze a run another user made of their own private report ("Journal entries, last
      30 days"), the Report analyst read 20 of its rows with get_report_run in 4 of 4 cases and
      answered from them, while describe_report on the same definition was refused ("no saved
      report ... that you can see") and analyze_data refused the run ("not one you ran for this
      person"). The agent tool only exposed it: the same run is served to anyone with report:read
      by the GraphQL reportRun query and the REST download.
    evidence: >
      transcript.md of both runs, get_report_run on rrun_01M52GQQW1STSZA14VFYTBPEK4 (requested by
      eric@trenova.app, definition rd_01M52E7JSQQ3M02TXYKTB5BS37, private) returned rows to
      admin@trenova.app.
    cause: >
      reportrepository.runRepository.GetByID filters by tenant only, and reporting.Service.GetRun,
      ReadRunRows and DownloadRun call it with no check on who ran the run or whether the caller
      may see its definition. A run is computed under its requester's data scope, so it can also
      carry rows the reader's own read scope would withhold.
    fix: >
      A run is read only by the person who ran it (a schedule's runs are its run-as person's):
      it holds what the report returned under that person's data scope and may be a run of their
      private report. reporting.Service.GetRun narrows runRepository.GetByID by RequestedBy, so
      another person's run reads as not found through GetRun, ReadRunRows, DownloadRun, CancelRun,
      the reportRun query, get_report_run, compare_report_runs and analyze_data alike; ListRuns
      and ListRunsConnection always list the caller's own, and a request with no person is
      refused. ReportRunsFilterInput.mineOnly is deprecated (every list is the caller's), and
      list_report_runs lost its mineOnly argument. Jobs keep reading runs through the repository.
    files:
      - services/tms/internal/modules/workspace/app/reporting/runs.go
      - services/tms/internal/modules/workspace/app/reporting/rows.go
      - services/tms/internal/modules/workspace/app/reporting/download.go
      - services/tms/internal/modules/workspace/adapters/postgres/reportrepository/run.go
      - services/tms/internal/modules/workspace/ports/reportports/report.go
      - services/tms/internal/modules/workspace/app/reporting/plan.go
      - services/tms/internal/api/graphql/schema/report.graphqls
      - services/tms/internal/api/graphql/resolver/reportresolver/report.resolvers.go
      - services/tms/internal/modules/agent/app/agentquerytoolservice/reportdiff_tools.go
      - docs/product-guide/reports/runs.md
    fixedIn: >
      uncommitted; verified by .deskbench/runs/20261017-231325-run and 20261017-231936-run
      (get_report_run on the colleague's run refused 6 of 6, no JE number in any reply)

  - id: DB-175
    title: Asked to analyze a report, agents describe run_report's sample instead of calling analyze_data
    status: fixed
    severity: high
    area: agent prompt / data analysis
    found: 2026-10-17, .deskbench/runs/20261017-223651-run and 20261017-225422-run
    models: [claude-haiku-5-5]
    scenarios:
      - analysis-ar-aging-asked-outright
      - analysis-explore-a-report
      - analysis-follow-up-revises-the-analysis
      - analysis-asked-from-ask
    problem: >
      "Run AR aging by customer and do analysis on it" reached analyze_data in 2 of 4 cases,
      "dig into it, anything interesting" in 0 of 4 (one reply said "I read the 20-row sample" of
      63 rows and drew conclusions from it), and "analyze who owes us the most" in 0 of 4. A
      person's own conversation needed "there is analysis that you can run" before the agent
      used it. Asked for a chart, it used analyze_data 4 of 4 times: only a chart reads as
      something no other tool does. From Ask (.deskbench/runs/20261017-230021-run), told "last
      90 days" after asking for the window, it ran the revenue report and then paged
      list_shipments to compare periods by hand in 3 of 3 cases; there analyze_data is only
      callable after find_tools, and it never loaded it.
    cause: >
      Every agent's base rules (agentdefinition/prompt.go) say "Do not calculate ... If answering
      would need arithmetic the tools did not do for you, say what you would need instead of
      estimating it", the Report analyst's instructions add "never calculate what the report did
      not", and run_report's note calls the sample rows "for answering questions about it; the
      rest are in the download". None says that analyze_data is the tool that does the
      arithmetic and reads every row, so an agent holding it treats the sample as the answer.
    fix: >
      trenovaRules(tools) gives an agent that holds analyze_data a calculation rule that sends
      every figure no tool stated, and every request to analyze, explore, compare or chart, to
      analyze_data in that turn, and says it holds over saved instructions about calculating; an
      agent without it keeps the old rule, so its prompt is unchanged. The rule depends only on
      the held tools, so the cached prompt stays stable. run_report and get_report_run call a
      partial sample "not the data to total, count, rank or compare". A new relation, Follows
      (agentports.FollowerTool, Catalog.Followers), loads analyze_data whenever run_report,
      get_report_run or read_attachment loads, for an agent that already holds it, granting
      nothing. analyze_data's description says it is how the agent calculates. The Report
      analyst template no longer says "never calculate what the report did not".
    files:
      - services/tms/internal/modules/agent/domain/agentprompt/prompt.go
      - services/tms/internal/modules/agent/domain/agentpreset/focused_templates.go
      - services/tms/internal/modules/agent/app/agentquerytoolservice/report_tools.go
      - services/tms/internal/modules/agent/app/agentquerytoolservice/analysis_tool.go
      - services/tms/internal/modules/agent/ports/agentports/agenttool.go
      - services/tms/internal/modules/agent/app/agenttoolcatalog/catalog.go
      - services/tms/internal/modules/agent/app/agentruntime/toolset.go
    fixedIn: >
      uncommitted; verified by .deskbench/runs/20261017-231325-run and 20261017-231936-run:
      asked-outright, explore-a-report and chart 3/3 each, asked-from-ask 3/3,
      follow-up-revises-the-analysis 3/3, and not-needed-for-a-lookup 3/3 (no analysis for a
      figure a row states). The local Report analyst still carries the old saved instruction,
      so the rule held over it.

  - id: DB-176
    title: A CSV attachment sent with a charset parameter is refused as a file type
    status: fixed
    severity: medium
    area: documents / upload
    found: 2026-10-17, .deskbench/runs/20261017-223651-run
    models: [claude-haiku-5-5]
    scenarios: [analysis-attached-spreadsheet, analysis-file-from-another-conversation]
    problem: >
      Attaching fuel-purchases-q3.csv failed with "File type is not allowed", so analyze_data
      could not be given a file at all. text/csv is on the allow list; the upload's Content-Type
      was text/csv; charset=utf-8.
    cause: >
      documentservice.Validator compared the whole Content-Type header with the allow list, so
      any media type parameter refused an allowed type, and the upload stored that raw header as
      the document's FileType, where isActiveContentType, previews and the docling extension
      switch compare it exactly.
    fix: >
      fileutils.MediaType reads the media type alone (lower-cased, no parameters); the validator
      checks that against the allow list and the upload stores it as FileType.
    files:
      - shared/fileutils/mediatype.go
      - services/tms/internal/modules/documents/app/documentservice/validator.go
      - services/tms/internal/modules/documents/app/documentservice/service.go
    fixedIn: uncommitted; verified by .deskbench/runs/20261017-225422-run (both attachment scenarios 3/3)

  - id: DB-177
    title: analyze_data accepts JSON files that a person cannot attach
    status: fixed
    severity: low
    area: data analysis / documents
    found: 2026-10-17, reading the upload allow list after DB-176
    models: []
    scenarios: []
    problem: >
      analyze_data's schema and agent-data-analysis.md say a dataset may be a CSV, XLSX, JSON or
      text file the person attached, but application/json is not on the default upload allow list
      (StorageConfig.GetAllowedMIMETypes), so a JSON attachment is refused before it can be read.
    fix: >
      analyze_data reads what a person can attach: CSV, XLSX and text. JSON is gone from
      analysisExtensions, the refusal message, the documentId schema, the sandbox prelude and
      agent-data-analysis.md. Allowing application/json on every upload surface was the
      alternative, and is a wider decision than this finding.
    files:
      - services/tms/internal/infrastructure/config/config.go
      - services/tms/internal/modules/agent/app/agentquerytoolservice/analysis_tool.go
      - services/tms/internal/modules/agent/app/agentextensionservice/analysis.go
      - services/tms/internal/modules/agent/app/agentextensionservice/analysis_prelude.py
      - docs/engineering/agent-data-analysis.md
    fixedIn: uncommitted; verified by .deskbench/runs/20261017-233305-run (attachment scenarios 3/3)

  - id: DB-178
    title: Analysis tables tag every column with a currency and show a stray index column
    status: fixed
    severity: low
    area: data analysis / prelude
    found: 2026-10-17, .deskbench/runs/20261017-223651-run
    models: [claude-haiku-5-5]
    scenarios: [analysis-chart-asked-for, analysis-not-needed-for-a-lookup]
    problem: >
      A show_table of a report's columns returned "currency":"USD" on text, count and datetime
      columns alike, and a table of a sorted or filtered frame gained an "index" column of row
      positions that the person reads as data.
    cause: >
      AnalysisColumnSpec.Currency is set from column.Display.Currency for every column, not only
      money ones; show_table resets any index that is not a RangeIndex, which a sort or filter
      leaves behind even when the index is unnamed row positions.
    fix: >
      agentextension.AnalysisCurrency keeps a currency on money alone; the column specs a run is
      loaded with, bounded tables and bounded figures all go through it. show_table resets an
      index only when it holds values (a name, several levels, or labels that are not whole
      numbers), so a sort or filter no longer adds an "index" column.
    files:
      - services/tms/internal/modules/agent/app/agentquerytoolservice/analysis_tool.go
      - services/tms/internal/modules/agent/app/agentextensionservice/analysis_prelude.py
      - services/tms/internal/modules/agent/domain/agentextension/analysisresult.go
    fixedIn: >
      uncommitted; verified by .deskbench/runs/20261017-233305-run (26 analyses: no index column,
      11 currency tags, all on money columns) and TestAnalysisCurrencyIsOnlyMoneys

