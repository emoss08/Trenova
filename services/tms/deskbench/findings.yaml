  - id: DB-246
    title: The bench runs against whatever data the database holds, and the volume seed breaks a third of it
    status: open
    severity: high
    area: deskbench / environment
    found: 2026-10-27, .deskbench/runs/20261027-full
    models: [claude-haiku-5-5]
    scenarios:
      - late-loads-this-morning
      - ready-to-invoice
      - analysis-not-needed-for-a-lookup
      - analysis-figure-checked-against-the-database
      - codemode-past-sixty-by-customer
      - codemode-whats-down-in-the-fleet
      - codemode-late-loads-with-etas
      - codemode-delayed-loads-holds-and-comments
      - request-time-off
      - assign-a-driver
      - approve-pending-time-off
      - weekly-driver-settlement
      - ifta-quarter
      - unattended-credentials-carlos-mvr-review-due-in-a-month
    problem: >
      The local database held the volume seed (10,041 shipments, 113 Delayed, 218 customers with
      open AR, hundreds of tractors) and writes from earlier bench runs. Scenarios written for the
      fixture seed then fail on correct answers: a fact listing "each delayed pro number" has 113
      rows; "carlos" and "david" match several drivers, so the agent rightly asks; Jane Doe has 22
      pending PTO requests; Carlos already has last week's draft settlement and Q3's IFTA return
      is finalized, so the agent rightly refuses to generate another; Carlos's credentials are
      gone. Three environment gaps fail nine more: every web extension (Exa, Parallel, BrowserUse)
      is disabled with no API key (eight portal cases); the one email profile is neither default
      nor assigned, so detention_send_notice is refused (four detention cases); Acme's Lading
      project has no active version (edi-preview-214).
    fix: >
      Not fixed. The bench should check the database before a run and refuse (or warn loudly)
      when it is not the fixture seed it was written for: shipment count, a volume-seed marker,
      a default email profile, an active Lading version. Better, give the bench its own database
      (`trenova-devdb` seeded with fixtures only, reset per run) so earlier approvals never leak
      into a later run. Scenarios that read one record (settlement, IFTA, credentials) need setup
      that puts it back, as the write scenarios already do.

