  - id: DB-049
    title: The pickup arrival and departure could not be proposed together
    status: fixed
    severity: high
    area: dispatch / stop actuals
    found: 2026-10-09, .deskbench/runs/20261009-211526-run
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      Dispatchers report both at once ("got there 5:50, left 7:05"). record_stop_actual took one
      event, and the departure's preview checked today's state, where the arrival had not happened
      yet, so it was refused ("Arrive at this stop before departing"). The pickup took two approval
      rounds and the delivery was never recorded.
    fix: >
      RecordStopActualRequest takes an optional DepartedAt with an Arrive: both are planned and
      written in one transaction (no stop left arrived and not departed if the second write
      failed), both events are published and the detention candidate is flagged. It must be at or
      after the arrival, not in the future, and needs the arrival time. The tool gains departedAt
      and the preview names both.
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-214446-run (arrival and departure proposed in one call, load Completed)
    files:
      - services/tms/internal/core/ports/repositories/shipmentmove.go
      - services/tms/internal/core/services/shipmentmoveservice/stopactual_plan.go
      - services/tms/internal/core/services/shipmentmoveservice/stopactuals.go
      - services/tms/internal/core/services/agenttoolservice/move_tools.go
      - services/tms/internal/core/services/agenttoolservice/preview_moves.go

  - id: DB-050
    title: Every driver was "infeasible" for a load whose pickup window had already passed
    status: fixed
    severity: high
    area: dispatch / candidate ranking
    found: 2026-10-09, .deskbench/runs/20261009-212705-run
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      A load entered after it ran has a pickup window in the past. rank_move_candidates projected
      each driver's arrival from now, found every one a day late, and marked them all infeasible, so
      Haiku would not assign the driver the person named. The comparison says nothing: everyone is
      equally late to a window already gone. An unknown slack also read as 0 and gave "tight".
      Separately, list_trailers never showed a trailer's equipment type, so "a dry van" could not be
      matched, and the seed called the dry van type "Standard semi-trailer".
    fix: >
      A window that closed before now is not judged for lateness: one Warn finding
      (move.window_passed) says so, the verdict ignores slack, and the agent view omits
      minutesOfSlack when it is unknown (CandidateScore.SlackKnown). list_trailers and list_tractors
      carry equipmentType (code and description); the seed's type reads "Dry van (standard enclosed
      semi-trailer)". A base prompt rule: when the person names exactly what to change, propose it
      and put what stands against it beside the proposal; a kind ("a dry van") is chosen, not asked.
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-215410-run (David Park on TRC-001 with a dry van proposed and approved)
    files:
      - services/tms/internal/core/services/dispatchcandidateservice/service.go
      - services/tms/internal/core/services/dispatchcandidateservice/score.go
      - services/tms/internal/core/services/dispatcheligibility/finding.go
      - services/tms/internal/core/services/agentquerytoolservice/dispatch_tools.go
      - services/tms/internal/core/services/agentquerytoolservice/listcatalog.go
      - services/tms/internal/core/domain/agentdefinition/prompt.go
      - services/tms/internal/infrastructure/database/seeds/development/06_test_data.go

