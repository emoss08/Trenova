  - id: DB-157
    title: An identifier with no hint of its kind is looked for in the wrong place
    status: open
    severity: medium
    area: agent tools / record lookup
    found: 2026-10-12, .deskbench/runs/20261012-230713-run
    models: [gpt-6-luna, claude-haiku-5-5]
    scenarios: [palette-shipment-by-pro-number]
