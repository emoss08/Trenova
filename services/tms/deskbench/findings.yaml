  - id: DB-020
    title: gpt-6-luna fills optional ids with placeholders
    status: fixed
    severity: low
    area: agent runtime / argument contract
    found: 2026-10-09, runs 2-4
    models: [gpt-6-luna]
    problem: >
      gpt-6-luna sends "x", "n/a" or an id with a trailing comma in optional id parameters
      (list_time_off workerId "x", "n/a"; get_customer_statement "cus_…,"), each a refused call
      and a retry. The refusal says what is wrong and it recovers, at the cost of a call.
    fix: >
      The argument contract reads a placeholder ("x", "n/a", "na", "none", "null", "nil", "-",
