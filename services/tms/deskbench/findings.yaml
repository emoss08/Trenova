  - id: DB-220
    title: A fact whose truth is zero failed a reply that said "no" or "none"
    status: fixed
    severity: low
    area: deskbench / checks
    found: 2026-10-19, .deskbench/runs/20261019-133049-run (Pass 2)
    models: [claude-haiku-5-5]
    scenarios: [ready-to-invoice]
    problem: >
      "No delivered shipments are waiting to be transferred to billing" failed "truth 0; missing
      from reply: 0", though the scenario's note says an empty group need not be named as zero.
    cause: statesInWords read 0 only as "zero".
    files:
      - services/tms/internal/deskbench/checks.go
      - services/tms/internal/deskbench/checks_test.go
    fix: >
      A zero is stated by zero, none or nothing, or by "no" directly before a noun ("no loads", "no delivered shipments"); "no problem", "no worries", "no longer" and a bare "no" are not counted (notCounted), so "no problem, there are 3" does not pass a fact of zero.
    fixedIn: >
      .deskbench/runs/20261019-154944-run: ready-to-invoice 0/1 → 3/3 with the tightened matcher; TestReplyStates_ReadsASmallCountInWords holds both directions.

