    models: []
    scenarios: []
    problem: >
      The artifact summary query wrote its empty-object fallback as '{}'::jsonb inside a
      buncolgen Column.Expr template, which replaces every {} with the column, so Postgres was sent
      'aart.payload'::jsonb and refused every artifact list read.
    fix: >
