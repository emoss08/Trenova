      from agent runs: "I found no agent runs that mention HARBOR Line Foods". The palette never
      looked at the shipment or the customer.
    cause: >
      askAgent sent a quick question to the general assistant when it was enabled and otherwise
      to the first chat agent the list returned, ordered by name. With the general assistant off,
      that was the Agent Activity Desk, which holds only list_agent_runs and get_agent_run. The
      general assistant itself held no record tools, so turning it on would not have helped.
    fix: >
