  - id: DB-061
    title: The approval card's preview of a driver assignment always failed
    status: fixed
    severity: medium
    area: dispatch / previews
    found: 2026-10-09, .deskbench/runs/20261009-233510-run
    models: [claude-haiku-5-5]
    problem: >
      Planning an assignment reads the organization's capabilities FOR SHARE (to close the
      capability-disable race), and the decision-time preview runs in a read-only snapshot, so
      "cannot execute SELECT FOR SHARE in a read-only transaction" and the card fell back to the
      raw parameters.
