  - id: DB-147
    title: An attached file could not be read, and a re-uploaded one was answered with "no file attached"
    status: fixed
    severity: critical
    area: agent runtime / attachments, document intelligence
    found: 2026-10-11, conversation athr_01M4PCCB687N678JGPND2SFXP6 (Shipment Assistant, gpt-6-luna)
    models: [gpt-6-luna, claude-haiku-5-5]
    scenarios: [rate-confirmation-attached-and-reattached]
    problem: >
      Asked to build a shipment from an attached C.H. Robinson rate confirmation, the agent said
      the file only showed "Van, minimum 53 ft" and asked for a re-upload; given the file again it
      answered twice that no file was attached.
    evidence: >
      The stored text was 11,821 characters over 4 pages, classified RateConfirmation at 0.99, but
      the prompt carried its first 1,200 characters, which are the confirmation's terms. The agent
      held no get_document_summary, find_tools could not load one, and the deterministic parse had
      found only the equipment type.
    cause: >
      Files were a section of the system prompt for the turn they came with and nowhere after it,
      read as a 1,200-character excerpt behind a tool an agent made in AI Control need not hold. A
      native PDF's text was in content-stream order, putting the terms first and every label away
      from its value, and pdfium's rect mode doubled and spaced the glyphs of a browser-printed PDF.
    fix: >
      The files ride on the message they came with (agentmessage.DescribeAttachments), with up
      to 24,000 characters of text, and every later turn replays the message with the files named.
      read_attachment is a core tool, loaded on any conversation with a file, reading only the
      person's own uploads to the thread and waiting for a file still being read. A native PDF page
      is read glyph by glyph and laid out row by row (pdfreader.wordsOf, arrange); the rate
      confirmation parser reads a row's cells. Document reads return what was found
      (documentcontent.Findings) instead of the raw analysis, which crowded the text out.
    files:
      - services/tms/internal/modules/agent/domain/agentmessage/attachments.go
      - services/tms/internal/modules/agent/app/agentquerytoolservice/attachment_tool.go
      - services/tms/internal/infrastructure/pdfrender/pdfreader/layout.go
      - services/tms/internal/modules/documents/jobs/documentintelligencejobs/stopextraction.go
    fixedIn: uncommitted; verified by .deskbench/runs/20261011-181022-run (every attachment check passes on gpt-6-luna and claude-haiku-5-5; the one failing check is DB-148)

  - id: DB-148
    title: A reply after many list calls names artifacts outside a sentence and is regrounded
    status: open
    severity: low
    area: agent runtime / reply pass (artifact placement)
    found: 2026-10-11, .deskbench/runs/20261011-180213-run and 20261011-181022-run
    models: [claude-haiku-5-5, gpt-6-luna]
    scenarios: [rate-confirmation-attached-and-reattached]
    problem: >
      Building a shipment calls list_customers, list_locations, list_commodities and the rest, each
      showing an artifact. The reply links several of them ("from [Locations](artifact:...)") and
      the placement guard rewrites it (relink_artifacts), costing a model call; the implicit
      "artifacts named without a correction" check fails on both models. Seen against the
      uncommitted artifactref.go and placement.go changes in the working tree.
    evidence: >
      .deskbench/runs/20261027-haiku-volume-fixed: delayed-reefer-detail and
      codemode-control-weight-question-script each ended a finished reply with the shipment card
      on a line of its own; each was restarted (relink_artifacts) to move the link into the last
      sentence, and failed "artifacts named without a correction".
    cause: >
      Only a reply whose one fault was a left-out artifact was mended without the model; a link
      standing apart from any sentence always cost a second model call, though cutting it and
      joining it to the sentence beside it is as good as the rewrite.
    fix: >
      placementProblems.mendable: a stray link on a prose line outside a fence (on its own line,
      after a list, after a sentence that has ended) is cut and joined, in parentheses, to the
      reply's own prose line nearest above where it stood (else the first below), with a
      place_artifacts and a reply_replaced and no retrying. A link in a table cell, a heading or a
      fenced block, an id nobody holds, and a reply with no prose to join keep relink_artifacts.
      The bench check is unchanged: it counts only a reply that was asked again.
    files:
      - services/tms/internal/modules/agent/app/agentruntime/placement.go
    fixedIn: uncommitted; TestDrive_MovesALinkStandingApartIntoTheRepliesSentence, TestPlaced_JoinsAStrayLinkToTheSentenceNearestIt

