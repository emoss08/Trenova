  - id: DB-141
    title: The scope classifier reasoned on every question, so a fifth of checks ran out its 3 s budget
    status: fixed
    severity: medium
    area: agent guard / model adapters
    found: 2026-10-10, ai_usage_records (task ScopeClassification, two days)
    models: [gpt-6-luna, claude-haiku-5-5]
    scenarios: []
    problem: >
      Both providers are set to reasoning Off, which sends no reasoning setting at all, so gpt-6-luna
      reasoned by default (about 37 tokens a classification): 488 of 2,482 calls hit the 3 s budget and
      32 came back empty or broken. Haiku 5.5 thinks adaptively at its default effort, and the adapter
      had no way to turn that off for it.
    fix: >
      A structured completion can override the provider's reasoning for that one call
      (StructuredCompletionRequest.Reasoning), and the classifier asks for none: thinking disabled on
      Haiku 5.5, reasoning effort none on gpt-6-luna; its free-text reason is capped at eight words.
      Measured on ten real classifications each: gpt-6-luna p50/p90 1.78/2.36 s to 1.46/1.90 s
      (reasoning tokens 370 to 0), Haiku 5.5 1.51/1.59 s to 1.43/1.68 s, no failures. The provider
      order is unchanged: routing has one priority per provider, so putting Haiku first would also
      move chat; with medians within 30 ms the hedge at 1.5 s still asks the second provider about
      half the time, at roughly a hundredth of a cent each.
    fixedIn: uncommitted; TestEvaluate_TheClassifierAsksProvidersNotToReason,
      TestAnthropicAdapter_ARequestCanTurnThinkingOffOnHaiku55, TestOpenAIResponsesAdapter_ARequestCanAskForNoReasoning
    files:
      - services/tms/internal/modules/agent/app/agentguard/classifier.go
      - services/tms/internal/modules/agent/ports/agentports/agentcompletion.go
      - services/tms/internal/infrastructure/agentcompletion/completionrouter/router.go
      - services/tms/internal/infrastructure/agentcompletion/completionrouter/prompt.go
      - services/tms/internal/infrastructure/agentcompletion/modeladapter/adapter.go
      - services/tms/internal/infrastructure/agentcompletion/modeladapter/anthropicmodels.go

  - id: DB-142
    title: Artifacts were named with the model's own words and left outside sentences
    status: fixed
    severity: medium
    area: agent runtime / artifact links / Desk
    found: 2026-10-11, reported by the user (Bench · Operations, Formula Desk and Dispatch desk conversations)
    models: [gpt-6-luna]
    scenarios: []
    problem: >
      One shipment's card was linked as "shipment card", "Shipment S26100090038417" and "full formula
      template" across one conversation, and the Formula Desk ended a reply with "rounded up. Formula
      template Per CWT (Hundredweight)" as a sentence of its own. Titles of tables and decision cards
      were humanized from identifiers with lower-cased initialisms ("ifta report"), and invoices,
      prices and other "-ices" entities were singularized to "invoix" and "prix".
    cause: >
      The link's words were whatever the model wrote, and only the prompt asked for the title. Where a
      link stood was checked nowhere on the server, and the Desk's withArtifactRefs moved a badge on a
      line of its own, and every artifact the reply left out, to the end of the first paragraph, which
      is how badges came to stand after a sentence.
    fix: >
      The link's words are always the artifact's title: NameArtifactLinks rewrites them when the turn
      is saved and the badge draws artifact.title. Titles come from one owner (assistantartifact/naming.go)
      on the registry's initialism-aware nouns. placement.go checks every final reply the person reads:
      a stray, missing or made-up link is sent back once with a correction, then placed in a closing
      sentence. withArtifactRefs is gone; the bench checks every turn that shows an artifact.
    fixedIn: uncommitted; placement_test.go, artifacts_naming_test.go, naming_test.go, noun_test.go,
      desk-inline-artifact.test.tsx
    files:
      - services/tms/internal/modules/agent/app/agentruntime/placement.go
      - services/tms/internal/modules/agent/app/agentruntime/artifactref.go
      - services/tms/internal/modules/agent/app/assistantservice/artifacts.go
      - services/tms/internal/modules/agent/domain/assistantartifact/naming.go
      - services/tms/internal/modules/identity/domain/permission/recordid.go
      - shared/stringutils/noun.go
      - client/apps/web/src/components/desk-chat/conversation/desk-turns.tsx
