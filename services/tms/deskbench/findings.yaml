  - id: DB-062
    title: The local Temporal server filled its memory with bench runs and stopped answering
    status: fixed
    severity: high
    area: bench infrastructure
    found: 2026-10-09, .deskbench/runs/20261009-233510-run
    problem: >
      Temporal runs as start-dev with no database file, under a 1 GiB limit, and keeps every closed
      run in memory until retention. The bench namespace kept runs 72 hours; by the evening the
      server sat at 1011 MiB and every poller timed out, so turns hung in three lifecycles.
    fix: >
      The bench namespace keeps closed runs for an hour, and an existing one is shortened on the
