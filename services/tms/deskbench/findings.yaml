  - id: DB-047
    title: A shipment with a rate override could never be saved
    status: fixed
    severity: critical
    area: shipments / validation
    found: 2026-10-09, .deskbench/runs/20261009-203702-run
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      Shipment.Validate checked rateOverrideAmount with validation.Min(decimal.NewFromInt(0)).
      ozzo-validation cannot compare a decimal.Decimal, so every shipment carrying a rate override
      failed with "type not supported: decimal.Decimal": the agent priced Acme's load off its
      contract and could not book it, and a person setting an override in the app hits the same.
      The dedicated lane suggestion's confidence score had the same rule.
    fix: >
      pkg/domainvalidation gains DecimalAtLeast and DecimalAtMost, which compare decimal.Decimal,
      *decimal.Decimal and decimal.NullDecimal (an absent value passes). Shipment, dedicated lane
      suggestion and order (whose hand-written nonNegativeNullDecimal it replaces) use them.
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-223506-run (the contract-priced load books on claude-haiku-5-5)
    files:
      - services/tms/pkg/domainvalidation/decimal.go
      - services/tms/internal/modules/operations/domain/shipment/shipment.go
      - services/tms/internal/modules/rating/domain/dedicatedlane/suggestion.go
      - services/tms/internal/modules/operations/domain/order/order.go

  - id: DB-048
    title: Searching the billing queue failed in SQL, and its pro number filter was withheld
    status: fixed
    severity: high
    area: billing queue
    found: 2026-10-09, .deskbench/runs/20261009-205726-run
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      BillingQueueItem declares UseSearchVector, but billing_queue_items never had a search_vector
      column, so every text search on the queue (the agent's, and the queue page's) failed with
      "column bqi.search_vector does not exist". The other way to find an item by its load, the
      shipment.proNumber filter list_billing_queue_items offers, was refused as "withheld at this
      data access": the billing queue resource did not classify that field, so it took the
      resource's Restricted default.
    fix: >
      Migration 20261231008650 adds the generated search_vector (status, review and exception notes,
      cancel reason) with a GIN index. shipment.proNumber is classified Internal on the billing
      queue, as a pro number is everywhere else. The new column first broke every billing transfer (DB-051): it is declared scanonly on BillingQueueItem now.
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-223506-run (the queue item found by pro number, approved and posted)
    files:
      - services/tms/internal/infrastructure/postgres/migrations/20261231008650_billing_queue_search_vector.tx.up.sql
      - services/tms/internal/modules/identity/domain/billingperms/billing.go

  - id: DB-049
    title: The pickup arrival and departure could not be proposed together
    status: fixed
    severity: high
    area: dispatch / stop actuals
    found: 2026-10-09, .deskbench/runs/20261009-211526-run
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      Dispatchers report both at once ("got there 5:50, left 7:05"). record_stop_actual took one
      event, and the departure's preview checked today's state, where the arrival had not happened
      yet, so it was refused ("Arrive at this stop before departing"). The pickup took two approval
      rounds and the delivery was never recorded.
    fix: >
      RecordStopActualRequest takes an optional DepartedAt with an Arrive: both are planned and
      written in one transaction (no stop left arrived and not departed if the second write
      failed), both events are published and the detention candidate is flagged. It must be at or
      after the arrival, not in the future, and needs the arrival time. The tool gains departedAt
      and the preview names both.
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-214446-run (arrival and departure proposed in one call, load Completed)
    files:
      - services/tms/internal/modules/operations/ports/shipmentmoveports/shipmentmove.go
      - services/tms/internal/modules/operations/app/shipmentmoveservice/stopactual_plan.go
      - services/tms/internal/modules/operations/app/shipmentmoveservice/stopactuals.go
      - services/tms/internal/modules/agent/app/agenttools/movetools/move_tools.go
      - services/tms/internal/modules/agent/app/agenttools/movetools/preview_moves.go

  - id: DB-050
    title: Every driver was "infeasible" for a load whose pickup window had already passed
    status: fixed
    severity: high
    area: dispatch / candidate ranking
    found: 2026-10-09, .deskbench/runs/20261009-212705-run
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      A load entered after it ran has a pickup window in the past. rank_move_candidates projected
      each driver's arrival from now, found every one a day late, and marked them all infeasible, so
      Haiku would not assign the driver the person named. The comparison says nothing: everyone is
      equally late to a window already gone. An unknown slack also read as 0 and gave "tight".
      Separately, list_trailers never showed a trailer's equipment type, so "a dry van" could not be
      matched, and the seed called the dry van type "Standard semi-trailer".
    fix: >
      A window that closed before now is not judged for lateness: one Warn finding
      (move.window_passed) says so, the verdict ignores slack, and the agent view omits
      minutesOfSlack when it is unknown (CandidateScore.SlackKnown). list_trailers and list_tractors
      carry equipmentType (code and description); the seed's type reads "Dry van (standard enclosed
      semi-trailer)". A base prompt rule: when the person names exactly what to change, propose it
      and put what stands against it beside the proposal; a kind ("a dry van") is chosen, not asked.
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-215410-run (David Park on TRC-001 with a dry van proposed and approved)
    files:
      - services/tms/internal/modules/operations/app/dispatchcandidateservice/service.go
      - services/tms/internal/modules/operations/app/dispatchcandidateservice/score.go
      - services/tms/internal/modules/operations/app/dispatcheligibility/finding.go
      - services/tms/internal/modules/agent/app/agentquerytoolservice/dispatch_tools.go
      - services/tms/internal/modules/agent/app/agentquerytoolservice/listcatalog.go
      - services/tms/internal/modules/agent/domain/agentprompt/prompt.go
      - services/tms/internal/infrastructure/database/seeds/development/06_test_data.go

