  - id: DB-030
    title: Later turns reasoned from what earlier turns said about a load, not from the load
    status: fixed
    severity: high
    area: agent runtime / context
    found: 2026-10-09, runs 4-5
    models: [gpt-6-luna, claude-haiku-5-5]
    scenarios:
      [
        long-session-context,
        detention-at-the-receiver,
        records-in-play-after-a-change,
      ]
    problem: >
      A conversation's earlier tool results are replayed as they were, with relative dates
      computed when they ran, and compaction keeps their figures. A status, ETA, coverage or
      charge read three turns ago reached the model looking as current as one read now, and
      models answered from it, or looked the load up again on every turn to be safe.
    fix: >
      Context anchored on records. A conversation keeps the records it is about
      (assistant_threads.working_set): subject, mentions, page record, get_* reads and the
      targets of executed writes. Every turn reads them again while it is prepared
      (recordanchorservice, per-kind batch readers, access checked per kind) and opens the
      question with a <records_in_play> block that says it is current, with the age of every
      fact taken from a report ("reported 40m ago", "too old to plan on"). The block is never
      saved, so the system prompt and history stay cacheable, and the anchored records are
      watched for mid-turn changes. PromptVersion v7. To verify across a full run.
    files:
      - services/tms/internal/core/services/recordanchorservice/
      - services/tms/internal/core/services/assistantservice/workingset.go
      - services/tms/internal/core/domain/conversation/workingset.go
      - services/tms/internal/core/domain/agentdefinition/anchors.go
      - services/tms/internal/core/services/shipmenttracking/facts.go
      - docs/engineering/agent-runtime.md
    fixedIn: .deskbench/runs/20261009-195808-run

