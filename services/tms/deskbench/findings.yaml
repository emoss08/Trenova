  - id: DB-024
    title: Asked for "last week's" settlement, both models asked which dates
    status: open
    severity: low
    area: agent tools / settlements
    found: 2026-10-09, .deskbench/runs/20261009-164136-run
    models: [gpt-6-luna, claude-haiku-5-5]
    scenarios: [weekly-driver-settlement]
    problem: >
      claude-haiku-5-5 worked out last week's days correctly and then asked anyway; gpt-6-luna
      asked for the dates without looking anything up. A settlement is drafted for review, so
      asking costs the person a turn for nothing.
    fix: >
