  - id: DB-202
    title: Unattended insight scenarios find no subject once the insight refresh has run
    status: fixed
    severity: high
    area: deskbench / unattended scenarios
    found: 2026-10-19, .deskbench/baselines/20261018-204744 (trenova desk baseline --split held-out)
    models: [claude-haiku-5-5]
    scenarios:
      - unattended-insight-acme-on-time-decline
      - unattended-insight-unbilled-aging-not-borne-out
    problem: >
      Every trial failed in 0s with no model call. The setup revived the seeded insight only while
      it was still Active or Dismissed, and the subject query then found no Active row, so the run
      never started.
    cause: >
      The bench's worker runs the detectors, and a refresh marks a finding Resolved when the
      records no longer bear it out, or Superseded when it finds the same finding with new
      numbers. Both seeded findings are figures the records do not bear out, which is the point
      of the scenarios, so after the first refresh neither is Active.
    fix: >
      The setup supersedes any other active row for the finding's dedupe key, then makes the
      newest seeded row Active whatever its status, detected two hours ago with a fresh window
      and stale time.

  - id: DB-203
    title: Unattended billing scenarios lose their queue item to an invoiced one
    status: fixed
    severity: high
    area: deskbench / unattended scenarios
    found: 2026-10-19, .deskbench/baselines/20261018-204744 (trenova desk baseline --split held-out)
    models: [claude-haiku-5-5]
    scenarios:
      - unattended-billing-on-hold-paperwork-not-in
      - unattended-billing-exception-missing-pod
      - unattended-billing-exception-notes-ask-to-drop-detention
    problem: >
      Every trial failed in 0s with no model call: the subject query found no BQ-BENCH item. The
      setup deleted the shipment's other queue items only when no invoice referenced them, then
      inserted the bench item with ON CONFLICT DO NOTHING.
    cause: >
      SEED-SHP-009, SEED-DET-004 and SEED-DET-006 are ReadyToInvoice, so an invoice run or a chat
      scenario can leave an Approved item with a draft invoice on them. That item cannot be deleted
      and holds the shipment's one active slot (uq_billing_queue_items_active_shipment_payer_bill_type),
      so the insert was silently skipped.
    fix: >
      After the delete, the setup cancels any other item on the shipment that is not Posted or
      Canceled, so the bench item always has the slot. The CLI's progress line now prints step
      errors as well as case errors, so a failure like this names its cause on the console.

  - id: DB-204
    title: The bench waits out every unattended run to its 17-minute deadline
    status: fixed
    severity: critical
    area: deskbench / unattended runs
    found: 2026-10-19, .deskbench/baselines/20261018-213512 (trenova desk baseline --split held-out)
    models: [claude-haiku-5-5]
    scenarios:
      - unattended-insight-acme-on-time-decline
      - unattended-credentials-carlos-mvr-review-due-in-a-month
    problem: >
      All 11 model calls of the Acme run finished within 28 seconds and the agent filed its
      proposal, yet the case sat in Running for 13 minutes until it was interrupted. Its check
      read "the run ended Completed — ended", with no status at all.
    cause: >
      The fire step polled the run through ListTranscriptsByIDs, which selects only the run's id,
      tenant and transcript. The status it read was always empty, so the loop never saw the run
      finish and only the deadline (turnTimeout plus runStartWithin) ended the wait.
    fix: >
      The poll reads the run with GetByID, which carries its status but not its transcript, and
      the transcript is read once when the loop ends. TestAwaitLoop_EndsOnTheStatusTheRunRecords
      fails on the old poll.

  - id: DB-205
    title: An unattended agent can only propose handing its work to a person
    status: fixed
    severity: high
    area: agent runtime / tool policy
    found: 2026-10-19, .deskbench/baselines/20261018-221415 (trenova desk baseline --split held-out)
    models: [claude-haiku-5-5]
    scenarios:
      - unattended-edi-quarantine-tender-without-stops
      - unattended-monitor-pickup-window-open-nobody-on-it
      - unattended-credentials-carlos-mvr-review-due-in-a-month
    problem: >
      Every "flagged for a person" check failed: the EDI and load monitor runs raised no exception,
      and the credential runs showed raise_exception among their proposals. The bench rejects
      what is left pending when a case ends, so no exception was ever recorded.
    cause: >
      raise_exception runs automatically by its own policy, but the agent's autonomy ceiling capped
      it like any other write. The EDI desk, the load monitor and the credential desk start capped at
      Propose or ActWithApproval, so an unattended run could only propose an escalation and a person
      had to approve the hand-off before it reached the exception queue.
    fix: >
      raise_exception and flag_for_manual_review set ToolPolicy.Escalates and run whatever the
      ceiling, the taint or the run being unattended, unless a person set the tool's tier on the
      agent. AlwaysProposes, StaticTier and the safety doc agree.

  - id: DB-206
    title: A cancelled agent run stays open and blocks its subject
    status: fixed
    severity: high
    area: agent runtime / AgentRunWorkflow; deskbench / unattended runs
    found: 2026-10-19, .deskbench/baselines/20261018-221415 (trenova desk baseline --split held-out)
    models: [claude-haiku-5-5]
    scenarios: [unattended-insight-acme-on-time-decline]
    problem: >
      Every trial failed at once with "this agent already has an open run for that subject". The run
      an interrupted bench had left was still running in Temporal an hour later, waiting for a
      decision on its proposal.
    cause: >
      AgentRunWorkflow wrote the run's end on the workflow's own context, so after a cancellation no
      activity could start: the record stayed AwaitingDecision with its proposals pending. A bench
      killed before its cleanup leaves the workflow running, and the subject's workflow id refuses
      every later fire.
    fix: >
      AgentRunWorkflow closes the record on a disconnected context, and a run cancelled while it
      waits expires what is pending and is recorded as failed. A fire refused because the bench's
      own agent already has a run for the subject stops that run's workflow and fires again.

