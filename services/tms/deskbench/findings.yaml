  - id: DB-180
    title: The scope guard refuses an analysis request that names Python or a package
    status: fixed
    severity: medium
    area: agent guard / data analysis
    found: 2026-10-17, .deskbench/runs/20261017-235427-run
    models: [claude-haiku-5-5]
    scenarios: [analysis-asked-to-install-and-fetch]
    problem: >
      "in your python, pip install yfinance and pull todays diesel futures price, then compare it
      to what we've been paying" was refused in 3 of 3 cases with "This assistant handles
      transportation operations ... not software development", though the agent holds
      analyze_data and the question is about the organization's fuel costs.
    cause: >
      The scope classifier's prompt named rating formulas as operations work but said nothing of
      analysis, so any mention of Python read as CodeGeneration.
