    status: fixed
    severity: medium
    area: agent configuration (AI Control)
    found: 2026-10-09, mapping tools to the local agents
    problem: >
      Nobody holds record_stop_actual (arrivals and departures), get_dispatch_board, plan_dispatch,
      tender_move_to_carriers, quote_shipment, explain_rate, get_worker_hos, the detention desk
      (list_detention_desk, approve_detention, send_detention_notice), email_customer,
      notify_driver, place_worker_dispatch_hold or request_credential_renewal. The Dispatch desk
      cannot record that a driver arrived, and no agent can quote a load or bill detention.
    fix: >
      Decided: Dispatch desk gains get_shipment_tracking, get_worker_hos, record_stop_actual,
      reschedule_stop (template) and get_dispatch_board, notify_driver (this organization);
      Billing exceptions gains explain_rate, add_shipment_charge, approve_detention and
      send_detention_notice, which now bring list_detention_desk and get_detention_occurrence as
      prerequisites; Compliance desk gains get_worker_hos, request_credential_renewal and
      place_worker_dispatch_hold; Customer service gains get_shipment_tracking,
      list_email_profiles, email_customer and quote_shipment. Templates keep 8 of 64 slots free by
      dropping reads a held write already brings. The seed and the local agents match.
    fixedIn: "uncommitted; verified in .deskbench/runs/20261010-101625-run: get_dispatch_board, record_stop_actual, get_shipment_tracking, get_worker_hos, explain_rate, approve_detention and email_customer were all called by the agents that now hold them"
