  - id: DB-163
    title: The EDI desk cannot show a 214 preview at its default data access
    status: fixed
    severity: medium
    area: agent tools / data access
    found: 2026-10-15, .deskbench/runs/20261015-092056-run and 20261015-115248-run
    models: [claude-haiku-5-5]
    scenarios: [edi-preview-214]
    problem: >
      Asked "show me the 214 it would get", every case (6 of 6 over two runs) answered "I can't
      show you the 214 itself. The rendered X12 is withheld at my data access". The case passes
      its checks but not its purpose: the rubric expects the 214 segment by segment (B10, AT7).
    evidence: >
      preview_edi_document returned "segments": [], "withheldByAccess": ["rawX12"], "note": "The
      rendered X12 is withheld at your data access". Bench · EDI desk and EDI Exchange Manager
      both have data_access_ceiling Internal.
    cause: >
      Raw EDI sits above Internal, an agent's ceiling defaults to Internal, and the segment list
      is withheld with the raw text. deskbench/agents.yaml has no field for a bench agent's data
      access, so the scenario cannot run at a ceiling that reaches it.
    fix: >
      The tier stays: raw EDI is Restricted. A withheld preview, and every withheld raw X12, now
      says whose access held it back (fieldGate.heldByAgent): the agent's own Data access, which
      someone whose role reaches Restricted can raise in AI control, or the person's role. Bench
      agents take dataAccess in agents.yaml, saved through the agent service so a role that does
      not reach Restricted cannot grant it, and the bench EDI desk runs at Restricted.
    files:
      - services/tms/internal/modules/agent/app/agentquerytoolservice/edi_document_preview_tool.go
      - services/tms/internal/deskbench/agents.go
      - services/tms/deskbench/agents.yaml
    fixedIn: >
      uncommitted; verified by .deskbench/runs/20261015-143405-run and 20261015-145941-run (the
      preview is described segment by segment in every case)

  - id: DB-164
    title: An empty list of inbound files is widened again and again
    status: fixed
    severity: low
    area: agent tools / EDI inbound files
    found: 2026-10-15, .deskbench/runs/20261015-115248-run
    models: [claude-haiku-5-5]
    scenarios: [edi-pasted-x12-then-a-write]
    problem: >
      Asked to rerun quarantined Acme files, one case called list_edi_inbound_files five times
      ({"query":"Acme"}, partnerId + Quarantined, partnerId alone, the inactive Acme Retail
      partner, status Quarantined alone) and went over the scenario's six calls with eight. The
      answer was right: nothing Acme is quarantined, nothing rerun, nothing proposed.
    cause: >
      An empty filtered list ended with filtercatalog.Criteria.EmptyNote, "Other inbound EDI files
      may exist; only these filters were applied", which every list tool shares and which reads as
      an invitation to drop a filter and look again.
    fix: >
      The shared note says the empty list is the answer for its filters, never a claim that none
      exist, and to search again only when the question is about more than they cover. An empty
      status-filtered list_edi_inbound_files says what the same search holds in any status, or
      that it holds nothing at all, as list_pay_advances already did.
    fixedIn: >
      uncommitted; verified by .deskbench/runs/20261015-143405-run (all 107 scenarios, against 20261015-baseline-full on 2b2c936e9: 83/107 against 79/107), no case that failed only there turned on an empty
      list) and 20261015-145941-run (edi-pasted-x12-then-a-write 3/3, two or three inbound file
      calls each)

