      searched driver settlements, carrier settlements and pay advances, then asked what kind of
      record it was. Neither tried the shipment the PRO number belongs to.
    cause: >
      Nothing an agent holds looks a record up by an identifier across kinds. Tool disclosure
      ranks tools by the question's words, so the words in an identifier choose where to look.
