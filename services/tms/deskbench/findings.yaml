  - id: DB-132
    title: Asked for a formula "per our contracts", gpt-6-luna read every agreement and never proposed one
    status: fixed
    severity: medium
    area: tool descriptions / formulas
    found: 2026-10-10, .deskbench/runs/20261010-101625-run
    models: [gpt-6-luna]
    scenarios: [formula-doe-fuel-surcharge, formula-detention-free-time]
    problem: >
      For the DOE surcharge it took "per our contracts" as an instruction to look the terms up: it
      listed rate agreements and opened eight of them one by one, spent the turn's 12-tool budget and
      proposed nothing. For detention it asked the person how per-stop detention hours would reach the
      formula instead of declaring a variable. Nothing said to build from the terms the person stated.
    fix: >
      propose_formula's expression parameter says to write the formula from the terms the person
      states, even when they say the terms are their contracts', opening an agreement or program only
      when asked to take the terms from one, and that a quantity no shipment field holds, such as hours
      at a stop, is a variable with a default to declare and propose rather than ask about. It sits on
