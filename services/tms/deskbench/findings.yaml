  - id: DB-012
    title: No shipment hold reasons exist, so the agent can never place a hold
    status: open
    severity: medium
    area: seed data / tenant setup
    found: 2026-10-09, .deskbench/runs/20261009-152259-run
    scenarios: [hold-rejected-with-a-better-idea]
    problem: >
      place_shipment_hold needs a hold reason id from list_hold_reasons, and neither the
      development seed nor a new organization's setup creates any, so every "put it on hold"
      ends in "no hold reasons are configured".
    fix: >
      Proposed: seed a standard set of hold reasons (missing paperwork, customer request, credit,
      equipment, appointment) for development, and decide whether new organizations get them by
      default the way they get control records.

  - id: DB-013
    title: Counting questions over 25 rows cannot be answered because list tools return a page, not a total
    status: open
    severity: high
    area: agent tools / list results
    found: 2026-10-09, .deskbench/runs/20261009-152259-run
    models: [claude-haiku-5-5, gpt-6-luna]
    scenarios: [unassigned-then-narrow]
    problem: >
      46 shipments need a driver; both models answered with the 25 they were shown (count is the
      page's length and hasMore only says there are more), so neither could say how many.
      Counting questions are among the most common a dispatcher asks.
    fix: >
      Results now carry "total" when the page is full: list_shipments through an optional count on
      the list framework (listSpec.count, one indexed COUNT, run only when there is more than a
      page), and search_shipments for a plain text or status search. Other list tools can take
      the same count when a run shows they need it.
    files:
      - services/tms/internal/core/services/agentquerytoolservice/listtools.go
      - services/tms/internal/core/services/agentquerytoolservice/listcatalog.go

  - id: DB-014
    title: A model that always sends a status searches status by status until the budget runs out
    status: open
    severity: high
    area: agent tools / shipments
    found: 2026-10-09, .deskbench/runs/ (run 2)
    models: [gpt-6-luna]
    scenarios: [why-this-charge]
    problem: >
      gpt-6-luna fills every optional parameter, so it searched "Peak Denver Phoenix" with status
      Invoiced, got nothing, and then repeated the search once per status, spending the tool
      budget before reaching ReadyToInvoice, where the load was. Haiku left the status out and
      found it in two calls.
    fix: >
      When a search with a status finds nothing, search_shipments runs it again without the
      status and returns those rows with a note that none was in the status asked for, so one call
      answers.
    files: [services/tms/internal/core/services/agentquerytoolservice/shipment_tools.go]

  - id: DB-015
    title: The formula assistant writes rates into the expression instead of variables
    status: open
    severity: medium
    area: agent tools / formulas
    found: 2026-10-09, .deskbench/runs/20261009-160030-run
    models: [claude-haiku-5-5]
    scenarios: [formula-new-per-mile-with-minimum]
    problem: >
      Asked for "2.85 a mile but never less than 400" it proposed max(2.85 * totalDistance, 400)
      and said changing either figure means editing the formula. Every seeded template keeps its
      figures in variables (baseRate, minimumCharge) so one template serves every customer; a
      template with literals cannot be reused on a rate agreement.
    cause: >
      propose_formula's expression parameter said only to use the schema's names, and its
      variables were "any input that is not a shipment variable", so nothing asked for figures
      to be variables.
    fix: >
      The expression and variables parameters now say every rate, fee, minimum and percentage is
      a variable with the person's figure as its default, with the per-mile example.
    files: [services/tms/internal/core/services/agentquerytoolservice/formula_tools.go]

  - id: DB-016
    title: Three approved instruction memories taint every Desk turn in the organization
    status: open
    severity: medium
    area: agent memory / taint
    found: 2026-10-09, .deskbench/runs/ (run 3 live log)
    problem: >
      Every turn of the Billing, Dispatch and other agents opens with run_tainted for three Active
      Instruction memories ("include the actual report results…", "include additional context
      when saving memories…", "assess ELD applicability…"), each recorded after a run had read
      outside content. A tainted turn holds every money, customer-visible and outside-recipient
      write for approval and holds remember, so these three harmless sentences permanently turn
      off automatic writes for the whole organization, and nothing in the Desk says why.
    evidence: >
      live.log: event run_tainted {"mark":{"source":"memory","ref":{"entityType":"agent_memory",
      "id":"amem_01M4CXBXF5HNBJP0WCZ1KGZ15W"}}} and two more at the start of every turn.
    cause: >
      By design (agent-runtime.md, "Memory in the prompt"): a person's approval of the remember
      that wrote a memory changes how it is rendered, not whether it taints.
    fix: >
      A product decision: either a person's approval (or an administrator's review in AI Control
      > Memory) clears a memory's taint, or AI Control shows that a memory is tainting every turn
      and offers to review it.

  - id: DB-017
    title: No agent tool adds an accessorial charge to a saved shipment
    status: open
    severity: high
    area: agent tools / shipments, billing
    found: 2026-10-09, mapping the shipment life cycle
    problem: >
      "Add a 150 lumper to SEED-SHP-005" had no tool: list_accessorial_charges says to use it
      before proposing a charge, but nothing proposed one on a shipment (add_order_charge is for
      orders, correct_charge_code only re-codes a billing queue item's charges). A person adds
      accessorials in the shipment form through updateShipment.
    fix: >
      New tool add_shipment_charge: one accessorial at the charge's configured rate or a given
      amount, with units for a per-unit charge, through the shipment service's update; refuses an
      inactive charge, a negative amount and an invoiced or canceled shipment; Money egress, ask
      first. To verify in a run.
    files: [services/tms/internal/core/services/agenttoolservice/shipment_edit_tools.go]

  - id: DB-018
    title: A one-day time-off request is refused by its own validation
    status: open
    severity: high
    area: domain / worker PTO
    found: 2026-10-09, .deskbench/runs/20261009-160911-run
    models: [claude-haiku-5-5]
    scenarios: [request-time-off]
    problem: >
      request_worker_pto with startDate and endDate both 2026-10-16 ("next friday off") was
      refused: "End date must be after start date". ComputePTODays counts the last day inclusively
      (its test names a same-day request one day), so the validation contradicted it and no single
      day could be requested through the tool.
    cause: WorkerPTO.Validate refused EndDate <= StartDate.
    fix: >
      Refuses only EndDate < StartDate ("End date cannot be before start date", translated in
      every locale). To verify in a run.
    files: [services/tms/internal/core/domain/worker/workerpto.go]

  - id: DB-019
    title: No agent in this organization holds the tools for several everyday jobs
    status: open
    severity: medium
    area: agent configuration (AI Control)
    found: 2026-10-09, mapping tools to the local agents
    problem: >
      Nobody holds record_stop_actual (arrivals and departures), get_dispatch_board, plan_dispatch,
      tender_move_to_carriers, quote_shipment, explain_rate, get_worker_hos, the detention desk
      (list_detention_desk, approve_detention, send_detention_notice), email_customer,
