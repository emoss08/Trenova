  - id: DB-208
    title: A find_tools result that loads tools is refused by the Claude API
    status: fixed
    severity: critical
    area: model adapter / anthropic deferred tools
    found: 2026-10-19, .deskbench/runs/20261019-125417-run (Pass 1, the new scenarios)
    models: [claude-haiku-5-5]
    scenarios:
      - dispatch-desk-reaches-the-ar-aging
      - unattended-billing-stopped-while-waiting-closes-the-run
    problem: >
      Every turn whose find_tools call loaded a tool failed on the next model call with a 400,
      "Tool definitions/code execution functions cannot be mixed with other content". The Desk
      showed "The assistant could not finish this reply" and unattended runs ended Failed.
    evidence: >
      10 of the 400s in that run's worker.log; calls/dispatch-desk-reaches-the-ar-aging--…--1/
      turn01-call012.json is the tool message with both Content and ToolReferences. No earlier
      local run had sent a tool reference: deferred loading arrived in #822 that morning.
    cause: >
      anthropicToolResult put find_tools' explanation and the tool_reference blocks in one
      tool_result. The API takes a tool_result that loads tools only when it holds nothing but
      tool_reference blocks, and the wire golden pinned the refused shape.
    fix: >
      A result that loads tools holds only its references; its text goes in a text block after
      every tool_result of the message, opened with the tool and call it answers
      ("find_tools (toolu_…):"), so two searches in one reply stay apart. An error result, or one
      left with no references, keeps its text inside as before. This matches the Responses
      adapter, which already sends the text apart from tool_search_output.
    files:
      - services/tms/internal/infrastructure/agentcompletion/modeladapter/anthropic.go
      - services/tms/internal/infrastructure/agentcompletion/modeladapter/anthropicwire_internal_test.go
      - services/tms/internal/infrastructure/agentcompletion/modeladapter/testdata/anthropic_wire/deferred_haiku_5_5_medium_stream.json
    fixedIn: >
      .deskbench/runs/20261019-131140-run and 20261019-132324-run: no 400 in either worker.log; dispatch-desk-reaches-the-ar-aging 3/3, unattended-billing-stopped-while-waiting-closes-the-run 3/3 (20261019-132930-run).


  - id: DB-209
    title: On a fresh database every unattended run is a shadow run and no proposal can be decided
    status: fixed
    severity: high
    area: deskbench / agent controls
    found: 2026-10-19, .deskbench/runs/20261019-125417-run (Pass 1)
    models: [claude-haiku-5-5]
    scenarios:
      - unattended-billing-escalation-runs-under-a-propose-ceiling
      - unattended-billing-escalation-keeps-a-tier-a-person-set
      - approve-two-settlements-in-one-go
    problem: >
      The escalation runs ended ShadowCompleted with raise_exception Simulated or Pending, and
      every decision the bench made, its end-of-case rejections included, was refused with
      "Proposals cannot be actioned while all agents are paused". A proposal left Pending by one
      trial was counted by the next trial's database check (approve-two-settlements #2 got 2,
      want 1).
    evidence: >
      agent_controls.shadow_mode was true for the bench organization, its row created when the
      database was reset that morning; live.log lines "could not reject … all agents are paused".
    cause: >
      A new organization's agent control starts with shadow mode ("Pause all agents") on
      (agentcontrolrepository GetOrCreate), and EffectiveShadow ORs it with the agent's own flag.
      The bench turns the agent's shadow off but never the organization's, so its results
      depended on whether someone had flipped the switch on that database.
    fix: >
      The bench's worker reads the agent control through unshadowed, which reports shadow mode
      off and keeps the stored switch on any update, so runs and decisions are live in the
      bench's own process and the person's setting is never written.
    files:
      - services/tms/internal/deskbench/unshadowed.go
      - services/tms/internal/deskbench/unshadowed_test.go
      - services/tms/internal/deskbench/app.go
    fixedIn: >
      .deskbench/runs/20261019-131140-run: approve-two-settlements-in-one-go 1/2 → 3/3, unattended-billing-escalation-keeps-a-tier-a-person-set 0/2 → 3/3, no refused decision in live.log.


  - id: DB-210
    title: find_tools never reaches the person's other agents when one word of the need is in an own tool
    status: fixed
    severity: high
    area: agent runtime / find_tools discovery across desks
    found: 2026-10-19, .deskbench/runs/20261019-125417-run and 20261019-131140-run
    models: [claude-haiku-5-5]
    scenarios:
      - dispatch-desk-reaches-the-ar-aging
      - billing-lead-delegate-never-writes
    problem: >
      Asked for "accounts receivable aging by customer", the dispatch desk loaded
      shipment_update_hold and searched four times without finding get_ar_aging. The billing
      lead, asked to put a load on hold, was told "Nothing new matched" and sent the person to do
      it by hand, although shipment_place_hold was among the tools the turn could reach.
    evidence: >
      find_tools results in both transcripts list only own tools; get_ar_aging and
      shipment_place_hold are in the turns' declared tool names.
    cause: >
      resolveFind searched beyond the agent only when its best own match did not
      MatchesStrongly, and that was true for any single shared word in a name or description:
      "customer" in shipment_update_hold's description, "shipment" in the billing queue tools.
    fix: >
      The reached tools are always searched, and one is loaded when it matches the need more
      strongly than the best own match (Catalog.StrongScore); a reached tool that only matches a
      parameter, or one an own tool matches as well, still is not.
    files:
      - services/tms/internal/modules/agent/app/agentruntime/toolset.go
      - services/tms/internal/modules/agent/app/agentruntime/toolset_test.go
