  - id: DB-042
    title: Seeded shipment types carried the service type prefix, so no agent could book a load
    status: fixed
    severity: high
    area: development data
    found: 2026-10-09, .deskbench/runs/20261009-185431-run
    models: [claude-haiku-5-5, gpt-6-luna]
    scenarios:
      [
        lifecycle-one-agent-book-to-posted-invoice,
        create-shipment-from-a-sentence,
      ]
    problem: >
      The development seed minted its ten shipment types with pulid.MustNew("st_"), the service
      type prefix; the domain mints sht_. The argument contract checks an id's kind by its prefix,
      so create_shipment and quote_shipment refused the real FTL id as "a service type id", and the
      agent told the person the shipment type was broken.
    fix: >
      06_test_data.go mints sht_ for shipment types. The local database was renamed in one
      transaction (shipment_types, the shipments, dedicated lane and suggestion references, and the
      shipment_type_ids arrays on fuel surcharge programs, detention policies, mode profiles and
      rate agreement rules and accessorials). A scan of every table's id prefixes found no other
      seeded collision. To verify in a run.
