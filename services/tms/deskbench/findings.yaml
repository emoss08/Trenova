  - id: DB-138
    title: Testing a formula ignored the values set on its sample loads, so neither formula case could price
    status: fixed
    severity: high
    area: formula assistant
    found: 2026-10-10, .deskbench/runs/20261010-111436-run
    models: [gpt-6-luna]
    scenarios: [formula-price-a-sample, formula-equipment-and-hazmat-adders]
    problem: >
      test_formula_expression checked an expression against the top-level variables only. With every
      value set on the one sample load, max() met an empty minimumCharge and failed, and the model said
      the engine could not price it (270 never stated). A per-load teamService was refused as an
      unknown name, and serviceType.description, a listed field, as an invalid variable name though
      the engine applies dotted paths; the model then asked which service type means team service and
      proposed nothing.
    fix: >
      When testing, a name only the loads give a value counts as declared (first load's value), and
      load values may name a schema field path (pagedraft.ValidValuePath checks each part).
      propose_formula still checks with its declared variables only. Its expression description says
      a condition no field marks, such as team service, compares the nearest field to a variable or
      is a yes/no variable, explained rather than asked about.
    fixedIn: uncommitted; TestTest_PricesALoadWhoseValuesAreAllOnTheLoad,
      TestTest_ScenarioValuesCountAsDeclaredAndMayNameASchemaField, TestPropose_ChecksWithTheDeclaredVariablesOnly
    files:
      - services/tms/internal/core/services/formulaassistantservice/service.go
      - services/tms/internal/core/domain/pagedraft/draft.go
      - services/tms/internal/core/services/agentquerytoolservice/formula_tools.go

