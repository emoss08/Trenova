findings:
  - id: DB-001
    title: Claude turns fail with HTTP 400 after a tool called with no arguments
    status: fixed
    severity: critical
    area: model adapter / anthropic
    found: 2026-10-09, .deskbench/runs/20261009-152259-run
    models: [claude-haiku-5-5]
    scenarios: [ready-to-invoice]
    problem: >
      When Claude calls a tool with no arguments (list_billing_transfer_candidates {}), the next
      model request in the turn is refused by Anthropic and the turn fails with "The assistant
      could not finish this reply". Every Desk turn on a Claude model that uses an argument-free
      call dies at its second model call.
    evidence: >
      worker.log: provider request failed (status 400): messages.1.content.1.tool_use.input:
      Field required.
    cause: >
      anthropicBlock.Input is map[string]any tagged json:"input,omitempty", so an empty argument
      map is left out of the replayed tool_use block; Anthropic requires input on every tool_use.
    fix: >
      Input is now *map[string]any, always set (toolUseInput), so an argument-free call replays as
      "input": {}; toolUseArguments reads it back. Regression tests in anthropic_tooluse_test.go.
    files:
      - services/tms/internal/infrastructure/agentcompletion/modeladapter/anthropic.go
      - services/tms/internal/infrastructure/agentcompletion/modeladapter/anthropic_tooluse_test.go
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-154357-run (ready-to-invoice and completed-not-invoiced pass on claude-haiku-5-5, no 400s)

  - id: DB-002
    title: AI cost ignores prompt caching (Anthropic under-counted, OpenAI over-counted)
    status: fixed
    severity: high
    area: model router / cost accounting
    found: 2026-10-09, .deskbench/runs/20261009-151726-ask
    models: [claude-haiku-5-5, gpt-6-luna]
    problem: >
      Usage rows, message costs, monthly caps and budgets price a call as InputTokens x input
      price + OutputTokens x output price. Anthropic reports cached tokens outside input_tokens,
      so cache reads and writes (most of a Desk turn's prompt) are never charged: a Haiku turn
      reads "4 in" tokens. OpenAI counts cached tokens inside input_tokens, so they are charged
      at the full input price instead of the cached rate.
    evidence: >
      Haiku calls in the smoke run report 4 and 2 input tokens; usage rows carry
      cache_read_tokens and cache_write_tokens that no cost reads.
    cause: >
      aiprovider.Provider.CostForTask takes only input and output tokens; usage.go and trace.go
      pass outcome.InputTokens. modeladapter.CacheSeparateFromInput is used for tracing only.
    fix: >
      Decided: each provider takes optional cache read and cache write prices per million. Unset,
      a cache read is 0.1x the input price on every protocol and a cache write 1.25x on Anthropic
      (1x elsewhere, where none is reported). Uncached input, reads and writes are priced apart
      through one function (aiprovider.Provider.CostFor), with OpenAI's cached tokens subtracted
      from its input count; usage rows, chat, structured, trace and embedding costs all use it.
      The provider form and detail sheet edit both prices.
    fixedIn: "uncommitted; verified in .deskbench/runs/20261010-101625-run: OpenAI chat priced 13.9M cached tokens apart from 14.6M fresh. The local Anthropic provider has no prices set, so its calls stay uncosted until someone enters them"
    files:
      - services/tms/internal/core/domain/aiprovider/
      - services/tms/internal/infrastructure/agentcompletion/completionrouter/
      - services/tms/internal/infrastructure/agentcompletion/modeladapter/
      - services/tms/internal/api/graphql/schema/aiprovider.graphqls
      - client/apps/web/src (AI Control providers)
  - id: DB-003
    title: The scope guard's classifier runs close to its 3 s budget and sometimes fails open
    status: fixed
    severity: low
    area: scope guard / provider routing
    found: 2026-10-09, .deskbench/runs/20261009-151726-ask
    models: [gpt-6-luna]
    problem: >
      The scope classifier ran on OpenAI gpt-6-luna (priority 10 for ScopeClassification) and hit
      its 3 s budget, so the guard let the question through unclassified. If it times out on every
      turn the guard does nothing on this setup.
    evidence: >
      Unattributed structured call #1: execute provider request: Post
      "https://api.openai.com/v1/responses": context deadline exceeded, 3002 ms.
    fix: >
      Decided in code: the classification hedges. At half its 3 s budget, if the first provider has
      not answered, the router asks the next as well and takes the first answer, cancelling the
      other; a provider that fails hands over at once. It fails open only when every candidate is
      exhausted within the budget. Hedging is opt-in per request (StructuredCompletionRequest
      HedgeAfter), so other completions are unchanged, and the last candidate's wait for a slot
      stops at the caller's deadline instead of 20 s.
    fixedIn: "uncommitted; verified in .deskbench/runs/20261010-101625-run: 151 hedges, no question let through unclassified"
    files:
      - services/tms/internal/core/ports/services/agentcompletion.go
      - services/tms/internal/infrastructure/agentcompletion/completionrouter/hedge.go
      - services/tms/internal/infrastructure/agentcompletion/completionrouter/router.go
      - services/tms/internal/infrastructure/agentcompletion/completionrouter/limits.go
      - services/tms/internal/core/services/agentguard/guard.go
      - services/tms/internal/core/services/agentguard/classifier.go
  - id: DB-004
    title: Proposal and plan lists drop their id tie-breaker
    status: fixed
    severity: low
    area: repositories / ordering
    found: 2026-10-09, worker.log warning
    problem: >
      Three agent proposal queries and one agent plan query ordered by created_at only, so rows
      created in the same second (seeded rows, proposals filed in one turn) came back in no
      stable order.
    evidence: >
      bun: query "apl.created_at ASC" has [apl.id ASC] args, but no placeholders.
    cause: >
      OrderExpr(cols.CreatedAt.OrderAsc(), cols.ID.OrderAsc()) treats the second column as a
      placeholder argument and drops it.
    fix: Order(cols.CreatedAt.OrderAsc(), cols.ID.OrderAsc()), bun's multi-column form.
    fixedIn: uncommitted, 2026-10-09
    files:
      - services/tms/internal/infrastructure/postgres/repositories/agentproposalrepository/agentproposal.go
      - services/tms/internal/infrastructure/postgres/repositories/agentplanrepository/agentplan.go

  - id: DB-005
    title: No agent tool can reschedule a saved stop
    status: fixed
    severity: high
    area: agent tools / write coverage
    found: 2026-10-09, writing the reschedule-delivery scenario
    scenarios: [reschedule-delivery]
    problem: >
      "Push the delivery a day" has no tool. update_shipment says stops are not changed there and
      points at move tools that do not change windows; set_stop_schedule only edits the import
      page's draft. A person reschedules through the same updateShipment mutation, so the write
      coverage ledger counts it as covered by update_shipment when the agent cannot do it.
    fix: >
      New tool reschedule_stop: moves one stop's window in the stop's local time (the end keeps
      the window's length unless given), through the shipment service's update like the form,
      with a preview of the old and new window and any EDI tender change it would send. Listed
      against mutation updateShipment beside update_shipment, Unbound in toolcontract with its
      reason; update_shipment now points to it. To verify in a run.
    files:
      - services/tms/internal/core/services/agenttoolservice/shipment_edit_tools.go
      - services/tms/internal/api/writecoverage/writecoverage.yml
    fixedIn: .deskbench/runs/20261009-203702-run

  - id: DB-006
    title: Deleting a Desk conversation leaves its proposals waiting in the inbox
    status: fixed
    severity: low
    area: assistant / threads
    found: 2026-10-09, writing the bench's cleanup
    problem: >
      DeleteThread removes the messages and the thread but not the proposals its turns filed, so
      they stay in the decisions inbox and an approval follows up on a conversation that no
      longer exists.
    fix: >
      Deleting a conversation withdraws what its turns proposed and nobody decided: its pending
      proposals and plans expire (ExpirePendingByThread, the same expiry an agent's deletion
      already applies), after the delete goes through and only if it did.
    fixedIn: uncommitted; TestDeleteThread_WithdrawsWhatItLeftWaiting
