      as a literal, and its ORDER BY expectation matches bun's quoting.
    fixedIn: uncommitted; TestVersionsQueryKeepsOnlyTheSummaryKeysOfAPayload
    files:
      - services/tms/internal/modules/agent/adapters/postgres/assistantartifactrepository/lineage.go
      - services/tms/internal/modules/agent/adapters/postgres/assistantartifactrepository/versions_test.go

