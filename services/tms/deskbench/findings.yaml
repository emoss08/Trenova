  - id: DB-016
    title: Three approved instruction memories taint every Desk turn in the organization
    status: fixed
    severity: medium
    area: agent memory / taint
    found: 2026-10-09, .deskbench/runs/ (run 3 live log)
    problem: >
      Every turn of the Billing, Dispatch and other agents opens with run_tainted for three Active
      Instruction memories ("include the actual report results…", "include additional context
      when saving memories…", "assess ELD applicability…"), each recorded after a run had read
      outside content. A tainted turn holds every money, customer-visible and outside-recipient
      write for approval and holds remember, so these three harmless sentences permanently turn
      off automatic writes for the whole organization, and nothing in the Desk says why.
    evidence: >
      live.log: event run_tainted {"mark":{"source":"memory","ref":{"entityType":"agent_memory",
      "id":"amem_01M4CXBXF5HNBJP0WCZ1KGZ15W"}}} and two more at the start of every turn.
    cause: >
      By design (agent-runtime.md, "Memory in the prompt"): a person's approval of the remember
      that wrote a memory changes how it is rendered, not whether it taints.
    fix: >
      Decided: a person's review clears the hold. A memory taints a turn only while it is tainted and
      unreviewed (Memory.Taints()); reviewing it in AI Control > Memory, or approving a tainted
      suggestion, records who and when (reviewed_by_user_id, reviewed_at) and writes a critical
      security audit row. AI Control lists every Active memory that still taints, with Review and
      Retire. reviewAgentMemory needs agent_memory:update and is exempt from agent write coverage,
      as an agent clearing the taint on what it reads would undo the hold. The three local memories
      were reviewed as admin@trenova.app through that mutation.
    fixedIn: "uncommitted; verified in .deskbench/runs/20261010-101625-run: no turn tainted by a reviewed memory. Since then two stale tainted lessons were retired and three sound ones reviewed, leaving no Active memory that taints"
    files:
      - services/tms/internal/core/domain/agent/agentmemory.go
      - services/tms/internal/core/services/agentmemoryservice/
      - services/tms/internal/api/graphql/schema/agent.graphqls
      - client/apps/web/src/routes/agent-control/_components/memory/
      - docs/engineering/agent-runtime.md
      - docs/engineering/security-audit.md
      - docs/product-guide/admin/agent-control.md

