  - id: DB-013
    title: Counting questions over 25 rows cannot be answered because list tools return a page, not a total
    status: fixed
    severity: high
    area: agent tools / list results
    found: 2026-10-09, .deskbench/runs/20261009-152259-run
    models: [claude-haiku-5-5, gpt-6-luna]
    scenarios: [unassigned-then-narrow]
    problem: >
      46 shipments need a driver; both models answered with the 25 they were shown (count is the
      page's length and hasMore only says there are more), so neither could say how many.
      Counting questions are among the most common a dispatcher asks.
    fix: >
      Results now carry "total" when the page is full: list_shipments through an optional count on
      the list framework (listSpec.count, one indexed COUNT, run only when there is more than a
      page), and search_shipments for a plain text or status search. Other list tools can take
      the same count when a run shows they need it.
    files:
      - services/tms/internal/core/services/agentquerytoolservice/listtools.go
      - services/tms/internal/core/services/agentquerytoolservice/listcatalog.go
    fixedIn: .deskbench/runs/20261009-175153-run

  - id: DB-014
    title: A model that always sends a status searches status by status until the budget runs out
    status: fixed
    severity: high
    area: agent tools / shipments
    found: 2026-10-09, .deskbench/runs/ (run 2)
    models: [gpt-6-luna]
    scenarios: [why-this-charge]
    problem: >
      gpt-6-luna fills every optional parameter, so it searched "Peak Denver Phoenix" with status
      Invoiced, got nothing, and then repeated the search once per status, spending the tool
      budget before reaching ReadyToInvoice, where the load was. Haiku left the status out and
