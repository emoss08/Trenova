      person the palette says so. A quick question's conversation holds every query tool the
      person may use (Definition.HoldingReads, ThreadOrigin.ReadsEverything), disclosed through
      find_tools. The palette searches records for the question's search words, lists them under
      Nova, and sends the ones the question names as mentions.
