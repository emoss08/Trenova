  - id: DB-008
    title: search_shipments promises customer and city search but only matches pro number and BOL
    status: fixed
    severity: critical
    area: agent tools / shipments
    found: 2026-10-09, .deskbench/runs/20261009-152259-run
    models: [claude-haiku-5-5, gpt-6-luna]
    scenarios:
      [note-on-a-load-approved, load-by-description, delayed-reefer-detail]
    problem: >
      The tool's description says it matches "a pro number, BOL, customer name, or city", so
      models search "freshhaul", "FreshHaul Foods" and "Los Angeles" and are told there are no
      shipments, although there are. They then give up, or list recent shipments and open them
      one at a time with get_shipment until the tool budget is spent. Almost every request that
      names a load the way people do ("the freshhaul reefer to LA") starts here.
    evidence: >
      live.log: search_shipments {"query":"freshhaul"} -> No shipments; {"query":"FreshHaul
      Foods"} -> No shipments; {"query":"Los Angeles"} -> No shipments; then get_shipment on
      three rows to find them.
    cause: >
      The repository's text search is the shipments search vector, whose searchable fields are
      pro_number and bol only (Shipment.GetPostgresSearchConfig); the description was written
      for a search that does not exist.
    fix: >
      search_shipments now also resolves the words to customers (code, name) and locations (name,
      city) through their own indexed searches, and lists shipments for those customers and with a
      stop at those locations (new ShipmentOptions.CustomerIDs and StopLocationIDs, an indexed
      customer_id IN and an EXISTS over stops). Words that name a customer and a place require
      both. The description says what it matches and what it found is named in searchedFor.
    files:
      - services/tms/internal/core/services/agentquerytoolservice/shipment_search_parties.go
      - services/tms/internal/infrastructure/postgres/repositories/shipmentrepository/helpers.go
      - services/tms/internal/core/services/agentquerytoolservice/shipment_tools.go
      - services/tms/internal/core/domain/shipment/shipment.go
    fixedIn: uncommitted; verified by .deskbench/runs/20261009-154357-run (5 gpt-6-luna cases flipped to pass; search_shipments calls 107 -> 44)

  - id: DB-009
    title: Asked which loads need a driver, the model reads shipments one by one until the budget runs out
    status: fixed
    severity: high
    area: agent tools / shipments, find_tools
    found: 2026-10-09, .deskbench/runs/20261009-152259-run
    models: [gpt-6-luna]
    scenarios: [unassigned-then-narrow]
    problem: >
      find_tools returned nothing four times for "unassigned moves / dispatch board", and the
      shipment list rows do not say whether a load has a driver, so the model opened each New
      shipment with get_shipment to check, spent its 12-call budget, and had 4 more calls refused.
    evidence: >
      live.log: 4 x find_tools with an empty answer; search_shipments status New; 11 x
      get_shipment; 4 x get_shipment over_budget.
    cause: >
      Shipment list and search rows carried pro number, status, customer, charges and dates only,
      so pickup order, where a load goes and who drives it all needed one get_shipment per row.
      Run 2 repeated it: 25 get_shipment calls for "which one picks up first", and a delegate
      opening shipments to learn whether a driver was on a load.
    fix: >
      Rows from list_shipments and search_shipments now carry the first pickup and last delivery
      (place, window in the stop's zone, arrival) and who drives each move with the tractor, or
      that it needs a driver, loaded with the page as batched relations (ShipmentOptions.IncludeRoute).
      Both descriptions say so.
    files:
      - services/tms/internal/core/services/agentquerytoolservice/shipment_route.go
      - services/tms/internal/infrastructure/postgres/repositories/shipmentrepository/helpers.go
    fixedIn: .deskbench/runs/20261009-175153-run

  - id: DB-010
    title: raise_exception is offered in chat, where it can only be refused
    status: fixed
    severity: medium
    area: agent runtime / toolset
    found: 2026-10-09, .deskbench/runs/20261009-152259-run
    models: [gpt-6-luna]
    scenarios: [hold-rejected-with-a-better-idea]
    problem: >
      raise_exception is a core tool every agent holds, but it needs a run and a conversation's
      turn has none, so in the Desk it is always refused ("an exception can only be raised from
      within an agent run"). gpt-6-luna reached for it when it could not place a hold, spending a
      call and then telling the person nothing useful.
    cause: Core tools ride on every turn; only open_page was dropped where it cannot work.
    fix: >
      OpenTurn drops raise_exception from the held tools when the request has no RunID, beside the
      existing open_page rule for delegates. Background runs and dry runs, which carry a run, keep it.
    fixedIn: uncommitted; TestRun_OffersRaiseExceptionOnlyWithARun covers both a conversation turn and a run
    files: [services/tms/internal/core/services/agentruntime/turn.go]

