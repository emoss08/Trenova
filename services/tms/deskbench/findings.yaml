  - id: DB-186
    title: Figures in a reply that files nothing are not checked against what the turn read
    status: fixed
    severity: medium
    area: agent runtime / grounding
    found: 2026-10-18, .deskbench/runs/20261018-000819-run
    models: [claude-haiku-5-5]
    scenarios: [analysis-two-reports-together, analysis-chart-asked-for, revenue-by-customer, long-session-context, formula-build-then-rework, formula-price-a-sample, customer-short-paid]
    problem: >
      The grounding guard (groundingguard.go) rewrites a reply whose figures or fields the filed
      change does not hold, so it ran only when a turn filed something. A read-only answer that
      states a figure no tool returned (52.3% in DB-183) went out unchecked; the calculation rule
      in the prompt was the only control. A run over every scenario with the check in place found
      it firing on real head arithmetic in seven read-only answers ("over 99%" of open AR, "about
      87%" accessorial share, "$310 plus $85 is $395", "50 x $3 = $150", a $500 short pay, "about
      $444,000" without FreshHaul).
    fix: >
      A reply that files nothing is held to the money and percentages the conversation read
      (numberguard.CheckAmounts), once the conversation has read a tool's result, behind
      agent-loop-grounding-read-amounts. Counts, years, clock times and limits the trade knows are
      left alone, and a percentage is supported by the fraction it renders. A hit is discarded once
      with a correction that sends an agent holding analyze_data to work the figure out there; a
      rewrite that still states it ends with a sentence naming the figures to check. The bench now
      fails any step whose reply the guard corrected ("reply grounded without a correction").
    files:
      - shared/numberguard/numberguard.go
      - services/tms/internal/modules/agent/app/agentruntime/groundingguard.go
      - services/tms/internal/modules/agent/app/agentruntime/placement.go
      - services/tms/internal/deskbench/checks.go
    fixedIn: >
      uncommitted; verified by .deskbench/runs/20261018-080008-run (every scenario once), then
      20261018-082639-run and 20261018-082950-run, where every remaining correction is arithmetic no tool returned
      ($445,000 without FreshHaul, a $180 example run); a sum or difference of figures in the
      person's own question counts as stated ("$500 short" on a 3,200 check for a 3,700 invoice)

  - id: DB-187
    title: The grounding guard took figures the conversation had read for invented ones
    status: fixed
    severity: high
    area: agent runtime / grounding
    found: 2026-10-18, .deskbench/runs/20261018-072255-run
    models: [claude-haiku-5-5]
    scenarios: [analysis-attached-workbook, analysis-explore-a-report, analysis-follow-up-revises-the-analysis, rate-confirmation-attached-and-reattached, shipment-from-a-rate-confirmation-with-new-parties, shipment-from-scratch-with-a-new-customer, duplicate-a-load-for-next-week, send-a-delivered-load-to-billing, approve-pending-time-off]
    problem: >
      The first bench run that failed a corrected reply showed the guard on filed changes (and the
      new read-only check) rewriting replies over figures the model had read. numberguard took
      every comma between digits as a thousands separator, so a tool's JSON array
      ([172.5,12937.5,0.708], [50,150,250]) was one run that never parsed, and every figure of an
      analysis table counted as unread. A date's day and year (2026-10-25, 10/26, "September 29",
      "Dec 26-31, 2026") and a code's digits (HL-30117) were read as figures. Figures from a PDF the
      model reads itself were invented in the guard's eyes, and a proposal's result replayed as its
      outcome lost the rate its preview priced. The rewrites then told the person to disregard the
      rate confirmation's own figures.
    fix: >
      numberguard reads figures apart (ReadSeparated): a comma groups digits only before three
      digits and never inside JSON; a number joined by a hyphen, dash, slash or colon, glued to a
      letter, an ordinal, or the day or year of a written date is not a figure; a figure rounded
      to its last written digit ("$57K" for 57,323.83, "43%" for 0.4343) is the same figure; an
      unsupported figure is listed once. A conversation holding a file only the model can read
      (Message.Files) has no figure checked, and a replayed proposal result counts whole as read.
      Executions started before agent-loop-grounding-figures-as-read keep the joined reading
      where the two disagree on whether anything is unsupported.
    files:
      - shared/numberguard/numberguard.go
      - services/tms/internal/modules/agent/app/agentruntime/groundingguard.go
      - services/tms/internal/modules/agent/app/agentruntime/messages.go
    fixedIn: uncommitted; verified by .deskbench/runs/20261018-080008-run, 20261018-081853-run and 20261018-082639-run

  - id: DB-188
    title: A rewritten reply answers the correction instead of the person
    status: fixed
    severity: medium
    area: agent runtime / grounding
    found: 2026-10-18, .deskbench/runs/20261018-072255-run
    models: [claude-haiku-5-5]
    scenarios: [analysis-chart-asked-for, analysis-asked-from-ask, formula-build-then-rework, lifecycle-rate-check-before-billing]
    problem: >
      Told only what was wrong with its draft, the model opened the rewrite with "You're right,
      the 'over 99%' was my own arithmetic" and "The rest of my last reply stands", and later turns
      apologised for notes and figures the person never questioned. The person never sees the
      correction, and the draft is withdrawn from the reader.
    fix: >
      Every grounding correction ends by saying the person sees neither it nor the reply it
      replaces, so the model writes its whole answer again and never mentions a correction, an
      earlier reply or how a figure was checked.
    files:
      - services/tms/internal/modules/agent/app/agentruntime/groundingguard.go
