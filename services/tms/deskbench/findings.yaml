  - id: DB-171
    title: The base 214 sends our internal shipment id in L11 and an AT8 with no weight
    status: open
    severity: high
    area: EDI / starter templates
    found: 2026-10-15, .deskbench/runs/20261015-143405-run
    models: [claude-haiku-5-5]
    scenarios: [edi-preview-214]
    problem: >
      Once the EDI desk could read the preview, it described what Acme would get: "L11: the
      shipment's internal Trenova id, tagged as the shipper's identifying number. Acme would see
      our internal id here, not their own reference number" and "AT8 G: a weight qualifier with no
      weight value after it."
    evidence: >
      templates.Base214Segments fills L11-01 from shipmentStatus.shipmentId (the record's pulid)
      with qualifier SI, and gives AT8 only its weight qualifier, a constant G. Every organization's
      base 214 starter is built from it.
    fix: >
      Open. L11 should carry a reference the partner knows (their own shipment or BOL number, or
