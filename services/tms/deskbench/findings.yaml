  - id: DB-038
    title: Quoting and carrier shopping refused every load with a row-level security error
    status: fixed
    severity: critical
    area: rating / row-level security
    found: 2026-10-09, .deskbench/runs/20261009-175153-run
    models: [claude-haiku-5-5, gpt-6-luna]
    scenarios:
      [lifecycle-one-agent-book-to-posted-invoice, lifecycle-carrier-covered]
    problem: >
      quote_shipment and shop_carriers failed with "database access refused: tenant data must be
      read and written inside an explicit tenant-scoped transaction". The rate engine's
      rateagreementrepository.ResolveRules ran its keyed and radius candidate queries outside a
      scoped transaction; only its agreement load opened one. Any caller without an outer
      transaction (every agent tool) could not price a load from a contract.
    cause: >
      The transaction lint looked only for an exported method touching the connection itself, so
      a method whose unexported helpers ran the queries passed it.
    fix: >
      ResolveRules runs its three reads in one dbtx.Read. The lint now follows calls to the
      receiver's unexported helpers, transitively, and flags an unscoped method that reaches one
      touching the connection outside a transaction (txlint_test covers it). It also flagged
      WeeklyTrainableTotalsByProvider, whose scope closure built its consent subquery from the
      outer context; the closure now takes the scoped one. To verify in a run.
    files:
      - services/tms/internal/infrastructure/postgres/repositories/rateagreementrepository/resolve.go
      - services/tms/internal/infrastructure/postgres/repositories/aicorrectionrepository/correction.go
      - services/tms/internal/infrastructure/postgres/rlslint/txlint.go
      - services/tms/internal/infrastructure/postgres/rlslint/txlint_test.go
    fixedIn: .deskbench/runs/20261009-185431-run

  - id: DB-039
    title: Two bench processes shared one namespace and ran each other's turns
    status: fixed
    severity: medium
    area: desk bench
    found: 2026-10-09, .deskbench/runs/20261009-184040-ask
    problem: >
      Every bench process registers its workers in the same Temporal namespace (deskbench) under the
      same identity. A desk ask started during a full run had its activities taken by the run's
      worker, built from an older checkout, so a fix under test appeared not to work, and the run
      executed some of the ask's work on its own build. Cases in a run that overlapped an ask
      cannot be trusted.
    fix: >
      Open takes an exclusive flock on .deskbench/<namespace>.lock, writes its pid there, and
      releases it on Close. A second bench in the same namespace refuses to start, naming the pid
      that holds it and --namespace as the way around.
    files:
      - services/tms/internal/deskbench/lock.go
      - services/tms/internal/deskbench/app.go
      - services/tms/cmd/cli/desk/desk.go
    fixedIn: this session

