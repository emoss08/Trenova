  - id: DB-086
    title: Seven more control repositories aborted a preview's read-only transaction on a missing row
    status: fixed
    severity: high
    area: repositories / previews
    found: 2026-10-10, .deskbench/runs/20261010-012111-run
    models: [claude-haiku-5-5, gpt-6-luna]
    problem: >
      Dispatch, document, settlement, carrier settlement, Dash and agent control, and the timesheet
      opener created their default row inside the caller's transaction; inside a preview's read-only
      snapshot the insert failed and aborted it, so every later check failed. Dispatch control failed
      this way 3 times in the run, aborting assignment previews.
    fix: >
      One helper, dbtx.GetOrCreate (Find, Create, Default, MapError), used by all eight
      repositories including data entry control: read-only contexts read and return the default; a
      write reads first, inserts in a savepoint, returns the default on a read-only refusal, reads
      again. rlslint recognises GetOrCreate as a scoped wrapper.
    fixedIn: uncommitted; dbtx unit tests; dispatch, data entry and document control integration tests pass against Postgres
    files:
      - services/tms/internal/infrastructure/postgres/dbtx/getorcreate.go
      - services/tms/internal/infrastructure/postgres/rlslint/txlint.go
      - services/tms/internal/infrastructure/postgres/repositories/dispatchcontrolrepository/dispatchcontrol.go
      - services/tms/internal/infrastructure/postgres/repositories/dataentrycontrolrepository/dataentrycontrol.go

