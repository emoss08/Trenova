  - id: DB-137
    title: '"No routine notices" read as forbidding the arrival notice the person asked for'
    status: fixed
    severity: medium
    area: tool results / customer update preferences
    found: 2026-10-10, .deskbench/runs/20261010-111436-run
    models: [claude-haiku-5-5]
    scenarios: [no-routine-notice-for-freshhaul]
    problem: >
      FreshHaul's preference warning said "never send one on your own" and gave only a delay and a new
      ETA as what the person may still ask for, so Haiku treated "send the arrival notice when it gets
      in" as routine and set no wait (and wrongly thought a move with no truck cannot be waited on).
