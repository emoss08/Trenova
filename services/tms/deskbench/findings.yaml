  - id: DB-056
    title: A corrected proposal in the same turn was approved together with the one it corrected
    status: fixed
    severity: critical
    area: agent runtime / proposals
    found: 2026-10-09, .deskbench/runs/20261009-224352-run
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      Haiku proposed create_shipment, saw it had sent a tractor type nobody asked for, proposed a
      corrected create_shipment in the same turn and told the person to reject the first. Both were
      filed into one plan, the person's one approval executed both, and the load was entered twice.
      The agent had no way to take back its own proposal, and nothing ever marks one Superseded.
    fix: >
      A runtime tool, withdraw_proposal, offered once a person-read turn has filed a proposal still
      waiting: it withdraws one filed earlier in the same turn, which the recorder saves Superseded
      and which is never a plan step, never offered in the approval box and gets no draft. One from
      an earlier turn is refused (the person rejects it). Every filing result names its proposal id.
      No GetVersion gate (data on the turn, no new command); the audit chain is unchanged.
    fixedIn:
      uncommitted; unit-tested; .deskbench/runs/20261009-233510-run passed the one-agent
      lifecycle with it live
    files:
      - services/tms/internal/core/services/agentruntime/withdrawproposal.go
      - services/tms/internal/core/services/proposalrecorder/recorder.go
      - services/tms/internal/core/ports/services/agentruntime.go

