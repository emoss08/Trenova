  - id: DB-125
    title: Agent activity made the open Desk refetch every cached conversation, until the browser hit the rate limit
    status: fixed
    severity: high
    area: web client / realtime
    found: 2026-10-10, services/tms/tmp/api.log 10:38 to 10:44 (reported by the user, 429 Too Many Requests)
    models: []
    scenarios: []
    problem: >
      While the bench ran, the Desk sent about 360 requests a minute, nearly all per-thread proposals
      (593) and artifacts (525) across 24 conversations. Proposal and artifact events invalidated every
      conversation's lists with refetchType "all", so each event refetched every cached thread, on
      screen or not (1,224 fetches for 50 events with 24 threads cached); the 300 ms coalescing only
      merged events in the same window, so a stream refetched the open thread almost per event; the
      page assistant read its whole artifact list with payloads to open one; and a running approval
      polled proposals and plans every 2 s although the server publishes the change when it commits.
    fix: >
      Events refetch only mounted queries (others are marked stale and read fresh when opened); an
      artifact event naming its thread invalidates only that thread; a list refetched within the last
      second waits for one trailing refetch; the page assistant reads one artifact's versions on click;
      and while realtime is connected a running approval polls every 15 s as a net for a lost event
      instead of every 2 s. Measured in the test: background threads 1,224 fetches to 0, the open
      thread 17 to 6 for 50 events.
    fixedIn: uncommitted; realtime-desk-flood.test.tsx, page-assistant.test.tsx, proposal-state.test.ts
    files:
      - client/packages/shared/src/hooks/realtime-patching.ts
      - client/apps/web/src/hooks/use-realtime-connection.ts
      - client/apps/web/src/components/assistant/page-assistant.tsx
      - client/apps/web/src/components/assistant/proposal-state.ts
      - client/apps/web/src/components/assistant/use-thread-model.ts

