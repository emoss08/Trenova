      invoice_list withheld them, so it could analyze a report but never check one of its figures
      against the records. The template now defaults to Restricted, which fixes the case, but any
      agent held to Internal still reads Restricted amounts through a report run.
    fix: >
      Not fixed. Apply the reader's data-access ceiling to report runs an agent starts or reads,
      the way the read tools apply it, and test that an Internal agent's report run withholds
      Restricted columns.

  - id: DB-257
    title: Carried-over PTO never expired in the daily run, and the seed skipped this year's rollover
    status: open
    severity: high
    area: workforce / PTO ledger
    found: 2026-10-27, .deskbench/runs/20261027-haiku-volume-fixed
    models: [claude-haiku-5-5]
    scenarios: [approve-pending-time-off]
    problem: >
      worker_approve_pto refused requests the worker's balance covered: the PTO seed posted
      accruals but never this year's rollover, so the balance projected an overdue year-end
      rollover (19.50 vacation days read as 1.25). Behind it, the rollover cursor compared keys
      as strings, so once January's carryover posted, the expiry of carried days never posted in
      the daily runs, and would then have blocked next year's carryover.
    fix: >
      Fixed in code, not yet confirmed by a bench run: RolloverDue compares by year then phase
      (ptoledgerservice/calculator.go, with tests), and the seed posts rollovers as the daily
      accrual run does (fixtures/17_pto_policy.go).
