  - id: DB-071
    title: No agent could propose a new customer; the preview's transaction was aborted
    status: fixed
    severity: critical
    area: master data / previews
    found: 2026-10-10, .deskbench/runs/20261010-012111-run
    models: [claude-haiku-5-5, gpt-6-luna]
    scenarios: [brand-new-customer]
    problem: >
      Validating create_customer reads the data entry control through GetOrCreate, which inserted
      the default row first. Inside the preview's read-only snapshot the INSERT failed and aborted
      the transaction, so every later check failed ("current transaction is aborted") and nothing
      was proposed. Seven other control repositories share the insert-first GetOrCreate.
    fix: >
      GetOrCreate reads first; on a read-only context a missing row returns the defaults without
      writing, and otherwise the insert runs in a savepoint (dberror.IsReadOnlyTransaction). Being
      moved into one dbtx helper for all eight repositories.
    fixedIn: uncommitted; TestGetOrCreateInAReadOnlyTransactionWritesNothing passes against Postgres
    files:
      - services/tms/internal/infrastructure/postgres/repositories/dataentrycontrolrepository/dataentrycontrol.go
      - services/tms/pkg/dberror/helpers.go

  - id: DB-072
    title: Every report touching an unclassified field was refused, for admins too
    status: fixed
    severity: high
    area: reports / permissions
    found: 2026-10-10, .deskbench/runs/20261010-012111-run
    models: [claude-haiku-5-5]
    scenarios: [revenue-by-customer]
    problem: >
      Revenue by Customer failed with 'field "Miles" on Shipment Move is not in your accessible
      field set'. The permission engine built AccessibleFields from only the fields a resource
      classifies itself, and every reader (report compiler, drill-down, report-builder tools, the
      GraphQL catalog behind the report builder UI) treats a non-empty list as the complete
      allowlist, so every unclassified field was withheld though MaxSensitivity allowed it.
    fix: >
      The engine no longer emits a list derived from sensitivity. Each of the four readers checks
      MaxSensitivity against GetFieldSensitivity first, which falls to the resource's
      DefaultSensitivity for an unlisted field, so nothing above the role's level is exposed.
    fixedIn: uncommitted; engine and reporting tests pass; reviewed every reader
    files:
      - services/tms/internal/core/services/permission/engine.go

