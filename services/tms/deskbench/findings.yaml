  - id: DB-232
    title: A shipment with no BOL is refused as a duplicate of any other open shipment with no BOL
    status: open
    severity: high
    area: operations / shipment validation
    found: 2026-10-27, .deskbench/runs/20261027-full
    models: [claude-haiku-5-5]
    scenarios:
      - create-shipment-from-a-sentence
      - shipment-from-scratch-with-a-new-customer
      - load-with-no-price-and-no-contract
      - lifecycle-handed-between-agents
    problem: >
      Once one open shipment without a BOL exists (S26101198339886, entered earlier in the same
      run), every later shipment_create without a BOL is refused with "BOL is already in use by
      shipment(s) with Pro Number(s): S26101198339886". The agent passed no BOL at all; it then
      asked the person for a BOL the load does not need, and four cases proposed nothing.
    evidence: >
      The query log shows the duplicate check as `s.bol IS NULL AND s.status <> 'Canceled'`
      (13 times in the run). The colliding shipment's bol is NULL.
    cause: >
      checkDuplicateBOLsWithControl (shipmentservice/shipment_duplicate_bol.go) runs whenever
      ShipmentControl.CheckForDuplicateBOLs is on, whatever the BOL. CheckForDuplicateBOLs in
      shipmentrepository filters with sp.BOL.Eq(req.BOL); keel writes an empty string to the
      nullable column as NULL and compiles Eq("") to IS NULL, so "no BOL" matches "no BOL".
    fix: >
      Not fixed. Skip the duplicate check when the BOL is blank (trimmed), in the service, and add
      a repository test that two BOL-less shipments do not collide. Create, update and the
      CheckForDuplicateBOLs entry point all reach the same helper.
    files:
      - services/tms/internal/modules/operations/app/shipmentservice/shipment_duplicate_bol.go
      - services/tms/internal/modules/operations/adapters/postgres/shipmentrepository/shipment.go

  - id: DB-233
    title: An unattended run cannot read a shipment's comments, so a dispatcher's note never reaches it
    status: open
    severity: high
    area: agent tools / shipment reads
    found: 2026-10-27, .deskbench/runs/20261027-full
    models: [claude-haiku-5-5]
    scenarios: [unattended-service-failure-receiver-closed-dock]
