  - id: DB-248
    title: An approval refused because the record changed leaves the conversation silent
    status: open
    severity: medium
    area: agent runtime / decisions
    found: 2026-10-27, .deskbench/runs/20261027-fixed
    models: [claude-haiku-5-5]
    scenarios: [codemode-stale-hold-after-cancel-discrete, codemode-stale-hold-after-cancel-script, codemode-stale-batch-note-one-canceled-discrete, codemode-stale-batch-note-one-canceled-script]
    problem: >
      The person approves a hold; between the proposal and the approval the load was canceled.
      The executor correctly refuses (no hold placed, the cancellation stands), but no follow-up
      turn starts, so the person who pressed approve is never told why nothing happened or that
      the load was canceled. Every other decision gets a follow-up. The bench waits three minutes
      for that follow-up in each of the four stale cases (one exclusive chain, so twelve minutes a
      run) before it rejects what is left.
    fix: >
      Not fixed. Start the decision follow-up for a refused-as-stale approval too, with the
      refusal and what changed on the record (its new status, who changed it), so the agent can
      say so and offer to propose again against the current version.

  - id: DB-249
