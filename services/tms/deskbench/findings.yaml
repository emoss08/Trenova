      shipments, customers, workers and documents asked about from the palette. The Desk and the
      kinds outside the global index need a lookup by identifier across kinds.

  - id: DB-158
    title: A connection draft the agent replaced is still required in the reply, so the reply links the stale draft
    status: fixed
    severity: medium
    area: agent runtime / reply pass (artifact placement)
    found: 2026-10-15, .deskbench/runs/20261015-115248-run
    models: [claude-haiku-5-5]
    scenarios: [edi-guide-new-partner, edi-guide-revised]
    problem: >
      When a turn drafts twice (the first draft held a value, the second fixed it), both
      edi_connection_draft artifacts carry the same title and both must be linked. The model's
      first-written reply links the current draft inside a sentence, which is what #771 asked
      for, and the guard then demands the superseded one: relink_artifacts, then place_artifacts
      appends "The details are in [EDI connection for Acme Retail Group](artifact:<first draft>)".
      In edi-guide-new-partner #3 the rewrite moved the in-sentence link to the superseded draft
      and place_artifacts appended the current one at the end. The person is pointed at a draft
      the proposal is not built from, under the same title as the one it is.
    evidence: >
      4 of 4 corrected cases (edi-guide-new-partner #2 and #3, edi-guide-revised #1 and #2), each
      with two drafts in the turn. new-partner #2 first wrote "Review it in [EDI connection for
      Acme Retail Group](artifact:art_01M504J8ZAQE1NKXYY19781CAG)." and was told
      "art_01M504HQ2RSBNW4YG0BG9EWPTE is not named" (the blocked first draft). revised #1's rewrite
      said "so I've linked that version rather than the earlier draft", and place_artifacts
      appended the earlier draft anyway.
    cause: >
      Turn.placementProblems (agentruntime/placement.go) counts every shown artifact whose
      MustBeLinked() is true as missing when unlinked. MustBeLinked is true for every
      KindEDIConnectionDraft, and nothing marks an earlier draft of the same connection as
      replaced by a later one in the same turn.
    fix: >
      A shown artifact carries its lineage (ShownArtifact.Lineage, the first version's id), and
      Turn.keepShown puts a new version in place of the one before it, so placement, the table
      reprint check and everything else read only the current version. A draft's lineage key is
      its guide alone (assistantartifact.LineageKeyFor, namedBy): the first fix keyed it on every
      id argument, and a redraft that named ediPartnerId after the first let the planner match
      it landed in a lineage of its own (20261015-125246-run, edi-guide-revised #3).
    files:
      - services/tms/internal/modules/agent/ports/agentports/agentruntime.go
      - services/tms/internal/modules/agent/app/assistantservice/artifacts.go
      - services/tms/internal/modules/agent/app/agentruntime/replypass.go
      - services/tms/internal/modules/agent/domain/assistantartifact/lineage.go
    fixedIn: >
      uncommitted; verified by .deskbench/runs/20261015-132109-run (edi-guide-new-partner #1 and
      #3 each drafted twice in one turn and neither reply was corrected)

  - id: DB-159
    title: The connection draft refuses a guide's own spelling of MDN mode and signing algorithm
    status: fixed
    severity: medium
    area: agent tools / EDI connection draft
    found: 2026-10-15, .deskbench/runs/20261015-115248-run
    models: [claude-haiku-5-5]
    scenarios: [edi-guide-new-partner, edi-guide-revised]
    problem: >
      Every first draft_edi_connection call (6 of 6) passed the guide's wording: as2.mdnMode
      "Synchronous, signed" (or "Synchronous") and as2.signingAlgorithm "SHA-256". "Synchronous,
      signed" is held as an Invalid decision ("MDN mode must be one of async, sync"), which blocks
      the draft; "SHA-256" is held as Invalid too, on a draft otherwise ready. Four cases redrafted
      with "sync"/"sha256" on their own (each second draft then led to DB-158); two asked the
      person which MDN mode to use when the guide states it, and failed. In edi-guide-revised #3
      the held decision showed current "sync" and change "Same", and still blocked with "Decide
      MDN mode".
    evidence: >
      edi-guide-new-partner #1 asked "Acme's guide says MDN is \"synchronous, signed\" (page 2).
      Which MDN mode should the Acme AS2 connection use?"; edi-guide-revised #3 asked "The Acme
      guide says MDN is \"synchronous, signed\", but the draft is blocked until you pick the MDN
      mode Trenova accepts. Which should it use?". Both turns ended on the question with no reply,
      so no proposal was filed.
    cause: >
      In ediconnectiondraft/catalog.go the normalizer and the spelled list disagree. as2.mdnMode's
      choice() accepts "sync" and "synchronous" but not "synchronous, signed"; as2.signingAlgorithm
      uses as2Algorithms(), which accepts only "sha256", while its spelled list already names
      "sha-256" and "sha 256". The values schema gives no hint of the accepted forms.
    fix: >
      Every field with a spelled list reads a value it does not accept through those spellings
      (spelledOut): the longest phrase wins, so "AES-256-GCM" is aes256-gcm, and a value that
      spells two codes stays invalid. "Synchronous, signed", "SHA-256", "AES-256 (CBC)",
      "qualifier 01 (DUNS)" and "* (asterisk)" now normalize; the plan test passes them as the
      guide writes them.
    files:
      - services/tms/internal/modules/edi/app/ediconnectiondraft/catalog.go
      - services/tms/internal/modules/edi/app/ediconnectiondraft/fields.go
    fixedIn: >
      uncommitted; verified by .deskbench/runs/20261015-123455-run, 20261015-125246-run,
      20261015-130724-run and 20261015-132109-run (no MDN mode, signing or encryption value held
      in any guide case)

