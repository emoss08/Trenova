      The classifier prompt says analyzing, charting, totalling or comparing the organization's
      own data is TransportationOperations even when the request names Python, pandas, a package
      or a sandbox; software for the person to run elsewhere stays CodeGeneration, a computation
      unrelated to the organization's data GeneralKnowledge, and asking for the sandbox's
      environment or keys PromptManipulation. The verdict cache is keyed by the prompt's digest,
      so earlier verdicts lapse.
