  - id: DB-134
    title: Time-off previews named each request a day later than the list did, and the agent withdrew correct approvals
    status: fixed
    severity: high
    area: proposal previews / time off
    found: 2026-10-10, .deskbench/runs/20261010-101625-run
    models: [gpt-6-luna]
    scenarios: [approve-pending-time-off]
    problem: >
      ptoLabel formatted a request's start and end in UTC while list_time_off renders them in the
      turn's zone. A request stored at 01:17 UTC read a day later in the approve, reject and cancel
      previews than in the list. gpt-6-luna proposed approving Jane's six pending requests, saw the
      dates disagree, began withdrawing all six and ran out of its 12-call budget halfway, leaving three
      "mismatched" proposals waiting. The ledger's "only N days will be available on <date>" message
      had the same UTC date.
    fix: >
      PTO days are booked in the organization's zone (ptoledgerservice.OrgLocation), so the transition
      preview now carries that Location and ptoLabel names the days in it. The zone is the
      organization's, not the viewer's, so the preview's digest is the same whoever computes it. The
      availability message formats its date in the organization's zone too.
    fixedIn: uncommitted; TestPTOLabel_NamesTheDaysInTheOrganizationsZone
    files:
      - services/tms/internal/core/ports/services/workerpto.go
      - services/tms/internal/core/services/workerptoservice/preview_transition.go
      - services/tms/internal/core/services/agenttoolservice/preview_driver.go
      - services/tms/internal/core/services/agenttoolservice/preview_pto_approval.go
      - services/tms/internal/core/services/agenttoolservice/preview_driver_test.go
      - services/tms/internal/core/services/ptoledgerservice/availability.go

