  - id: DB-235
    title: A word that names several kinds of record turns a multi-word shipment search into an OR
    status: open
    severity: medium
    area: agent tools / shipment search
    found: 2026-10-27, .deskbench/runs/20261027-full
    models: [claude-haiku-5-5]
    scenarios: [delivered-and-billed]
    problem: >
      "did the acme steel load deliver yet" searched "Acme Steel". "steel" names five customers
      (Cascade Steel, Evergreen Steel, ...) and two commodities as well as SEED-SHP-005's Steel
      Coils, so partyLookups fell back to "or customer ... or carrying ...": ten Acme loads came
      back, none of them SEED-SHP-005, and the rows carry no commodity. The agent then said "none
      of its loads carry steel; they are General Freight", a claim from two of twelve loads.
    cause: >
      allFromDifferentWords is false when one word resolves to more than one kind of party, and
      the fallback ORs every lookup. The tool description promises "several words each narrow".
      The row has no commodity column, so the model cannot see why a row matched.
    fix: >
      Not fixed. Keep the AND across words when each word resolves to at least one party, trying
      each reading of an ambiguous word; add the commodity (or the matched term) to each row.
    files:
      - services/tms/internal/modules/agent/app/agentquerytoolservice/shipment_tools.go

  - id: DB-236
    title: A trailer listed as Available is on a move in progress, and the conflict surfaces two steps later
    status: open
    severity: medium
    area: equipment / availability
    found: 2026-10-27, .deskbench/runs/20261027-full
    models: [claude-haiku-5-5]
    scenarios: [lifecycle-one-agent-book-to-posted-invoice]
    problem: >
      equipment_list_trailers with status Available returned TRL-001; dispatch_assign_move was
      proposed with it and approved, and only dispatch_record_stop_actual refused it ("Trailer is
      currently in progress on another move", SEED-DET-001). The agent unassigned and reassigned
      with TRL-002, which was on SEED-DET-002, and the case never recorded the delivery.
    cause: >
      A trailer's status is a stored field, not derived from its open assignments, so
      Available says nothing about whether it is on a move. The assignment check flags the
      conflict as a warning but files the assignment anyway.
    fix: >
      Not fixed. Either derive "in use" from open assignments in the trailer list (a column or a
      filter) or refuse dispatch_assign_move on a trailer in progress elsewhere, so the conflict
      is met where the choice is made.

