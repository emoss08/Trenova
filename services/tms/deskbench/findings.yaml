  - id: DB-244
    title: The grounding guard rewrites a reply for a field read from the record, not the proposal
    status: open
    severity: low
    area: agent runtime / grounding guard
    found: 2026-10-27, .deskbench/runs/20261027-full
    models: [claude-haiku-5-5]
    scenarios: [send-a-delivered-load-to-billing]
    problem: >
      The reply said the load was "delivered to the Chicago Distribution Center", read from
      shipment_get; the guard rewrote it and then appended a note because the filed
      billing_transfer does not hold "delivered to". Derived figures were rewritten in three other
      cases (5.6 in analysis-chart-asked-for, 1,390 = 400 mi x $3.10 + $150 in
      formula-asked-for-in-the-desk, 17,000 in palette-customer-by-name), each a figure the model
      worked out from what it read.
    fix: >
      The field claim is checked against what the conversation read (readResults). Derived
      figures: numberguard.Derived follows the reply's working a second step and totals what it
      lists (each list's and table column's amounts, three or more in one sentence), every operand
      a figure the reply states, so 1,390 = 400 mi x $3.10 + $150 shown as $1,240 plus $150, and
      17,000 after the six loads it totals, are checked rather than rewritten. A figure said of the
      filed change keeps the one-step check. The 5.6 in analysis-chart-asked-for was a $5.6M top-10
      total the reply did not list; it still goes to a script, as does 410 in the formula's own
      made-up 100-mile test.
    fixedIn: uncommitted; TestGroundingGuard_ChecksArithmeticOnWhatTheConversationRead, TestDerived_FollowsWorkingTheProseShowsInSteps

