  - id: DB-214
    title: Two parallel get calls of one kind merge into one table and drop the first card
    status: fixed
    severity: medium
    area: agent runtime / result artifacts
    found: 2026-10-19, .deskbench/runs/20261019-125417-run
    models: [claude-haiku-5-5]
    scenarios: [approve-two-settlements-in-one-go]
    problem: >
      settlement_get_driver called twice in one reply produced a "Driver settlement" card and then
      a "Driver settlements (2)" table, and the card was removed (artifact_removed). The model had
      linked the card for Jane Doe, so the reply lost that link and the table link sat beside
      Sarah Williams alone.
    evidence: >
      transcript of approve-two-settlements-in-one-go #2, model call #8 to the reply; event
      artifact_removed art_01M5AHE0XPY8E7ZMT3DZXACHMS.
    cause: >
      A second get of one tool in a turn folds the earlier card into a table and retires the card (assistantservice/artifact_bunch.go). When the two calls run in parallel, the first call's result has already told the model to link the card, so the reply linked an artifact that was gone and the reply pass dropped the link.
    fix: >
      A bunched table names the cards it replaced (ShownArtifact.Replaces). When a replaced card's result is still in the batch the model has not read, the runtime rewrites that result's note to point to the table instead (Turn.foldReplaced, foldedNote) and drops the card from what the turn keeps; a result the model has already read is never rewritten, so the cached prefix and replayed thinking stay intact.
    files:
      - services/tms/internal/modules/agent/ports/agentports/agentruntime.go
      - services/tms/internal/modules/agent/app/assistantservice/artifact_bunch.go
      - services/tms/internal/modules/agent/app/agentruntime/replypass.go
      - services/tms/internal/modules/agent/app/agentruntime/publish.go
      - services/tms/internal/modules/agent/app/agentruntime/runner.go
    fixedIn: >
      .deskbench/runs/20261019-165003-run: approve-two-settlements-in-one-go #2 read both settlements in parallel; Jane Doe's result reads "This record is now one row of a table titled \"Driver settlements (2)\"" and the reply links no retired card. 3/3.

  - id: DB-215
    title: A run the bench stopped on purpose failed the case's "every turn finished" check
    status: fixed
    severity: medium
    area: deskbench / checks
    found: 2026-10-19, .deskbench/runs/20261019-132324-run
    models: [claude-haiku-5-5]
    scenarios: [unattended-billing-stopped-while-waiting-closes-the-run]
    problem: >
      Every trial passed its own checks (stopped while waiting, ended Failed, proposal expired,
      the run says why) and still failed "every turn finished — Failed: the run was stopped while
      its proposals waited for a decision".
    cause: >
      stopWaitingRun copies the stopped run's error into the turn's Failure, and turnsCompleted
      fails any turn with a Failure, so the outcome a stopWhileWaiting step asks for counted
      against it.
    fix: >
      turnsCompleted takes a run the bench stopped as the step's outcome and ignores its failure;
      a capture error still fails it, and a run the bench did not stop still fails on its own
      error.
    files:
      - services/tms/internal/deskbench/checks.go
      - services/tms/internal/deskbench/stop_test.go
    fixedIn: >
      .deskbench/runs/20261019-132930-run: unattended-billing-stopped-while-waiting-closes-the-run 0/3 → 3/3.

