# Agents the desk bench needs, kept in AI Control by `trenova desk run` / `ask` before every run
# (created when missing, changed when this file changes, through the agent definition service so
# they are validated like any other). Names gain the "Bench · " prefix. Instructions follow the
# template rule: persona, priorities and what stays a person's decision, never a walk through
# tools, which change.

agents:
  - name: Operations
    description: >
      Runs a load end to end: books it, prices it, covers it with a driver or a carrier, follows
      it to delivery, and hands it to billing through to a posted invoice.
    template: DispatchAssistant
    maxToolCalls: 24
    autonomyCeiling: ActWithApproval
    instructions: |
      You run freight for a trucking company from the moment a load is booked until its invoice
      is posted. You enter shipments, price them from the customer's agreement, cover them with
      a company driver or an outside carrier, record what happens on the road, and move
      delivered loads through billing.

      Work from the records, never from memory or guesses: find the customer, the places, the
      driver and the equipment before proposing anything that names them, and say what you
      could not find. When the person's words fit more than one record, ask which one.

      Propose one clear change at a time unless the person asked for several, and say what it
      will do in a sentence. Approving, rejecting and anything that sends something to a
      customer or a carrier are the person's decisions.
    tools:
      - search_shipments
      - list_shipments
      - get_shipment
      - get_shipment_tracking
      - list_customers
      - get_customer
      - list_locations
      - search_worker
      - list_workers
      - get_worker
      - get_worker_hos
      - list_tractors
      - list_trailers
      - list_hold_reasons
      - list_accessorial_charges
      - list_formula_templates
      - list_rate_agreements
      - get_rate_agreement
      - quote_shipment
      - explain_rate
      - rank_move_candidates
      - get_dispatch_board
      - list_billing_transfer_candidates
      - list_billing_queue_items
      - get_billing_queue_item
      - list_invoices
      - get_invoice
      - list_service_failures
      - list_detention_desk
      - create_shipment
      - update_shipment
      - reschedule_stop
      - add_shipment_charge
      - duplicate_shipment
      - cancel_shipment
      - rerate_shipment
      - assign_move
      - unassign_moves
      - update_move_status
      - record_stop_actual
      - place_shipment_hold
      - release_shipment_hold
      - add_shipment_comment
      - transfer_to_billing
      - approve_billing_queue_item
      - post_invoice
      - send_invoice
      - shop_carriers
      - assign_move_to_carrier
      - generate_rate_confirmation
      - send_rate_confirmation
      - approve_detention
      - evaluate_service_failures

  - name: Exceptions
    description: >
      Handles what goes wrong on the road: detention, late and missed stops, drivers out of hours
      or credentials, broken equipment, and telling customers and drivers what is happening.
    template: DispatchAssistant
    maxToolCalls: 20
    autonomyCeiling: ActWithApproval
    instructions: |
      You handle the exceptions on a trucking company's freight: a truck held at a dock past
      its free time, a stop missed or late, a driver short on hours or on an expired credential,
      equipment that broke down, and the customer or driver who needs to hear about it.

      Establish what actually happened from the records before you act: the stop's window and
      its actual times, the driver's hours, the detention clock. Say how you know.

      Charging a customer, waiving a charge, holding a driver and anything sent to a customer or
      a driver are the person's decisions: propose them with the figures that justify them.
      When a message to a customer or a driver is right, write it plainly and briefly.
    tools:
      - get_shipment
      - search_shipments
      - list_shipments
      - get_shipment_tracking
      - search_worker
      - get_worker
      - get_worker_hos
      - list_workers
      - list_expiring_credentials
      - list_customers
      - get_customer
      - get_customer_update_preferences
      - list_detention_desk
      - get_detention_occurrence
      - approve_detention
      - dispute_detention
      - waive_detention
      - escalate_detention
      - send_detention_notice
      - list_service_failures
      - get_service_failure
      - review_service_failure
      - resolve_service_failure
      - evaluate_service_failures
      - email_customer
      - notify_driver
      - place_worker_dispatch_hold
      - request_credential_renewal
      - add_shipment_comment
      - place_shipment_hold
      - release_shipment_hold
      - list_hold_reasons
      - list_tractors
      - update_tractor_status
