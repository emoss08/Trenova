defaults:
  tags: [operations, write]

scenarios:
  - name: new-customer-location
    description: An address read off an email, turned into a location.
    agent: Master data steward
    tags: [masterdata]
    steps:
      - say: "add a new location: Walmart DC 6094, 2100 W Lewis Ave, Phoenix AZ 85009, its a receiver"
        expect:
          proposals: [{ tool: location_create }]
          maxFailedCalls: 2
          rubric: >
            Proposes a location with that name, address, city, state and ZIP, picks a fitting
            category, and does not geocode or invent details it was not given.

  - name: new-customer-that-already-exists
    description: Asked to create a customer that is already there.
    agent: Master data steward
    tags: [masterdata]
    steps:
      - say: "set up acme manufacturing as a customer"
        expect:
          calls: ["customer_list|customer_get"]
          noCalls: [customer_create]
          noProposals: true
          rubric: Notices Acme Manufacturing (ACME) already exists and says so instead of creating a duplicate.

  - name: brand-new-customer
    description: A customer that does not exist yet.
    agent: Master data steward
    tags: [masterdata]
    steps:
      - say: "new customer Blue Mesa Produce, 2210 E Benson Hwy, Tucson AZ 85706, code BMPR"
        expect:
          calls: ["customer_list"]
          proposals: [{ tool: customer_create, args: { code: BMPR } }]
          maxFailedCalls: 2

  - name: send-a-delivered-load-to-billing
    description: The hand-off from operations to billing, approved.
    agent: Billing exceptions
    tags: [billing]
    setup:
      - >
        WITH removed AS (
          DELETE FROM billing_queue_items AS b USING shipments AS s, customers AS c
          WHERE b.shipment_id = s.id AND c.id = s.customer_id AND c.code = 'ACME'
            AND s.pro_number LIKE 'SEED-%'
            AND s.pro_number NOT IN ('SEED-DET-001', 'SEED-DET-002')
            AND b.status = 'ReadyForReview'
            AND NOT EXISTS (SELECT 1 FROM invoices AS i WHERE i.billing_queue_item_id = b.id)
          RETURNING b.shipment_id)
        UPDATE shipments SET status = 'Completed', billing_transfer_status = NULL,
          transferred_to_billing_at = NULL, marked_ready_to_bill_at = NULL
        WHERE id IN (SELECT shipment_id FROM removed) AND status = 'ReadyToInvoice'
      - >
        DELETE FROM billing_queue_items AS b USING shipments AS s
        WHERE b.shipment_id = s.id AND s.pro_number IN ('SEED-DET-001', 'SEED-DET-002')
          AND NOT EXISTS (SELECT 1 FROM invoices AS i WHERE i.billing_queue_item_id = b.id)
      - >
        UPDATE shipment_moves AS sm SET status = 'InTransit'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number IN ('SEED-DET-001', 'SEED-DET-002')
          AND sm.status <> 'InTransit'
          AND EXISTS (SELECT 1 FROM stops AS st WHERE st.shipment_move_id = sm.id
                      AND st.actual_arrival IS NOT NULL AND st.actual_departure IS NULL)
      - >
        UPDATE shipments AS sp SET status = 'InTransit', billing_transfer_status = NULL,
          transferred_to_billing_at = NULL, marked_ready_to_bill_at = NULL
        WHERE sp.pro_number IN ('SEED-DET-001', 'SEED-DET-002') AND sp.status <> 'InTransit'
          AND EXISTS (SELECT 1 FROM shipment_moves AS sm
                      WHERE sm.shipment_id = sp.id AND sm.status = 'InTransit')
    steps:
      - say: "acme's last delivered load that hasn't gone to billing yet, send it over"
        expect:
          proposals: [{ tool: billing_transfer }]
          maxFailedCalls: 1
      - decide: approve
        expect:
          executed: true

  - name: invoice-a-ready-load
    description: Turning a ready load into an invoice.
    agent: Billing exceptions
    tags: [billing]
    steps:
      - say: "invoice the peak denver to phoenix load"
        expect:
          noCalls: [invoice_create]
          maxFailedCalls: 1
          replyIncludes: ["SEED-SHP-009"]
          facts:
            - sql: >
                select case when status = 'Invoiced' then 'invoiced' else pro_number end
                from shipments where pro_number = 'SEED-SHP-009'
              note: that it is already invoiced, when an earlier run posted its invoice
          rubric: >
            Finds SEED-SHP-009 (Peak, Denver to Phoenix) and proposes the step that gets it
            invoiced from where it stands, saying what comes after: posting the draft an earlier
            run left (one invoice or the batch twin), or the queue step before it. A posted invoice
            cannot be reset between runs, so once one is posted the right answer is that it is
            already invoiced, with nothing proposed that would duplicate it.

  - name: request-time-off
    description: >
      Time off asked for on a driver's behalf. A tenant has several drivers called Carlos, so he is
      named the way a dispatcher names him once asked which one.
    agent: Workforce coordinator
    tags: [workforce]
    steps:
      - say: "carlos rivera needs next friday off, put it in as vacation"
        expect:
          calls: ["worker_list"]
          proposals: [{ tool: worker_request_pto }]
          maxFailedCalls: 1
          rubric: >
            Resolves Carlos Rivera and next Friday's date, and proposes one day of vacation, or says
            plainly what time off already covers that day.

  - name: approve-pending-time-off
    description: >
      Clearing what is waiting. The fixture seed gives Jane Doe and the other first drivers
      eighty time-off records each, a score of them still requested and most beyond her balance,
      so the scenario owns its driver's pending requests instead: Emily Chen has none seeded, and
      the setup files two (two vacation days in about three weeks, one sick day in about twelve
      days) and keeps them requested and ahead of today on every run. Her balances cover both:
      the setup marks this year's rollover as posted on them, as the daily accrual run leaves
      them, because a database seeded before the PTO seed posted rollovers holds a balance whose
      year-end rollover is still due, and approving projects it (19.50 vacation days read as
      1.25, 7 sick days as none) and is rightly refused.
    agent: Workforce coordinator
    tags: [workforce]
    setup:
      - >
        INSERT INTO worker_pto
          (id, worker_id, business_unit_id, organization_id, status, type, start_date, end_date,
           reason, days)
        SELECT v.id, w.id, w.business_unit_id, w.organization_id, 'Requested',
          v.kind::worker_pto_type_enum,
          EXTRACT(EPOCH FROM date_trunc('day', now()))::bigint + v.start_off,
          EXTRACT(EPOCH FROM date_trunc('day', now()))::bigint + v.end_off,
          v.reason, v.days
        FROM workers AS w
        CROSS JOIN (VALUES
            ('wrkpto_01JBENCH00000000000000PT01', 'Vacation', 1951200, 2066400, 'Family vacation', 2),
            ('wrkpto_01JBENCH00000000000000PT02', 'Sick', 1087200, 1116000, 'Doctor visit', 1))
          AS v (id, kind, start_off, end_off, reason, days)
        WHERE w.email = 'emily.chen@example.com'
        ON CONFLICT DO NOTHING
      - >
        UPDATE worker_pto AS p
        SET status = 'Requested', approver_id = NULL, rejector_id = NULL, cancelled_by_id = NULL,
          rejection_reason = NULL, cancellation_reason = NULL,
          start_date = EXTRACT(EPOCH FROM date_trunc('day', now()))::bigint + v.start_off,
          end_date = EXTRACT(EPOCH FROM date_trunc('day', now()))::bigint + v.end_off
        FROM (VALUES
            ('wrkpto_01JBENCH00000000000000PT01', 1951200, 2066400),
            ('wrkpto_01JBENCH00000000000000PT02', 1087200, 1116000))
          AS v (id, start_off, end_off)
        WHERE p.id = v.id AND p.status IN ('Requested', 'Rejected', 'Cancelled')
      - >
        UPDATE worker_pto_balances AS b
        SET last_rollover_key = 'X:' || extract(YEAR FROM now())::int, carried_days = 0
        FROM workers AS w
        WHERE b.worker_id = w.id AND w.email = 'emily.chen@example.com'
          AND coalesce(b.last_rollover_key, '') NOT IN
            ('C:' || extract(YEAR FROM now())::int, 'X:' || extract(YEAR FROM now())::int)
    steps:
      - say: "approve whatever pto emily chen has pending"
        expect:
          calls: ["worker_list_time_off"]
          proposals: [{ tool: worker_approve_pto }]
          maxFailedCalls: 1
          rubric: >
            Lists Emily Chen's requested time off (two vacation days in about three weeks and a
            sick day in about twelve days) and proposes approving both requests, naming the
            dates, rather than approving anything not requested.

  - name: log-a-fuel-purchase
    description: A fuel receipt read out over the phone.
    agent: Fuel and IFTA clerk
    tags: [fuel]
    steps:
      - say: "log fuel for trc-001: 112 gallons diesel at 3.89 in amarillo tx yesterday"
        expect:
          proposals: [{ tool: fuel_record_purchase }]
          maxFailedCalls: 1
          rubric: >
            Proposes 112 gallons of diesel at $3.89 ($435.68) for TRC-001 in Texas dated yesterday,
            asking for a driver only if the tool requires one.

  - name: revenue-by-customer
    description: A management question that belongs to reports.
    agent: Report analyst
    tags: [reports, read]
    steps:
      - say: "how much did we bill by customer last month"
        expect:
          calls: ["report_list|report_run|report_preview|report_get"]
          maxFailedCalls: 1
          noProposals: true
          rubric: >
            Runs or previews a report of billed revenue by customer for last month and gives the
            figures it returned (none, if nothing was invoiced), not figures it estimated.

  - name: record-a-new-med-card
    description: A credential renewal reported in passing.
    agent: Compliance desk
    tags: [compliance]
    steps:
      - say: "jane got her new med card today, good till oct 9 2028"
        expect:
          calls: ["worker_list|worker_list_credentials"]
          proposals: [{ tool: "worker_record_credential|worker_update_credential" }]
          maxFailedCalls: 1
          rubric: >
            Records a medical card for Jane Doe issued today and expiring in October 2028, and asks
            for the exact expiry day only if the tool needs one.
