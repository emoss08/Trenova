defaults:
  tags: [conversation]

scenarios:
  - name: correction-mid-flow
    description: >
      A note for "the acme load" when Acme has several: the agent asks, and the answer narrows to
      one load by its lane and its status.
    agent: Dispatch desk
    exclusive: acme-shipments
    setup:
      - >
        UPDATE shipment_moves AS sm SET status = 'Canceled'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id
          AND sp.status = 'New'
          AND sp.pro_number NOT LIKE 'SEED-%'
          AND sp.customer_id = (SELECT id FROM customers WHERE code = 'ACME')
          AND sp.id IN (
            SELECT p.execution_result->'record'->>'id'
            FROM agent_proposals p
            JOIN agent_runs r ON r.id = p.run_id
            JOIN assistant_threads t ON t.id = r.subject_id
            WHERE t.title LIKE '[bench]%' AND p.status = 'Executed'
              AND p.tool_name IN ('shipment_create', 'shipment_duplicate'))
      - >
        UPDATE shipments AS sp SET status = 'Canceled'
        WHERE sp.status = 'New'
          AND sp.pro_number NOT LIKE 'SEED-%'
          AND sp.customer_id = (SELECT id FROM customers WHERE code = 'ACME')
          AND sp.id IN (
            SELECT p.execution_result->'record'->>'id'
            FROM agent_proposals p
            JOIN agent_runs r ON r.id = p.run_id
            JOIN assistant_threads t ON t.id = r.subject_id
            WHERE t.title LIKE '[bench]%' AND p.status = 'Executed'
              AND p.tool_name IN ('shipment_create', 'shipment_duplicate'))
      - >
        UPDATE shipments SET status = 'New', canceled_at = NULL, canceled_by_id = NULL,
          cancel_reason = NULL
        WHERE pro_number = 'SEED-SHP-001' AND status = 'Canceled'
      - >
        UPDATE shipment_moves AS sm SET status = 'New'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number = 'SEED-SHP-001'
          AND sm.status = 'Canceled'
    steps:
      - say: "add a note on the acme load that the shipper wants a call before arrival"
        expect:
          maxFailedCalls: 2
      - say: "the LA to chicago one that hasn't been picked up yet"
        expect:
          noCalls: [ask_user]
          maxCalls: 4
          rubric: >
            Settles on SEED-SHP-001 (Acme, LA to Chicago, still New), the only Acme load on that
            lane not yet picked up: proposes the note on it, or, when the first turn already
            proposed it there, says that proposal is the one, without asking again or proposing
            a second note. Never puts the note on another load.

  - name: ambiguous-load-asks
    description: >
      Eleven FreshHaul reefers to LA exist locally; "the freshhaul load" is not one of them, so the
      agent should ask, not pick one.
    agent: Bench · Shipment Assistant
    steps:
      - say: "cancel the freshhaul load to LA"
        expect:
          noProposals: true
          calls: ["shipment_list"]
          rubric: >
            Says several FreshHaul loads to Los Angeles match and asks which one (by pro number,
            pickup date or status) instead of cancelling any of them.

  - name: remember-a-customer-rule
    description: >
      A standing instruction about a customer, kept for later conversations. The rule an earlier
      run kept is removed first, so the agent records it rather than finding it already on file.
    agent: Dispatch desk
    tags: [memory]
    exclusive: acme-memory
    setup:
      - >
        DELETE FROM agent_memories
        WHERE content ILIKE '%acme%' AND content ILIKE '%24 hour%notice%'
    steps:
      - say: "remember acme always needs 24 hours notice before we deliver"
        expect:
          calls: ["agent_create_memory"]
          rubric: >
            Records the rule against Acme Manufacturing (not as a general instruction), and says
            whether it is kept now or waits for approval.

  - name: edit-a-customer-rule
    description: >
      A person corrects part of a rule kept for the whole organization. The agent changes the kept
      rule as its replacement (an edit, or a rewrite naming it in replacesMemoryId) rather than
      saving a second rule beside it. The call runs unasked, but a memory shared with others is
      never replaced by a call nobody approved: the change is kept as an offer and the old rule
      stands until a person accepts it. The rule is planted fresh, and anything an earlier run
      made of it removed.
    agent: Dispatch desk
    tags: [memory]
    exclusive: acme-memory
    setup:
      - >
        DELETE FROM agent_memories
        WHERE id = 'amem_01M6BENCHACMEQ0TE000000000'
           OR supersedes_id = 'amem_01M6BENCHACMEQ0TE000000000'
           OR (content ILIKE '%acme%' AND content ILIKE '%dollars%')
      - >
        INSERT INTO agent_memories
          (id, business_unit_id, organization_id, kind, source, status, scope, subject_type,
           subject_id, subject_label, content)
        SELECT 'amem_01M6BENCHACMEQ0TE000000000', c.business_unit_id, c.organization_id,
               'Instruction', 'User', 'Active', 'Organization', 'Customer', c.id, c.name,
               'Quote Acme Manufacturing in US dollars, and copy their AP desk on every quote.'
        FROM customers AS c
        WHERE c.name ILIKE 'Acme Manufacturing%'
        ORDER BY c.created_at
        LIMIT 1
    steps:
      - say: "acme quotes should be in canadian dollars now, not US. keep copying their AP desk"
        expect:
          calls: ["agent_edit_memory|agent_create_memory"]
          db:
            - sql: >
                SELECT count(*) FROM agent_memories
                WHERE supersedes_id = 'amem_01M6BENCHACMEQ0TE000000000' AND status = 'Suggested'
                  AND content ILIKE '%canadian%' AND content ILIKE '%AP desk%'
              equals: "1"
              note: the change is offered once, in Canadian dollars, still copying the AP desk
            - sql: >
                SELECT status FROM agent_memories WHERE id = 'amem_01M6BENCHACMEQ0TE000000000'
              equals: "Active"
              note: the shared rule stands until a person accepts the offer
          rubric: >
            Says the change to the Acme rule is offered on a card and not kept yet, and that the
            US dollar rule still stands until it is accepted; does not claim it is saved.

  - name: kept-fact-changes-the-answer
    description: >
      What memory is for: a fact kept about a customer changes the answer to a question that
      never mentions the memory. The customer is named in plain words, not picked as a record,
      so the fact is reached through its name. Without it the agent has no reason to object to
      a 4:30pm Friday delivery; with it the agent says the dock is closed by then. The fact
      counts as used, because the question is about what it says.
    agent: Dispatch desk
    tags: [memory]
    exclusive: acme-memory
    setup:
      - >
        DELETE FROM agent_memories
        WHERE id = 'amem_01M6BENCHACMEDCK0000000000' OR (content ILIKE '%acme%' AND content ILIKE '%dock%')
      - >
        INSERT INTO agent_memories
          (id, business_unit_id, organization_id, kind, source, status, scope, subject_type,
           subject_id, subject_label, content)
        SELECT 'amem_01M6BENCHACMEDCK0000000000', c.business_unit_id, c.organization_id,
               'Fact', 'User', 'Active', 'Organization', 'Customer', c.id, c.name,
               'Acme Manufacturing''s receiving dock closes at 2pm on Fridays, and nothing is received after that until Monday.'
        FROM customers AS c
        WHERE c.name ILIKE 'Acme Manufacturing%'
        ORDER BY c.created_at
        LIMIT 1
    steps:
      - say: "can we deliver to acme manufacturing this friday at 4:30pm?"
        expect:
          noProposals: true
          replyIncludes: ["2"]
          db:
            - sql: >
                SELECT CASE WHEN use_count > 0 THEN 'used' ELSE 'unused' END
                FROM agent_memories WHERE id = 'amem_01M6BENCHACMEDCK0000000000'
              equals: "used"
              note: a fact the answer rests on is counted as used
          rubric: >
            Says a 4:30pm Friday delivery will not work because Acme's receiving dock closes at
            2pm on Fridays, and suggests delivering before 2pm or on another day. Does not say
            the delivery is fine, and does not ask the person when the dock closes.

  - name: kept-fact-not-counted-when-off-topic
    description: >
      Naming a customer puts the memories about it in the prompt, but one of them is used only
      when the question is about what it says. Asking how many open shipments Acme has does not
      use a fact about its dock hours, so the fact's use count stays where it was: a count that
      rose every time a customer was named would say nothing about which memories earn their
      place.
    agent: Dispatch desk
    tags: [memory]
    exclusive: acme-memory
    setup:
      - >
        DELETE FROM agent_memories
        WHERE id = 'amem_01M6BENCHACMEDCK0000000000' OR (content ILIKE '%acme%' AND content ILIKE '%dock%')
      - >
        INSERT INTO agent_memories
          (id, business_unit_id, organization_id, kind, source, status, scope, subject_type,
           subject_id, subject_label, content)
        SELECT 'amem_01M6BENCHACMEDCK0000000000', c.business_unit_id, c.organization_id,
               'Fact', 'User', 'Active', 'Organization', 'Customer', c.id, c.name,
               'Acme Manufacturing''s receiving dock closes at 2pm on Fridays, and nothing is received after that until Monday.'
        FROM customers AS c
        WHERE c.name ILIKE 'Acme Manufacturing%'
        ORDER BY c.created_at
        LIMIT 1
    steps:
      - say: "how many open shipments does acme manufacturing have?"
        expect:
          noProposals: true
          noCalls: ["agent_create_memory", "agent_edit_memory"]
          db:
            - sql: >
                SELECT CASE WHEN use_count > 0 THEN 'used' ELSE 'unused' END
                FROM agent_memories WHERE id = 'amem_01M6BENCHACMEDCK0000000000'
              equals: "unused"
              note: a fact about dock hours is not used by a question about open shipments
          rubric: >
            Answers with the number of Acme Manufacturing's open shipments. Dock hours are not
            what was asked, so the answer does not turn on them.

  - name: personal-note-differs-from-shared-rule
    description: >
      A person keeps a preference of their own that disagrees with a rule kept for the whole
      organization. The personal note is kept for them alone and the shared rule is left as it
      is: a note for one person never replaces what everyone else works under. The agent is told
      the two differ, so it says so and asks whether the shared rule is the one out of date,
      rather than leaving two memories that contradict each other with nobody aware of it.
    agent: Dispatch desk
    tags: [memory]
    exclusive: acme-memory
    setup:
      - >
        DELETE FROM agent_memories
        WHERE id = 'amem_01M6BENCHACMEQ0TE000000000'
           OR supersedes_id = 'amem_01M6BENCHACMEQ0TE000000000'
           OR (content ILIKE '%acme%' AND content ILIKE '%dollars%')
      - >
        INSERT INTO agent_memories
          (id, business_unit_id, organization_id, kind, source, status, scope, subject_type,
           subject_id, subject_label, content)
        SELECT 'amem_01M6BENCHACMEQ0TE000000000', c.business_unit_id, c.organization_id,
               'Instruction', 'User', 'Active', 'Organization', 'Customer', c.id, c.name,
               'Quote Acme Manufacturing in US dollars, and copy their AP desk on every quote.'
        FROM customers AS c
        WHERE c.name ILIKE 'Acme Manufacturing%'
        ORDER BY c.created_at
        LIMIT 1
    steps:
      - say: "just for me, remember that I quote acme manufacturing in canadian dollars"
        expect:
          calls: ["agent_create_memory"]
          noCalls: ["agent_edit_memory"]
          db:
            - sql: >
                SELECT count(*) FROM agent_memories
                WHERE scope = 'User' AND status = 'Active' AND supersedes_id IS NULL
                  AND content ILIKE '%acme%' AND content ILIKE '%canadian%'
              equals: "1"
              note: the preference is kept for the person alone, replacing nothing
            - sql: >
                SELECT status FROM agent_memories WHERE id = 'amem_01M6BENCHACMEQ0TE000000000'
              equals: "Active"
              note: the organization's rule is untouched
          rubric: >
            Says the Canadian dollar preference is kept for this person, and points out that it
            differs from the organization's rule to quote Acme in US dollars, asking whether
            that shared rule is out of date or should stay. Does not claim the organization's
            rule was changed.

  - name: mention-is-offered-on-look-back
    description: >
      A person states a lasting fact about a customer while asking for something else and never
      says "remember". Whether or not the agent saves it in the turn, the conversation's look
      back picks it up: afterwards a memory about the call before delivery is kept or offered,
      filed under Acme Manufacturing. Before the look back read what people mention, this taught
      the agents nothing.
    agent: Dispatch desk
    tags: [memory]
    exclusive: acme-memory
    setup:
      - >
        DELETE FROM agent_memories
        WHERE content ILIKE '%call%' AND content ILIKE '%hour%' AND content ILIKE '%deliver%'
    steps:
      - say: "acme manufacturing's receiving office wants a call an hour before every delivery. what is their newest shipment?"
        expect:
          noProposals: true
          rubric: >
            Answers with Acme Manufacturing's newest shipment. It may also say it noted the
            call-ahead requirement.
      - lookBack: true
        expect:
          db:
            - sql: >
                SELECT CASE WHEN count(*) >= 1 THEN 'learned' ELSE 'missed' END
                FROM agent_memories
                WHERE content ILIKE '%call%' AND content ILIKE '%hour%'
                  AND status IN ('Active', 'Suggested')
                  AND subject_label ILIKE 'Acme Manufacturing%'
              equals: "learned"
              note: the call before delivery is kept or offered, filed under Acme Manufacturing

  - name: mention-in-spanish-is-offered-on-look-back
    description: >
      The same, written in Spanish: people write in the language they think in, and the look
      back reads a Spanish statement as it reads an English one. The lesson is written in the
      person's language.
    agent: Dispatch desk
    tags: [memory]
    exclusive: acme-memory
    setup:
      - >
        DELETE FROM agent_memories
        WHERE content ILIKE '%viernes%'
           OR (content ILIKE '%acme%' AND (content ILIKE '%dock%' OR content ILIKE '%muelle%'))
    steps:
      - say: "el muelle de recepción de acme manufacturing cierra a las 2 de la tarde los viernes. ¿cuál es su envío más reciente?"
        expect:
          noProposals: true
          rubric: >
            Answers, in Spanish, with Acme Manufacturing's newest shipment.
      - lookBack: true
        expect:
          db:
            - sql: >
                SELECT CASE WHEN count(*) >= 1 THEN 'learned' ELSE 'missed' END
                FROM agent_memories
                WHERE content ILIKE '%viernes%'
                  AND status IN ('Active', 'Suggested')
              equals: "learned"
              note: the Friday closing time is kept or offered, in Spanish as the person wrote it

  - name: short-name-reaches-the-record
    description: >
      People call a customer by the first word of its name. "acme" reaches the fact filed under
      Acme Manufacturing when no other record with memories begins with that word, so the answer
      turns on it as it does when the full name is typed.
    agent: Dispatch desk
    tags: [memory]
    exclusive: acme-memory
    setup:
      - >
        DELETE FROM agent_memories
        WHERE id = 'amem_01M6BENCHACMEDCK0000000000' OR (content ILIKE '%acme%' AND content ILIKE '%dock%')
      - >
        INSERT INTO agent_memories
          (id, business_unit_id, organization_id, kind, source, status, scope, subject_type,
           subject_id, subject_label, content)
        SELECT 'amem_01M6BENCHACMEDCK0000000000', c.business_unit_id, c.organization_id,
               'Fact', 'User', 'Active', 'Organization', 'Customer', c.id, c.name,
               'Acme Manufacturing''s receiving dock closes at 2pm on Fridays, and nothing is received after that until Monday.'
        FROM customers AS c
        WHERE c.name ILIKE 'Acme Manufacturing%'
        ORDER BY c.created_at
        LIMIT 1
    steps:
      - say: "can we deliver to acme this friday at 4:30pm?"
        expect:
          noProposals: true
          replyIncludes: ["2"]
          rubric: >
            Says a 4:30pm Friday delivery will not work because Acme Manufacturing's receiving
            dock closes at 2pm on Fridays, or asks which Acme is meant while citing that rule.
            Does not say the delivery is fine.

  - name: wait-for-delivery
    description: Parking work until something happens on the road.
    agent: Dispatch desk
    tags: [waits]
    setup:
      - >
        UPDATE stops AS st SET status = 'New', actual_arrival = NULL, actual_departure = NULL
        FROM shipment_moves AS sm JOIN shipments AS sp ON sp.id = sm.shipment_id
        WHERE st.shipment_move_id = sm.id AND sp.pro_number = 'SEED-SHP-008'
          AND sm.sequence = 1 AND st.sequence = 1
          AND (st.status <> 'New' OR st.actual_arrival IS NOT NULL
            OR st.actual_departure IS NOT NULL)
      - >
        UPDATE shipment_moves AS sm SET status = 'InTransit'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number = 'SEED-SHP-008'
          AND sm.sequence = 1 AND sm.status <> 'InTransit'
      - >
        UPDATE shipments SET status = 'InTransit'
        WHERE pro_number = 'SEED-SHP-008' AND status <> 'InTransit'
    steps:
      - say: "let me know when SEED-SHP-008 delivers in chicago"
        expect:
          calls: ["agent_create_wait"]
          rubric: >
            Sets a wait for the Chicago delivery stop's arrival or departure on SEED-SHP-008,
            says what it will do when it fires, and does not poll.

  - name: two-asks-one-message
    description: Two unrelated requests in one breath, both done.
    agent: Bench · Operations
    steps:
      - say: "whats on SEED-SHP-004 for weight, and is trc-002 free tomorrow"
        expect:
          calls: ["shipment_get|shipment_list", "equipment_list_tractors|dispatch_get_board|shipment_list"]
          noProposals: true
          rubric: Answers both, each from a lookup, in two short parts.

  - name: long-session-context
    description: >
      Six turns on one shipment where later turns lean on earlier ones by pronoun only.
    agent: Bench · Operations
    steps:
      - say: "pull up SEED-SHP-006"
      - say: "how many moves is it"
        expect:
          maxCalls: 2
          replyIncludes: ["3|three"]
      - say: "who's on the second one"
        expect:
          maxCalls: 2
      - say: "and where does the last one end up"
        expect:
          maxCalls: 2
          replyIncludes: ["miami"]
      - say: "whats the total on it"
        expect:
          maxCalls: 2
          facts:
            - sql: select total_charge_amount from shipments where pro_number = 'SEED-SHP-006'
              note: the shipment's total

  - name: records-in-play-after-a-change
    description: >
      The conversation reads a load, changes it, and asks about it again. The later turns should
      answer from the records read again at the start of each turn, not from what an earlier turn
      said, and without looking the load up again. The coverage question allows one call: after
      an approved change an agent may fairly re-read the load's assignment once to confirm it,
      which is not the search for the load this case guards against.
    agent: Bench · Operations
    tags: [anchors]
    exclusive: SEED-SHP-004
    setup:
      - UPDATE shipments SET weight = 38000 WHERE pro_number = 'SEED-SHP-004'
    steps:
      - say: "what's the weight on SEED-SHP-004"
        expect:
          calls: ["shipment_get|shipment_list"]
      - say: "make it 39,250"
        expect:
          proposals: [{ tool: shipment_update }]
          maxFailedCalls: 1
      - decide: approve
        expect:
          executed: true
      - say: "who's the customer on it and where does it deliver"
        expect:
          maxCalls: 1
          rubric: >
            Names the customer and the delivery place from the records in play, without searching
            for the load again.
      - say: "and is it covered yet"
        expect:
          maxCalls: 1
          rubric: >
            Answers whether a driver or carrier is on SEED-SHP-004 from the records in play, with
            at most one read of its coverage and no search for the load.

  - name: records-in-play-are-dated
    description: >
      A load whose truck has not reported recently: the agent must say how old the position is
      rather than present it as where the truck is now.
    agent: Bench · Operations
    tags: [anchors]
    setup:
      - >
        DELETE FROM billing_queue_items AS b USING shipments AS s
        WHERE b.shipment_id = s.id AND s.pro_number IN ('SEED-DET-001', 'SEED-DET-002')
          AND NOT EXISTS (SELECT 1 FROM invoices AS i WHERE i.billing_queue_item_id = b.id)
      - >
        UPDATE shipment_moves AS sm SET status = 'InTransit'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number IN ('SEED-DET-001', 'SEED-DET-002')
          AND sm.status <> 'InTransit'
          AND EXISTS (SELECT 1 FROM stops AS st WHERE st.shipment_move_id = sm.id
                      AND st.actual_arrival IS NOT NULL AND st.actual_departure IS NULL)
      - >
        UPDATE shipments AS sp SET status = 'InTransit', billing_transfer_status = NULL,
          transferred_to_billing_at = NULL, marked_ready_to_bill_at = NULL
        WHERE sp.pro_number IN ('SEED-DET-001', 'SEED-DET-002') AND sp.status <> 'InTransit'
          AND EXISTS (SELECT 1 FROM shipment_moves AS sm
                      WHERE sm.shipment_id = sp.id AND sm.status = 'InTransit')
    steps:
      - say: "pull up SEED-DET-001"
      - say: "where's the truck right now"
        expect:
          maxCalls: 1
          rubric: >
            Gives the last reported position with how long ago it was reported, says it is too old
            to be where the truck is now if so, and does not present it as the current location.
