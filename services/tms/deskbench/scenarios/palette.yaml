defaults:
  tags: [palette]

scenarios:
  - name: palette-shipment-by-pro-number
    description: >
      A quick question from the command palette that names a shipment by its PRO number and
      nothing else. The palette once sent every question to the first chat agent by name, which
      held only the agent run tools, and it searched agent runs for the PRO number. The palette's
      search finds the shipment and the question names it, so it arrives as a mention.
    palette: true
    steps:
      - say: "Tell me about SEED-PAY-002?"
        page: { path: /, title: Home }
        mentions:
          - type: shipment
            label: SEED-PAY-002
            find: select id from shipments where pro_number = 'SEED-PAY-002'
        expect:
          calls: ["get_record|search_records|list_records"]
          noProposals: true
          noRecordIds: true
          replyIncludes: ["SEED-PAY-002"]
          facts:
            - sql: >
                select c.name from shipments s join customers c on c.id = s.customer_id
                where s.pro_number = 'SEED-PAY-002'
              note: the shipment's customer
          rubric: >
            Says what the shipment is: its customer, status and lane, read from the shipment,
            without searching agent runs or saying it cannot see records.

  - name: palette-customer-by-name
    description: >
      A quick question from the command palette about a customer, named the way a person types
      it. The same misrouting answered this from agent runs with "no runs mention" the customer.
      The palette's search finds the customer and the question names it, so it arrives as a
      mention.
    palette: true
    steps:
      - say: "whats going on with peak distributing?"
        page: { path: /, title: Home }
        mentions:
          - type: customer
            label: Peak Distributing
            find: select id from customers where code = 'PEAK'
        expect:
          calls: ["get_record|search_records|list_records"]
          noProposals: true
          noRecordIds: true
          replyIncludes: ["Peak"]
          rubric: >
            Answers about the customer itself: its standing, open shipments or what is owed,
            from its records, not from agent activity.

  - name: palette-list-answered-inline
    description: >
      A quick question from the command palette whose answer is a list. Asked for the shipment
      types, Nova once replied "The full table is in [Shipment types](artifact:…)", a link the
      palette cannot open. A palette answer has nothing beside it, so the rows are written into
      the reply.
    palette: true
    steps:
      - say: "what shipment types do we have?"
        page: { path: /, title: Home }
        expect:
          calls: ["list_records"]
          noProposals: true
          noRecordIds: true
          replyExcludes: ["artifact:", "full table is in", "attached"]
          facts:
            - sql: select code from shipment_types
              note: every shipment type's code
          rubric: >
            Gives the count and every shipment type, written into the reply as a short list,
            without pointing to a table, card or document.

  - name: palette-document-what-it-says
    description: >
      A quick question from the command palette about a rate confirmation the palette's search
      found. The palette's get_record opens a kind through the read named <kind>_get, and the
      document read was document_get_summary, so Nova found the file, could not open it, and
      pointed the person at agent runs and the Desk instead of reading it.
    palette: true
    steps:
      - say: "what did we pull from RateCon_SEED-SHP-003.pdf?"
        page: { path: /, title: Home }
        mentions:
          - type: document
            label: RateCon_SEED-SHP-003.pdf
            find: >
              select id from documents where original_name = 'RateCon_SEED-SHP-003.pdf'
              and resource_type = 'shipment'
        expect:
          calls: ["get_record"]
          noProposals: true
          noRecordIds: true
          replyIncludes: ["1,180"]
          replyExcludes: ["can't be opened", "cannot be opened", "agent run"]
          rubric: >
            Says what was read off the rate confirmation (the load, the $1,180 rate, the
            equipment), from the document itself, without saying it cannot open it or sending the
            person to agent runs or the Desk.

  - name: palette-document-against-its-shipment
    description: >
      Asked to check a rate confirmation against its shipment, Nova could not read the file, so it
      did not know which shipment it was on and searched for a PRO made from the leading digits of
      the file name. The document read names the shipment it is attached to, by its PRO.
    palette: true
    steps:
      - say: "does this rate confirmation match the shipment it's on?"
        page: { path: /, title: Home }
        mentions:
          - type: document
            label: RateCon_SEED-SHP-003.pdf
            find: >
              select id from documents where original_name = 'RateCon_SEED-SHP-003.pdf'
              and resource_type = 'shipment'
        expect:
          calls: ["get_record"]
          noProposals: true
          noRecordIds: true
          replyIncludes: ["SEED-SHP-003"]
          facts:
            - sql: >
                select total_charge_amount from shipments where pro_number = 'SEED-SHP-003'
              note: the shipment's own total, to set against the document's $1,180
          rubric: >
            Reads the document, names the shipment it is attached to (SEED-SHP-003), reads that
            shipment, and compares the document's rate with the shipment's charges, saying plainly
            whether they agree.

  - name: palette-document-who-sent-it
    description: >
      Asked who sent a rate confirmation that a person uploaded, Nova could not read the file,
      assumed it had been emailed and searched the inbox for its name. The document read says who
      uploaded it, when, and how it came in.
    palette: true
    steps:
      - say: "who sent RateCon_SEED-SHP-003.pdf?"
        page: { path: /, title: Home }
        mentions:
          - type: document
            label: RateCon_SEED-SHP-003.pdf
            find: >
              select id from documents where original_name = 'RateCon_SEED-SHP-003.pdf'
              and resource_type = 'shipment'
        expect:
          calls: ["get_record"]
          noProposals: true
          noRecordIds: true
          facts:
            - sql: select name from users where username = 'admin'
              note: the person who uploaded the file
          rubric: >
            Says the file was uploaded by hand and names the person who uploaded it (the fact
            above) and when, rather than naming a sender or saying no email matched. It may add
            that a signed copy came in separately by email, but does not say this file was sent.
