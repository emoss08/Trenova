defaults:
  tags: [shipments, write]

scenarios:
  - name: create-shipment-from-a-sentence
    description: >
      A whole load entered from one message, the way it comes off a phone call: customer by
      nickname, places by what dispatch calls them, dates relative to today.
    agent: Shipment Assistant
    exclusive: acme-shipments
    steps:
      - say: >
          new load for acme, pick up at the LA terminal tomorrow 8am, deliver to the chicago DC
          four days later by noon, 40k lbs dry van
        expect:
          proposals: [{ tool: create_shipment }]
          maxFailedCalls: 2
          noRecordIds: true
          rubric: >
            Resolves Acme Manufacturing, TERM-LA and DC-CHI, sets a pickup tomorrow 08:00 and a
            delivery four days after pickup by 12:00 in each stop's own zone, 40,000 lb, dry van,
            priced off Acme's rate agreement without asking about rating, and asks only for what
            it truly cannot work out instead of guessing.
      - decide: approve
        expect:
          executed: true
          rubric: Reports the new shipment's pro number.

  - name: load-with-no-price-and-no-contract
    description: >
      Plenty of loads have no contract: a spot load for a customer without an agreement is priced
      by the person, as the shipment form's rating method, base rate and charges are. Given no
      price, the agent asks for one and offers something to react to, then enters the load at the
      price the person gives.
    agent: Bench · Operations
    steps:
      - say: >
          new load for peak distributing, dallas warehouse to the denver drop point, pick up
          tomorrow 7am, deliver the day after by 3pm, 28k lbs dry van
        expect:
          noProposals: true
          maxFailedCalls: 2
          rubric: >
            Says Peak Distributing has no rate agreement for the lane and asks for the price,
            offering a figure or a way to price it (a quote, a per-mile or flat rate) rather than
            listing rating methods for the person to pick from. Does not invent a price.
      - say: "make it 2450 flat plus a 75 dollar lumper"
        expect:
          proposals: [{ tool: create_shipment }]
          maxFailedCalls: 1
          rubric: >
            Proposes the load on the Flat Rate method with a 2,450 base rate and a lumper
            accessorial charge of 75, without asking again.

  - name: duplicate-a-load-for-next-week
    description: Repeat freight is copied, not re-entered.
    agent: Dispatch desk
    exclusive: acme-shipments
    setup:
      - >
        UPDATE shipments SET status = 'New', canceled_at = NULL, canceled_by_id = NULL,
          cancel_reason = NULL
        WHERE pro_number = 'SEED-SHP-001' AND status = 'Canceled'
      - >
        UPDATE shipment_moves AS sm SET status = 'New'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number = 'SEED-SHP-001'
          AND sm.status = 'Canceled'
    steps:
      - say: "copy SEED-SHP-001 a week later, same everything"
        expect:
          proposals: [{ tool: duplicate_shipment }]
          noCalls: [create_shipment]
          maxFailedCalls: 1
          rubric: >
            Proposes duplicating SEED-SHP-001 with its stops moved a week later, rather than
            entering a new shipment field by field.

  - name: correct-a-weight
    description: The most ordinary edit, with the number written the way people write it.
    agent: Shipment Assistant
    exclusive: SEED-SHP-004
    setup:
      - UPDATE shipments SET weight = 38000 WHERE pro_number = 'SEED-SHP-004'
    steps:
      - say: "SEED-SHP-004 weight is wrong, it's 38,500 not whatever we have"
        expect:
          proposals: [{ tool: update_shipment, args: { weight: 38500 } }]
          maxFailedCalls: 1
      - decide: approve
        expect:
          executed: true
          facts:
            - sql: select weight from shipments where pro_number = 'SEED-SHP-004'
              note: the weight as it is now saved

  - name: cancel-then-think-better
    description: >
      A cancellation the person takes back before approving it. The follow-up must leave the
      load alone and not argue.
    agent: Shipment Assistant
    steps:
      - say: "cancel SEED-SHP-007, customer pulled it"
        expect:
          proposals: [{ tool: cancel_shipment }]
          maxFailedCalls: 1
      - decide: reject
        note: "hold off, they might rebook it this week"
        expect:
          noCalls: [cancel_shipment]
          noProposals: true
          rubric: Acknowledges and leaves SEED-SHP-007 as it is, without proposing anything else.

  - name: where-is-it-will-it-make-it
    description: Tracking and an on-time judgement in one question.
    agent: Shipment Assistant
    tags: [read, tracking]
    setup: &seed-shp-008-in-transit
      - >
        UPDATE stops AS st SET status = 'New', actual_arrival = NULL, actual_departure = NULL
        FROM shipment_moves AS sm JOIN shipments AS sp ON sp.id = sm.shipment_id
        WHERE st.shipment_move_id = sm.id AND sp.pro_number = 'SEED-SHP-008'
          AND sm.sequence = 1 AND st.sequence = 1
          AND (st.status <> 'New' OR st.actual_arrival IS NOT NULL
            OR st.actual_departure IS NOT NULL)
      - >
        UPDATE shipment_moves AS sm SET status = 'InTransit'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number = 'SEED-SHP-008'
          AND sm.sequence = 1 AND sm.status <> 'InTransit'
      - >
        UPDATE shipments SET status = 'InTransit'
        WHERE pro_number = 'SEED-SHP-008' AND status <> 'InTransit'
    steps:
      - say: "wheres SEED-SHP-008 right now and is it gonna make the delivery appt"
        expect:
          calls: ["get_shipment_tracking"]
          maxFailedCalls: 1
          noProposals: true
          replyIncludes: ["SEED-SHP-008"]
          rubric: >
            Says where the load is from the latest position or stop events, the delivery window in
            the stop's zone, and whether it is on time, saying plainly when there is no position to
            judge from.

  - name: mark-a-move-delivered
    description: >
      A status change reported from the road. The Dispatch desk does not hold record_stop_actual
      (DB-019), so this runs on the bench's Operations agent.
    agent: Bench · Operations
    setup: *seed-shp-008-in-transit
    steps:
      - say: "driver on SEED-SHP-008 just delivered in chicago, mark it done"
        expect:
          proposals: [{ tool: "update_move_status|record_stop_actual" }]
          maxFailedCalls: 1
          rubric: >
            Proposes completing the move that delivers in Chicago (the second one), not the move
            that already finished in Dallas, and records the arrival if it can.

  - name: quote-with-no-quote-tool
    description: >
      No agent here holds quote_shipment, so the honest answer is that it cannot quote and who or
      what can; it must not invent a price.
    agent: Dispatch desk
    tags: [rating, read]
    steps:
      - say: "what would we charge to run a dry van from LA to dallas this week"
        expect:
          noProposals: true
          replyExcludes: ["/\\$\\s?[0-9]{3,}/"]
          rubric: >
            Says it cannot quote from here and where a quote is made in Trenova, offering what it
            can do (past loads on the lane, the rate agreement), without stating a price.
