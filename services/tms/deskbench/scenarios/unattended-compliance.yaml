defaults:
  tags: [unattended, compliance]

scenarios:
  - name: unattended-credentials-robert-medical-card-lapsed
    description: >
      Robert Brown's DOT medical card and DOT physical both lapsed four days ago. A good run asks
      him for the renewal once, covering both papers, and proposes a dispatch hold that names the
      medical card and the date it lapsed.
    tags: [unattended, credentials]
    expectedTools: ["worker_get|worker_get_credential|worker_list_credentials"]
    exclusive: credential-seed
    setup:
      - >
        UPDATE worker_credentials AS wc
        SET expires_at = EXTRACT(EPOCH FROM now())::bigint - 345600
        FROM workers AS w, worker_credential_types AS t
        WHERE wc.worker_id = w.id AND t.id = wc.credential_type_id
          AND w.email = 'robert.b@example.com'
          AND t.name IN ('DOT Medical Card', 'DOT Physical') AND wc.status <> 'Archived'
    steps:
      - fire:
          agent: CredentialDesk
          event: worker_credential.expiring
          subject: select id from workers where email = 'robert.b@example.com'
        expect:
          run: AwaitingDecision
          proposals:
            - tool: worker_place_dispatch_hold
            - tool: worker_request_credential_renewal
          db:
            - sql: >
                select count(*) from agent_proposals where run_id = {{run}}
                and tool_name = 'worker_request_credential_renewal'
              equals: "1"
              note: one renewal request covers both papers
          rubric: >
            The hold's reason names the DOT medical card and the day it lapsed and says it is
            reversible. The renewal request covers the medical card and the physical together. The
            report says Robert cannot be given freight until the card is renewed.

  - name: unattended-credentials-carlos-mvr-review-due-in-a-month
    description: >
      Carlos Rivera's annual motor vehicle record review comes due in thirty days and everything
      else he holds is current. A good run asks for the renewal and stops: nothing has lapsed, so
      there is no hold. The credential seed runs before the driver-pay seed adds Carlos, so he may
      have no papers on file at all; the setup files his MVR review, DOT medical card and DOT
      physical (an active one of a type he already holds is kept and only its date set), puts
      back any of them an earlier run archived, and dates his profile to match.
    tags: [unattended, credentials]
    expectedTools: ["worker_get|worker_get_credential|worker_list_credentials"]
    forbiddenTools: [worker_place_dispatch_hold]
    exclusive: credential-seed
    setup:
      - >
        INSERT INTO worker_credentials
          (id, business_unit_id, organization_id, worker_id, credential_type_id, status,
           issuing_authority, issued_at, expires_at, verified_at, verified_by_id)
        SELECT v.id, w.business_unit_id, w.organization_id, w.id, t.id, 'Active', v.authority,
          EXTRACT(EPOCH FROM now())::bigint - v.issued_ago,
          EXTRACT(EPOCH FROM now())::bigint + v.expires_in,
          EXTRACT(EPOCH FROM now())::bigint - 259200,
          (SELECT id FROM users WHERE username = 'admin')
        FROM workers AS w
        CROSS JOIN (VALUES
            ('wcred_01JBENCH00000000000000MVR1', 'MVR', NULL, 28944000, 2592000),
            ('wcred_01JBENCH00000000000000MED1', 'MED_CARD', 'Certified Medical Examiner',
              28512000, 34560000),
            ('wcred_01JBENCH00000000000000PHY1', 'DOT_PHYSICAL', NULL, 28512000, 34560000))
          AS v (id, code, authority, issued_ago, expires_in)
        JOIN worker_credential_types AS t ON t.code = v.code
          AND t.organization_id = w.organization_id AND t.business_unit_id = w.business_unit_id
        WHERE w.email = 'carlos.rivera@example.com'
        ON CONFLICT DO NOTHING
      - >
        UPDATE worker_credentials AS wc
        SET status = 'Active', archived_at = NULL, archived_by_id = NULL, archive_reason = NULL
        WHERE wc.id IN ('wcred_01JBENCH00000000000000MVR1', 'wcred_01JBENCH00000000000000MED1',
            'wcred_01JBENCH00000000000000PHY1')
          AND wc.status <> 'Active'
          AND NOT EXISTS (SELECT 1 FROM worker_credentials AS o
            WHERE o.worker_id = wc.worker_id AND o.credential_type_id = wc.credential_type_id
              AND o.status = 'Active')
      - >
        UPDATE worker_credentials AS wc
        SET expires_at = EXTRACT(EPOCH FROM now())::bigint
          + CASE WHEN t.code = 'MVR' THEN 2592000 ELSE 34560000 END
        FROM workers AS w, worker_credential_types AS t
        WHERE wc.worker_id = w.id AND t.id = wc.credential_type_id
          AND w.email = 'carlos.rivera@example.com'
          AND t.code IN ('MVR', 'MED_CARD', 'DOT_PHYSICAL') AND wc.status = 'Active'
      - >
        UPDATE worker_profiles AS wp
        SET medical_card_expiry = EXTRACT(EPOCH FROM now())::bigint + 34560000,
          physical_due_date = EXTRACT(EPOCH FROM now())::bigint + 34560000,
          mvr_due_date = EXTRACT(EPOCH FROM now())::bigint + 2592000
        FROM workers AS w
        WHERE wp.worker_id = w.id AND w.email = 'carlos.rivera@example.com'
    steps:
      - fire:
          agent: CredentialDesk
          event: worker_credential.expiring
          subject: select id from workers where email = 'carlos.rivera@example.com'
        expect:
          run: AwaitingDecision
          proposals:
            - tool: worker_request_credential_renewal
          rubric: Asks for the MVR review once, says when it is due, and says Carlos can still roll.

  - name: unattended-carrier-risk-cedar-street-authority-revoked
    description: >
      Monitoring found that FMCSA revoked Cedar Street Carriers' common authority yesterday, a
      finding that bears on whether they can be tendered. A good run checks the carrier, finds the
      authority still revoked, and proposes closing the finding as CarrierBlocked.
    tags: [unattended, carriers]
    expectedTools: [carrier_get_intelligence_event, "carrier_get|carrier_vet"]
    exclusive: carrier-intel-seed
    setup:
      - >
        INSERT INTO carrier_intel_events
          (id, organization_id, business_unit_id, subject_type, subject_id, carrier_id, dot_number,
           subject_name, provider, source, category, rule_code, severity, action, prior_value,
           current_value, summary, detected_at, fingerprint, status)
        SELECT 'cievt_01JBENCH00000000000000CR01', c.organization_id, c.business_unit_id,
          'Carrier', c.id, c.id, c.dot_number, c.name, 'FMCSAQCMobile', 'RuleEvaluation',
          'Authority', 'authority.revoked', 'Critical', 'Block',
          '{"commonAuthority": "ACTIVE"}'::jsonb, '{"commonAuthority": "REVOKED"}'::jsonb,
          'FMCSA shows common authority for MC 905117 revoked as of yesterday after the carrier''s liability insurance was cancelled.',
          EXTRACT(EPOCH FROM now())::bigint - 1800, 'bench-csc-authority-revoked', 'Open'
        FROM carriers AS c WHERE c.code = 'CSC'
        ON CONFLICT DO NOTHING
      - >
        UPDATE carrier_intel_events SET status = 'Open', acknowledged_at = NULL,
          acknowledged_by_id = NULL, resolved_at = NULL, resolved_by_id = NULL, resolution = NULL,
          resolution_note = NULL, detected_at = EXTRACT(EPOCH FROM now())::bigint - 1800
        WHERE fingerprint = 'bench-csc-authority-revoked'
    steps:
      - fire:
          agent: CarrierRiskDesk
          event: carrier_intel.event_opened
          subject: select id from carrier_intel_events where fingerprint = 'bench-csc-authority-revoked'
        expect:
          proposals:
            - tool: carrier_resolve_intelligence_event
              args: { resolution: CarrierBlocked }
          db:
            - sql: >
                select count(*) from agent_proposals where run_id = {{run}}
                and tool_name = 'carrier_resolve_intelligence_event'
                and (tool_params::text ilike '%FalsePositive%' or tool_params::text ilike '%CarrierUpdated%')
              equals: "0"
              note: the finding was not closed as fixed or false
          rubric: >
            Reports Cedar Street Carriers, the revoked authority and that they cannot be tendered
            freight. Says the eligibility gate already refuses them, so closing the finding records
            the outcome.

  - name: unattended-carrier-risk-summit-peak-phone-changed
    description: >
      Monitoring noticed that Summit Peak Logistics' dispatch phone number changed on the FMCSA
      census. It does not bear on eligibility. A good run acknowledges it and nothing more.
    tags: [unattended, carriers]
    expectedTools: [carrier_get_intelligence_event]
    forbiddenTools: [carrier_resolve_intelligence_event, carrier_set_monitoring]
    exclusive: carrier-intel-seed
    setup:
      - >
        INSERT INTO carrier_intel_events
          (id, organization_id, business_unit_id, subject_type, subject_id, carrier_id, dot_number,
           subject_name, provider, source, category, field_path, severity, action, prior_value,
           current_value, summary, detected_at, fingerprint, status)
        SELECT 'cievt_01JBENCH00000000000000CR02', c.organization_id, c.business_unit_id,
          'Carrier', c.id, c.id, c.dot_number, c.name, 'FMCSAQCMobile', 'SnapshotDiff',
          'Contacts', 'contacts.dispatchPhone', 'Info', 'Notify',
          '{"dispatchPhone": "(303) 555-0142"}'::jsonb, '{"dispatchPhone": "(303) 555-0187"}'::jsonb,
          'Dispatch phone number changed from (303) 555-0142 to (303) 555-0187 on the FMCSA census.',
          EXTRACT(EPOCH FROM now())::bigint - 3600, 'bench-spl-dispatch-phone', 'Open'
        FROM carriers AS c WHERE c.code = 'SPL'
        ON CONFLICT DO NOTHING
      - >
        UPDATE carrier_intel_events SET status = 'Open', acknowledged_at = NULL,
          acknowledged_by_id = NULL, resolved_at = NULL, resolved_by_id = NULL, resolution = NULL,
          resolution_note = NULL, detected_at = EXTRACT(EPOCH FROM now())::bigint - 3600
        WHERE fingerprint = 'bench-spl-dispatch-phone'
    steps:
      - fire:
          agent: CarrierRiskDesk
          event: carrier_intel.event_opened
          subject: select id from carrier_intel_events where fingerprint = 'bench-spl-dispatch-phone'
        expect:
          run: AwaitingDecision
          proposals:
            - tool: carrier_acknowledge_intelligence_event
          rubric: Says the phone change does not affect whether Summit Peak can be tendered.
