defaults:
  agent: Billing exceptions
  tags: [billing, read]

scenarios:
  - name: ready-to-invoice
    description: End of day, what can go out the door.
    steps:
      - say: "whats ready to bill"
        expect:
          calls: ["shipment_list|billing_list_queue_items|billing_list_transfer_candidates"]
          maxFailedCalls: 0
          noProposals: true
          facts:
            - sql: >
                with outside_queue as (
                  select status from shipments
                  where status in ('ReadyToInvoice', 'Completed')
                    and coalesce(billing_transfer_status, '') in ('', 'SentBackToOps'))
                select n from (
                  select 'ready' as grp, count(*) filter (where status = 'ReadyToInvoice') as n
                  from outside_queue
                  union all
                  select 'completed', count(*) filter (where status = 'Completed') from outside_queue
                  union all
                  select 'all', count(*) from outside_queue) as counts
                where n > 0 or grp = 'all'
              any: true
              note: >
                how many delivered loads can go to billing, counted as the transfer candidates are
                (ready to invoice or completed, outside the billing queue): the ready ones, the
                completed ones or both together; an empty group need not be named as zero
          rubric: >
            Gives both groups with how many are in each: the shipments already ready to invoice
            and the completed ones that can be transferred to billing, with the customers and
            amounts of the largest or a table it kept rather than every row of a long list, and
            offers the next step.

  - name: why-this-charge
    description: A customer called about the total and billing wants the breakdown.
    steps:
      - say: "peak is asking why the denver to phoenix load is 3700. whats in that"
        expect:
          calls: ["shipment_list|shipment_get|rate_explain"]
          maxFailedCalls: 1
          noProposals: true
          replyIncludes: ["SEED-SHP-009"]
          facts:
            - sql: select total_charge_amount from shipments where pro_number = 'SEED-SHP-009'
              note: the shipment's total
          rubric: >
            Breaks the total into its linehaul and other charges from the record, with nothing
            made up, and says where the rate came from if it can.

  - name: nothing-open-for-acme
    description: >
      What Acme owes is what its open posted invoices hold, which other cases post and pay, so
      the figure is read from the database. Shipment totals ($2,950, $3,200) are not a balance,
      and with no open invoice the honest answer is that nothing is owed.
    tags: [receivables]
    agent: Receivables
    steps:
      - say: "how much does acme owe us right now, anything past 30?"
        expect:
          calls: ["receivable_get_aging|receivable_list_open_items|invoice_list|receivable_get_statement"]
          maxFailedCalls: 1
          noProposals: true
          replyExcludes: ["$2,950", "$3,200"]
          rubric: >
            Gives Acme Manufacturing's open balance from its open posted invoices and how much of
            it is more than 30 days past due, or says it has no open invoices and owes nothing,
            without reading shipment totals as receivables.

  - name: completed-not-invoiced
    description: Work that was delivered but never moved to billing.
    steps:
      - say: "any loads that delivered but never got sent over to billing?"
        expect:
          calls: ["shipment_list|billing_list_transfer_candidates"]
          maxFailedCalls: 0
          noProposals: true
          rubric: >
            Finds Completed shipments with no invoice and not ReadyToInvoice and says how many
            there are, names them by pro number (the oldest first, and only the first few when
            there are many, saying the list is cut), and explains what moving them to billing
            would do.

  - name: lumper-charge-on-a-load
    description: >
      An accessorial added to a saved load, at an amount the person names rather than the charge's
      configured $150. Exercises shipment_add_charge, which Billing exceptions holds since DB-019 and
      no other case reached. Lumper charges earlier runs added are removed first, so the load starts
      without one.
    tags: [billing, write]
    exclusive: SEED-SHP-008
    setup:
      - >
        DELETE FROM additional_charges AS ac USING shipments AS sp, accessorial_charges AS acc
        WHERE ac.shipment_id = sp.id AND acc.id = ac.accessorial_charge_id
          AND sp.pro_number = 'SEED-SHP-008' AND acc.code = 'LUMP'
          AND NOT ac.is_system_generated
    steps:
      - say: "add a 175 lumper to SEED-SHP-008, the receiver charged our driver at the dock"
        expect:
          proposals: [{ tool: shipment_add_charge }]
          maxFailedCalls: 1
          rubric: >
            Proposes one lumper charge of $175 on SEED-SHP-008, not the charge's configured $150,
            and says it waits for approval.
      - decide: approve
        expect:
          executed: true
          db:
            - sql: >
                select coalesce(sum(ac.amount), 0)::numeric(10,2)::text
                from additional_charges ac
                join shipments sp on sp.id = ac.shipment_id
                join accessorial_charges acc on acc.id = ac.accessorial_charge_id
                where sp.pro_number = 'SEED-SHP-008' and acc.code = 'LUMP'
              equals: "175.00"
              note: one lumper charge of $175 is on the load
