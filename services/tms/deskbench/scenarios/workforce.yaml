defaults:
  agent: Compliance desk
  tags: [workforce, compliance, read]

scenarios:
  - name: expired-medical-cards
    description: The compliance question that has a real answer in the seed.
    steps:
      - say: "anybody driving on an expired med card?"
        expect:
          calls: ["worker_list_credentials"]
          maxFailedCalls: 0
          noProposals: true
          facts:
            - sql: >
                select w.first_name from workers w
                join worker_credentials c on c.worker_id = w.id
                where c.status = 'Active' and c.expires_at < extract(epoch from now())
                order by w.first_name
              note: each driver holding an expired credential
          rubric: >
            Names the driver with the expired card, says it is unverified if the record says so,
            and says what should happen before they are dispatched.

  - name: expiring-soon
    description: The same question a step earlier, with a window.
    steps:
      - say: "what creds are coming due in the next 30 days"
        expect:
          calls: ["worker_list_credentials"]
          maxFailedCalls: 0
          noProposals: true
          facts:
            - sql: >
                select w.first_name from workers w
                join worker_credentials c on c.worker_id = w.id
                where c.status = 'Active'
                  and c.expires_at between extract(epoch from now())
                  and extract(epoch from now() + interval '30 days')
                order by w.first_name
              note: each driver with a credential expiring within 30 days
              any: true

  - name: workers-without-road-test
    description: >
      Who lacks a credential, across the roster. Asked of every worker, the agent once read the
      roster a page at a time and checked each worker's credentials with a call of its own, and
      still answered from part of the list.
    steps:
      - say: "show me all the workers that don't have a road test certificate"
        expect:
          calls: ["worker_list"]
          maxCalls: 3
          maxFailedCalls: 0
          noProposals: true
          facts:
            - sql: >
                select count(*) from workers w
                where not exists (
                  select 1 from worker_credentials c
                  join worker_credential_types t on t.id = c.credential_type_id
                  where c.worker_id = w.id and upper(t.code) = 'ROAD_TEST'
                    and c.status = 'Active'
                    and (c.expires_at is null or c.expires_at >= extract(epoch from now()))
                )
              note: how many workers have no valid road test on file
          rubric: >
            Answers for every worker with no valid road test certificate, pointing to the list
            beside the conversation, and gives a count only when the list says it is complete.
            It never checks workers one at a time, and never answers from part of the roster as
            though it were all of it.

  - name: how-many-inactive-drivers
    description: >
      A count across the roster. The list read a page at a time once said "39 inactive" only
      because the page happened to hold them all; a count is the list's total, from its first
      page, never the rows counted by hand.
    steps:
      - say: "how many inactive drivers do we have, and why are they out"
        expect:
          calls: ["worker_list"]
          maxCalls: 3
          maxFailedCalls: 0
          noProposals: true
          facts:
            - sql: select count(*) from workers where status = 'Inactive'
              note: how many workers are inactive
          rubric: >
            States how many workers are inactive from the list's total and sums up why (leave,
            separation) from the rows it read, saying when that reason covers only the rows shown.

  - name: open-safety-events
    description: A safety manager's Monday.
    steps:
      - say: "what safety stuff is still open"
        expect:
          calls: ["worker_list_safety_events"]
          maxFailedCalls: 0
          noProposals: true
          facts:
            - sql: select count(*) from worker_safety_events where status = 'Open'
              note: the number of open safety events
          rubric: Groups them by driver and severity, with the oldest first.

  - name: whos-off-this-week
    description: Time off, asked the way people ask it.
    agent: Workforce coordinator
    steps:
      - say: "whos off this week"
        expect:
          calls: ["worker_list_time_off|worker_get_schedule|worker_list"]
          maxFailedCalls: 0
          noProposals: true
          rubric: >
            Lists approved time off overlapping this week by driver and dates, and keeps
            requested (not yet approved) time off apart from it.
