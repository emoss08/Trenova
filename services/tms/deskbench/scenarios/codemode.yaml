  mode: discrete
  pair: late-loads-with-etas
  tags:
  - codemode
  - fan-out
  steps:
  - say: for every load that's running late give me the customer and when we now think it gets there.
      if theres a ton just the 5 furthest behind and how many total
    page:
      path: /shipments
      title: Shipments
    expect:
      noCalls:
      - analysis_run
      noProposals: true
      noRecordIds: true
      facts:
      - sql: select count(*) from shipments where status = 'Delayed'
        note: the number of delayed loads
      - sql: select pro_number from shipments where status = 'Delayed'
        any: true
        note: at least one delayed load, by pro number
      rubric: |
        Says how many loads are delayed and names each one with its customer and projected arrival (only the five furthest behind when there are more than five, saying how it chose them), without inventing an arrival no read returned.
