          SELECT w.first_name || ' ' || w.last_name FROM workers w JOIN worker_credentials c ON c.worker_id = w.id WHERE c.status = 'Active' AND c.archived_at IS NULL
            AND c.expires_at >= extract(epoch FROM now())::bigint
            AND c.expires_at <= extract(epoch FROM now() + interval '30 days')::bigint
          GROUP BY 1 ORDER BY 1
        note: each driver with a credential lapsing within 30 days
      - sql: |
          SELECT t.name FROM worker_credential_types t JOIN worker_credentials c ON c.credential_type_id = t.id WHERE c.status = 'Active' AND c.archived_at IS NULL
            AND c.expires_at >= extract(epoch FROM now())::bigint
            AND c.expires_at <= extract(epoch FROM now() + interval '30 days')::bigint
          GROUP BY t.name ORDER BY 1
        note: each kind of credential lapsing within 30 days
      rubric: |
        Lists every driver with a credential lapsing in the next 30 days, the credential and its date, soonest first, and keeps credentials already expired apart from them.
- name: codemode-whats-down-in-the-fleet-discrete
  description: |
    Fan-out read across two kinds of record: every tractor and every trailer that cannot be dispatched right now, and why. A small fleet has a unit or two down and a tenant's fleet has dozens, so the reply is held to how many of each are down and to naming real ones, not to every code.
  agent: Compliance desk
  mode: discrete
  pair: whats-down-in-the-fleet
  tags:
  - equipment
  - read
  - fan-out
  steps:
  - say: anything in the fleet down right now? trucks and trailers both, how many and why
    expect:
      noProposals: true
      noRecordIds: true
      facts:
      - sql: |
          SELECT count(*) FROM tractors WHERE status IN ('OutOfService', 'AtMaintenance')
          UNION ALL
          SELECT count(*) FROM trailers WHERE status IN ('OutOfService', 'AtMaintenance')
        note: how many tractors and how many trailers are out of service or at maintenance
      - sql: |
          SELECT code FROM tractors WHERE status IN ('OutOfService', 'AtMaintenance') UNION ALL SELECT code FROM trailers WHERE status IN ('OutOfService', 'AtMaintenance')
        any: true
        note: at least one tractor or trailer that is down, by its code
      rubric: |
        Says how many tractors and how many trailers are down, split between out of service and in the shop, and names them with which of the two each is: every one when there are a few, some of each when there are many, saying the list is cut and offering the rest. Does not list available equipment as down.
      noCalls:
      - analysis_run
