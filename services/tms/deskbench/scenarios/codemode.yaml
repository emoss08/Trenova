- name: codemode-range-loads-by-status-discrete
  description: |
    Fan-out read: a count of one customer's loads in each status, which needs every load read, not the first page. Range's loads are the five bench loads plus whatever other cases left.
  agent: Bench · Operations
  mode: discrete
  pair: range-loads-by-status
  tags:
  - shipments
  - read
  - fan-out
  exclusive: codemode-range-denver
  setup: *codemode_pool
  steps:
  - say: range logistics, how many loads they got in each status rn
    expect:
      noProposals: true
      noRecordIds: true
      facts:
      - sql: |
          SELECT sp.status::text FROM shipments sp JOIN customers c ON c.id = sp.customer_id WHERE c.code = 'RNGE' GROUP BY sp.status ORDER BY sp.status
        note: each status Range's loads are in
      - sql: |
          SELECT count(*) FROM shipments sp JOIN customers c ON c.id = sp.customer_id WHERE c.code = 'RNGE' GROUP BY sp.status ORDER BY sp.status
        note: how many of Range's loads are in each of those statuses
      rubric: |
        Gives a count per status that adds up to every Range Logistics load, and does not stop at a first page of results or count a list that was cut short.
