- name: codemode-lift-range-credit-holds-discrete
  description: 'Batch write that undoes a set: three Range loads out of Denver are on a credit hold and
    the person asks for every one released. Graded on the holds left open afterwards. Discrete mode.'
  agent: Dispatch desk
  mode: discrete
  pair: lift-range-credit-holds
  tags:
  - dispatch
  - write
  - batch-write
  exclusive: codemode-range-denver
  setup: *codemode_pool
  steps:
  - say: range paid up. pull the credit holds off all their denver loads
    setup:
    - |
      INSERT INTO shipment_holds
        (id, shipment_id, organization_id, business_unit_id, type, severity, reason_code,
         notes, source, blocks_dispatch, blocks_billing, started_at, created_by_id)
      SELECT v.id, sp.id, sp.organization_id, sp.business_unit_id, 'FinanceHold', 'Blocking',
        'CREDIT', 'Range over its credit limit, hold until AR clears it', 'User', true, true,
        extract(epoch FROM now())::bigint - 86400, (SELECT id FROM users WHERE username = 'admin')
      FROM (VALUES ('shh_01JBENCH000000000000CM001H', 'SEED-BENCH-CM-01'),
                   ('shh_01JBENCH000000000000CM002H', 'SEED-BENCH-CM-02'),
                   ('shh_01JBENCH000000000000CM004H', 'SEED-BENCH-CM-04'))
        AS v (id, pro)
      JOIN shipments AS sp ON sp.pro_number = v.pro ON CONFLICT DO NOTHING
    expect:
      noCalls:
      - analysis_run
      rubric: |
        Finds the three credit holds on SEED-BENCH-CM-01, -02 and -04 and proposes releasing each, and says they wait for approval.
  - decide: approve
    expect:
      db:
      - sql: |
          SELECT count(*) FROM shipment_holds h JOIN shipments sp ON sp.id = h.shipment_id WHERE sp.pro_number LIKE 'SEED-BENCH-CM-%' AND h.released_at IS NULL
        equals: '0'
        note: no hold left open on Range's Denver loads
      - sql: |
          SELECT count(*) FROM shipment_holds h JOIN shipments sp ON sp.id = h.shipment_id WHERE sp.pro_number LIKE 'SEED-BENCH-CM-%' AND h.released_at IS NOT NULL
        equals: '3'
        note: the three credit holds released, not removed
