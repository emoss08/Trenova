  description: |
    Every delayed load with its customer and its projected arrival: one read for the list, then one per load for its arrival. A tenant has a hundred delayed loads where the fixture has a few, more than one turn can read an arrival for, so past five the person asks for the five furthest behind and the total. Discrete mode.
