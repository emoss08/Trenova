- name: codemode-past-sixty-by-customer-discrete
  description: >
    Fan-out read: the 61+ day aging of every customer at once, not one customer at a time. The buckets
    follow the AR aging's rule (days past the due date), and the amounts are read from the database
    because other cases post and pay invoices.
  agent: Receivables
  mode: discrete
  pair: past-sixty-by-customer
  tags:
  - receivables
  - read
  - fan-out
  steps:
  - say: who's more than 60 days past due on us? every customer and how much each one has sitting
      past 60
    expect:
      noProposals: true
      noRecordIds: true
      facts:
      - sql: |
          SELECT bill_to_name FROM invoices WHERE status = 'Posted' AND bill_type IN ('Invoice', 'DebitMemo')
            AND total_amount_minor > applied_amount_minor AND due_date IS NOT NULL
            AND (extract(epoch FROM now())::bigint - due_date) / 86400 > 60
          GROUP BY bill_to_name ORDER BY 1
        note: each customer with a balance more than 60 days past due
      - sql: |
          SELECT round(sum(total_amount_minor - applied_amount_minor) / 100.0, 2) FROM invoices WHERE status = 'Posted' AND bill_type IN ('Invoice', 'DebitMemo')
            AND total_amount_minor > applied_amount_minor AND due_date IS NOT NULL
            AND (extract(epoch FROM now())::bigint - due_date) / 86400 > 60
          GROUP BY bill_to_name ORDER BY bill_to_name
        note: each of those customers' balance past 60 days
      rubric: >
        Lists every customer with money more than 60 days past due and the amount past 60 for each,
        says the figures are by days past the due date, and leaves out customers whose oldest balance
        is younger. Proposes no reminders or statements it was not asked for.
      noCalls:
      - agent_run_script
