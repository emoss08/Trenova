- name: codemode-past-sixty-by-customer-discrete
  description: |
    Fan-out read: the 61+ day aging of every customer at once, not one customer at a time. The buckets follow the AR aging's rule (days past the due date), and the amounts are read from the database because other cases post and pay invoices. A tenant has a handful of customers past 60 or a few hundred, so the question asks how many and the five largest, which is the same fan-out on either.
  agent: Receivables
  mode: discrete
  pair: past-sixty-by-customer
  tags:
  - receivables
  - read
  - fan-out
  steps:
  - say: who's more than 60 days past due on us? how many customers, and the 5 biggest with how much
      each one has sitting past 60
    expect:
      noProposals: true
      noRecordIds: true
      facts:
      - sql: |
          SELECT count(DISTINCT bill_to_name) FROM invoices WHERE status = 'Posted' AND bill_type IN ('Invoice', 'DebitMemo')
            AND total_amount_minor > applied_amount_minor AND due_date IS NOT NULL
            AND (extract(epoch FROM now())::bigint - due_date) / 86400 > 60
        note: how many customers have a balance more than 60 days past due
      - sql: |
          SELECT bill_to_name FROM invoices WHERE status = 'Posted' AND bill_type IN ('Invoice', 'DebitMemo')
            AND total_amount_minor > applied_amount_minor AND due_date IS NOT NULL
            AND (extract(epoch FROM now())::bigint - due_date) / 86400 > 60
          GROUP BY bill_to_name ORDER BY sum(total_amount_minor - applied_amount_minor) DESC, bill_to_name LIMIT 5
        note: each of the five customers with the most more than 60 days past due
      - sql: |
          SELECT round(sum(total_amount_minor - applied_amount_minor) / 100.0, 2) FROM invoices WHERE status = 'Posted' AND bill_type IN ('Invoice', 'DebitMemo')
            AND total_amount_minor > applied_amount_minor AND due_date IS NOT NULL
            AND (extract(epoch FROM now())::bigint - due_date) / 86400 > 60
          GROUP BY bill_to_name ORDER BY sum(total_amount_minor - applied_amount_minor) DESC, bill_to_name LIMIT 5
        note: each of those five customers' balance past 60 days
      rubric: |
        Says how many customers have money more than 60 days past due and names the five with the most, largest first, with the amount past 60 for each (all of them when there are five or fewer); says the figures are by days past the due date, and leaves out customers whose oldest balance is younger. Proposes no reminders or statements it was not asked for.
      noCalls:
      - analysis_run
