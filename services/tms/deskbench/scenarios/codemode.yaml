- name: codemode-dock-note-on-every-denver-pickup-discrete
  description: 'Batch write: the same note on every load picking up at one place tomorrow, whoever''s
    they are, approved together. Graded on the comments afterwards: each of tomorrow''s Denver pickups
    carries the note and the loads on other days do not. Discrete mode.'
  agent: Bench · Operations
  mode: discrete
  pair: dock-note-on-every-denver-pickup
  tags:
  - shipments
  - write
  - batch-write
  exclusive: codemode-range-denver
  setup: *codemode_pool
  steps:
  - say: 'put a note on every load picking up at the denver drop tomorrow: dock 4 only, driver calls 30
      min out'
    expect:
      noCalls:
      - analysis_run
      rubric: |
        Finds the three loads picking up there tomorrow (SEED-BENCH-CM-01, -02, -03) and proposes the same note on each, leaving the load due yesterday and the one three days out alone.
  - decide: approve
    expect:
      db:
      - sql: |
          WITH first_pickup AS (
            SELECT DISTINCT ON (sp.id) sp.id, l.code, st.scheduled_window_start AS starts
            FROM shipments sp
            JOIN shipment_moves sm ON sm.shipment_id = sp.id
            JOIN stops st ON st.shipment_move_id = sm.id
            JOIN locations l ON l.id = st.location_id
            WHERE st.type IN ('Pickup', 'SplitPickup')
              AND sp.status IN ('New', 'PartiallyAssigned', 'Assigned')
            ORDER BY sp.id, sm.sequence, st.sequence)
          SELECT count(*) FROM first_pickup fp WHERE fp.code = 'CUST-DEN'
            AND fp.starts >= extract(epoch FROM ((date_trunc('day', now() AT TIME ZONE 'America/Denver')
              + interval '1 day') AT TIME ZONE 'America/Denver'))
            AND fp.starts < extract(epoch FROM ((date_trunc('day', now() AT TIME ZONE 'America/Denver')
              + interval '2 days') AT TIME ZONE 'America/Denver'))
            AND NOT EXISTS (SELECT 1 FROM shipment_comments c
                            WHERE c.shipment_id = fp.id AND c.comment ILIKE '%dock 4%')
        equals: '0'
        note: no load picking up at the Denver drop tomorrow without the note
      - sql: |
          SELECT count(*) FROM shipments sp WHERE sp.pro_number IN ('SEED-BENCH-CM-01', 'SEED-BENCH-CM-02', 'SEED-BENCH-CM-03')
            AND EXISTS (SELECT 1 FROM shipment_comments c
                        WHERE c.shipment_id = sp.id AND c.comment ILIKE '%dock 4%')
        equals: '3'
        note: the three bench loads picking up tomorrow each carry it
      - sql: |
          SELECT count(*) FROM shipment_comments c JOIN shipments sp ON sp.id = c.shipment_id WHERE sp.pro_number IN ('SEED-BENCH-CM-04', 'SEED-BENCH-CM-05')
            AND c.comment ILIKE '%dock 4%'
        equals: '0'
        note: the loads on other days left without it
