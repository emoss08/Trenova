- name: codemode-every-driver-cred-lapsing-discrete
  description: |
    Fan-out read: every driver with a credential lapsing in the next 30 days and which credential it is, so each driver's credentials have to be read, not just the first match.
  agent: Workforce coordinator
  mode: discrete
  pair: every-driver-cred-lapsing
  tags:
  - workforce
  - compliance
  - read
  - fan-out
  steps:
  - say: need a list of every driver w a cred lapsing in the next 30 days and which cred it is
    expect:
      noProposals: true
      noRecordIds: true
      facts:
      - sql: |
          SELECT w.first_name || ' ' || w.last_name FROM workers w JOIN worker_credentials c ON c.worker_id = w.id WHERE c.status = 'Active' AND c.archived_at IS NULL
            AND c.expires_at >= extract(epoch FROM now())::bigint
            AND c.expires_at <= extract(epoch FROM now() + interval '30 days')::bigint
          GROUP BY 1 ORDER BY 1
        note: each driver with a credential lapsing within 30 days
      - sql: |
          SELECT t.name FROM worker_credential_types t JOIN worker_credentials c ON c.credential_type_id = t.id WHERE c.status = 'Active' AND c.archived_at IS NULL
            AND c.expires_at >= extract(epoch FROM now())::bigint
            AND c.expires_at <= extract(epoch FROM now() + interval '30 days')::bigint
          GROUP BY t.name ORDER BY 1
        note: each kind of credential lapsing within 30 days
      rubric: |
        Lists every driver with a credential lapsing in the next 30 days, the credential and its date, soonest first, and keeps credentials already expired apart from them.
      noCalls:
      - analysis_run
- name: codemode-every-driver-cred-lapsing-script
  description: |
    Fan-out read: every driver with a credential lapsing in the next 30 days and which credential it is, so each driver's credentials have to be read, not just the first match.
  agent: Workforce coordinator
  mode: script
  pair: every-driver-cred-lapsing
  tags:
  - workforce
