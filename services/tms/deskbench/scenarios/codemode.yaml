- name: codemode-blown-pickup-window-hold-discrete
  description: |
    Sequential control: the window decides the write. The Chicago load out of Denver that was to pick up yesterday has had its window pass with nobody there, so the answer is the hold. Its twin, codemode-la-pickup-ahead-note-not-hold, asks the same of a load whose window is ahead.
  agent: Dispatch desk
  mode: discrete
  pair: blown-pickup-window-hold
  tags:
  - dispatch
  - write
  - control
  exclusive: codemode-range-denver
  setup: *codemode_pool
  steps:
  - say: range's chicago load out of denver that was supposed to pick up yesterday. if the pickup
      window already blew put it on hold for a missed pickup, if not just leave a note to call the
      shipper
    expect:
      rubric: |
        Reads SEED-BENCH-CM-05's pickup window, sees it closed yesterday with no arrival, and proposes a hold for the missed pickup, not a note. Does not confuse it with SEED-BENCH-CM-02, which picks up tomorrow.
      noCalls:
      - analysis_run
  - decide: approve
    expect:
      db:
      - sql: |
          SELECT (count(*) > 0)::text FROM shipment_holds h JOIN shipments sp ON sp.id = h.shipment_id WHERE sp.pro_number = 'SEED-BENCH-CM-05' AND h.released_at IS NULL
        equals: 'true'
        note: the load whose window passed is on hold
      - sql: |
          SELECT count(*) FROM shipment_holds h JOIN shipments sp ON sp.id = h.shipment_id WHERE sp.pro_number = 'SEED-BENCH-CM-02' AND h.released_at IS NULL
        equals: '0'
        note: tomorrow's Chicago load left alone
