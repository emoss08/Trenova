- name: codemode-whats-down-in-the-fleet-discrete
  description: >
    Fan-out read across two kinds of record: every tractor and every trailer that cannot be dispatched
    right now, and why.
  agent: Compliance desk
  mode: discrete
  pair: whats-down-in-the-fleet
  tags:
  - equipment
  - read
  - fan-out
  steps:
  - say: anything in the fleet down right now? trucks and trailers both, and why
    expect:
      noProposals: true
      noRecordIds: true
      facts:
      - sql: >
          SELECT code FROM tractors WHERE status IN ('OutOfService', 'AtMaintenance') UNION ALL SELECT
          code FROM trailers WHERE status IN ('OutOfService', 'AtMaintenance') ORDER BY 1
        note: each tractor and trailer out of service or at maintenance
      rubric: >
        Names every tractor and trailer that is out of service or in the shop with which of the two
        it is, and does not list available equipment as down.
      noCalls:
      - agent_run_script
- name: codemode-whats-down-in-the-fleet-script
  description: >
    Fan-out read across two kinds of record: every tractor and every trailer that cannot be dispatched
    right now, and why.
  agent: Compliance desk
  mode: script
  pair: whats-down-in-the-fleet
  tags:
  - equipment
  - read
