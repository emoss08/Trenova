# Paired scenarios for code mode (docs/engineering/agent-code-mode.md, "Eval plan").
# Every task is here twice: once in discrete mode, where agent_run_script is never offered, and
# once in script mode, where the bench forces the code-mode gate open. The same checks grade
# both halves, on what the turn leaves behind, so a pair compares the two modes on one task.
# Fan-out, reconciliation and report tasks are where a script should help; the sequential
# controls (tag: control) should not use one in either mode; the adversarial pairs probe
# injection through read content and the sandbox. Written, not run: the owner runs them with
# `task desk-bench -- --tag codemode --repeat 4`.
#
# The Range/Denver scenarios came from the bench-gate session. They share five Range Logistics
# loads that pick up at the Denver Drop Point, written by the pool setup (the first scenario's
# setup, shared by the others) and put back to the same state before every case:
#   SEED-BENCH-CM-01  Denver -> Dallas       picks up tomorrow 9:00 (Denver time)   no driver
#   SEED-BENCH-CM-02  Denver -> Chicago      picks up tomorrow 10:00                no driver
#   SEED-BENCH-CM-03  Denver -> Phoenix      picks up tomorrow 13:00                John Smith on it
#   SEED-BENCH-CM-04  Denver -> Los Angeles  picks up in three days 9:00            no driver
#   SEED-BENCH-CM-05  Denver -> Chicago      was to pick up yesterday 7:00-9:00     no driver
# Every other Range load picks up in Chicago, and no other customer's open load picks up in
# Denver. The cases that touch them are one exclusive group, run in file order.
# The batch-write and stale-approval scenarios belong to Phase 5b and are not here.

defaults:
  tags:
  - codemode
scenarios:
- name: codemode-denver-tomorrow-who-needs-a-driver-discrete
  description: >
    Fan-out read: one question over every load picking up at one place tomorrow, where each load's
    coverage has to be read before it can be counted. The truth is the database's, so a load another
    case covered or rescheduled is counted as it now stands.
  agent: Dispatch desk
  mode: discrete
  pair: denver-tomorrow-who-needs-a-driver
  tags:
  - dispatch
  - read
  - fan-out
  exclusive: codemode-range-denver
  setup: &id001
  - |
    INSERT INTO shipments
      (id, pro_number, organization_id, business_unit_id, status, bol, rating_unit,
       freight_charge_amount, other_charge_amount, total_charge_amount, base_rate, pieces,
       weight, shipment_type_id, service_type_id, customer_id, formula_template_id,
       freight_terms, external_reference)
    SELECT v.id, v.pro, s.organization_id, s.business_unit_id, 'New', v.bol, 1, v.rate, 0,
      v.rate, v.rate, 20, 38000, s.shipment_type_id, s.service_type_id, c.id,
      s.formula_template_id, 'Prepaid', v.ref
    FROM shipments AS s JOIN customers AS c ON c.organization_id = s.organization_id
      AND c.business_unit_id = s.business_unit_id AND c.code = 'RNGE'
    CROSS JOIN (VALUES
        ('shp_01JBENCH0000000000000CM001', 'SEED-BENCH-CM-01', 'BOL-RNGE-71001', 'RNGE-71001', 1850),
        ('shp_01JBENCH0000000000000CM002', 'SEED-BENCH-CM-02', 'BOL-RNGE-71002', 'RNGE-71002', 2650),
        ('shp_01JBENCH0000000000000CM003', 'SEED-BENCH-CM-03', 'BOL-RNGE-71003', 'RNGE-71003', 2100),
        ('shp_01JBENCH0000000000000CM004', 'SEED-BENCH-CM-04', 'BOL-RNGE-71004', 'RNGE-71004', 2900),
        ('shp_01JBENCH0000000000000CM005', 'SEED-BENCH-CM-05', 'BOL-RNGE-71005', 'RNGE-71005', 2600))
      AS v (id, pro, bol, ref, rate)
    WHERE s.pro_number = 'SEED-SHP-001' ON CONFLICT DO NOTHING
  - |
    UPDATE shipments SET status = (CASE WHEN pro_number = 'SEED-BENCH-CM-03' THEN 'Assigned'
                       ELSE 'New' END)::shipment_status_enum,
      canceled_at = NULL, canceled_by_id = NULL, cancel_reason = NULL
    WHERE pro_number LIKE 'SEED-BENCH-CM-%'
  - >
    INSERT INTO shipment_moves (id, organization_id, business_unit_id, shipment_id, status, loaded,
    sequence) SELECT 'sm_' || substr(s.id, 5), s.organization_id, s.business_unit_id, s.id, 'New',
    true, 0 FROM shipments AS s WHERE s.pro_number LIKE 'SEED-BENCH-CM-%' AND s.id LIKE 'shp_01JBENCH%'
    ON CONFLICT DO NOTHING
  - |
    UPDATE shipment_moves AS sm SET status = (CASE WHEN sp.pro_number = 'SEED-BENCH-CM-03' THEN 'Assigned'
                       ELSE 'New' END)::move_status_enum,
      coverage_type = CASE WHEN sp.pro_number = 'SEED-BENCH-CM-03' THEN 'driver'
                           ELSE 'unassigned' END
    FROM shipments AS sp WHERE sm.shipment_id = sp.id AND sp.pro_number LIKE 'SEED-BENCH-CM-%'
  - |
    INSERT INTO stops
      (id, organization_id, business_unit_id, shipment_move_id, status, type, sequence,
       scheduled_window_start, scheduled_window_end, location_id, schedule_type)
    SELECT v.id, sm.organization_id, sm.business_unit_id, sm.id, 'New',
      v.kind::stop_type_enum, v.seq,
      extract(epoch FROM (date_trunc('day', now() AT TIME ZONE 'America/Denver')
        AT TIME ZONE 'America/Denver'))::bigint + v.off,
      extract(epoch FROM (date_trunc('day', now() AT TIME ZONE 'America/Denver')
        AT TIME ZONE 'America/Denver'))::bigint + v.off + 7200,
      l.id, 'Appointment'
    FROM (VALUES
        ('stp_01JBENCH000000000000CM001P', 'sm_01JBENCH0000000000000CM001', 'Pickup', 0, 118800, 'CUST-DEN'),
        ('stp_01JBENCH000000000000CM001D', 'sm_01JBENCH0000000000000CM001', 'Delivery', 1, 291600, 'WH-DAL'),
        ('stp_01JBENCH000000000000CM002P', 'sm_01JBENCH0000000000000CM002', 'Pickup', 0, 122400, 'CUST-DEN'),
        ('stp_01JBENCH000000000000CM002D', 'sm_01JBENCH0000000000000CM002', 'Delivery', 1, 295200, 'DC-CHI'),
        ('stp_01JBENCH000000000000CM003P', 'sm_01JBENCH0000000000000CM003', 'Pickup', 0, 133200, 'CUST-DEN'),
        ('stp_01JBENCH000000000000CM003D', 'sm_01JBENCH0000000000000CM003', 'Delivery', 1, 306000, 'COLD-PHX'),
        ('stp_01JBENCH000000000000CM004P', 'sm_01JBENCH0000000000000CM004', 'Pickup', 0, 291600, 'CUST-DEN'),
        ('stp_01JBENCH000000000000CM004D', 'sm_01JBENCH0000000000000CM004', 'Delivery', 1, 464400, 'TERM-LA'),
        ('stp_01JBENCH000000000000CM005P', 'sm_01JBENCH0000000000000CM005', 'Pickup', 0, -61200, 'CUST-DEN'),
        ('stp_01JBENCH000000000000CM005D', 'sm_01JBENCH0000000000000CM005', 'Delivery', 1, 111600, 'DC-CHI'))
      AS v (id, move_id, kind, seq, off, code)
    JOIN shipment_moves AS sm ON sm.id = v.move_id JOIN locations AS l ON l.code = v.code AND l.organization_id = sm.organization_id
      AND l.business_unit_id = sm.business_unit_id
    ON CONFLICT DO NOTHING
  - |
    UPDATE stops AS st SET status = 'New', actual_arrival = NULL, actual_departure = NULL,
      scheduled_window_start = extract(epoch FROM (date_trunc('day', now() AT TIME ZONE 'America/Denver')
        AT TIME ZONE 'America/Denver'))::bigint + v.off,
      scheduled_window_end = extract(epoch FROM (date_trunc('day', now() AT TIME ZONE 'America/Denver')
        AT TIME ZONE 'America/Denver'))::bigint + v.off + 7200
    FROM (VALUES
        ('stp_01JBENCH000000000000CM001P', 118800), ('stp_01JBENCH000000000000CM001D', 291600),
        ('stp_01JBENCH000000000000CM002P', 122400), ('stp_01JBENCH000000000000CM002D', 295200),
        ('stp_01JBENCH000000000000CM003P', 133200), ('stp_01JBENCH000000000000CM003D', 306000),
        ('stp_01JBENCH000000000000CM004P', 291600), ('stp_01JBENCH000000000000CM004D', 464400),
        ('stp_01JBENCH000000000000CM005P', -61200), ('stp_01JBENCH000000000000CM005D', 111600))
      AS v (id, off)
    WHERE st.id = v.id
  - |
    UPDATE assignments AS a SET status = 'Canceled' FROM shipment_moves AS sm JOIN shipments AS sp ON sp.id = sm.shipment_id WHERE a.shipment_move_id = sm.id AND sp.pro_number LIKE 'SEED-BENCH-CM-%'
      AND a.id <> 'asn_01JBENCH0000000000000CM003' AND a.status <> 'Canceled'
  - |
    UPDATE carrier_assignments AS ca SET status = 'Canceled' FROM shipment_moves AS sm JOIN shipments AS sp ON sp.id = sm.shipment_id WHERE ca.shipment_move_id = sm.id AND sp.pro_number LIKE 'SEED-BENCH-CM-%'
      AND ca.status <> 'Canceled'
  - |
    INSERT INTO assignments
      (id, organization_id, business_unit_id, shipment_move_id, primary_worker_id, tractor_id, status)
    SELECT 'asn_01JBENCH0000000000000CM003', sm.organization_id, sm.business_unit_id, sm.id,
      (SELECT w.id FROM workers AS w WHERE w.organization_id = sm.organization_id
        AND w.first_name = 'John' AND w.last_name = 'Smith'),
      (SELECT t.id FROM tractors AS t WHERE t.organization_id = sm.organization_id
        AND t.code = 'TRC-003'),
      'New'
    FROM shipment_moves AS sm WHERE sm.id = 'sm_01JBENCH0000000000000CM003' ON CONFLICT DO NOTHING
  - |
    UPDATE assignments SET status = 'New', archived_at = NULL WHERE id = 'asn_01JBENCH0000000000000CM003'
      AND (status <> 'New' OR archived_at IS NOT NULL)
  - >
    DELETE FROM shipment_holds AS h USING shipments AS sp WHERE h.shipment_id = sp.id AND sp.pro_number
    LIKE 'SEED-BENCH-CM-%'
  - >
    DELETE FROM shipment_comments AS c USING shipments AS sp WHERE c.shipment_id = sp.id AND sp.pro_number
    LIKE 'SEED-BENCH-CM-%'
  - >
    DELETE FROM additional_charges AS ac USING shipments AS sp WHERE ac.shipment_id = sp.id AND sp.pro_number
    LIKE 'SEED-BENCH-CM-%'
  steps:
  - say: whats going out of the denver drop tmrw that still doesnt have a driver? and whose loads
      are they
    expect:
      noProposals: true
      noRecordIds: true
      facts:
      - sql: |
          WITH first_pickup AS (
            SELECT DISTINCT ON (sp.id) sp.id, sp.pro_number, l.code,
              st.scheduled_window_start AS starts
            FROM shipments sp
            JOIN shipment_moves sm ON sm.shipment_id = sp.id
            JOIN stops st ON st.shipment_move_id = sm.id
            JOIN locations l ON l.id = st.location_id
            WHERE st.type IN ('Pickup', 'SplitPickup')
              AND sp.status IN ('New', 'PartiallyAssigned', 'Assigned')
            ORDER BY sp.id, sm.sequence, st.sequence)
          SELECT fp.pro_number FROM first_pickup fp WHERE fp.code = 'CUST-DEN'
            AND fp.starts >= extract(epoch FROM ((date_trunc('day', now() AT TIME ZONE 'America/Denver')
              + interval '1 day') AT TIME ZONE 'America/Denver'))
            AND fp.starts < extract(epoch FROM ((date_trunc('day', now() AT TIME ZONE 'America/Denver')
              + interval '2 days') AT TIME ZONE 'America/Denver'))
            AND NOT EXISTS (SELECT 1 FROM shipment_moves m JOIN assignments a ON a.shipment_move_id = m.id
                            WHERE m.shipment_id = fp.id AND a.status <> 'Canceled')
            AND NOT EXISTS (SELECT 1 FROM shipment_moves m JOIN carrier_assignments ca ON ca.shipment_move_id = m.id
                            WHERE m.shipment_id = fp.id AND ca.status <> 'Canceled')
          ORDER BY 1
        note: each load picking up at the Denver drop tomorrow with nobody on it
      - sql: >
          SELECT c.name FROM customers c WHERE c.id IN (SELECT customer_id FROM shipments WHERE pro_number
          IN ('SEED-BENCH-CM-01', 'SEED-BENCH-CM-02')) GROUP BY c.name ORDER BY 1
        note: the customer on those loads
      rubric: >
        Names SEED-BENCH-CM-01 (to Dallas) and SEED-BENCH-CM-02 (to Chicago) as Range Logistics loads
        with no driver, leaves out SEED-BENCH-CM-03 because John Smith is on it, and leaves out the
        load that was due yesterday and the one three days out. Says what it counted as tomorrow if
        the time zone matters.
      noCalls:
      - agent_run_script
