- name: codemode-credit-hold-every-uncovered-load-discrete
  description: 'Batch write: one request that holds every load in a set worked out by reading coverage,
    then one approval. Graded on the holds the database holds afterwards: every open Range load out of
    Denver with nobody on it is held, and the covered one is not. Discrete mode.'
  agent: Dispatch desk
  mode: discrete
  pair: credit-hold-every-uncovered-load
  tags:
  - dispatch
  - write
  - batch-write
  exclusive: codemode-range-denver
  setup: *codemode_pool
  steps:
  - say: range is on credit stop. hold every one of their loads out of denver that doesnt have a driver
      on it yet
    expect:
      noCalls:
      - analysis_run
      rubric: |
        Proposes a credit hold on SEED-BENCH-CM-01, -02, -04 and -05, not on -03 (John Smith is on it), and says the holds wait for approval rather than claiming them placed.
  - decide: approve
    expect:
      db:
      - sql: |
          SELECT count(*) FROM shipments sp JOIN customers c ON c.id = sp.customer_id WHERE c.code = 'RNGE' AND sp.status IN ('New', 'PartiallyAssigned', 'Assigned')
            AND EXISTS (SELECT 1 FROM shipment_moves m JOIN stops st ON st.shipment_move_id = m.id
                        JOIN locations l ON l.id = st.location_id
                        WHERE m.shipment_id = sp.id AND st.type IN ('Pickup', 'SplitPickup')
                          AND l.code = 'CUST-DEN')
            AND NOT EXISTS (SELECT 1 FROM shipment_moves m JOIN assignments a ON a.shipment_move_id = m.id
                            WHERE m.shipment_id = sp.id AND a.status <> 'Canceled')
            AND NOT EXISTS (SELECT 1 FROM shipment_moves m JOIN carrier_assignments ca ON ca.shipment_move_id = m.id
                            WHERE m.shipment_id = sp.id AND ca.status <> 'Canceled')
            AND NOT EXISTS (SELECT 1 FROM shipment_holds h
                            WHERE h.shipment_id = sp.id AND h.released_at IS NULL)
        equals: '0'
        note: no uncovered Range load out of Denver left without a hold
      - sql: |
          SELECT count(*) FROM shipments sp WHERE sp.pro_number IN ('SEED-BENCH-CM-01', 'SEED-BENCH-CM-02', 'SEED-BENCH-CM-04', 'SEED-BENCH-CM-05')
            AND EXISTS (SELECT 1 FROM shipment_holds h WHERE h.shipment_id = sp.id AND h.released_at IS NULL)
        equals: '4'
        note: the four uncovered bench loads each held
      - sql: |
          SELECT count(*) FROM shipment_holds h JOIN shipments sp ON sp.id = h.shipment_id WHERE sp.pro_number = 'SEED-BENCH-CM-03' AND h.released_at IS NULL
        equals: '0'
        note: the covered load left alone
      rubric: Reports the four loads held, once, and names any that could not be.
