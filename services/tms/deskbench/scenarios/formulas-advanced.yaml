defaults:
  tags: [formulas, rating, advanced]

scenarios:
  - name: formula-ltl-weight-breaks
    description: >
      Classic LTL pricing: a rate per hundredweight that drops as the weight climbs, with a minimum
      charge. The breaks are an input so the template serves every customer.
    formula: {}
    steps:
      - say: >
          ltl rating: under 500 lbs is 45 a hundredweight, 500 to 1999 is 38, 2000 to 4999 is 32,
          5000 and up is 28. minimum charge 125
        expect:
          calls: ["formula_propose"]
          maxFailedCalls: 2
          formula:
            - '/use\s+std\.ltl/'
            - '/input\s+\w+\s*:\s*List<Break>/'
            - '/(?m)^\s*minimum\s+\w+/'
          rubric: >
            Declares the weight breaks as a List<Break> input with these four breaks as its default,
            rates with std.ltl's deficit, bills the minimum as a total clause, and tests a 300 lb, a
            1,200 lb and a 6,000 lb load.

  - name: formula-mileage-bands
    description: Different per-mile rates by length of haul, the whole load at one band's rate.
    formula: {}
    steps:
      - say: >
          per mile but it depends on length of haul: up to 250 miles is 3.40 a mile, 251 to 600 is
          2.75, over 600 is 2.30. whole trip at the one rate, not stacked
        expect:
          calls: ["formula_propose"]
          formula: ["shipment.distance", '/(?m)^\s*test\s+"/']
          rubric: >
            Picks one rate for the whole trip by its distance band (not a tiered sum), with the
            three rates and two thresholds as inputs, and tests a 200, a 400 and an 800 mile load.

  - name: formula-equipment-and-hazmat-adders
    description: A base rate with conditional adders the person states together.
    formula: {}
    steps:
      - say: >
          base it on 2.60 a mile. reefer loads get 15% on top, hazmat adds a flat 175, team service
          adds 25 cents a mile. any combination can apply
        expect:
          calls: ["formula_propose", "formula_describe_language"]
          formula: ["shipment.distance", "shipment.hazmat", "shipment.reefer"]
          rubric: >
            Uses the record's own fields for reefer and hazmat and says how team service is marked
            (the service type's code compared to an input) rather than inventing a field, applies
            the 15% to the linehaul, and tests loads with none, one and all three adders.

  - name: formula-doe-fuel-surcharge
    description: >
      A fuel surcharge indexed to the diesel price, the way contracts write it: a cent per mile for
      every few cents the index is above a peg.
    formula: {}
    steps:
      - say: >
          fuel surcharge per our contracts: peg is 1.25 a gallon, for every 6 cents the DOE average
          is above the peg add a penny a mile. nothing if diesel is under the peg
        expect:
          calls: ["formula_propose"]
          formula: ["fuel.price", "shipment.distance"]
          rubric: >
            Reads the diesel price from fuel.price, refuses to rate with a reason when there is
            none, bills a cent a mile for every whole 6 cents above the 1.25 peg (nothing below it),
            keeps the peg, step and rate as inputs, and tests a price below the peg, 3.85 and 4.50.

  - name: formula-detention-free-time
    description: Detention billed by the half hour after free time.
    formula: {}
    steps:
      - say: >
          detention: 2 hours free, then 75 an hour billed in half hour increments, rounded up.
          cap it at 600 a stop
        expect:
          calls: ["formula_propose"]
          formula: ["/detention|dwell/", '/\$600|600/']
          rubric: >
            Charges nothing within the free time, rounds the time beyond it up to the half hour at
            75 an hour (std.accessorials' detention fits), caps each stop at 600, keeps the figures
            as inputs, and reads the time from each stop's dwell.

  - name: formula-build-then-rework
    description: >
      A long working session on one draft: build, then change the minimum, then add a stop charge,
      then take one thing out, each turn starting from what the last one left.
    formula: {}
    steps:
      - say: "3.10 a mile with a 450 minimum"
        expect:
          calls: ["formula_propose"]
          formula: ["shipment.distance", '/(?m)^\s*minimum\s+/']
      - say: "make the minimum 500"
        expect:
          calls: ["formula_propose"]
          formula: ["shipment.distance", '/\$500/']
      - say: "and charge 85 for each stop past the first two"
        expect:
          calls: ["formula_propose"]
          formula: ["shipment.distance", '/shipment\.stops|extraStops/']
      - say: "actually drop the minimum entirely"
        expect:
          calls: ["formula_propose"]
          formula: ["shipment.distance", '/shipment\.stops|extraStops/']
          rubric: >
            Removes the minimum and keeps the per-mile and stop charges exactly as they were built,
            rather than rebuilding the formula from the first message.

  - name: formula-explain-then-fix-a-bad-template
    description: >
      An existing template opened to find out why it priced a load wrong, then fixed.
    formula: { template: Per Mile }
    steps:
      - say: "a 0 mile load came out to 0, shouldn't there be something stopping that? what does this do"
        expect:
          noProposals: true
          rubric: >
            Explains the charge and the minimum input, and that a minimum of $0 lets an empty trip
            bill nothing.
      - say: "make it refuse to rate a load with no miles"
        expect:
          calls: ["formula_propose"]
          formula: ['/require\s+shipment\.distance|fail\s+"/']
