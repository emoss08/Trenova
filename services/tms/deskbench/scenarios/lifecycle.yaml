defaults:
  tags: [lifecycle, write]

scenarios:
  - name: lifecycle-one-agent-book-to-posted-invoice
    description: >
      A load from entry to the posted invoice in one conversation with an agent that holds every
      step: book it from the customer's contract, cover it with a company driver, record the pickup
      and the delivery, hand it to billing, approve it in the billing queue and post the invoice.
      Every change is approved, and the database is checked after each one. The load ran yesterday
      on a lane a truck drives in a day, so the actual times can be recorded whatever hour the run
      starts: a load that delivered a minute after it picked up is one a careful agent refuses.
    agent: Bench · Operations
    exclusive: acme-shipments
    setup:
      - >
        UPDATE assignments AS a SET status = 'Canceled'
        FROM shipment_moves AS sm
        JOIN shipments AS sp ON sp.id = sm.shipment_id
        WHERE a.shipment_move_id = sm.id
          AND sp.weight = 41500
          AND sp.customer_id = (SELECT id FROM customers WHERE code = 'ACME')
          AND sp.status NOT IN ('Completed', 'ReadyToInvoice', 'Invoiced', 'Canceled')
      - >
        UPDATE shipment_moves AS sm SET status = 'Canceled'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id
          AND sp.weight = 41500
          AND sp.customer_id = (SELECT id FROM customers WHERE code = 'ACME')
          AND sp.status NOT IN ('Completed', 'ReadyToInvoice', 'Invoiced', 'Canceled')
      - >
        UPDATE shipments SET status = 'Canceled'
        WHERE weight = 41500
          AND customer_id = (SELECT id FROM customers WHERE code = 'ACME')
          AND status NOT IN ('Completed', 'ReadyToInvoice', 'Invoiced', 'Canceled')
    steps:
      - say: >
          entering a load for acme that ran yesterday: picked up at the LA terminal yesterday
          morning, delivered to phoenix cold storage yesterday afternoon, 41,500 lbs dry van,
          price it off their contract
        expect:
          proposals: [{ tool: create_shipment }]
          maxFailedCalls: 2
          noRecordIds: true
      - decide: approve
        expect:
          executed: true
          db:
            - sql: >
                select status from shipments where customer_id =
                (select id from customers where code = 'ACME') order by created_at desc limit 1
              equals: New
              note: the new Acme load saved as New
      - say: "put david park on it with trc-001 and a dry van"
        expect:
          proposals: [{ tool: assign_move }]
          maxFailedCalls: 2
          rubric: >
            Assigns the new load's move to David Park, TRC-001 and a free dry van trailer
            (TRL-006; TRL-001 and TRL-002 are on the detention loads still in transit, which the
            preview says), and says anything that stands against it (hours, credentials, the
            window).
      - decide: approve
        expect:
          executed: true
      - say: "david got to the LA terminal at 5:50 yesterday morning and left loaded at 7:05"
        expect:
          proposals: [{ tool: "record_stop_actual|update_move_status" }]
          maxFailedCalls: 2
      - decide: approve
        expect:
          executed: true
      - say: "he got to phoenix cold storage at 2:40 yesterday afternoon and left empty at 3:30"
        expect:
          proposals: [{ tool: "record_stop_actual|update_move_status" }]
          maxFailedCalls: 2
      - decide: approve
        expect:
          executed: true
          db:
            - sql: >
                select status from shipments where customer_id =
                (select id from customers where code = 'ACME') order by created_at desc limit 1
              equals: Completed
              note: the load completed once its delivery was recorded
      - say: "ok send it to billing"
        expect:
          proposals: [{ tool: transfer_to_billing }]
      - decide: approve
        expect:
          executed: true
      - say: "approve it in the billing queue"
        expect:
          calls: ["get_billing_queue_item|list_billing_queue_items"]
          proposals: [{ tool: approve_billing_queue_item }]
          rubric: >
            Opens the queue item and checks it before proposing the approval, and says what
            approving it creates (the draft invoice).
      - decide: approve
        expect:
          executed: true
      - say: "post the invoice"
        expect:
          proposals: [{ tool: post_invoice }]
      - decide: approve
        expect:
          executed: true
          db:
            - sql: >
                select status from shipments where customer_id =
                (select id from customers where code = 'ACME') order by created_at desc limit 1
              equals: Invoiced
              note: the load invoiced once its invoice was posted
          rubric: Reports the invoice number and total, once.

  - name: lifecycle-handed-between-agents
    description: >
      The same life of a load the way a team works it: the shipment desk books it, dispatch covers
      and runs it, billing invoices it. Each step is handed to the agent that owns it from one
      conversation, as a person does with the agent picker.
    agent: Shipment Assistant
    exclusive: peak-shipments
    setup:
      - >
        UPDATE assignments AS a SET status = 'Canceled'
        FROM shipment_moves AS sm JOIN shipments AS sp ON sp.id = sm.shipment_id
        WHERE a.shipment_move_id = sm.id
          AND sp.weight = 28000 AND sp.pro_number NOT LIKE 'SEED-%'
          AND sp.customer_id = (SELECT id FROM customers WHERE code = 'PEAK')
          AND sp.status NOT IN ('Completed', 'ReadyToInvoice', 'Invoiced', 'Canceled')
      - >
        UPDATE shipment_moves AS sm SET status = 'Canceled'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id
          AND sp.weight = 28000 AND sp.pro_number NOT LIKE 'SEED-%'
          AND sp.customer_id = (SELECT id FROM customers WHERE code = 'PEAK')
          AND sp.status NOT IN ('Completed', 'ReadyToInvoice', 'Invoiced', 'Canceled')
      - >
        UPDATE shipments SET status = 'Canceled'
        WHERE weight = 28000 AND pro_number NOT LIKE 'SEED-%'
          AND customer_id = (SELECT id FROM customers WHERE code = 'PEAK')
          AND status NOT IN ('Completed', 'ReadyToInvoice', 'Invoiced', 'Canceled')
      - >
        DELETE FROM billing_queue_items AS b USING shipments AS s
        WHERE b.shipment_id = s.id AND s.pro_number IN ('SEED-DET-001', 'SEED-DET-002')
          AND NOT EXISTS (SELECT 1 FROM invoices AS i WHERE i.billing_queue_item_id = b.id)
      - >
        UPDATE shipment_moves AS sm SET status = 'InTransit'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number IN ('SEED-DET-001', 'SEED-DET-002')
          AND sm.status <> 'InTransit'
          AND EXISTS (SELECT 1 FROM stops AS st WHERE st.shipment_move_id = sm.id
                      AND st.actual_arrival IS NOT NULL AND st.actual_departure IS NULL)
      - >
        UPDATE shipments AS sp SET status = 'InTransit', billing_transfer_status = NULL,
          transferred_to_billing_at = NULL, marked_ready_to_bill_at = NULL
        WHERE sp.pro_number IN ('SEED-DET-001', 'SEED-DET-002') AND sp.status <> 'InTransit'
          AND EXISTS (SELECT 1 FROM shipment_moves AS sm
                      WHERE sm.shipment_id = sp.id AND sm.status = 'InTransit')
    steps:
      - say: >
          new load for peak distributing, dallas warehouse to the denver drop point, pick up
          tomorrow 7am, deliver the day after by 3pm, 28k lbs dry van, $2,450 flat
        expect:
          proposals: [{ tool: create_shipment }]
          maxFailedCalls: 2
          rubric: >
            Peak Distributing has no rate agreement, so the load is entered at the flat price the
            person gave, without asking them for a rating method.
      - decide: approve
        expect:
          executed: true
      - say: "who can run this one? put the best driver on it"
        agent: Dispatch desk
        expect:
          calls: ["rank_move_candidates"]
          proposals: [{ tool: assign_move }]
          rubric: >
            Finds the load the conversation just booked without being told its pro number, ranks
            candidates and proposes the top one, saying why.
      - decide: approve
        expect:
          executed: true
      - say: "it delivered, mark it done"
        agent: Dispatch desk
        expect:
          proposals: [{ tool: "update_move_status|record_stop_actual" }]
      - decide: approve
        expect:
          executed: true
      - say: "bill it"
        agent: Billing exceptions
        expect:
          proposals: [{ tool: "transfer_to_billing|create_invoice|approve_billing_queue_item" }]
          rubric: >
            Takes the next billing step for the load this conversation booked, without asking
            which load, and says what is left after it.
      - decide: approve
        expect:
          executed: true

  - name: lifecycle-carrier-covered
    description: >
      A brokered load: no company driver, so it goes to an outside carrier at a rate, with the
      rate confirmation, and later the carrier's delivery.
    agent: Bench · Operations
    exclusive: peak-shipments
    setup:
      - >
        UPDATE carrier_assignments AS ca SET status = 'Canceled'
        FROM shipment_moves AS sm JOIN shipments AS sp ON sp.id = sm.shipment_id
        WHERE ca.shipment_move_id = sm.id AND sp.pro_number = 'SEED-SHP-002'
          AND ca.status <> 'Canceled'
      - >
        DELETE FROM carrier_assignments AS ca USING shipment_moves AS sm, shipments AS sp
        WHERE ca.shipment_move_id = sm.id AND sm.shipment_id = sp.id
          AND sp.pro_number = 'SEED-SHP-002'
          AND NOT EXISTS (SELECT 1 FROM carrier_cost_events AS e
                          WHERE e.carrier_assignment_id = ca.id)
      - >
        UPDATE assignments AS a SET status = 'Canceled'
        FROM shipment_moves AS sm JOIN shipments AS sp ON sp.id = sm.shipment_id
        WHERE a.shipment_move_id = sm.id AND sp.pro_number = 'SEED-SHP-002'
          AND a.status <> 'Canceled'
      - >
        UPDATE stops AS st SET status = 'New', actual_arrival = NULL, actual_departure = NULL
        FROM shipment_moves AS sm JOIN shipments AS sp ON sp.id = sm.shipment_id
        WHERE st.shipment_move_id = sm.id AND sp.pro_number = 'SEED-SHP-002'
          AND (st.status <> 'New' OR st.actual_arrival IS NOT NULL
            OR st.actual_departure IS NOT NULL)
      - >
        UPDATE shipment_moves AS sm SET status = 'New', coverage_type = 'unassigned'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number = 'SEED-SHP-002'
          AND (sm.status <> 'New' OR sm.coverage_type <> 'unassigned')
      - >
        UPDATE shipments SET status = 'New', canceled_at = NULL, canceled_by_id = NULL,
          cancel_reason = NULL
        WHERE pro_number = 'SEED-SHP-002' AND status <> 'New'
    steps:
      - say: "the peak ltl to chicago, nobody in house can take it. shop it to carriers"
        expect:
          calls: ["shop_carriers"]
          noProposals: true
      - say: "give it to whoever is cheapest that's active and compliant"
        expect:
          proposals: [{ tool: assign_move_to_carrier }]
          rubric: >
            Picks the cheapest carrier from the shop that is Active and compliant (not Lone Star,
            which is inactive, nor Harbor Point while its compliance is pending) and proposes the
            assignment at that rate.
      - decide: approve
        expect:
          executed: true
      - say: "send them the rate con"
        expect:
          db:
            - sql: >
                select case when count(*) > 0 then 'waiting' else 'none' end
                from agent_proposals p
                join shipment_moves sm on sm.id = p.tool_params->>'shipmentMoveId'
                join shipments sp on sp.id = sm.shipment_id
                where sp.pro_number = 'SEED-SHP-002' and p.status = 'Pending'
                  and p.tool_name in ('generate_rate_confirmation', 'send_rate_confirmation')
              equals: waiting
              note: >
                A rate confirmation proposal is waiting, filed now or already filed after the
                carrier was approved; asking for a decision on that one is right, a second is not.
          rubric: >
            Proposes generating or sending Blue Ridge's rate confirmation, or, when the follow-up to
            the approval already filed it, points to that proposal rather than filing another.

  - name: lifecycle-rate-check-before-billing
    description: >
      Billing questions the price before approving: the agent explains the rate from the agreement,
      finds it disagrees with what the shipment carries, and rerates it.
    agent: Bench · Operations
    exclusive: acme-shipments
    setup:
      - >
        UPDATE shipments AS sp SET
          formula_template_id = (SELECT ft.id FROM formula_templates AS ft
                                 WHERE ft.organization_id = sp.organization_id
                                   AND ft.business_unit_id = sp.business_unit_id
                                   AND ft.name = 'Flat Rate' AND ft.type = 'FreightCharge'
                                 LIMIT 1),
          base_rate = 3200, freight_charge_amount = 3200, other_charge_amount = 0,
          total_charge_amount = 3200, rating_detail = NULL, rate_quote_id = NULL,
          rate_agreement_id = NULL, rate_agreement_rule_id = NULL, rate_override_amount = NULL,
          rate_override_reason = NULL, rate_override_by_id = NULL, rate_override_at = NULL,
          rate_locked = false, auto_rated = false, auto_rated_at = NULL
        WHERE sp.pro_number = 'SEED-SHP-001'
          AND (sp.rate_quote_id IS NOT NULL OR sp.base_rate IS DISTINCT FROM 3200
            OR sp.total_charge_amount IS DISTINCT FROM 3200)
      - >
        UPDATE shipments SET status = 'New', canceled_at = NULL, canceled_by_id = NULL,
          cancel_reason = NULL
        WHERE pro_number = 'SEED-SHP-001' AND status = 'Canceled'
      - >
        UPDATE shipment_moves AS sm SET status = 'New'
        FROM shipments AS sp
        WHERE sm.shipment_id = sp.id AND sp.pro_number = 'SEED-SHP-001'
          AND sm.status = 'Canceled'
    steps:
      - say: "before we bill SEED-SHP-001, is it priced right per the acme contract?"
        expect:
          calls: ["explain_rate|get_rate_agreement|get_shipment"]
          noProposals: true
          rubric: >
            Explains how SEED-SHP-001 was priced (its rating method and charges) against the Acme
            Truckload Agreement, and says plainly whether they agree.
      - say: "rerate it off the contract then"
        expect:
          proposals: [{ tool: rerate_shipment }]
      - decide: approve
        expect:
          executed: true
