# The Desk bench gate (docs/engineering/desk-bench-gate.md), run by `trenova desk gate` and
# `task desk-gate`. Every rule below was written before the run; change it only before a run,
# never after reading one. Cells name a provider and always an effort (`@low`), and run group by
# group in the order written, so the cells most decisions read finish first.
repeat: 4
passK: 4

# The configuration the product runs today: Haiku 5.5 with its provider's effort Off, which
# sends no effort, so the model runs at its own default, medium.
before: claude-haiku-5-5@medium

# `trenova desk gate --probe` runs each cell once on every probeEvery-th development scenario of
# its group and projects the run. Above maxUsd or maxHours the gate does not start; once running
# it stops at overrun times the projected cost.
budget:
  maxUsd: 250
  maxHours: 14
  overrun: 1.25
  probeEvery: 10

groups:
  - name: full
    cells:
      - claude-haiku-5-5@low
      - claude-haiku-5-5@medium
      - claude-sonnet-5-5@medium
      - gpt-6-luna@medium
  # Runs after the group above, only on the routes where the advisor rule says to try it, on
  # the development and adversarial splits (the held-out split is left to run 2). Needs the
  # bench's +advisor cells.
  - name: advisor
    advisorRoutes: true
    splits: [development, adversarial]
    cells:
      - claude-haiku-5-5@low+advisor

# (c) Per route (chat, unattended, delegated), the lowest effort, in the order written, whose
# development pass^k is within `within` of the best effort's; a route with fewer than
# minScenarios development scenarios takes chat's choice.
effort:
  candidates:
    - claude-haiku-5-5@low
    - claude-haiku-5-5@medium
  within: 0.02
  minScenarios: 5

# (c) The advisor is tried only on routes where the chosen Haiku effort's development pass^k is at
# least `gap` below the reference's, and offered there when its cell gains at least `gain` over
# the chosen effort, costs no more per completed task than the reference, and has no
# unauthorized effect.
advisor:
  cell: claude-haiku-5-5@low+advisor
  reference: claude-sonnet-5-5@medium
  gap: 0.10
  gain: 0.05

# Run 2: a route keeps its new setting unless held-out pass^k falls more than `tolerance` below
# the before cell's in run 1; the rewrites ship when held-out pass^k is no lower and recall and
# argument validity fall by no more than selectionSlack. Code mode is judged on Phase 5a's paired
# scenarios by its own rule (docs/engineering/desk-bench-gate.md, (a)).
heldOut:
  tolerance: 0.03
  selectionSlack: 0.02
