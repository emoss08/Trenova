# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  REPO_DIR: "{{.TASKFILE_DIR}}/../.."
  BUILD_DIR: ./build
  CLI_BINARY: "trenova-cli{{exeExt}}"
  CLI_PATH: "{{.BUILD_DIR}}/{{.CLI_BINARY}}"
  DEVDB_BINARY: "trenova-devdb{{exeExt}}"
  DEVDB_PATH: "{{.BUILD_DIR}}/{{.DEVDB_BINARY}}"
  DB_ENV: '{{.env | default "development"}}'
  DOCKER_COMPOSE_LOCAL: "docker compose -f {{.REPO_DIR}}/dev/compose.yml"
  CLIENT_DIR: "{{.REPO_DIR}}/client"
  TEST_DB_CONTAINER: trenova-integration-postgres
  TEST_DB_PORT: "55432"
  TEST_POSTGRES_DSN: "postgres://postgres:postgres@localhost:55432/trenova_test?sslmode=disable"
  # Plain PostGIS runs every test on the keyword-only fallback path. Build the
  # pgvector image with `task test-db-image` and export
  # TRENOVA_TEST_POSTGRES_IMAGE=trenova-postgres:local to run the vector tests.
  TEST_POSTGRES_IMAGE: '{{.TRENOVA_TEST_POSTGRES_IMAGE | default "postgis/postgis:18-3.6-alpine"}}'
  TEST_POSTGRES_LOCAL_IMAGE: trenova-postgres:local
  # nomsgpack drops gin's MsgPack binding, which nothing here uses. It is the
  # only thing pulling in ugorji/go/codec, a 20s compile on the critical path.
  GO_TAGS: nomsgpack
  GO_TAG_FLAG: '{{if .GO_TAGS}}-tags {{.GO_TAGS}}{{end}}'
  # Commands that pass -tags on the command line override GOFLAGS rather than
  # merging with it, so they have to spell the base tags out themselves.
  GO_TAGS_INTEGRATION: '{{if .GO_TAGS}}{{.GO_TAGS}},{{end}}integration'
  # Low-resource mode, for machines that swap or stall during a build. Turn it on
  # per command (`task run-watch LOW_RESOURCE=true`) or for every command by
  # exporting LOW_RESOURCE=true in your shell profile.
  #
  # By default Go compiles one package per core, each with its own compiler
  # threads, so the largest packages (the GraphQL resolver package, the test
  # mocks the service helpers import) set the peak together. The mode
  # therefore compiles LOW_RESOURCE_JOBS packages at a time with that many
  # threads each (-p and GOMAXPROCS), runs the GC harder (GOGC), caps
  # golangci-lint and the test runners the same way, debounces air, and starts
  # only the containers the API needs. Builds take longer; the machine stays
  # usable. Raise LOW_RESOURCE_JOBS to 2 on a machine with 16 GB or more.
  LOW_RESOURCE: '{{.LOW_RESOURCE | default "false"}}'
  LOW_RESOURCE_JOBS: '{{.LOW_RESOURCE_JOBS | default "1"}}'
  GO_JOBS: '{{if eq .LOW_RESOURCE "true"}}{{.LOW_RESOURCE_JOBS}}{{end}}'
  GO_TEST_JOBS: '{{.GO_JOBS | default "4"}}'
  AIR_FLAGS: '{{if .GO_JOBS}}--build.delay 2000{{end}}'
  # Search is off by default, Gotenberg only renders PDFs, and Redis Insight and
  # the Samsara simulator are debugging aids, so the API starts without them.
  # Temporal stays: every AI feature and background job runs on it. The imaging
  # worker stays: every document preview, page view and capture page goes through it.
  DOCKER_MINIMAL_SERVICES: '{{.DOCKER_MINIMAL_SERVICES | default "db redis minio temporal imaging"}}'
  DOCKER_SERVICES: '{{if .GO_JOBS}}{{.DOCKER_MINIMAL_SERVICES}}{{end}}'

# 769 of 832 packages depend on gin, so a go command that misses the tag set
# rebuilds and re-caches almost the whole tree under a second configuration.
# Setting GOFLAGS here covers every go invocation in this file, including ones
# added later.
#
# The low-resource values are empty unless the mode is on, and Go treats an
# empty GOMAXPROCS or GOGC as unset. A value already exported in your shell
# takes precedence over these. They also reach the API process that `run` and
# `run-watch` start, which keeps a local server from competing with the build.
env:
  GOFLAGS: '-trimpath {{if .GO_TAGS}}-tags={{.GO_TAGS}}{{end}}{{if .GO_JOBS}} -p={{.GO_JOBS}}{{end}}'
  GOMAXPROCS: '{{.GO_JOBS}}'
  GOGC: '{{if .GO_JOBS}}50{{end}}'

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Display available tasks
    cmds:
      - task --list

  build:
    desc: Build the CLI binary
    deps: [build-cli]

  build-cli:
    desc: Build the unified CLI tool
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -buildvcs=false {{.GO_TAG_FLAG}} -o {{.CLI_PATH}} ./cmd/cli

  build-devdb:
    desc: Build trenova-devdb, the development database tool (migrations, templates, reset)
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -buildvcs=false {{.GO_TAG_FLAG}} -o {{.DEVDB_PATH}} ./cmd/devdb

  run:
    desc: Run the API server via CLI
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} api run"

  run-watch:
    desc: Run the API server with hot reload
    cmds:
      - air {{.AIR_FLAGS}}

  build-bench:
    desc: "Measure rebuild times after representative edits (task build-bench -- --target cli --mode air)"
    cmds:
      - ./scripts/buildbench/buildbench.sh {{.CLI_ARGS}}

  run-worker-watch:
    desc: Run the worker service with hot reload
    cmds:
      - >-
        air {{.AIR_FLAGS}}
        --build.cmd "go build -tags nomsgpack -gcflags='github.com/emoss08/trenova/...=-N -l' -ldflags='-s -w' -o ./tmp/trenova-worker ./cmd/worker"
        --build.bin "./tmp/trenova-worker"

  run-worker:
    desc: Run the worker service
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} worker run"

  desk-ask:
    desc: "Send the Desk a message on this checkout's code and print everything it did (task desk-ask -- \"msg\")"
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} desk ask {{.CLI_ARGS}}"

  desk-bench:
    desc: Run the Desk scenarios under deskbench/scenarios and compare with the previous run
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} desk run {{.CLI_ARGS}}"

  desk-baseline:
    desc: Run the Phase 0 baseline matrix in deskbench/baseline.yaml (4 trials per cell) and write baseline.md and baseline.json
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} desk baseline {{.CLI_ARGS}}"

  desk-sweep:
    desc: Run the tool-count sweep (held 8, 12, 20, 30; all vs disclosed) to set ai.toolDisclosureThreshold
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} desk sweep {{.CLI_ARGS}}"

  desk-gate:
    desc: Run the Desk bench gate in deskbench/gate.yaml (--probe, then --budget <probe>, then --confirm <gate>)
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} desk gate {{.CLI_ARGS}}"

  desk-route:
    desc: Score how well the questions under deskbench/routing are matched to their agent
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} desk route {{.CLI_ARGS}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - go clean
      - rm -rf {{.BUILD_DIR}}

  test:
    desc: Run unit tests only
    cmds:
      - go test -v ./...

  test-unit:
    desc: Alias for test
    deps: [test]

  test-integration:
    desc: Run integration tests only
    deps: [test-db-up]
    env:
      TRENOVA_TEST_POSTGRES_DSN: "{{.TEST_POSTGRES_DSN}}"
      APP_ENV: test
    cmds:
      # Only the packages that carry integration-tagged files; the rest already
      # run under `task test`.
      - |
        set -euo pipefail
        packages=$(git grep -l 'go:build integration' -- '*_test.go' \
          | xargs -n1 dirname | sort -u | sed 's|^|./|')
        go test -p {{.GO_TEST_JOBS}} -tags={{.GO_TAGS_INTEGRATION}} $packages

  test-all:
    desc: Run all tests (unit + integration)
    deps: [test-db-up]
    env:
      TRENOVA_TEST_POSTGRES_DSN: "{{.TEST_POSTGRES_DSN}}"
      APP_ENV: test
    cmds:
      - go test -p {{.GO_TEST_JOBS}} -tags={{.GO_TAGS_INTEGRATION}} ./...

  test-db-up:
    desc: Start the shared Postgres the integration suite runs against
    status:
      - docker exec {{.TEST_DB_CONTAINER}} pg_isready -U postgres
    cmds:
      # One shared server means the migrated template database is built once for
      # the whole run instead of once per package.
      - docker rm -f {{.TEST_DB_CONTAINER}} 2>/dev/null || true
      - >-
        docker run -d --name {{.TEST_DB_CONTAINER}}
        -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=trenova_test
        -p {{.TEST_DB_PORT}}:5432 {{.TEST_POSTGRES_IMAGE}}
        postgres -c max_connections=300
      - |
        for _ in $(seq 1 60); do
          docker exec {{.TEST_DB_CONTAINER}} pg_isready -U postgres >/dev/null 2>&1 && exit 0
          sleep 1
        done
        echo "test postgres did not become ready" >&2
        exit 1

  test-db-image:
    desc: Build the Postgres image with pgvector for the integration suite
    cmds:
      - >-
        docker build -f {{.REPO_DIR}}/deploy/Dockerfile.postgres
        -t {{.TEST_POSTGRES_LOCAL_IMAGE}} {{.REPO_DIR}}/deploy

  test-db-down:
    desc: Stop the shared integration-test Postgres
    cmds:
      - docker rm -f {{.TEST_DB_CONTAINER}} 2>/dev/null || true

  test-netsuite-sandbox:
    desc: Run the NetSuite adapter against a real sandbox account (skips unless TRENOVA_NETSUITE_SANDBOX_* is set)
    cmds:
      # Reads need ACCOUNT_ID, CLIENT_ID, CERTIFICATE_ID and PRIVATE_KEY_FILE
      # (a certificate mapping on the sandbox; SUBSIDIARY_ID for OneWorld).
      # The invoice and payment lifecycle also needs CUSTOMER_ID, ITEM_ID and
      # DEPOSIT_ACCOUNT_ID, and writes then voids real records in the sandbox.
      - go test -tags=nomsgpack,netsuitesandbox -count=1 -v -run '^TestSandbox' ./internal/infrastructure/accounting/nsconnector/

  test-coverage:
    desc: Run unit tests with coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test-coverage-all:
    desc: Run all tests with coverage
    deps: [test-db-up]
    env:
      TRENOVA_TEST_POSTGRES_DSN: "{{.TEST_POSTGRES_DSN}}"
      APP_ENV: test
    cmds:
      - go test -p {{.GO_TEST_JOBS}} -tags={{.GO_TAGS_INTEGRATION}} -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test-short:
    desc: Run short tests
    cmds:
      - go test -short ./...

  test-race:
    desc: Run unit tests with race detector
    cmds:
      - GOEXPERIMENT=goroutineleakprofile go test -race ./...

  benchmark:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem ./...

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run{{if .GO_JOBS}} --concurrency={{.GO_JOBS}}{{end}} ./...
      - go run ./scripts/archlint

  fmt:
    desc: Format code
    cmds:
      - gofmt -s -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy and verify module dependencies
    cmds:
      - go mod tidy
      - go mod verify

  deps:
    desc: Download dependencies
    cmds:
      - go mod download

  update:
    desc: Update dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  generate-mocks:
    desc: Generate mocks with mockery
    cmds:
      - mockery

  generate:
    desc: Run go generate with bounded Go concurrency
    env:
      GO_GENERATE_CONCURRENCY: '{{.GO_GENERATE_CONCURRENCY | default (or .GO_JOBS "2")}}'
    cmds:
      - |
        case "$GO_GENERATE_CONCURRENCY" in
          ''|0|*[!0-9]*)
            echo "GO_GENERATE_CONCURRENCY must be a positive integer" >&2
            exit 1
            ;;
        esac

        echo "Running go generate with concurrency=$GO_GENERATE_CONCURRENCY"
        # GOMAXPROCS caps generator runtime CPU use; GOFLAGS caps nested go run builds.
        GOMAXPROCS="$GO_GENERATE_CONCURRENCY" GOFLAGS="${GOFLAGS:-} -p=$GO_GENERATE_CONCURRENCY" go generate ./...

  gqlgen:
    desc: Generate GraphQL server code (models, resolver stubs and the sharded executor)
    cmds:
      # gqlexec reads gqlgen.yml, binds the schema with gqlgen's own binder and
      # writes the models, one executor package per schema file under
      # internal/api/graphql/generated/exec, and one resolver package per schema
      # file under internal/api/graphql/resolver (types, the root composition,
      # and stubs or signature updates in the hand-written resolvers). It
      # restores the previous executor if generation fails, then builds the result. Do not run
      # `go tool gqlgen generate`: it writes gqlgen's single-package executor
      # next to the sharded one and the build breaks.
      - go run ./internal/api/graphql/gqlexec/gen
      # The agent read path's executor and tool bindings are written from the
      # executor above and the persisted operations; see
      # docs/engineering/agent-graphql-reads.md.
      - go run ./internal/api/graphql/agentread/gen

  gqlgen-check:
    desc: Check GraphQL server generated code is up to date
    cmds:
      - task: gqlgen
      - cd internal/api/graphql/gqlexec/internal/e2e && go run github.com/emoss08/trenova/internal/api/graphql/gqlexec/gen
      - |
        # Each schema file gets its own executor package, so a new schema file
        # produces new *untracked* generated files. git diff cannot see those,
        # so check porcelain status instead.
        PATHS="internal/api/graphql/generated internal/api/graphql/gqlmodel internal/api/graphql/resolver internal/api/graphql/gqlexec/internal/e2e internal/api/graphql/agentread internal/modules/agent/app/agentquerytoolservice/graphqlreads_gen.go"
        if [ -z "$(git status --porcelain -- $PATHS)" ]; then
          echo "GraphQL server generated code is up to date"
        else
          echo "GraphQL server generated code is out of date"
          git status --porcelain -- $PATHS
          exit 1
        fi

  gqlschema-diff:
    desc: Report GraphQL schema changes against a git ref (default origin/master); fails on breaking changes
    vars:
      BASE_REF: '{{.BASE_REF | default "origin/master"}}'
      SCHEMA_DIR: internal/api/graphql/schema
    cmds:
      - |
        set -euo pipefail
        BASE_DIR="$(mktemp -d)"
        trap 'rm -rf "$BASE_DIR"' EXIT
        # git archive needs the ref locally; a shallow CI clone will not have it.
        git archive "{{.BASE_REF}}" "{{.SCHEMA_DIR}}" | tar -x -C "$BASE_DIR"
        go run ./internal/api/graphql/schemadiff/cmd -base "$BASE_DIR/{{.SCHEMA_DIR}}" -head "{{.SCHEMA_DIR}}"

  generate-columns:
    desc: Generate Bun column constants from domain entities
    cmds:
      - go generate ./internal/infrastructure/database/colgen/...

  generate-reportcatalog:
    desc: Generate the reporting field catalog from domain entities and reportcatalog.yml
    cmds:
      - go generate ./internal/infrastructure/database/reportcatalog/...

  generate-reportcatalog-check:
    desc: Verify the generated report catalog is up to date
    cmds:
      - |
        go generate ./internal/infrastructure/database/reportcatalog/...
        if ! git diff --quiet -- pkg/reportcatalog/catalog_gen.go; then
          echo "Report catalog is out of date — run 'task generate-reportcatalog' and commit"
          git diff --stat -- pkg/reportcatalog/catalog_gen.go
          exit 1
        fi

  generate-write-coverage:
    desc: Regenerate docs/engineering/agent-write-coverage.md from writecoverage.yml, the schema, the routes and the agent tools
    cmds:
      - go generate ./internal/api/writecoverage/...

  generate-write-coverage-check:
    desc: Verify every write has a decision and the write coverage document is up to date
    dir: internal/api/writecoverage
    cmds:
      - go run -tags nomsgpack ./gen -check -output=../../../../../docs/engineering/agent-write-coverage.md

  generate-seeds:
    desc: Regenerate seed IDs from seed files
    cmds:
      - go generate ./internal/infrastructure/database/seeder/...

  generate-seeds-check:
    desc: Check if seed IDs need regeneration
    cmds:
      - |
        go generate ./internal/infrastructure/database/seeder/...
        if git diff --quiet pkg/seedhelpers/seed_ids_gen.go; then
          echo "Seed IDs are up to date"
        else
          echo "Seed IDs are out of date - run 'task generate-seeds' and commit"
          git diff --stat pkg/seedhelpers/seed_ids_gen.go
          exit 1
        fi

  docker-up:
    desc: Start all services with docker compose, docling-serve included (only the minimal set when LOW_RESOURCE=true)
    cmds:
      - "{{.DOCKER_COMPOSE_LOCAL}} up -d {{.DOCKER_SERVICES}}"

  docker-up-minimal:
    desc: Start only the services the API needs (override with DOCKER_MINIMAL_SERVICES)
    cmds:
      - task: docker-up
        vars:
          DOCKER_SERVICES: "{{.DOCKER_MINIMAL_SERVICES}}"

  docker-down:
    desc: Stop all services
    cmds:
      - "{{.DOCKER_COMPOSE_LOCAL}} down"

  docker-restart:
    desc: Restart all services
    deps: [docker-down, docker-up]

  docker-logs:
    desc: View docker logs
    cmds:
      - "{{.DOCKER_COMPOSE_LOCAL}} logs -f"

  docker-ps:
    desc: List running containers
    cmds:
      - "{{.DOCKER_COMPOSE_LOCAL}} ps"

  docker-build:
    desc: Build docker images
    cmds:
      - "{{.DOCKER_COMPOSE_LOCAL}} build"

  db-migrate:
    desc: Apply pending migrations (trenova-devdb up), then reconcile what migrations cannot
    deps: [build-devdb, build-cli]
    cmds:
      - "{{.DEVDB_PATH}} up -env {{.DB_ENV}}"
      - "{{.CLI_PATH}} db reconcile{{if .env}} --env {{.env}}{{end}}"

  db-seed:
    desc: Seed the database
    deps: [generate-seeds, build-cli]
    cmds:
      - "{{.CLI_PATH}} db seed{{if .env}} --env {{.env}}{{end}}"

  db-seed-volume:
    desc: "Fill the development organization with volume data (shipments=10000 months=12 seed=0)"
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} db seed-volume --shipments {{.shipments | default 10000}} --months {{.months | default 12}} --seed {{.seed | default 0}}"

  db-reset:
    desc: Recreate the database from the migrated template, then reconcile and seed it
    deps: [generate-seeds, build-devdb, build-cli]
    cmds:
      - "{{.DEVDB_PATH}} reset -yes"
      - "{{.CLI_PATH}} db reconcile{{if .env}} --env {{.env}}{{end}}"
      - "{{.CLI_PATH}} db seed{{if .env}} --env {{.env}}{{end}}"

  db-setup:
    desc: Set up a new database (migrate, reconcile, seed)
    cmds:
      - task: db-migrate
      - task: db-seed

  db-status:
    desc: Show migration and seed status
    deps: [build-devdb, build-cli]
    cmds:
      - "{{.DEVDB_PATH}} migrate status"
      - "{{.CLI_PATH}} db seed status"

  db-create-migration:
    desc: "Create a migration in schema/migrations (name=add_holds [kind=tx|notx|repeatable])"
    deps: [build-devdb]
    cmds:
      - |
        if [ -z "{{.name}}" ]; then
          echo "Usage: task db-create-migration name=add_holds [kind=tx|notx|repeatable]"
          exit 1
        fi
        {{.DEVDB_PATH}} migrate create {{.name}} -kind {{.kind | default "tx"}}

  db-lint:
    desc: Lint pending migrations (all=true lints every migration)
    deps: [build-devdb]
    cmds:
      - "{{.DEVDB_PATH}} migrate lint{{if .all}} -all{{end}}"

  db-stamp:
    desc: Regenerate schema/version_gen.go, the schema version the API and worker require
    cmds:
      - go run {{.GO_TAG_FLAG}} ./cmd/devdb migrate stamp

  db-stamp-check:
    desc: Fail when schema/version_gen.go does not match the migrations
    cmds:
      - go run {{.GO_TAG_FLAG}} ./cmd/devdb migrate stamp -check

  db-create-seed:
    desc: Create a new seed file
    deps: [build-cli]
    cmds:
      - |
        if [ -z "{{.name}}" ]; then
          echo "Error: Please provide a seed name"
          echo "Usage: task db-create-seed name=my_seed_name [env=dev|test]"
          exit 1
        fi

        if [ "{{.env}}" = "dev" ]; then
          {{.CLI_PATH}} db create-seed {{.name}} --dev
        elif [ "{{.env}}" = "test" ]; then
          {{.CLI_PATH}} db create-seed {{.name}} --test
        else
          {{.CLI_PATH}} db create-seed {{.name}}
        fi

        go generate ./internal/infrastructure/database/seeder/...

  db-seed-sync:
    desc: Synchronize seed registry
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} db seed-sync"

  db-seed-check:
    desc: Check for orphaned seeds
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} db seed-check"

  db-seed-clean:
    desc: Clean orphaned seed history
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} db seed-clean --force"

  db-seed-watch:
    desc: Watch seed directories for changes
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} db seed-watch"

  redis-flush:
    desc: Flush Redis cache
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} redis flush"

  security-check:
    desc: Run security checks
    cmds:
      - gosec ./...

  audit:
    desc: Audit dependencies for vulnerabilities
    cmds:
      - go list -json -m all | nancy sleuth

  watch:
    desc: Run API with hot reload
    cmds:
      - air {{.AIR_FLAGS}}

  watch-ui:
    desc: Run frontend with hot reload
    cmds:
      - cd {{.CLIENT_DIR}} && pnpm dev

  dev:
    desc: Start development environment
    deps: [docker-up]
    cmds:
      - task --parallel watch watch-ui

  ui-install:
    desc: Install UI dependencies
    cmds:
      - cd {{.CLIENT_DIR}} && pnpm install

  ui-build:
    desc: Build UI for production
    cmds:
      - cd {{.CLIENT_DIR}} && pnpm build

  ui-lint:
    desc: Lint UI code
    cmds:
      - cd {{.CLIENT_DIR}} && pnpm lint

  ui-test:
    desc: Run UI tests
    cmds:
      - cd {{.CLIENT_DIR}} && pnpm test

  install-hooks:
    desc: Install git hooks
    cmds:
      - cp .githooks/* .git/hooks/
      - chmod +x .git/hooks/*

  ci:
    desc: Run CI checks locally
    deps: [lint, vet, test, security-check]

  check:
    desc: Run lint, vet, and test
    deps: [lint, vet, test]

  config-validate:
    desc: Validate configuration
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} config validate"

  config-show:
    desc: Show current configuration
    deps: [build-cli]
    cmds:
      - "{{.CLI_PATH}} config show"

  clean-caches:
    desc: Clean all go caches
    cmds:
      - go clean -cache
      - go clean -modcache
      - go clean -testcache
      - go clean -fuzzcache

  version:
    desc: Show version information
    cmds:
      - 'echo "Trenova Transportation Management System"'
      - 'echo "Version: $(git describe --tags --always --dirty)"'
      - 'echo "Go version: $(go version)"'
      - 'echo "Build date: $(date -u +%Y-%m-%d_%H:%M:%S)"'

  tools:
    desc: Install required tools
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - go install github.com/air-verse/air@latest
      - go install github.com/sonatype-nexus-community/nancy@latest

  reset-all:
    desc: Reset the database (drop, create, migrate, seed) and flush Redis
    cmds:
      - task: db-reset
      - task: redis-flush

  quick-start:
    desc: Quick start for new developers
    deps: [deps, tools, docker-up, db-setup]
    cmds:
      - 'echo "Quick start complete"'
