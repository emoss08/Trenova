schema:
  - internal/api/graphql/schema/*.graphqls

exec:
  layout: follow-schema
  dir: internal/api/graphql/generated
  package: generated
  filename_template: "{name}.generated.go"
  worker_limit: 32

model:
  filename: internal/api/graphql/gqlmodel/models_gen.go
  package: gqlmodel

resolver:
  layout: follow-schema
  dir: internal/api/graphql/resolver
  package: resolver
  filename_template: "{name}.resolvers.go"
  omit_template_comment: true

autobind: []

go_initialisms:
  replace_defaults: false
  initialisms:
    - BCC
    - BOL
    - DOT
    - EDI
    - ELD
    - IFTA
    - MVR
    - NPI
    - PTO
    - SCAC
    - TTL
    - TWIC

omit_gqlgen_version_in_file_notice: true
skip_mod_tidy: true
use_buffer_pooling: true

