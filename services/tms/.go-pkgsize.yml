exceptions:
  services/tms/internal/modules/rating/domain/rateagreement:
    ceiling: 1908
    reason: >-
      Mutual references: RateAgreement holds its rules, accessorials, versions and fuel
      binding, and each of those belongs to the agreement, so the five keel models share a
      package; lanes.go stays because RateAgreementRule carries its unexported lane state.
      Matching and term comparison live in rateagreementmatch and rateagreementcompare.
