budgets:
  foundation: 1500
  default: 3000
foundation:
  - ^shared/
  - ^services/tms/pkg/
  - ^services/tms/internal/modules/[^/]+/domain/
  - ^services/tms/internal/modules/[^/]+/ports/
  - ^services/tms/internal/modules/[^/]+/jobs/[^/]+/[^/]+contract$
exceptions:
  services/tms/internal/modules/operations/domain/shipment:
    ceiling: 3407
    reason: 'Mutual references: Shipment holds its moves, stops, assignments, charges, allocations, comments and commodities as keel relations in both directions, so the aggregate shares one package (closure from Shipment, ShipmentMove, Stop and Assignment is 2,807 lines). The vocabulary (statuses, stop, move and coverage types, rate methods, comment visibility, stages) lives in shipmentvocab, which importers that need no model use instead; everything that only uses the aggregate lives in chargeallocation, commentbody, shipmentrating, shipmenthold, quickfilter, movesplit, pickupwindow, shipmentcoverage and boardgrouping.'
  services/tms/internal/modules/rating/domain/rateagreement:
    ceiling: 1908
    reason: 'Mutual references: RateAgreement holds its rules, accessorials, versions and fuel binding, and each of those belongs to the agreement, so the five keel models share a package; lanes.go stays because RateAgreementRule carries its unexported lane state. Matching and term comparison live in rateagreementmatch and rateagreementcompare.'
