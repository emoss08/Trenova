openapi: 3.1.0
info:
  title: Trenova Control Plane instance API
  version: 0.1.0
  description: |
    The API each instance's operator, and each shared server, calls, served on the instance
    listener. Every request must present a client certificate from the instance CA over TLS 1.3.
    A certificate names exactly one identity in its one URI SAN: an instance
    (`urn:trenova:instance:{id}`) or a shared server (`urn:trenova:shared-server:{id}`, a Trenova
    deployment Trenova staff run for many tenants). There are no other credentials and nothing
    here is reachable without one.

    **Who may call what.** Each operation says which identity may call it (`x-identity`:
    `instance`, `shared_server` or both); any other answers `403 forbidden`. An instance calls
    every operation but the `/v1/shared/` ones. A shared server calls the `/v1/shared/` ones,
    `renewCertificate`, `reportTelemetry` (its machine), `getSecrets` (its own escrowed secrets,
    for the one TMS it runs, and the system email sender) and the email events of its tenants;
    never an instance's spec, status, usage, storage, commands or log bundles. A company's own
    machine for a move to Managed, before its switch, calls only what its import needs (see
    `SpecImport`). Each identity is rate limited on its own.

    **Enrolment.** Staff issue an instance's first certificate and key once, as an enrolment
    bundle, when its infrastructure is ready. The operator's first call should be
    `renewCertificate` with a key it generated itself: the first request made with a new
    certificate retires the instance's older ones, so the enrolment key stops working as soon as
    the operator uses its own. Renew again when a third of the certificate's life is left.

    **Converging.** Poll `getSpec` (with `If-None-Match`) for the desired spec, converge to it, and
    report with `reportStatus`. An instance becomes running once it reports `ready` with the
    desired revision applied.

    **A shared server** converges its tenants to `listSharedTenants` (with `If-None-Match`) and
    reports with `reportSharedStatus`, `reportSharedUsage` and `reportTelemetry`. A tenant becomes
    running once the server reports it `active` with its revision applied, and is removed once
    the server reports it `removed`. Every tenant is one organization of the server's TMS, and its
    `instanceId` names it in every call.

    **The tenant archive.** One format holds one tenant's data, for every use: a customer's data
    export, the nightly backup, a restore, a move to another shared server, a move to a Trenova of
    the customer's own, and the final archive taken before a tenant is removed. A shared server
    keeps its tenants' archives in **its own bucket**, which no other server shares and which
    `getSharedStorage` names with that bucket's own key (an S3 user scoped at the provider to that
    bucket alone):

    - `tenants/<instanceId>/archives/<archiveId>/`: an archive the control plane asked for with an
      `archive` command (`<archiveId>` is the command's `id`);
    - `tenants/<instanceId>/nightly/<YYYY-MM-DD>/`: the nightly archive the server takes of each
      active tenant on its own (the UTC day it was taken), keeping the newest
      `plan.backupRetentionDays` and deleting older ones whole.

    Each archive's prefix holds `manifest.json` (a `TenantArchiveManifest`) and the parts it
    names, at keys relative to the prefix: one object per table under `tables/`, in the order the
    tables can be loaded in (a table after every table it references), and the tenant's documents
    under `documents/`. An archive is **complete only when `manifest.json` exists**: write every
    part first and the manifest last, as one object; an archive without one is a partial write the
    control plane shows as incomplete and never restores, imports or delivers. Never write
    anything else under an archive's prefix, and never write `export.tar` there: the control
    plane assembles a customer's export in its region's vault, never in a server's bucket. An
    archive's SHA-256 (`lastArchive.sha256`,
    a command's `expectSha256`) is the lowercase hex SHA-256 of `manifest.json`'s exact bytes; the
    manifest in turn holds every part's SHA-256, so the one digest proves the whole archive.

    **Nothing is taken on a server's word.** A reported archive (`lastArchive`) is used for nothing
    until the control plane has read it back from the server's bucket: its `location` must be
    exactly `s3://<the server's bucket>/tenants/<instanceId>/archives/<commandId>/`, its
    `manifest.json` must digest to the reported `sha256`, name the tenant's `instanceId` and the
    command's `purpose`, be encrypted under one of the server's own archive keys (or, an `export`,
    be unencrypted with `omitted` listed), and every part it lists must be in the bucket at its
    listed size. A report that fails any of these is recorded as failed with why and never removes,
    moves or exports anything; Trenova staff are alerted. A tenant's removal waits for its final
    archive to be verified and then copied into Trenova's vault.

    **The control plane is the only party that moves an archive between places.** When a tenant
    moves to another shared server, the control plane copies its `move` archive from the old
    server's bucket into the new server's bucket, under the same relative prefix
    (`tenants/<instanceId>/archives/<archiveId>/`), with every part's bytes unchanged and the
    manifest's data key re-wrapped under the new server's current archive key; the new server's
    `import` command names that copy and its `expectSha256` is the copy's (re-wrapped) manifest's
    digest. A final archive is copied into Trenova's vault the same way and deleted from the
    server's bucket once the copy is verified. A server never reads or writes another server's
    bucket.

    **Encryption and the server's archive keys.** Archives of purpose `final` and `move`, and the
    nightly ones, hold everything of the tenant and are encrypted part by part
    (`TenantArchiveManifest.encryption`): each archive gets a fresh random 256-bit data key, the
    data key is wrapped with **the server's current archive key** and written, wrapped, in the
    manifest with the id of the archive key that wrapped it. Columns the TMS encrypts with its install's key
    are decrypted on export and re-encrypted with the destination's key on import, so inside an
    archive they are protected by the archive's own encryption alone. Archives of purpose `export`
    are the customer's readable copy: not encrypted, and without what is a secret rather than the
    customer's data (password hashes, second-factor secrets and recovery codes, API key hashes,
    sessions and tokens, integration credentials, webhook secrets), each left-out table or column
    listed in the manifest's `omitted`. The control plane never decrypts a part: it lists
    archives, reads manifests (plaintext JSON with no tenant data in it but the organization's
    name), verifies sizes and SHA-256 of the stored bytes, copies objects, re-wraps a manifest's
    data key from one archive key to another, and deletes objects. A shared server is given only
    its own archive keys, in `getSharedStorage` (`archiveKeys`): the current one to write with and
    its own older ones to read its own older archives with. Trenova makes a server a new current
    key when it rotates them; a server keeps none of them past its process's memory. A dedicated
    instance importing an archive is given exactly one key, made for that import alone, in its
    served spec's `import.archiveKeys`.

    **Errors** are RFC 9457 problem details with a `code`. `401 unauthenticated` means the
    certificate is unknown, revoked or names an instance or server that is gone; do not retry with
    it. `403 forbidden` means the certificate's identity may not call the operation.
servers:
  - url: /
paths:
  /v1/spec:
    get:
      operationId: getSpec
      x-identity: [instance]
      summary: The desired spec
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 100
          description: The `ETag` of the spec the operator holds.
      responses:
        "200":
          description: The desired spec and its revision.
          headers:
            ETag:
              description: |
                Opaque, quoted: it changes when the revision or what the control plane adds when
                serving (`account`, `support`, `systemEmail`, and an import's archive keys by id)
                changes. Send it back as `If-None-Match`.
              schema:
                type: string
            Cache-Control:
              description: "`no-store`: a spec that carries an import carries its import's archive key."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredSpec"
        "304":
          description: The operator already holds the desired revision.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: |
            The desired spec names no release yet: it was written before staff set its channel; or
            the instance is a company's own machine for a move to Managed whose archive is still
            being copied into its bucket, so there is nothing it may install yet (it must not start
            the TMS, which would bootstrap an empty database). Retry after `Retry-After`; the
            rollout, or the move once its copy is checked, makes a spec to serve.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/status:
    put:
      operationId: reportStatus
      x-identity: [instance]
      summary: Report the instance's status
      description: The operator's latest view of the instance. Send it after converging and at least every minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusReport"
      responses:
        "204":
          description: Recorded.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/usage:
    post:
      operationId: reportUsage
      x-identity: [instance]
      summary: Report usage, and learn what may continue
      description: |
        Hourly meter readings: for a counted meter, what was counted in the hour; for a level
        (document storage), the level at the hour's end. A reading for an hour already reported
        replaces it, so resend from the source of truth. Report at least every 15 minutes: a usage
        window closes and is billed 30 minutes after it ends, and readings that arrive later are
        kept but not billed.

        The answer is the open usage window, whether the subscription bills overage, and every
        meter's quantity in the window so far against its allowance. Stop a metered action while
        its meter is `stopped`. Without an open window (not paid yet, or the subscription has
        ended), every metered action stops.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageReport"
      responses:
        "200":
          description: Recorded; what may continue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAck"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/telemetry:
    post:
      operationId: reportTelemetry
      x-identity: [instance, shared_server]
      summary: Report what the instance is using
      description: |
        What the instance's machine, its parts and its data used, one sample a minute. The
        operator sends the samples it has not yet had accepted, oldest first, at most 30 at a
        time, so a short outage is caught up and a long one loses its oldest minutes. The control
        plane keeps one sample per instance per minute: a repeat for a minute it holds replaces
        it, so sending again after a lost answer is safe. A sample older than 2 hours or more
        than 5 minutes ahead of the control plane's clock is refused. Nothing here bills or
        entitles; it is what the console and the staff admin draw, and what attention rules read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryReport"
      responses:
        "204":
          description: Recorded.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/certificate:
    post:
      operationId: renewCertificate
      x-identity: [instance, shared_server]
      summary: Renew the client certificate
      description: |
        Signs a certificate for a key the operator generated (ECDSA P-256 or P-384, or Ed25519),
        valid for 30 days. The key must differ from the current certificate's. Keep using the
        current certificate until the new one is installed: the first request made with the new
        one retires the old.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewCertificateRequest"
      responses:
        "200":
          description: The new certificate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedCertificate"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/secrets:
    get:
      operationId: getSecrets
      x-identity: [instance, shared_server]
      summary: The instance's escrowed secrets
      description: |
        The secrets that make the instance's data readable, which the control plane keeps in escrow:
        the TMS encryption key, the row-level security scope key and its ID, and the MFA recovery
        code pepper. The answer is the same every time, so an instance that is reinstalled, or
        restored from a backup onto new infrastructure, still reads its data. Fetch them when the
        cluster holds no copy, keep them only in a Secret, and never log them. The first fetch makes
        them. While the spec names a system email sender (`systemEmail`), the answer also carries
        its credential, which the operator fetches when the instance does not hold that
        fingerprint and keeps only in memory.
      responses:
        "200":
          description: The secrets.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSecrets"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/storage:
    get:
      operationId: getStorage
      x-identity: [instance]
      summary: The instance's object storage
      description: |
        The instance's two buckets and a credential for each, scoped to that bucket alone: the
        documents bucket, which the TMS reads and writes, and the backups bucket, which only
        PostgreSQL's backup tool may write. Keep the backups credential where the application's
        pods cannot read it, so a compromised application cannot delete its backups. The answer is
        the same until the provider makes new credentials. Fetch it when the cluster holds no copy,
        keep the credentials only in Secrets, and never log them. `404 not_found` means the instance
        has no object storage of its own (its infrastructure was made by hand): keep documents in
        the chart's own store and take no backups.
      responses:
        "200":
          description: The storage.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceStorage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/commands:
    get:
      operationId: listCommands
      x-identity: [instance]
      summary: The commands waiting for the instance
      description: |
        What the control plane asks the instance to do besides converging to its spec: restart
        Trenova or one part of it, collect a part's recent log lines, or collect a log bundle. The
        instance takes no inbound connections, so it asks: with each status report, or sooner. A
        command is listed until the instance answers it with `completeCommand` or it expires (15
        minutes after it was issued); at most 20, oldest first. Carry each out once, by ID: a
        command listed again was not answered yet, not issued again. A `collect_log_bundle` may
        take longer than that: its outcome is the bundle's, reported with `updateLogBundle`, and
        an answer to an expired command is not found. `emailEvents` says whether system email
        events wait for `listEmailEvents`.
      responses:
        "200":
          description: The commands, oldest first; empty when there are none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/commands/{commandId}:
    put:
      operationId: completeCommand
      x-identity: [instance]
      summary: Answer a command
      description: |
        Says how a command ended. Answering again with the same outcome changes nothing; a command
        that expired or belongs to another instance is not found. For `collect_logs`, `output` is
        the lines, newest last, with every secret the instance holds removed before they leave it.
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandResult"
      responses:
        "204":
          description: Recorded.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/log-bundles:
    post:
      operationId: registerLogBundle
      x-identity: [instance]
      summary: Register a log bundle asked for inside Trenova
      description: |
        An administrator asked for the instance's logs inside Trenova. The operator registers the
        request here before it collects anything, and reports how it goes with `updateLogBundle`.
        Registering the same `requestId` again answers the same `bundleId` with `201`, so an
        operator that restarted mid-way never makes a second bundle. A period longer than 7 days,
        or one whose `until` is not after `since`, is invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogBundleRegistration"
      responses:
        "201":
          description: Registered, or registered before; the bundle's ID either way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogBundleRegistered"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/log-bundles/{bundleId}:
    put:
      operationId: updateLogBundle
      x-identity: [instance]
      summary: Report how a log bundle goes
      description: |
        A bundle goes `requested` → `collecting` → `stored`, `failed` or `refused`, and the control
        plane marks it `expired` when it deletes the zip 30 days after it was stored. The zip is
        at `support/logs/<bundleId>.zip` in the instance's documents bucket, a zip of one
        `<component>.log` per source (lines `timestamp pod container message`, oldest first, with
        every secret the instance holds removed) and a `manifest.json`. Reporting the same status
        again changes nothing; once a bundle has an outcome, a later report is ignored and answered
        `204`. A bundle that is not this instance's is not found.
      parameters:
        - name: bundleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogBundleUpdate"
      responses:
        "204":
          description: Recorded.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/email-events:
    get:
      operationId: listEmailEvents
      x-identity: [instance, shared_server]
      summary: The system email events waiting for the instance
      description: |
        Bounces and spam complaints for email the instance sent through Trenova's sender. The
        provider's webhook is Trenova's, one for every instance, so it posts to the control plane,
        which verifies each delivery and keeps it for the instance the message's
        `trenova_instance` tag names. Fetch them when `listCommands` says `emailEvents`, deliver
        each payload to the TMS, and acknowledge the ones delivered with `ackEmailEvents`; until
        then they are listed again. At most 50, oldest first. Unacknowledged events are deleted 7
        days after they arrived.
      responses:
        "200":
          description: The events, oldest first; empty when none wait.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/email-events/ack:
    post:
      operationId: ackEmailEvents
      x-identity: [instance, shared_server]
      summary: Acknowledge system email events
      description: |
        The events the TMS took, by ID: 1 to 50, each once. They are deleted. An ID that is not
        this instance's, or was acknowledged already, is ignored, so acknowledging again is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailEventAck"
      responses:
        "204":
          description: Acknowledged.
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/shared/tenants:
    get:
      operationId: listSharedTenants
      x-identity: [shared_server]
      summary: The tenants this shared server should hold
      description: |
        Every tenant the calling server should hold or let go of, as it should be: each tenant's
        spec revision, what to do with it (`lifecycle`), its organization, plan, features, add-ons,
        allowances, first administrator and plan page, and the commands to run for it. One
        document for the whole server, ordered by `instanceId`; a server holds at most 1,000
        tenants. Poll it every 15 seconds with `If-None-Match`: `304` while nothing in it changed.
        Converge every tenant listed and report each with `reportSharedStatus`; a tenant the server
        holds that is not listed is not this server's any more: keep its data and say nothing of it
        until a later document lists it.

        A tenant is listed on a server while it is placed there and not yet reported `removed`.
        While Trenova moves a tenant from one shared server to another it is listed on both: the
        server it is moving to lists it from the moment its archive is taken, `suspended`, with an
        `import` command, until the switch; from the switch the server it left lists it `removed`
        until that server reports it gone. A move that fails before the switch lists the tenant
        `removed` on the server it was moving to until that server reports it gone, and the tenant
        stays where it was.

        The document also carries, once for the whole server, the system email sender's
        fingerprint and Trenova support access (`support`): the keys whose assertions every
        tenant on the server accepts.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
            maxLength: 100
          description: The `ETag` of the document the server holds.
      responses:
        "200":
          description: The tenants.
          headers:
            ETag:
              description: |
                Strong and opaque, quoted: a digest of the document's exact bytes, so it changes
                exactly when anything in it changes (a revision, a plan's end, a command, the
                system email sender, the console's address). Send it back as `If-None-Match`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedTenantList"
        "304":
          description: The server already holds this document.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/shared/status:
    put:
      operationId: reportSharedStatus
      x-identity: [shared_server]
      summary: Report the server's status and each tenant's
      description: |
        The server's latest view of itself and of each tenant it holds. Send it after converging and
        at least every minute; a server silent for 10 minutes is an item on Trenova staff's
        attention list. Every report replaces the server's last: its version, readiness, parts and
        message. Each tenant entry replaces that tenant's last; a tenant the report leaves out keeps
        its last entry. Reporting the same thing again changes nothing. An entry for an instance
        that is not a tenant placed on this server (or one already reported `removed`) is refused
        on its own, named in the answer's `refused`, and the rest are recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedStatusReport"
      responses:
        "200":
          description: Recorded; the entries refused, if any.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedReportAck"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/shared/usage:
    post:
      operationId: reportSharedUsage
      x-identity: [shared_server]
      summary: Report the tenants' usage, and learn what each may continue
      description: |
        Hourly meter readings, each for one tenant, exactly as `reportUsage` takes an instance's
        (counted meters: what was counted in the hour; a level, document storage: the level at the
        hour's end; a reading for an hour already reported replaces it). At most 5,000 readings a
        report; send more in several. Report at least every 15 minutes: a usage window closes and is
        billed 30 minutes after it ends, and readings that arrive later are kept but not billed. A
        reading for an instance that is not a tenant placed on this server is not recorded, and that
        instance is named in `refused`; the rest are recorded. A tenant with any reading in the
        report that its plan does not allow (`implausible`) has none of its readings in the report
        recorded, and is named in `refused`; every other tenant's are recorded.

        The answer covers every tenant placed on the server, whether or not the report had readings
        for it, so a server learns what each tenant may do with an empty report: each tenant's open
        usage window, whether usage past its allowances continues and is billed, and every meter's
        quantity so far against its allowance, as `UsageAck` says an instance's. Stop a tenant's
        metered action while its meter is `stopped`. A tenant without an open window (not paid yet,
        or its subscription has ended) has every metered action stopped. The usage window's state is
        given only here, never in the tenants document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedUsageReport"
      responses:
        "200":
          description: Recorded; what each tenant may continue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedUsageAck"
        "400":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/shared/storage:
    get:
      operationId: getSharedStorage
      x-identity: [shared_server]
      summary: The server's own archive bucket and archive keys, and where each commanded archive is in it
      description: |
        The standing target for nightly archives (`nightly`: the server's own archive bucket, key
        and archive keys), and for each `archive`, `restore` and `import` command the tenants
        document lists, where in that bucket the archive is and the credential to reach it
        with: always the server's own bucket and its own access key, which Trenova scopes at the
        provider to that bucket alone (read, write, list, delete and multipart uploads in it). No
        other server's bucket or key is ever named here.

        - An `archive` command's target has `access: write` and the prefix
          `tenants/<instanceId>/archives/<commandId>/`: write every object of the archive under it
          and nowhere else, `manifest.json` last, then report the archive as the tenant's
          `lastArchive` with its `location` (`s3://<bucket>/<prefix>`).
          The `location` reported must be exactly that, or the archive is refused.
        - A `restore` or `import` command's target has `access: read` and the prefix of the archive
          the command's `location` names, in the server's own bucket (for an `import`, the copy
          the control plane made there): read the archive from it, and write nothing.

        Nightly archives need no command: take them with `nightly`. **When to read this:** the
        tenants document carries `storageRevision`, which changes whenever anything here would
        change (the server's bucket or its key recorded or replaced, its archive keys rotated, the
        bucket retired, or a command's target added or removed). Read this once at start, then
        again only when `storageRevision` differs from the one you last read it at, when a bucket
        request is refused, or when a manifest names a key id you do not hold. When `nightly` is
        absent (the server has no bucket recorded, which never happens for a server Trenova has
        opened, or it is retired), stop taking nightly archives and remove the credential and keys
        held for them. Keep the key only in memory or in the server's own sealed secrets, never log
        it. When `sessionToken` and `expiresAt` are absent the key does not expire. Commands that
        cannot be given a target now are listed in `waiting`; read again at the next
        `storageRevision` change or in a minute.
      responses:
        "200":
          description: The archives to write.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedStorage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  responses:
    Invalid:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Nothing by that ID is this instance's.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        `conflict`: the request does not fit what the control plane holds, such as a log bundle
        already in flight for the instance or the day's 10 bundles used. `detail` is a sentence a
        person can read; pass it on, and do not retry the same request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        `forbidden`: the certificate's identity may not call this operation (an instance a shared
        server's, or a shared server an instance's). Do not retry it with this certificate.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: The client certificate is unknown, revoked, or its instance or server is not served.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: Too many requests from this instance.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    CommandList:
      type: object
      required: [commands, emailEvents]
      properties:
        commands:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Command"
        emailEvents:
          type: boolean
          description: |
            Whether system email events (bounces and spam complaints for email the instance sent
            through Trenova's sender) wait for the instance. Fetch them with `listEmailEvents` only
            when this is true.

    EmailEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          maxItems: 50
          description: At most 50, oldest first; empty when none wait.
          items:
            $ref: "#/components/schemas/EmailEvent"

    EmailEvent:
      type: object
      description: |
        A bounce or spam complaint for a message the instance sent through Trenova's sender, as
        the provider's webhook delivered it to the control plane.
      required: [id, provider, payload, receivedAt]
      properties:
        id:
          type: string
          format: uuid
          description: The event's ID, to acknowledge it with.
        instanceId:
          type: string
          format: uuid
          description: |
            The tenant the message was sent for, as its `trenova_instance` tag named it: present
            only when a shared server lists its tenants' events.
        provider:
          type: string
          enum: [Resend, Postmark]
          x-enum-varnames: [EmailEventResend, EmailEventPostmark]
          description: The provider whose webhook delivered it.
        payload:
          type: string
          maxLength: 65536
          description: |
            The provider's webhook body, verbatim (at most 65536 bytes): a Resend `email.bounced`
            or `email.complained` event, or a Postmark `Bounce` or `SpamComplaint` record. The
            control plane verified its signature; the instance parses it as it parses its own
            webhooks. It names the instance's recipients: never log it.
        receivedAt:
          type: string
          format: date-time
          description: When the control plane received it.

    EmailEventAck:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid

    Command:
      type: object
      required: [id, kind, issuedAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [restart, collect_logs, collect_log_bundle]
          x-enum-varnames: [Restart, CollectLogs, CollectLogBundle]
          description: |
            `restart` restarts the named component's workload, or every Trenova workload when no
            component is named. The database is never restarted this way: a restart of everything
            leaves it running, and naming it fails. `collect_logs` returns the named component's
            most recent log lines. `collect_log_bundle` collects every component's kept lines
            between `since` and `until` into a zip in the instance's own object storage, reports
            the bundle's progress with `updateLogBundle`, and answers the command once the bundle
            is stored, has failed or was refused.
        component:
          type: string
          maxLength: 64
          description: A component as the status report names it, such as `api`. Required for `collect_logs`.
        lines:
          type: integer
          minimum: 1
          maximum: 5000
          description: |
            For `collect_logs`, how many of the most recent lines to return. With log keeping on,
            the instance reads them from what it keeps (7 days) across every pod the component
            had; with it off, from the running pods only, at most 500 per container. Either way
            the output stops at 262,144 bytes, keeping the newest lines.
        bundleId:
          type: string
          format: uuid
          description: For `collect_log_bundle`, the bundle the control plane made for it.
        since:
          type: string
          format: date-time
          description: For `collect_log_bundle`, the start of the period, inclusive.
        until:
          type: string
          format: date-time
          description: |
            For `collect_log_bundle`, the end of the period, exclusive; at most 7 days after
            `since`.
        requestedBy:
          $ref: "#/components/schemas/RequestedBy"
        issuedAt:
          type: string
          format: date-time

    RequestedBy:
      type: object
      description: |
        Who asked for a `collect_logs` or `collect_log_bundle` command; required on both. A
        customer's own request (an owner or admin in the console) is carried out as asked. A staff
        request is carried out only while that staff address holds a live support access grant on
        the instance, which the instance checks itself and audits; without one the command is
        answered `refused` and nothing is collected.
      required: [kind, email]
      properties:
        kind:
          type: string
          enum: [customer, staff]
          x-enum-varnames: [RequestedByCustomer, RequestedByStaff]
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 200

    CommandResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [succeeded, failed, refused]
          x-enum-varnames: [CommandResultStatusSucceeded, CommandResultStatusFailed, CommandResultStatusRefused]
          description: |
            `refused` when a staff request found no live support access grant on the instance;
            nothing was collected.
        message:
          type: string
          maxLength: 500
          description: |
            A short explanation, required when failed or refused. One line, no control characters.
        output:
          type: string
          maxLength: 262144
          description: For `collect_logs`, the lines, newest last, with secrets removed.

    LogBundleRegistration:
      type: object
      description: |
        A log bundle an administrator asked for inside Trenova, registered by the operator before
        it collects anything.
      required: [requestId, since, until, requestedBy]
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9_-]{1,100}$'
          description: The request's ID in the TMS. Registering the same ID again answers the same bundle.
        since:
          type: string
          format: date-time
          description: The start of the period, inclusive.
        until:
          type: string
          format: date-time
          description: The end of the period, exclusive; at most 7 days after `since`.
        requestedBy:
          $ref: "#/components/schemas/LogRequester"

    LogRequester:
      type: object
      description: The Trenova administrator who asked.
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        name:
          type: string
          maxLength: 200

    LogBundleRegistered:
      type: object
      required: [bundleId]
      properties:
        bundleId:
          type: string
          format: uuid

    LogBundleUpdate:
      type: object
      description: |
        How a log bundle goes. `collecting` once the operator starts; then one outcome: `stored`
        with `objectKey`, `sizeBytes` and `components`; `failed` or `refused` with `message`.
      required: [status]
      properties:
        status:
          type: string
          enum: [collecting, stored, failed, refused]
          x-enum-varnames: [LogBundleCollecting, LogBundleStored, LogBundleFailed, LogBundleRefused]
        objectKey:
          type: string
          maxLength: 200
          pattern: '^support/logs/[0-9a-f-]{36}\.zip$'
          description: |
            Where the zip is, in the instance's documents bucket: `support/logs/<bundleId>.zip`.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: The zip's size.
        components:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/LogBundleComponent"
        message:
          type: string
          maxLength: 500
          description: |
            Why it failed or was refused, a sentence a person can read. One line, no control
            characters.

    LogBundleComponent:
      type: object
      description: One source in the bundle, as its `<component>.log` file.
      required: [component, lines, truncated]
      properties:
        component:
          type: string
          maxLength: 64
        lines:
          type: integer
          format: int64
          minimum: 0
        truncated:
          type: boolean
          description: |
            Whether the source was cut at a size cap (its own, or the bundle's). A cut keeps the
            newest lines; the manifest says where the kept lines start.

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          $ref: "#/components/schemas/ProblemCode"
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    ProblemCode:
      type: string
      enum: [validation_failed, invalid_request, unauthenticated, forbidden, rate_limited, not_found, conflict, internal,
             unavailable]

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string

    DesiredSpec:
      type: object
      required: [revision, spec]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        spec:
          $ref: "#/components/schemas/InstanceSpec"

    InstanceSpec:
      type: object
      description: |
        What the instance should be. `schemaVersion` changes when a field's meaning changes; an
        operator refuses a version it does not know.
      required: [schemaVersion, lifecycle, kind, instanceId, organizationId, name, hostname, release, plan, placement,
                 addons, features, components, aiProvider, allowances, firstAdministrator]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        kind:
          type: string
          enum: [dedicated, shared]
          x-enum-varnames: [InstanceKindDedicated, InstanceKindShared]
          description: |
            `dedicated`: the instance has a machine of its own. Always `dedicated` here: a shared
            tenant has no operator and its spec is never served by `getSpec`; its server reads it as
            an entry of `listSharedTenants`.
        lifecycle:
          type: string
          enum: [active, suspended, decommissioned]
          description: |
            `active` runs the instance. `suspended` stops its workloads and keeps every byte of its
            data: its subscription lapsed and it resumes when paid again. `decommissioned` means take
            the final backup and report it as `finalBackup` on the status report; the instance is
            torn down after.
        instanceId:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        hostname:
          type: string
          description: Where the instance is served, at the root path.
        customHostname:
          type: string
          description: >
            The customer's own address for the instance, served beside `hostname`, and the address
            links are built with while it is set. Absent when the instance has none, or while its
            own address has fallen back. `hostname` is always served and never changes.
        release:
          $ref: "#/components/schemas/SpecRelease"
        plan:
          $ref: "#/components/schemas/SpecPlan"
        placement:
          $ref: "#/components/schemas/SpecPlacement"
        addons:
          type: array
          description: The add-ons the instance has, by key.
          items:
            type: string
        features:
          type: array
          description: The TMS catalog features to turn on.
          items:
            type: string
        components:
          type: array
          description: |
            Extra workloads to run: `docling` with Document Intelligence, `embedding` (the embedding
            service) with Trenova AI.
          items:
            type: string
        aiProvider:
          type: string
          enum: [trenova, customer]
          description: Whose AI keys the instance uses.
        allowances:
          type: array
          items:
            $ref: "#/components/schemas/SpecAllowance"
        firstAdministrator:
          $ref: "#/components/schemas/SpecFirstAdministrator"
        systemEmail:
          $ref: "#/components/schemas/SpecSystemEmail"
        backup:
          $ref: "#/components/schemas/SpecBackupRequest"
        database:
          $ref: "#/components/schemas/SpecDatabase"
        restore:
          $ref: "#/components/schemas/SpecRestore"
        retiredDatabases:
          type: array
          maxItems: 20
          uniqueItems: true
          description: |
            Databases of this instance that are no longer needed: remove each one's cluster and its
            volumes. An item is a generation, or the empty string for the instance's first database.
            Never the database the instance runs on (`database`), the one being restored
            (`restore.generation`) or the one a restore reads from (`restore.sourceGeneration`):
            the operator removes none of those, says so in the status report's `message`, and
            leaves them be. Removing one that is already gone is done. Backups in the backups
            bucket are not touched.
          items:
            type: string
            pattern: '^(r[0-9a-f]{8})?$'
        addonEndings:
          type: array
          maxItems: 50
          description: |
            The add-ons whose removal is scheduled, each with when it ends. They stay in `addons`
            and their features stay on until then. Absent when none is ending. The operator sends
            the list to the TMS with the features on every tick, an empty list when this is
            absent, so the instance's list is replaced each time.
          items:
            $ref: "#/components/schemas/SpecAddonEnding"
        account:
          $ref: "#/components/schemas/SpecAccount"
        support:
          $ref: "#/components/schemas/SpecSupport"
        import:
          $ref: "#/components/schemas/SpecImport"

    SpecImport:
      type: object
      description: |
        Make this instance's data from a tenant archive instead of bootstrapping it: a company that
        ran on a shared server is moving to a Trenova of its own (docs/decisions/0050-shared-
        trenova.md, "Moving to Managed"). Present only in the spec served to the company's new
        machine before its move switches, at a revision of its own; until the archive is copied and
        checked, `getSpec` answers `503` and the operator installs nothing. The switch's revision,
        above it, leaves `import` out: the operator then converges as for any instance and the
        company's people sign in at `hostname`. The archive was copied by the control plane into
        the instance's own backups bucket under `prefix`, in the tenant archive format
        (`TenantArchiveManifest`), and the release in `release` is the one the shared server ran
        when it took the archive (its manifest's `releaseVersion`), so the schema matches. Until
        the switch this machine's certificate may call only `getSpec`, `reportStatus`,
        `renewCertificate`, `getStorage` (its own buckets, to read the import and write its
        documents) and `getSecrets` (its own escrowed secrets, without the system email sender):
        every other operation answers `403 forbidden`, its usage is not metered (the company's
        server still meters it), and its status reports are recorded on the move alone (`import`,
        `appliedRevision`, `ready`, `version`), never as the company's status. A move that fails or
        is cancelled revokes the machine's certificates at once (`401` from then).

        The operator, before the TMS's first start: reads `manifest.json` under `prefix` with the
        instance's own storage key (`getStorage`), checks its SHA-256 against `expectSha256` and
        every part against the manifest, and runs the TMS's import of the archive into the empty
        database in place of the first-install bootstrap: the organization, its business unit,
        users (the first administrator among them, who signs in with their password as before:
        no invitation is sent, and `firstAdministrator.invite` is absent) and documents come from
        the archive. It then reports `import` with `state: done` and `id`, and converges the rest
        of the spec as usual. The spec served with `import` is `lifecycle: suspended`, the hold a
        lapsed subscription uses: the operator runs the database and the import, reports them, and
        starts nothing that serves a person, so the new address answers nothing anyone can use
        until the switch's revision (`active`, without `import`) arrives. The control plane
        switches once the machine has applied the import's revision with `import.state: done`;
        it does not wait for `ready`. An
        archive that does not match, or an import the TMS refuses, is reported `state: refused`
        with a reason, and the operator leaves the database empty and never bootstraps it.
        Importing again after a restart is idempotent by `id`: an import already done is not run
        again.
      required: [id, bucket, prefix, expectSha256, archiveKeys]
      properties:
        id:
          type: string
          format: uuid
          description: The import, which the status report's `import.id` names.
        archiveKeys:
          type: array
          minItems: 1
          maxItems: 1
          description: |
            Exactly one key: the one Trenova made for this import alone and re-wrapped the copy's
            data key under (the one the copy's manifest's `encryption.keyId` names). No shared
            server's key is ever served here. Served only: added by the control plane each time it
            serves the spec, opened from the keyring's seal, never stored in the spec's revision and
            never in the `ETag`'s digest input in the clear; destroyed once the move settles. Hold
            it only in memory while importing.
          items:
            $ref: "#/components/schemas/ArchiveKey"
        bucket:
          type: string
          description: The instance's own backups bucket, as `getStorage` names it.
        prefix:
          type: string
          maxLength: 200
          description: "`imports/<id>/`: where in the bucket the archive's `manifest.json` and parts are."
        expectSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            The lowercase hex SHA-256 of the copy's `manifest.json` exact bytes (re-wrapped for
            this import, so not the digest the shared server reported).

    ImportStatus:
      type: object
      description: |
        Where the spec's `import` stands, reported with every status report from the moment the
        operator starts it until the spec no longer carries it.
      required: [id, state, at]
      properties:
        id:
          type: string
          format: uuid
          description: The spec's `import.id`.
        state:
          type: string
          enum: [importing, done, refused]
          x-enum-varnames: [ImportImporting, ImportDone, ImportRefused]
          description: |
            `importing` while it runs; `done` once the database holds the archive; `refused` when the
            archive did not match or the TMS refused it, with `reason`. Nothing is retried after a
            refusal: the control plane tears the instance down and the company stays where it was.
        at:
          type: string
          format: date-time
          description: When it reached this state.
        reason:
          type: string
          maxLength: 500
          description: One line a staff member can read; present only when `refused`.

    SpecSupport:
      type: object
      description: |
        Trenova support access: the keys that sign the assertions Trenova staff enter the instance
        with, which instance this is, and the one email domain a grant may name. The control plane
        adds it to every spec when it serves one; it is not part of a stored revision, and the
        spec's `ETag` changes with it, so a rotated key set reaches every operator on its next
        poll. Absent when the control plane has no staff domain configured: support access is off,
        and the operator then sends the instance nothing.

        The operator delivers it to the TMS as it is (`PUT /managed/v1/support-access` with
        `instanceId`, `staffDomain` and `keys`), whenever what the TMS holds differs. Keys rotate
        by overlap: a new key is served beside the old one before it signs, and the old one is
        served for 7 days after it stops, so delivering every set as served never refuses an
        assertion in flight.

        The assertion (a compact JWS, EdDSA, protected header `{alg: EdDSA, kid, typ:
        support-assertion+jwt}` and nothing else) carries exactly `iss` (`trenova-control-plane`),
        `aud` (`instanceId`), `sub` (the staff member's address at `staffDomain`), `name` (at most
        100 characters), `org` (the organization's ID on the instance), `jti` (fresh, 16 to 64 of
        `[A-Za-z0-9_-]`), `iat` and `exp` (at most 60 seconds after `iat`). The staff member's
        browser posts it as the form field `assertion` to `https://<hostname>/api/v1/support/enter`;
        it is never put in a URL.
      required: [instanceId, staffDomain, keys]
      properties:
        instanceId:
          type: string
          description: The instance's ID in the control plane, the audience of every assertion.
        staffDomain:
          type: string
          maxLength: 253
          description: |
            The lower-case email domain of Trenova staff, the only one a grant may name: exactly
            this domain, never a subdomain of it.
        keys:
          type: array
          minItems: 1
          maxItems: 4
          description: |
            The keys whose assertions the instance accepts, newest first, each with its own
            `kid`. The newest signs; the others stopped signing within the last 7 days.
          items:
            $ref: "#/components/schemas/SupportKey"

    SupportKey:
      type: object
      description: An Ed25519 public JSON Web Key (RFC 8037).
      required: [kid, kty, crv, alg, use, x]
      properties:
        kid:
          type: string
          maxLength: 64
          description: The key's ID, which an assertion's header names, such as `cp-20261116-a1b2c3`.
        kty:
          type: string
          description: Always `OKP`.
        crv:
          type: string
          description: Always `Ed25519`.
        alg:
          type: string
          description: Always `EdDSA`.
        use:
          type: string
          description: Always `sig`.
        x:
          type: string
          description: The 32-byte public key, unpadded base64url.

    SpecAddonEnding:
      type: object
      description: An add-on whose removal is scheduled, and when it ends.
      required: [addon, endsAt]
      properties:
        addon:
          type: string
          minLength: 1
          maxLength: 40
          description: The add-on's code, as the TMS catalog names it (`ACC`, `AI`).
        endsAt:
          type: string
          format: date-time
          description: When the add-on leaves the plan.

    SpecAccount:
      type: object
      description: |
        Where the customer manages the instance in the Trenova console. The control plane adds it
        to every spec when it serves one, from where its console is served; it is not part of a
        stored revision. The spec's `ETag` changes with it as well as with the revision, so a
        console that moves reaches every operator. An operator that receives a spec without it
        sends the TMS no plan URL, and the TMS keeps the one it holds.
      required: [planUrl, finalBackupDays]
      properties:
        planUrl:
          type: string
          maxLength: 2048
          description: |
            The absolute http or https address of the instance's plan page in the console, where
            add-ons are bought. The operator passes it to the TMS with the feature list; the TMS
            links to it from its own plan page and refuses anything but an absolute http or https
            address with a host and no user information.
        supportUrl:
          type: string
          maxLength: 2048
          description: |
            The absolute http or https address of the console's support page, where the
            organization's support requests are listed. The operator renders it into the chart's
            `managed.supportUrl`, which the TMS serves its people as "Your support requests". An
            operator that does not know it, or a spec without it, leaves the link out.
        newSupportRequestUrl:
          type: string
          maxLength: 2048
          description: |
            The absolute http or https address of the console's new support request form, with
            this instance chosen and the request marked as opened from Trenova
            (`{console}/support/new?from=trenova&instance={instanceId}`). The operator renders it
            into the chart's `managed.newSupportRequestUrl`; the TMS adds `page` (the path of the
            page the person was on, never a record's ID) when it opens it as "Contact Trenova
            support". An operator that does not know it, or a spec without it, leaves the link out.
        finalBackupDays:
          type: integer
          format: int32
          minimum: 1
          description: |
            How many days the instance's final backup is kept after the instance is taken down.
            The operator passes it to the TMS, which says it wherever it tells people what happens
            when a plan ends.
        endsAt:
          type: string
          format: date-time
          description: |
            When the instance's plan ends, present exactly while its owner has set it to end: the
            end of the period already paid for. The instance runs as it is until then; at that
            time it is decommissioned (final backup, then teardown). Trenova warns its
            administrators. Absent once the plan is kept; the `ETag` changes either way.

    SpecSystemEmail:
      type: object
      description: |
        The sender Trenova supplies for the instance's system email (invitations, password resets,
        notifications). Absent when Trenova supplies none: the operator then removes any the
        instance holds. The credential itself is never in the spec; the operator fetches it from
        `getSecrets` when the instance does not already hold one with this fingerprint.
      required: [fingerprint]
      properties:
        fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            The lowercase hex SHA-256 of the credential, the same value the instance reports:
            SHA-256 over `trenova.system-email.v1`, `provider`, `fromAddress`, `fromName` and
            `apiKey`, joined by a single line feed (`\n`), in that order. A new credential has a
            new fingerprint, which is how a rotation reaches the instance.

    SpecBackupRequest:
      type: object
      description: |
        Take one base backup now, before a version update, unless one has completed for this `id`.
        Report how it goes as `backup.request` on the status report. A later revision carries the
        same request until another replaces it.
      required: [id, requestedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[0-9a-f-]{1,64}$'
        requestedAt:
          type: string
          format: date-time

    SpecDatabase:
      type: object
      description: |
        The database the instance runs on, once a restore has replaced its first one: `generation`
        names it, and it was restored from `sourceGeneration`'s backups (empty for the first
        database) to `targetTime`. Absent while the instance runs on its first database.
        Naming a database the cluster already holds, stopped, means go back to it: start it, wait
        until it accepts connections, move the instance to it, then stop the one it ran on. A
        revision without `database` on an instance that has other databases means go back to the
        first one, the same way. Whichever is named, every other database of the instance except
        the one being restored is stopped, on every reconcile, not only after a switch. A
        `generation` the cluster does not hold, and that `restore` does not name, is refused: the
        instance stays as it is and the status report's `message` says why.
      required: [generation, sourceGeneration, targetTime]
      properties:
        generation:
          type: string
          pattern: '^r[0-9a-f]{8}$'
        sourceGeneration:
          type: string
          pattern: '^(r[0-9a-f]{8})?$'
        targetTime:
          type: string
          format: date-time

    SpecRestore:
      type: object
      description: |
        Restore the database to `targetTime` from the backups of the database the instance runs on
        (`sourceGeneration`), into a new database named by `generation`, beside the live one. The
        live database keeps serving and is never touched. Report how it goes as `restore` on the
        status report. A later revision switches to it by naming it as `database`; one without
        `restore` or a matching `database` means remove the new database.
      required: [id, generation, sourceGeneration, targetTime]
      properties:
        id:
          type: string
          format: uuid
        generation:
          type: string
          pattern: '^r[0-9a-f]{8}$'
        sourceGeneration:
          type: string
          pattern: '^(r[0-9a-f]{8})?$'
        targetTime:
          type: string
          format: date-time

    SpecFirstAdministrator:
      type: object
      description: |
        The instance's first organization and its administrator: the person who ordered it, and
        their organization's name, as they were when it was ordered. The first install creates
        them, with no usable password; the administrator chooses one through `invite`. Later
        revisions carry the same values, so they never conflict with what was installed.
      required: [name, email, organizationName]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        organizationName:
          type: string
          minLength: 1
          maxLength: 100
        invite:
          $ref: "#/components/schemas/SpecAdministratorInvite"

    SpecAdministratorInvite:
      type: object
      description: |
        A one-time link for the first administrator to choose their password. The control plane
        holds the token and emails the link, `https://<hostname>/auth/reset?token=<token>&purpose=invite`;
        the instance holds only its SHA-256, as an account invite for the administrator, and
        reports it as `administrator.inviteTokenSha256` once it does. A new invite replaces the
        one before. Absent until the instance first runs, and once the administrator is set up.
      required: [tokenSha256, expiresAt]
      properties:
        tokenSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The lowercase hex SHA-256 of the token's text.
        expiresAt:
          type: string
          format: date-time
          description: When the link stops working; at most 7 days after it was made.

    SpecRelease:
      type: object
      description: |
        The Trenova release the instance runs. Staff point each channel at a version; every spec
        on the channel names it, and a new version reaches instances as a new spec revision.
      required: [channel, version]
      properties:
        channel:
          type: string
          enum: [stable]
        version:
          type: string
          maxLength: 64
          pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          description: |
            The exact release to run, as its Helm chart (`oci://ghcr.io/emoss08/charts/trenova`) and
            images are tagged, without a leading "v", such as `0.11.0`.

    SpecPlan:
      type: object
      required: [key, name, vcpu, memoryGiB, diskGiB, backup, backupRetentionDays, support]
      properties:
        key:
          type: string
        name:
          type: string
        vcpu:
          type: integer
          format: int64
        memoryGiB:
          type: integer
          format: int64
        diskGiB:
          type: integer
          format: int64
        backup:
          type: string
          enum: [nightly, point_in_time]
        backupRetentionDays:
          type: integer
          format: int64
        uptimeSlaBp:
          type: integer
          format: int64
          description: Uptime promised, in basis points (9950 is 99.5%). Absent when there is no SLA.
        support:
          type: string
          enum: [email, business_hours, priority, contracted]

    SpecPlacement:
      type: object
      required: [provider, region, location, storageLocation, country, runtime]
      properties:
        provider:
          type: string
        region:
          type: string
        location:
          type: string
          description: The provider's code for where the instance runs.
        storageLocation:
          type: string
          description: The provider's code for where documents and backups are kept.
        country:
          type: string
        runtime:
          type: string
          enum: [single_node]

    SpecAllowance:
      type: object
      required: [meter, unit, quantity, hardCap]
      properties:
        meter:
          type: string
        appMeter:
          type: string
          description: The TMS meter this allowance limits; absent for an instance counter.
        unit:
          type: string
          enum: [count, bytes]
        quantity:
          type: integer
          format: int64
        hardCap:
          type: boolean
          description: Whether the metered action stops at the allowance.
        ceiling:
          type: integer
          format: int64
          description: |
            Where the metered action stops whatever the overage setting (at or above the
            allowance); absent when there is none. Nothing past it is billed.
        alwaysBilled:
          type: boolean
          description: |
            Usage past the allowance is billed without the customer opting in to overage, so the
            action continues past the allowance (up to the ceiling); absent when overage is the
            customer's choice.

    StatusReport:
      type: object
      required: [ready, components]
      properties:
        appliedRevision:
          type: integer
          format: int64
          minimum: 1
          description: The spec revision the instance runs; absent before the first converge.
        version:
          type: string
          maxLength: 64
          description: The Trenova release running.
        ready:
          type: boolean
          description: Whether every component is ready and the post-deploy checks pass.
        components:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ComponentStatus"
        message:
          type: string
          maxLength: 500
          description: A short explanation when not ready.
        finalBackup:
          $ref: "#/components/schemas/FinalBackup"
        administrator:
          $ref: "#/components/schemas/AdministratorStatus"
        features:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 80
            pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          description: |
            The TMS catalog features the instance holds now, as it reads them, so staff can see
            whether it has taken up its spec's `features`. Report the whole list each time; left
            out, the last list reported stands. Only staff see it, and it entitles and bills
            nothing: the spec says what the instance should hold.
        backup:
          $ref: "#/components/schemas/BackupHealth"
        restore:
          $ref: "#/components/schemas/RestoreProgress"
        operator:
          $ref: "#/components/schemas/OperatorStatus"
        supportGrants:
          type: array
          maxItems: 100
          description: |
            Every live Trenova support access grant on the instance, across its organizations, as
            the TMS lists them now: the complete list, at most 100. The control plane replaces what
            it holds for the instance with exactly this list, in the transaction that records the
            report, so an empty list says no grant is live. Left out (an operator that does not
            read them, or could not this time), the last list reported stands. Staff see the list,
            and the control plane signs an assertion to enter only for a grant on it that names
            the staff member and has not ended; the instance checks the grant again on entry, so a
            grant revoked since the last report is refused there.
          items:
            $ref: "#/components/schemas/SupportGrant"
        systemEmailFingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            The fingerprint of the system email sender the instance holds now, as the TMS reports it
            (`GET /managed/v1/system-email`), the same value as the spec's `systemEmail.fingerprint`
            once the instance has taken it up. Left out when the instance holds none or the operator
            could not read it this time; either way the instance is not counted as holding the
            current sender. Each report replaces the last: nothing reported is stored as nothing.
        databases:
          type: array
          maxItems: 20
          description: |
            The databases the cluster holds for this instance, the live one first. The operator
            sends the list with the first status report after it starts and whenever it differs
            from the last one the control plane accepted; left out, the control plane keeps the
            list it has.
          items:
            $ref: "#/components/schemas/DatabaseState"
        refused:
          $ref: "#/components/schemas/RefusedRevision"
        import:
          $ref: "#/components/schemas/ImportStatus"
        capabilities:
          type: array
          description: >
            What this operator can do that an older one could not, so the control plane offers a
            feature only to an instance that can carry it out. An operator sends every capability
            it has on every report; one that predates this field sends none.
          items:
            type: string
            enum: [custom_hostname]
            x-enum-varnames: [CapabilityCustomHostname]

    SupportGrant:
      type: object
      description: One live support access grant, as the TMS holds it.
      required: [id, organizationId, organizationName, staffEmail, scope, expiresAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          description: The grant's ID on the instance. Each grant is listed once.
        organizationId:
          type: string
          pattern: '^org_[0-9A-HJKMNP-TV-Z]{26}$'
          description: The organization's ID on the instance, which an assertion under this grant names as `org`.
        organizationName:
          type: string
          minLength: 1
          maxLength: 200
          description: The organization's name, which staff are shown.
        staffEmail:
          type: string
          maxLength: 254
          description: The staff member's address the grant names, lower-case ASCII, as the TMS stores it.
        scope:
          type: string
          enum: [read_only, full]
          description: "`read_only` lets support read only; `full` acts as an administrator, less what the TMS keeps from support."
        expiresAt:
          type: string
          format: date-time
          description: When the grant ends.

    OperatorStatus:
      type: object
      description: |
        The operator itself: the release it runs and its move to the release the spec names. The
        operator follows the instance's release and moves first: it brings Trenova to a new release
        only once it runs that release itself, so `upgrade` says why `version` lags the spec.
      required: [version]
      properties:
        version:
          type: string
          maxLength: 64
          description: The release the operator runs, such as `0.12.2`.
        upgrade:
          $ref: "#/components/schemas/OperatorUpgrade"
        message:
          type: string
          maxLength: 500
          description: |
            A short explanation, one line: why an upgrade failed, or a node manifest that pins the
            operator's version.

    OperatorUpgrade:
      type: object
      description: |
        The operator's move to the spec's release, present while it is under way or after it failed.
        `upgrading` while the new operator is installed and takes over. `failed` once it could not
        be (a version the registry does not have, or one that never became ready): the operator
        stays on its version, Trenova stays on its own, and neither is tried again until the spec
        names another release.
      required: [version, phase]
      properties:
        version:
          type: string
          maxLength: 64
          description: The release the operator is moving to.
        phase:
          type: string
          enum: [upgrading, failed]

    UsageReport:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/UsageReading"

    UsageReading:
      type: object
      required: [meter, hour, quantity]
      properties:
        meter:
          type: string
          maxLength: 40
          description: A catalog meter's key, such as `shipments`.
        hour:
          type: string
          format: date-time
          description: The start of the hour, on the hour, from 35 days ago to the current hour.
        quantity:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: In the meter's unit (a count or bytes), at most 10^15.

    UsageAck:
      type: object
      required: [overage, meters]
      properties:
        window:
          $ref: "#/components/schemas/UsageWindow"
        overage:
          type: boolean
          description: |
            Whether usage beyond an allowance without a hard cap continues (up to its ceiling) and is
            billed: the customer opted in to overage, or the plan bills usage past its allowances
            always.
        meters:
          type: array
          items:
            $ref: "#/components/schemas/MeterUsage"

    UsageWindow:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time

    MeterUsage:
      type: object
      required: [meter, unit, quantity, allowance, hardCap, stopped]
      properties:
        meter:
          type: string
        unit:
          type: string
          enum: [count, bytes]
        quantity:
          type: integer
          format: int64
          description: The window's quantity so far.
        allowance:
          type: integer
          format: int64
          description: The window's allowance; 0 when the plan and add-ons include none.
        hardCap:
          type: boolean
        ceiling:
          type: integer
          format: int64
          description: Where the metered action stops whatever the overage setting; absent when there is none.
        stopped:
          type: boolean
          description: Whether the metered action must stop.

    TelemetryReport:
      type: object
      required: [samples]
      properties:
        samples:
          type: array
          minItems: 1
          maxItems: 30
          description: Oldest first, one per minute, no minute twice.
          items:
            $ref: "#/components/schemas/TelemetrySample"

    TelemetrySample:
      type: object
      description: |
        One minute of the instance. Every figure is what was read at `at`, not an average, except
        `cpuMillicores`, which is the rate over the reading's own window as the cluster's metrics
        report it. A figure the operator could not read is left out, never sent as zero.
      required: [at, parts]
      properties:
        at:
          type: string
          format: date-time
          description: The minute the sample is for, in UTC, with zero seconds.
        machine:
          $ref: "#/components/schemas/MachineUsage"
        parts:
          type: array
          maxItems: 50
          description: |
            One entry per part of Trenova the instance runs (the same names as the status
            report's `components`), each once.
          items:
            $ref: "#/components/schemas/PartUsage"
        data:
          $ref: "#/components/schemas/DataUsage"

    MachineUsage:
      type: object
      description: The machine the instance runs on, as a whole.
      properties:
        cpuMillicores:
          type: integer
          format: int64
          minimum: 0
          description: Processor in use, in thousandths of a core.
        cpuCapacityMillicores:
          type: integer
          format: int64
          minimum: 1
          description: Processor the machine has to give.
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
          description: Memory in use (working set).
        memoryCapacityBytes:
          type: integer
          format: int64
          minimum: 1
        diskBytes:
          type: integer
          format: int64
          minimum: 0
          description: Disk in use on the volume that holds the instance's data.
        diskCapacityBytes:
          type: integer
          format: int64
          minimum: 1

    PartUsage:
      type: object
      required: [name, ready]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9-]*$"
          description: The part's name, as in the status report's `components`.
        ready:
          type: boolean
          description: Whether every copy of the part that should run is ready.
        replicas:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: Copies that should run.
        readyReplicas:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        restarts:
          type: integer
          format: int64
          minimum: 0
          description: |
            Restarts of the part's containers since they were created, summed over its copies:
            a counter, so the difference between two samples is the restarts in between, and a
            lower value than the last means the part was replaced. It counts a container
            starting again in place (a crash); a copy that is replaced starts from zero, so see
            `startedAt` for every time the part started again.
        startedAt:
          type: string
          format: date-time
          description: |
            When the newest of the part's running containers started. It moves forward whenever
            the part starts again, however that came about: a container restarting in place, a
            restart that was asked for, an update, a copy moved to another machine. Absent while
            none of its containers runs, and from an operator that cannot read the part's copies.
        cpuMillicores:
          type: integer
          format: int64
          minimum: 0
        cpuLimitMillicores:
          type: integer
          format: int64
          minimum: 1
          description: The most the part may use; absent when it has no limit.
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
        memoryLimitBytes:
          type: integer
          format: int64
          minimum: 1
        version:
          type: string
          maxLength: 128
          description: The image tag the part runs, without its registry or name.

    DataUsage:
      type: object
      description: How much the instance's data takes, each where it could be read.
      properties:
        databaseBytes:
          type: integer
          format: int64
          minimum: 0
          description: The size of the instance's database.
        documentsBytes:
          type: integer
          format: int64
          minimum: 0
          description: Documents and files stored.
        searchBytes:
          type: integer
          format: int64
          minimum: 0
          description: The search index.
        logsBytes:
          type: integer
          format: int64
          minimum: 0
          description: Logs kept on the instance.

    AdministratorStatus:
      type: object
      description: |
        Where the first administrator's handoff stands on the instance, reported once the spec has
        an `invite` and the instance answered for it.
      required: [setUp]
      properties:
        inviteTokenSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The invite the instance holds and will redeem; absent when it holds none that works.
        setUp:
          type: boolean
          description: Whether the first administrator has chosen a password or signed in.

    FinalBackup:
      type: object
      description: |
        The backup taken after the instance applied a `decommissioned` spec, reported with that
        revision as `appliedRevision`. It is kept for the control plane's final backup retention
        (`account.finalBackupDays`) after the instance is torn down.
      required: [id, completedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: The backup's identifier in the instance's backup store.
        completedAt:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: |
            The backup's size, only when the operator knows it. The backup tool the operator
            uses does not report one, so it is left out rather than sent as zero; staff are then
            told nothing about its size.

    BackupHealth:
      type: object
      description: |
        The instance's backups as the operator reads them from the cluster: the last base backup,
        how far back the backups reach, and whether WAL archiving works. Report it with every status
        report once the instance has backup storage; left out, staff see the last one reported.
      required: [walArchiving]
      properties:
        lastBaseBackupAt:
          type: string
          format: date-time
          description: When the newest completed base backup finished.
        lastBaseBackupId:
          type: string
          maxLength: 200
        firstRecoverabilityPoint:
          type: string
          format: date-time
          description: The earliest time the database can be restored to.
        walArchiving:
          type: string
          enum: [healthy, failing, unknown]
          description: Whether WAL segments reach the backups bucket.
        lastArchivedWalAt:
          type: string
          format: date-time
          description: When the newest WAL segment was archived; the archiving lag is now minus this.
        message:
          type: string
          maxLength: 500
          description: Why archiving or the last backup failed, in one line.
        request:
          $ref: "#/components/schemas/BackupRequestStatus"
        backups:
          type: array
          maxItems: 100
          description: |
            The base backups the cluster knows of, newest first: the ones its retention still keeps,
            and any that is running or failed in the last 7 days. The operator sends the list with
            the first status report after it starts and whenever the list differs from the last one
            the control plane accepted; left out, the control plane keeps the list it has. A backup
            that is no longer in a newer list has been removed by retention.
          items:
            $ref: "#/components/schemas/BackupEntry"

    BackupRequestStatus:
      type: object
      description: How the base backup the spec's `backup` asks for goes, by its `id`.
      required: [id, phase]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        phase:
          type: string
          enum: [running, completed, failed]
        backupId:
          type: string
          maxLength: 200
        completedAt:
          type: string
          format: date-time
        message:
          type: string
          maxLength: 500

    BackupEntry:
      type: object
      description: One base backup of the instance's database.
      required: [id, phase, startedAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          description: The backup's identifier in the instance's backup store.
        phase:
          type: string
          enum: [running, completed, failed]
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          description: When it finished; absent while it runs.
        origin:
          type: string
          enum: [scheduled, requested, final]
          description: |
            Why it was taken: on the daily schedule, because a spec's `backup` asked for it, or as
            the final backup of a decommissioned instance.
        requestId:
          type: string
          maxLength: 64
          description: The `id` of the spec's `backup` that asked for it, for a requested backup.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: The backup's size, only when the operator knows it; never sent as zero.
        message:
          type: string
          maxLength: 500
          description: Why it failed, in one line.

    RestoreProgress:
      type: object
      description: |
        How the restore the spec's `restore` asks for goes: `preparing` while the new database is
        restored, `ready` once it accepts connections at `recoveredTo`, `failed` if it cannot be, and
        `switched` once the instance runs on it after a revision names it as `database`.
      required: [id, phase]
      properties:
        id:
          type: string
          format: uuid
        phase:
          type: string
          enum: [preparing, ready, failed, switched]
        recoveredTo:
          type: string
          format: date-time
        message:
          type: string
          maxLength: 500

    DatabaseState:
      type: object
      description: One database of the instance, as the cluster holds it.
      required: [generation, state, live]
      properties:
        generation:
          type: string
          pattern: '^(r[0-9a-f]{8})?$'
          description: Its generation; the empty string is the instance's first database.
        state:
          type: string
          enum: [running, starting, stopped, restoring, removing]
          description: |
            `running` accepts connections, `starting` should run and is not accepting connections
            yet, `stopped` is kept with its volumes and no server, `restoring` is a restore's copy
            still being prepared, `removing` is being deleted.
        live:
          type: boolean
          description: Whether the instance's application is connected to this one.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: The size of its volumes, only when the operator can read it.
        createdAt:
          type: string
          format: date-time

    RefusedRevision:
      type: object
      description: |
        The newest revision the operator has read and will not apply as it is written, and why.
        The instance stays as it was. Sent with every status report while it stands, and left
        out once a later revision has been applied or the cause is gone. It is how the control
        plane learns that something it asked for will never happen, instead of waiting for it.
      required: [revision, code, reason]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: The revision that was refused.
        code:
          type: string
          enum: [database_not_held, first_database_removed, invalid]
          description: |
            `database_not_held`: `database` names a generation the cluster does not hold and
            `restore` does not name. `first_database_removed`: the revision has no `database`
            and the instance's first database has been removed. `invalid`: the revision cannot
            be turned into what to run, for any other reason.
        reason:
          type: string
          maxLength: 500
          description: One line a staff member can read.

    InstanceStorage:
      type: object
      required: [endpoint, region, backupsPrefix, documents, backups]
      properties:
        endpoint:
          type: string
          description: The S3 API's URL, such as `https://s3.bhs.io.cloud.ovh.net`.
        region:
          type: string
          description: The region requests are signed for, such as `bhs`.
        backupsPrefix:
          type: string
          description: Where in the backups bucket the backup tool keeps base backups and WAL.
        documents:
          $ref: "#/components/schemas/StorageBucket"
        backups:
          $ref: "#/components/schemas/StorageBucket"

    StorageBucket:
      type: object
      required: [bucket, accessKeyId, secretAccessKey]
      properties:
        bucket:
          type: string
        accessKeyId:
          type: string
        secretAccessKey:
          type: string

    ComponentStatus:
      type: object
      required: [name, ready]
      properties:
        name:
          type: string
          maxLength: 64
        ready:
          type: boolean
        message:
          type: string
          maxLength: 200

    RenewCertificateRequest:
      type: object
      required: [csr]
      properties:
        csr:
          type: string
          maxLength: 8192
          description: A PEM certificate request, signed by the new key.

    InstanceSecrets:
      type: object
      required: [encryptionKey, rlsScopeKeyId, rlsScopeKey, mfaRecoveryCodePepper]
      properties:
        encryptionKey:
          type: string
          minLength: 32
          maxLength: 128
          description: The TMS's `security.encryption.key`.
        rlsScopeKeyId:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[A-Za-z0-9_-]{1,32}$"
          description: The TMS's `database.rls.scopeKeyId`.
        rlsScopeKey:
          type: string
          minLength: 44
          maxLength: 128
          description: The TMS's `database.rls.scopeKey`, standard base64 of at least 32 random bytes.
        mfaRecoveryCodePepper:
          type: string
          minLength: 32
          maxLength: 128
          description: The TMS's `security.mfa.recoveryCodePepper`.
        systemEmail:
          $ref: "#/components/schemas/SystemEmailCredential"

    SystemEmailCredential:
      type: object
      description: |
        The credential of the sender Trenova supplies for the instance's system email, present
        while the spec names one (`systemEmail`). Unlike the keys above it may change: a rotation
        is a new credential and a new fingerprint in the spec. Keep it only in memory and never
        log it; the instance stores it encrypted and never returns it.
      required: [provider, apiKey, fromAddress, fromName]
      properties:
        provider:
          type: string
          enum: [Resend, Postmark]
          description: The email provider the credential is for.
        apiKey:
          type: string
          minLength: 20
          maxLength: 512
          pattern: "^[\\x21-\\x7E]+$"
          description: The provider API key (a Postmark server token or a Resend API key).
        fromAddress:
          type: string
          format: email
          maxLength: 254
          description: The address system email is sent from, on a domain Trenova verified with the provider.
        fromName:
          type: string
          minLength: 1
          maxLength: 40
          description: |
            The brand in the display name. The instance sends as `<organization name> via <fromName>`.

    IssuedCertificate:
      type: object
      required: [certificate, caBundle, notAfter]
      properties:
        certificate:
          type: string
          description: The PEM certificate.
        caBundle:
          type: string
          description: Every CA certificate the control plane trusts, as PEM.
        notAfter:
          type: string
          format: date-time

    SharedTenantList:
      type: object
      description: |
        Every tenant placed on the server and not yet reported `removed`, ordered by `instanceId`.
      required: [tenants, storageRevision]
      properties:
        tenants:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SharedTenant"
        storageRevision:
          type: string
          maxLength: 64
          description: |
            Opaque: changes exactly when `getSharedStorage` would answer differently (the server's
            bucket or its key recorded, replaced or retired, its archive keys rotated, an archive
            command's target added or removed). Read `getSharedStorage` again when it differs from
            the value you last read storage at; not on every poll.
        systemEmail:
          $ref: "#/components/schemas/SpecSystemEmail"
        support:
          $ref: "#/components/schemas/SharedSupport"

    SharedSupport:
      type: object
      description: |
        Trenova support access for every tenant on the server: the keys that sign the assertions
        Trenova staff enter a tenant with, and the one email domain a grant may name. The same keys
        and rotation as a dedicated instance's `SpecSupport`, served once for the whole server.
        Absent when the control plane has no staff domain configured: support access is off, and
        the server then refuses every assertion.

        A grant is made in the TMS by an administrator of one tenant, for that tenant's
        organization alone, and is reported in that tenant's `supportGrants`. The assertion is the
        one `SpecSupport` describes, with `aud` the **tenant's** `instanceId` and `org` the
        tenant's organization on the server. The TMS accepts it only when every one of these holds:
        the signature verifies under a key listed here with the header's `kid`; `iss` is
        `trenova-control-plane`; `iat` and `exp` are no more than 60 seconds apart and `exp` has not
        passed; `jti` was never used before on the server; `aud` is the `instanceId` of a tenant the
        server holds `active`, **and that tenant's organization is `org`** (the pair names one
        tenant: an assertion for one tenant never opens another on the same server, whatever `org`
        it names); and a live grant of exactly that organization names `sub`. The session it opens
        is in that organization alone. The staff member's browser posts it to
        `https://<the server's hostname>/api/v1/support/enter`.
      required: [staffDomain, keys]
      properties:
        staffDomain:
          type: string
          maxLength: 253
          description: |
            The lower-case email domain of Trenova staff, the only one a grant may name: exactly this
            domain, never a subdomain of it.
        keys:
          type: array
          minItems: 1
          maxItems: 4
          description: The keys whose assertions are accepted, newest first; the newest signs.
          items:
            $ref: "#/components/schemas/SupportKey"

    SharedTenant:
      type: object
      description: |
        One tenant as it should be: one organization (and its one business unit) of the server's
        TMS, made the first time the tenant is listed with what `firstAdministrator` names, and
        known by `instanceId` from then on. Every field is the tenant's desired state at `revision`;
        a later revision may change any of them but `instanceId`, `organizationName` and
        `firstAdministrator`'s person.
      required: [instanceId, revision, lifecycle, organizationName, plan, addons, features, aiProvider,
                 allowances, firstAdministrator, account, commands]
      properties:
        instanceId:
          type: string
          format: uuid
          description: The tenant's instance in the control plane. Every report about the tenant names it.
        revision:
          type: integer
          format: int64
          minimum: 1
          description: |
            The tenant's spec revision. Report it as the tenant's `appliedRevision` once the tenant
            holds everything this entry says.
        lifecycle:
          type: string
          enum: [active, suspended, removed]
          x-enum-varnames: [SharedTenantActive, SharedTenantSuspended, SharedTenantRemoved]
          description: |
            `active`: the tenant's people sign in and work, with the features listed. `suspended`:
            keep every byte of the tenant's data, sign its people out, refuse its sign-ins with the
            suspended page that points at the console, refuse its API calls and run none of its
            background work; it is suspended while its subscription lapses, while Trenova staff hold
            it, while it is restored or moved, or while its server takes its final archive.
            `removed`: the tenant is not this server's any more (its final archive is taken, it moved
            to another server, or a move to this server failed): delete the tenant's data and
            documents from this server, then report it `removed`. Archives in the bucket are
            Trenova's to delete: never delete them for a removal.
        organizationName:
          type: string
          minLength: 1
          maxLength: 100
          description: The tenant's organization as it was named when it was ordered; the first install names it so.
        plan:
          $ref: "#/components/schemas/SharedTenantPlan"
        addons:
          type: array
          maxItems: 50
          description: The add-ons the tenant has, by code.
          items:
            type: string
        features:
          type: array
          maxItems: 200
          description: The TMS catalog features the tenant's organization has; every other is off for it.
          items:
            type: string
        addonEndings:
          type: array
          maxItems: 50
          description: |
            The add-ons whose removal is scheduled, each with when it ends; they stay in `addons` and
            their features stay on until then. Absent when none is ending: the tenant's list is then
            empty.
          items:
            $ref: "#/components/schemas/SpecAddonEnding"
        aiProvider:
          type: string
          enum: [trenova, customer]
          x-enum-varnames: [SharedTenantAiTrenova, SharedTenantAiCustomer]
          description: Whose AI keys the tenant's AI features use.
        allowances:
          type: array
          maxItems: 20
          description: |
            The tenant's monthly allowances. Which metered actions may continue now is the usage
            answer's (`reportSharedUsage`), measured against these.
          items:
            $ref: "#/components/schemas/SpecAllowance"
        firstAdministrator:
          $ref: "#/components/schemas/SpecFirstAdministrator"
        account:
          $ref: "#/components/schemas/SpecAccount"
        commands:
          type: array
          maxItems: 20
          description: |
            What the server is asked to do for the tenant besides converging to this entry, oldest
            first, once the tenant holds this entry's `lifecycle`. Each is listed until the server
            reports it done or failed: an `archive` as the tenant's `lastArchive` or in its
            `commandFailures`, a `restore` as its `lastRestore`, an `import` by the tenant held
            `suspended` at this `revision` or in its `commandFailures`. Carry each out once, by `id`:
            a command listed again after a restart of the server is not run twice. Empty when there
            is none.
          items:
            $ref: "#/components/schemas/SharedTenantCommand"

    SharedTenantPlan:
      type: object
      description: "The plan the tenant is sold. It has no machine: the tenant runs on the server's."
      required: [key, name, backupRetentionDays, support]
      properties:
        key:
          type: string
          description: The plan's key in the price book, such as `shared`.
        name:
          type: string
          description: The plan's name, such as `Shared`.
        backupRetentionDays:
          type: integer
          format: int64
          minimum: 1
          description: How many days the tenant's nightly archives are kept.
        support:
          type: string
          enum: [email, business_hours, priority, contracted]
          x-enum-varnames: [SharedTenantSupportEmail, SharedTenantSupportBusinessHours, SharedTenantSupportPriority,
                            SharedTenantSupportContracted]

    SharedTenantCommand:
      description: |
        One command, told apart by `kind`: `archive`, `restore` or `import`. A server that reads a
        kind it does not know leaves it be and reports nothing of it.
      oneOf:
        - $ref: "#/components/schemas/SharedArchiveCommand"
        - $ref: "#/components/schemas/SharedRestoreCommand"
        - $ref: "#/components/schemas/SharedImportCommand"
      discriminator:
        propertyName: kind
        mapping:
          archive: "#/components/schemas/SharedArchiveCommand"
          restore: "#/components/schemas/SharedRestoreCommand"
          import: "#/components/schemas/SharedImportCommand"

    SharedArchiveCommand:
      type: object
      description: |
        Take an archive of the tenant alone: every table that carries it, in one consistent
        (`REPEATABLE READ`) snapshot, and its documents, in the tenant archive format. Write it
        where `getSharedStorage` says for this `id`, `manifest.json` last, then report it as the
        tenant's `lastArchive`. An archive the server cannot take (a part it cannot write, a
        snapshot that fails) is reported once in the tenant's `commandFailures` with why, and not
        retried: the command stops being listed and Trenova asks again if it still needs one.
        Trenova raises an alert for an archive not reported within 6 hours of `requestedAt`.
      required: [kind, id, purpose, requestedAt]
      properties:
        kind:
          type: string
          enum: [archive]
          x-enum-varnames: [SharedCommandArchive]
        id:
          type: string
          format: uuid
          description: The archive's ID; report it as `lastArchive.commandId`.
        purpose:
          type: string
          enum: [final, export, move]
          x-enum-varnames: [SharedArchiveFinal, SharedArchiveExport, SharedArchiveMove]
          description: |
            `final`: the archive the tenant's removal waits for; the tenant is already `suspended`,
            so nothing changes it after. `export`: the customer asked for an export of their data;
            the tenant is `active` and keeps working while it is taken (the snapshot makes it
            consistent). `move`: the tenant is moving to another server; it is already
            `suspended`, so the archive holds everything it will ever have here.
        requestedAt:
          type: string
          format: date-time

    SharedRestoreCommand:
      type: object
      description: |
        Put the tenant back as an archive of it holds it. Listed only while the tenant is
        `suspended` (its entry's `lifecycle`), and the tenant stays `suspended` through the restore
        and after it: the control plane resumes it with a later revision once `lastRestore` says
        `done`. The server: signs the tenant's people out and holds it suspended (as the entry
        says); reads `manifest.json` from `location` with the `getSharedStorage` credential and
        checks its SHA-256 against `expectSha256`, its `instanceId` against the tenant's, its
        `schemaVersion` against the server's migration head and every part against the manifest;
        only then, under one tenant-level lock, deletes every row and document of the tenant and
        imports the archive's; and reports `lastRestore`. A check that fails before anything is
        deleted is reported `failed` with the tenant untouched; a failure after the delete began
        is reported `failed` and leaves the tenant suspended and incomplete, to be restored again
        from the same or another archive.
      required: [kind, id, location, expectSha256, takenAt, requestedAt]
      properties:
        kind:
          type: string
          enum: [restore]
          x-enum-varnames: [SharedCommandRestore]
        id:
          type: string
          format: uuid
          description: The restore's ID; report it as `lastRestore.commandId`.
        location:
          type: string
          maxLength: 1024
          description: |
            The archive, `s3://<bucket>/<prefix>`: always exactly one archive of this tenant in this
            server's own bucket, `tenants/<instanceId>/archives/<archiveId>/` or
            `tenants/<instanceId>/nightly/<YYYY-MM-DD>/`, verified by Trenova before it was sent.
        expectSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The lowercase hex SHA-256 of the archive's `manifest.json`; refuse an archive whose differs.
        takenAt:
          type: string
          format: date-time
          description: When the archive's snapshot was taken, as its manifest says.
        requestedAt:
          type: string
          format: date-time

    SharedImportCommand:
      type: object
      description: |
        Make the tenant from an archive instead of from `firstAdministrator`: the tenant is moving
        here from another shared server. Listed only on the tenant's first entry on this server,
        with the tenant `suspended`, and only until the server reports the tenant held `suspended`
        at the entry's `revision` (or reports the import in `commandFailures`). The server checks
        the archive as a restore does (`expectSha256`, the tenant's `instanceId`, the schema, every
        part), refuses it if any of the archive's ids already exists on the server, imports it in
        one transaction (organization, business unit, users with their passwords and second
        factors, every row and document: no invitation is issued), records the tenant at the
        entry's `revision`, and reports it `suspended` with `appliedRevision` set. A refused import
        leaves nothing of the tenant on the server and is reported once in `commandFailures`.
      required: [kind, id, location, expectSha256, requestedAt]
      properties:
        kind:
          type: string
          enum: [import]
          x-enum-varnames: [SharedCommandImport]
        id:
          type: string
          format: uuid
          description: The import's ID; report a failure of it as `commandFailures[].commandId`.
        location:
          type: string
          maxLength: 1024
          description: |
            The archive to import, `s3://<bucket>/tenants/<instanceId>/archives/<archiveId>/`: the copy
            Trenova made in this server's own bucket of the archive the tenant's old server took, its
            data key re-wrapped under this server's current archive key.
        expectSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            The lowercase hex SHA-256 of the copy's `manifest.json` (not the old server's: the
            re-wrapped manifest is another file).
        requestedAt:
          type: string
          format: date-time

    SharedStatusReport:
      type: object
      required: [ready, components, tenants]
      properties:
        version:
          type: string
          maxLength: 64
          description: The Trenova release the server runs.
        ready:
          type: boolean
          description: Whether every component is ready and the post-deploy checks pass.
        components:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ComponentStatus"
        message:
          type: string
          maxLength: 500
          description: A short explanation when not ready.
        tenants:
          type: array
          maxItems: 1000
          description: The tenants the server holds, each once.
          items:
            $ref: "#/components/schemas/SharedTenantStatus"

    SharedTenantStatus:
      type: object
      description: One tenant as the server holds it now.
      required: [instanceId, state]
      properties:
        instanceId:
          type: string
          format: uuid
        appliedRevision:
          type: integer
          format: int64
          minimum: 1
          description: |
            The newest revision the tenant holds everything of; absent before its first. The tenant
            is running once it is `active` on its desired revision.
        state:
          type: string
          enum: [applying, active, suspended, removed]
          x-enum-varnames: [TenantApplying, TenantActive, TenantSuspended, TenantRemoved]
          description: |
            `applying` while the server converges the tenant to a revision; `active` or `suspended`
            once it holds `appliedRevision`'s lifecycle; `removed` once its data and documents are
            deleted after a `removed` revision, reported with that revision or a later one as
            `appliedRevision`.
        administrator:
          $ref: "#/components/schemas/AdministratorStatus"
        lastArchive:
          $ref: "#/components/schemas/SharedArchiveReport"
        lastRestore:
          $ref: "#/components/schemas/SharedRestoreReport"
        commandFailures:
          type: array
          maxItems: 20
          description: |
            The `archive` and `import` commands listed for the tenant that the server could not carry
            out, each with why. Report each while the command is still listed; once recorded the
            command stops being listed, and reporting it again changes nothing.
          items:
            $ref: "#/components/schemas/SharedCommandFailure"
        supportGrants:
          type: array
          maxItems: 100
          description: |
            Every live Trenova support access grant of this tenant's organization, as the TMS lists
            them now, in the shape a dedicated instance's status report lists its grants: the
            complete list, at most 100, every one naming the tenant's own organization. The control
            plane replaces what it holds for the tenant with exactly this list; an empty list says
            none is live; left out, the last list reported stands. A list naming more than one
            organization is refused with the report.
          items:
            $ref: "#/components/schemas/SupportGrant"
        refused:
          $ref: "#/components/schemas/SharedTenantRefusal"

    SharedArchiveReport:
      type: object
      description: |
        The newest archive of the tenant the server took for an `archive` command, by its ID:
        reported once it is written whole. Reporting the same archive again changes nothing. The
        report only makes the archive reported: Trenova then reads it back from the bucket and uses
        it only once it checks out (see "Nothing is taken on a server's word").
      required: [commandId, location, sizeBytes, sha256, takenAt]
      properties:
        commandId:
          type: string
          format: uuid
          description: The `archive` command's `id`.
        location:
          type: string
          minLength: 1
          maxLength: 1024
          description: |
            Where it is: exactly `s3://<the server's bucket>/tenants/<instanceId>/archives/<commandId>/`,
            as `getSharedStorage` named it. Any other location is refused.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: The archive's size, all its objects together.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The lowercase hex SHA-256 of the archive's manifest.
        takenAt:
          type: string
          format: date-time
          description: When its snapshot was taken.

    SharedRestoreReport:
      type: object
      description: |
        The newest `restore` command the server finished for the tenant, done or failed. Report it
        with every report until the command stops being listed; reporting it again changes nothing.
      required: [commandId, state, at]
      properties:
        commandId:
          type: string
          format: uuid
          description: The `restore` command's `id`.
        state:
          type: string
          enum: [done, failed]
          x-enum-varnames: [RestoreDone, RestoreFailed]
          description: |
            `done`: the tenant holds the archive's data, and stays `suspended` until the control
            plane resumes it. `failed`: see `reason`; the tenant stays `suspended`.
        at:
          type: string
          format: date-time
          description: When it finished.
        reason:
          type: string
          maxLength: 500
          description: |
            Present when `failed`: one line a staff member can read, starting with whether the
            tenant's data was untouched ("Nothing was changed: ...") or partly deleted ("The tenant
            is incomplete: ...").
        note:
          type: string
          maxLength: 500
          description: |
            Optional, and only with `done`: one line a staff member should know about a restore that
            succeeded (for example that part of the tenant's audit history was restored as it was and
            does not verify, or was signed again and marked as imported). Shown to Trenova staff with
            the restore, never to the customer. Ignored with `failed`, where `reason` says why.

    SharedCommandFailure:
      type: object
      required: [commandId, kind, reason]
      properties:
        commandId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [archive, import]
          x-enum-varnames: [SharedFailedArchive, SharedFailedImport]
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: One line a staff member can read.

    TenantArchiveManifest:
      type: object
      description: |
        `manifest.json` at the root of a tenant archive's prefix: what the archive holds, written
        last, at most 64 MiB. Every key it names is relative to the archive's prefix, and is unique
        in it. Not served by any operation:
        it is the format the TMS writes and the control plane reads (to list, deliver, copy and
        restore archives).
      required: [formatVersion, schemaVersion, releaseVersion, instanceId, organizationName, takenAt,
                 tables, documents, totalSizeBytes, contentSha256]
      properties:
        formatVersion:
          type: integer
          enum: [1]
          description: The archive format's version. A reader refuses a version it does not know.
        schemaVersion:
          type: string
          maxLength: 64
          description: The TMS database's migration head when the snapshot was taken; an archive is imported only at the same one.
        releaseVersion:
          type: string
          maxLength: 64
          description: The Trenova release that took it.
        instanceId:
          type: string
          format: uuid
          description: The tenant's instance in the control plane.
        organizationName:
          type: string
          maxLength: 200
        takenAt:
          type: string
          format: date-time
          description: When its snapshot was taken.
        tables:
          type: array
          maxItems: 2000
          description: Every table that carries the tenant, in the order they load in.
          items:
            $ref: "#/components/schemas/TenantArchiveTable"
        documents:
          type: array
          maxItems: 400000
          description: Every document of the tenant, each copied from the tenant's object prefix.
          items:
            $ref: "#/components/schemas/TenantArchiveObject"
        totalSizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Every part's `sizeBytes` together (the manifest itself not counted).
        contentSha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            The SHA-256, lowercase hex, of the content list: one line per part, the tables first in
            their order then the documents in theirs, each `<sha256>  <key>` (two spaces, as
            `sha256sum` writes it) ending in a newline.
        purpose:
          type: string
          enum: [final, export, move, nightly]
          description: Why it was taken; `nightly` for a nightly archive.
        encryption:
          $ref: "#/components/schemas/TenantArchiveEncryption"
        omitted:
          type: array
          maxItems: 500
          description: |
            Present only on an `export` archive: every table or column left out because it holds a
            secret rather than the customer's data, each once.
          items:
            $ref: "#/components/schemas/TenantArchiveOmission"
        trails:
          $ref: "#/components/schemas/TenantArchiveTrails"

    TenantArchiveEncryption:
      type: object
      description: |
        How the parts are encrypted; present on every archive but an `export`, absent on an export.
        Each part is the STREAM construction over AES-256-GCM with the archive's data key: the object
        starts with a random 7-byte nonce prefix, then segments of at most `segmentBytes` plaintext,
        each sealed with the nonce `prefix || uint32 big-endian segment index || 0x01 for the last
        segment, 0x00 otherwise` and the part's `key` (as the manifest names it, UTF-8) as additional
        data. A part's `sizeBytes` and `sha256` are of these stored, encrypted bytes.
      required: [algorithm, segmentBytes, keyId, wrappedDataKey]
      properties:
        algorithm:
          type: string
          enum: [aes256gcm_stream_v1]
        segmentBytes:
          type: integer
          enum: [1048576]
          description: The plaintext bytes of every segment but the last.
        keyId:
          type: string
          maxLength: 64
          description: |
            The `ArchiveKey.id` of the archive key that wrapped the data key: the writing server's
            current key; on a copy Trenova made, the destination's (another server's current key, an
            import's own key, or Trenova's vault key).
        wrappedDataKey:
          type: string
          description: |
            The 32-byte data key sealed with AES-256-GCM under the archive key: a random 12-byte
            nonce followed by the ciphertext and tag, standard base64 with padding; additional data
            the archive's `instanceId` (canonical text form), so a data key never unwraps for
            another tenant's archive.

    TenantArchiveTrails:
      type: object
      description: |
        Optional within `formatVersion` 1: a server MAY write it when it takes an archive. The
        source's own statement about the tenant's audit chains the archive carries, one entry per
        trail (`audit`, the tenant's audit trail; `aiAudit`, its AI audit trail), each absent when
        the archive carries none of it. It is carried inside the manifest whose digest the control
        plane pins and verifies, so it is exactly as trustworthy as the archive itself, and no more.
        A reader that imports the archive MAY record a trail's imported history as verified at its
        source, as the archive states, when that trail's `verified` is true and its own structural
        checks of what arrived agree with `links` and `sealedThrough`; when the trail is absent or
        `verified` is false, the reader treats that history as not verified at its source. The
        control plane does not interpret it: it refuses a manifest whose `trails` is not this shape
        or names `trails`, or a key inside it, twice or in another case, and a re-wrap keeps it
        unchanged.
      properties:
        audit:
          $ref: "#/components/schemas/TenantArchiveTrail"
        aiAudit:
          $ref: "#/components/schemas/TenantArchiveTrail"

    TenantArchiveTrail:
      type: object
      required: [sealedThrough, verified, links]
      properties:
        sealedThrough:
          type: string
          format: date-time
          description: The moment up to which the source sealed the tenant's trail before the snapshot.
        verified:
          type: boolean
          description: The source verified its own chain for this tenant, end to end, at that moment.
        links:
          type: integer
          format: int64
          minimum: 0
          description: How many links of the chain the archive carries.

    TenantArchiveOmission:
      type: object
      required: [table, reason]
      properties:
        table:
          type: string
          maxLength: 128
        column:
          type: string
          maxLength: 128
          description: The column left out; absent when the whole table is.
        reason:
          type: string
          maxLength: 200
          description: Why, in words the customer reads (for example `password hashes`).

    TenantArchiveTable:
      type: object
      required: [name, rows, key, sizeBytes, sha256, encoding]
      properties:
        name:
          type: string
          maxLength: 128
          description: The table, schema-qualified (`public.shipments`).
        rows:
          type: integer
          format: int64
          minimum: 0
        key:
          type: string
          maxLength: 300
          description: "`tables/<NNNN>-<table>.copy.zst`: its position in the load order, four digits from `0001`."
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Of the object's bytes as stored.
        encoding:
          type: string
          enum: [pg_copy_binary_zstd]
          description: "`pg_copy_binary_zstd`: PostgreSQL `COPY ... TO STDOUT (FORMAT binary)` of the tenant's rows, compressed with zstd."

    TenantArchiveObject:
      type: object
      required: [key, sizeBytes, sha256]
      properties:
        key:
          type: string
          maxLength: 1024
          description: "`documents/<the document's key under the tenant's object prefix>`."
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        contentType:
          type: string
          maxLength: 255
          description: |
            The document's media type, which its import restores. Omitted when it is
            `application/octet-stream`; absent means `application/octet-stream`. Optional within
            `formatVersion` 1: a reader ignores a field it does not know.

    SharedTenantRefusal:
      type: object
      description: |
        The newest revision of the tenant the server has read and will not apply as it is written,
        and why. The tenant stays as it was. Sent with every report while it stands.
      required: [revision, code, reason]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
        code:
          type: string
          enum: [invalid]
          x-enum-varnames: [SharedRefusedInvalid]
          description: "`invalid`: the revision cannot be turned into what the tenant should be."
        reason:
          type: string
          maxLength: 500
          description: One line a staff member can read.

    SharedReportAck:
      type: object
      required: [refused]
      properties:
        refused:
          type: array
          maxItems: 1000
          description: The report's entries that were not recorded, each once; empty when all were.
          items:
            $ref: "#/components/schemas/SharedEntryRefused"

    SharedEntryRefused:
      type: object
      required: [instanceId, code]
      properties:
        instanceId:
          type: string
          format: uuid
        code:
          type: string
          enum: [not_placed, implausible]
          x-enum-varnames: [SharedEntryNotPlaced, SharedEntryImplausible]
          description: |
            `not_placed`: the instance is not a tenant placed on this server, or it was already
            reported `removed`. Stop reporting it.
            `implausible` (usage reports only): a reading of the tenant's in the report is more than
            its plan allows (an hour's count above the allowance's ceiling, or a level above twice
            it), so none of the tenant's readings in the report was recorded. Do not send those readings again; report the tenant's later hours as usual.
            A refused entry is never recorded. Treat a code you do not know as a refusal of the
            entry's readings in that report: do not send them again.

    SharedUsageReport:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/SharedUsageReading"

    SharedUsageReading:
      type: object
      required: [instanceId, meter, hour, quantity]
      properties:
        instanceId:
          type: string
          format: uuid
          description: The tenant the reading is for.
        meter:
          type: string
          maxLength: 40
          description: A catalog meter's key, such as `shipments`.
        hour:
          type: string
          format: date-time
          description: The start of the hour, on the hour, from 35 days ago to the current hour.
        quantity:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000000
          description: In the meter's unit (a count or bytes), at most 10^15. Each tenant's meter and hour once a report.

    SharedUsageAck:
      type: object
      required: [tenants, refused]
      properties:
        tenants:
          type: array
          maxItems: 1000
          description: Every tenant placed on the server, ordered by `instanceId`.
          items:
            $ref: "#/components/schemas/SharedTenantUsage"
        refused:
          type: array
          maxItems: 5000
          description: The instances whose readings were not recorded, each once; empty when none.
          items:
            $ref: "#/components/schemas/SharedEntryRefused"

    SharedTenantUsage:
      type: object
      description: What one tenant may continue, as `UsageAck` says it of an instance.
      required: [instanceId, overage, meters]
      properties:
        instanceId:
          type: string
          format: uuid
        window:
          $ref: "#/components/schemas/UsageWindow"
        overage:
          type: boolean
          description: |
            Whether usage beyond an allowance without a hard cap continues (up to its ceiling) and is
            billed: the customer opted in to overage, or the plan bills usage past its allowances
            always.
        meters:
          type: array
          items:
            $ref: "#/components/schemas/MeterUsage"

    SharedStorage:
      type: object
      required: [archives, waiting]
      properties:
        nightly:
          $ref: "#/components/schemas/SharedNightlyTarget"
        archives:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SharedArchiveTarget"
        waiting:
          type: array
          maxItems: 100
          description: The archive commands no credential could be given for now, with why; ask again in a minute.
          items:
            $ref: "#/components/schemas/SharedArchiveWaiting"

    SharedNightlyTarget:
      type: object
      description: |
        The standing target for nightly archives: the server's own archive bucket, its own access key
        (scoped at the provider to that bucket alone) and the server's own archive keys. Write each
        active tenant's nightly archive under `tenants/<instanceId>/nightly/<YYYY-MM-DD>/` (the UTC
        day), wrapped by the key marked `current`; read and prune the tenant's older nightly archives
        there with the keys their manifests name. Never write anything else with it, and never
        another tenant's prefix than one the tenants document lists as this server's. Present on
        every answer while the server has its archive bucket recorded and is not retired; absent
        otherwise, and then the server takes no nightly archive and removes the credential and keys
        it holds for them. Never another server's bucket or key.
      required: [access, endpoint, region, bucket, prefix, accessKeyId, secretAccessKey, archiveKeys]
      properties:
        access:
          type: string
          enum: [write]
          x-enum-varnames: [NightlyWrite]
          description: Write, list, read and delete under `prefix`.
        endpoint:
          type: string
          description: The S3 API's URL, always `https`, such as `https://s3.bhs.io.cloud.ovh.net`.
        region:
          type: string
          description: The region requests are signed for.
        bucket:
          type: string
          description: The server's own bucket.
        prefix:
          type: string
          description: |
            Always `tenants/`: nightly archives go only to `tenants/<instanceId>/nightly/<YYYY-MM-DD>/`
            of the server's own tenants.
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        sessionToken:
          type: string
          description: Present only for a temporary credential; absent for the bucket's own key.
        expiresAt:
          type: string
          format: date-time
          description: When a temporary credential stops working; absent for the bucket's own key.
        archiveKeys:
          type: array
          minItems: 1
          maxItems: 50
          description: The server's own archive keys, exactly one `current`.
          items:
            $ref: "#/components/schemas/ArchiveKey"

    SharedArchiveTarget:
      type: object
      description: |
        Where one archive is kept, and the credential to reach it with: the server's own bucket's
        own key, scoped at the provider to that bucket (the same as `SharedStorage.bucket`).
      required: [instanceId, commandId, kind, access, endpoint, region, bucket, prefix, accessKeyId, secretAccessKey]
      properties:
        instanceId:
          type: string
          format: uuid
        commandId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [archive, restore, import]
          x-enum-varnames: [TargetArchive, TargetRestore, TargetImport]
          description: The command's kind.
        archiveKeys:
          type: array
          maxItems: 50
          description: |
            The server's own archive keys, absent for an `export` archive (written unencrypted). To
            write an archive, wrap its data key with the one key marked `current` and record that
            key's `id` in the manifest's `encryption.keyId`; to read one (a restore, an import of the
            copy Trenova made for this server, or pruning that needs to read), unwrap its data key
            with the key whose `id` its manifest names. Hold them only in memory, never log or store
            them; fetch again for a key id you do not hold.
          items:
            $ref: "#/components/schemas/ArchiveKey"
        access:
          type: string
          enum: [write, read]
          x-enum-varnames: [TargetWrite, TargetRead]
          description: "`write` for an `archive` command's new archive; `read` for the archive a `restore` or `import` reads."
        endpoint:
          type: string
          description: The S3 API's URL, always `https`, such as `https://s3.bhs.io.cloud.ovh.net`.
        region:
          type: string
          description: The region requests are signed for.
        bucket:
          type: string
          description: The server's own bucket.
        prefix:
          type: string
          description: |
            The archive's prefix: `tenants/<instanceId>/archives/<commandId>/` to write an archive;
            the prefix of the command's `location` to read one.
        accessKeyId:
          type: string
        secretAccessKey:
          type: string
        sessionToken:
          type: string
          description: |
            Present only for a temporary credential: send it as `X-Amz-Security-Token` with every
            request. Absent for the bucket's own key.
        expiresAt:
          type: string
          format: date-time
          description: |
            When a temporary credential stops working; absent for the bucket's own key, which does not
            expire.

    ArchiveKey:
      type: object
      description: |
        One archive key: a random 256-bit AES key that wraps each archive's own data key
        (AES-256-GCM, `encryption.wrappedDataKey`). Never wraps tenant data itself. A server's are
        its own; an import's is made for that import alone.
      required: [id, key, current]
      properties:
        id:
          type: string
          maxLength: 64
          description: The key's id, which a manifest's `encryption.keyId` names.
        key:
          type: string
          description: The 32-byte key, standard base64 with padding.
        current:
          type: boolean
          description: Whether new archives are wrapped with it; exactly one is.

    SharedArchiveWaiting:
      type: object
      required: [instanceId, commandId, reason]
      properties:
        instanceId:
          type: string
          format: uuid
        commandId:
          type: string
          format: uuid
        reason:
          type: string
          enum: [no_bucket, unavailable]
          x-enum-varnames: [SharedArchiveNoBucket, SharedArchiveUnavailable]
          description: |
            `no_bucket`: Trenova has not recorded this server's own archive bucket (never so for a
            server Trenova has opened). `unavailable`: the credential could not be given just now.
