# cargo-deny policy for every backend Rust crate (`task rust:deny`, CI's Rust workflow).
# desktop/capture has its own workspace and is checked by its own workflow.

[graph]
# The services run on Linux; the library crates also build for WebAssembly. Windows-only
# dependencies (desktop/capture's concern) are out of scope here.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-wasip1",
    "wasm32-unknown-unknown",
]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
unused-allowed-license = "allow"
confidence-threshold = 0.93
# Compatible with shipping under FSL-1.1-ALv2: permissive licences, and the weak-copyleft
# MPL-2.0 (file-level; we ship unmodified sources). Anything else needs a decision here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # jpeg-encoder ports libjpeg's tables: the IJG licence is permissive, with attribution.
    "IJG",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Two majors of the same crate in one binary are a decision, recorded here with the reason.
skip = [
    { crate = "getrandom@0.2", reason = "ring 0.17, under rustls, is still on 0.2; everything else is on 0.3" },
    { crate = "syn@2", reason = "the proc-macro ecosystem is part way from syn 2 to syn 3; both only run at build time" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
