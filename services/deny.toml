# cargo-deny policy for every backend Rust crate (`task rust:deny`, CI's Rust workflow).
# desktop/capture has its own workspace and is checked by its own workflow.

[graph]
# The services run on Linux; the library crates also build for WebAssembly. Windows-only
# dependencies (desktop/capture's concern) are out of scope here.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
    "wasm32-wasip1",
]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
unused-allowed-license = "allow"
confidence-threshold = 0.93
# Compatible with shipping under FSL-1.1-ALv2: permissive licences, and the weak-copyleft
# MPL-2.0 (file-level; we ship unmodified sources). Anything else needs a decision here.
# BlueOak-1.0.0 is a permissive, OSI-approved licence (minicbor, under monty).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    "BSL-1.0",
    # jpeg-encoder ports libjpeg's tables: the IJG licence is permissive, with attribution.
    "IJG",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between the workspace's own unpublished crates carry no version.
allow-wildcard-paths = true
highlight = "all"
# Two majors of the same crate in one binary are a decision, recorded here with the reason.
skip = [
    { crate = "getrandom@0.2", reason = "ring 0.17, under rustls, is still on 0.2" },
    { crate = "getrandom@0.3", reason = "rand 0.9, under opentelemetry_sdk's samplers, is on 0.3; tempfile is on 0.4" },
    { crate = "rand_core@0.9", reason = "rand 0.9 under opentelemetry_sdk; the rest of the graph is on 0.10" },
    { crate = "hashbrown@0.15", reason = "petgraph 0.8 under prost-build, which runs only at build time" },
    { crate = "fax@0.2", reason = "tiff 0.11 (image's TIFF decoder) is on fax 0.2; imaging-core's G4 encoder, shared with the capture companion, is on 0.3" },
    { crate = "miniz_oxide@0.8", reason = "png 0.18 pins miniz_oxide 0.8 while its flate2 is on 0.9" },
    { crate = "base64@0.22", reason = "tonic 0.14 is on base64 0.22; pem 4 (under rcgen, for the certs subcommand) is on 0.23" },
    { crate = "syn@2", reason = "the proc-macro ecosystem is part way from syn 2 to syn 3; both only run at build time" },
    { crate = "hashbrown@0.16", reason = "monty 1.3 (trenova-scripts) is on hashbrown 0.16, between petgraph's 0.15 and indexmap's 0.17" },
    { crate = "foldhash@0.2", reason = "hashbrown 0.16 under monty is on foldhash 0.2; hashbrown 0.15 under petgraph is on 0.1" },
    { crate = "itertools@0.15", reason = "ruff's Python parser under monty is on itertools 0.15; monty itself, pdfium-render and prost-build are on 0.14" },
    { crate = "rand@0.8", reason = "phf_generator 0.11, which builds unicode_names2's tables under monty at build time, is on rand 0.8" },
    { crate = "rand_chacha@0.3", reason = "rand 0.8 under phf_generator, at build time only" },
    { crate = "rand_core@0.6", reason = "rand 0.8 under phf_generator, at build time only" },
    { crate = "unicode-width@0.2", reason = "getopts under unicode_names2's build-time generator is on 0.2; miette under protox is on 0.1" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
