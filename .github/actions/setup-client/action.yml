name: Setup Client
description: >-
  Installs Bun for the client Turborepo and restores the dependency and
  Turborepo caches. Every client job needs the same setup, so it lives here
  rather than being repeated per job.

runs:
  using: composite
  steps:
    # No version pin here: setup-bun reads packageManager from client/package.json,
    # so CI cannot drift from what developers run locally.
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: client/package.json

    - name: Cache Bun packages
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('client/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    # Rolling key: the cache is saved on every run and restored from the newest
    # prefix match, so a task whose inputs did not change is never re-run.
    - name: Cache Turborepo
      uses: actions/cache@v4
      with:
        path: client/.turbo/cache
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      working-directory: ./client
      run: bun install --frozen-lockfile
