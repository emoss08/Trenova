name: Setup Go
description: >-
  Installs Go, restores the module cache and, when the build cache secrets are
  passed, points GOCACHEPROG at the shared build cache on Cloudflare R2
  (docs/engineering/go-build-cache.md). Without them (forks, Dependabot) the
  job builds with a cold local GOCACHE.

inputs:
  go-version:
    description: Go version to install
    required: false
    default: "1.27.1"
  r2-endpoint:
    description: The R2 account's S3 API endpoint (secrets.R2_BUILD_CACHE_ENDPOINT).
    required: false
    default: ""
  r2-access-key-id:
    description: >-
      The write token's key on pushes to master, the read token's everywhere
      else. The cache is read-only unless this is a push to master, whichever
      key is passed.
    required: false
    default: ""
  r2-secret-access-key:
    description: The secret of r2-access-key-id.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The ubuntu-26.04 image mounts /tmp as a size-capped tmpfs, and go build
    # and go test link every binary under GOTMPDIR, which defaults to /tmp. A
    # change to a package most of the service imports relinks hundreds of test
    # binaries at once and filled it ("disk quota exceeded"), so the work
    # directory goes on the runner's disk instead.
    - name: Keep Go's work directory on disk
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/gotmp"
        echo "GOTMPDIR=$RUNNER_TEMP/gotmp" >> "$GITHUB_ENV"

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Resolve cache paths
      id: paths
      shell: bash
      run: |
        echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "gobuildcache-version=$(cat services/tms/scripts/gocacheprog/version)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.paths.outputs.mod }}
        key: gomod-${{ runner.os }}-${{ inputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gomod-${{ runner.os }}-${{ inputs.go-version }}-

    - name: Cache gobuildcache
      if: inputs.r2-endpoint != '' && inputs.r2-access-key-id != '' && inputs.r2-secret-access-key != ''
      id: gobuildcache-bin
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/gobuildcache-bin
        key: gobuildcache-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.gobuildcache-version }}

    # Its go.mod needs a newer Go than the builds use; GOTOOLCHAIN=auto fetches
    # it for this install only, and the binary does not depend on it.
    - name: Install gobuildcache
      if: inputs.r2-endpoint != '' && inputs.r2-access-key-id != '' && inputs.r2-secret-access-key != '' && steps.gobuildcache-bin.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GOBIN: ${{ runner.temp }}/gobuildcache-bin
        GOTOOLCHAIN: auto
        GOFLAGS: ""
        GOWORK: "off"
        VERSION: ${{ steps.paths.outputs.gobuildcache-version }}
      run: go install "github.com/richardartoul/gobuildcache@${VERSION}"

    # The endpoint and keys go to a file only the wrapper reads, never into the
    # job environment: the go command passes its environment to every test
    # binary, and AWS_ENDPOINT_URL_S3 there would redirect any AWS SDK client a
    # test builds. Writing is decided here, not by the caller's choice of key.
    - name: Use the shared build cache
      if: inputs.r2-endpoint != '' && inputs.r2-access-key-id != '' && inputs.r2-secret-access-key != ''
      shell: bash
      env:
        ENDPOINT: ${{ inputs.r2-endpoint }}
        ACCESS_KEY_ID: ${{ inputs.r2-access-key-id }}
        SECRET_ACCESS_KEY: ${{ inputs.r2-secret-access-key }}
        WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/go-remote-cache"
        mkdir -p "$dir"
        umask 077
        {
          echo "R2_BUILD_CACHE_ENDPOINT=$ENDPOINT"
          echo "R2_BUILD_CACHE_ACCESS_KEY_ID=$ACCESS_KEY_ID"
          echo "R2_BUILD_CACHE_SECRET_ACCESS_KEY=$SECRET_ACCESS_KEY"
          echo "GO_REMOTE_CACHE_WRITE=$WRITE"
        } > "$dir/credentials.env"
        {
          echo "GO_REMOTE_CACHE_CREDENTIALS=$dir/credentials.env"
          echo "GOBUILDCACHE_BIN=$RUNNER_TEMP/gobuildcache-bin/gobuildcache"
          echo "GOBUILDCACHE_CACHE_DIR=$dir/cache"
          echo "GOCACHEPROG=$GITHUB_WORKSPACE/services/tms/scripts/gocacheprog/gocacheprog.sh"
          # The module index lives in the build cache under each package's
          # path and file times, so with a cache program every fresh checkout
          # pays one remote miss per first-party package for it.
          echo "GODEBUG=goindex=0"
        } >> "$GITHUB_ENV"
        if [ "$WRITE" = true ]; then mode=read-write; else mode=read-only; fi
        echo "Go build cache: shared (R2, $mode)" >> "$GITHUB_STEP_SUMMARY"

    - name: Download dependencies
      shell: bash
      run: |
        for module in services/tms shared dev/samsara-sim dev/edi-partner-sim; do
          (cd "$module" && go mod download)
        done
