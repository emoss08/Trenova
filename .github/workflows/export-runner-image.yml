name: Export runner image

# The data export runner for Managed Trenova (deploy/export-runner): the job
# that restores an instance's backups and makes the archive a customer
# downloads. The control plane runs the tag of the Trenova release an instance
# is on, so every release needs its own. A release calls this workflow; it
# can also be run by hand for a release that has none.

on:
  workflow_call:
    inputs:
      version:
        description: The release's version or tag (0.12.0 or v0.12.0)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The release's version or tag, such as 0.12.0 or v0.12.0
        type: string
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: emoss08/trenova

jobs:
  build-and-push:
    name: Build and Push Export Runner Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner is built on the PostgreSQL image the release runs: the
      # release's own when it built one, and otherwise the newest published
      # one that is not newer than the release, which is the one its chart
      # names.
      - name: Find the release's PostgreSQL image
        id: postgres
        env:
          VERSION: ${{ inputs.version }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          tag="$(python3 - "$VERSION" "${REGISTRY}" "${IMAGE_NAMESPACE}/postgres" <<'PY'
          import base64, json, os, re, sys, urllib.request

          version, registry, repository = sys.argv[1], "https://" + sys.argv[2], sys.argv[3]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"{version!r} is not a version such as 0.12.0")

          def get(url, auth):
              request = urllib.request.Request(url, headers={
                  "Authorization": auth, "User-Agent": "trenova-release"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def key(v):
              return tuple(int(p) for p in v.split("."))

          basic = base64.b64encode(
              f"{os.environ['GHCR_USER']}:{os.environ['GHCR_TOKEN']}".encode()).decode()
          token = get(f"{registry}/token?scope=repository:{repository}:pull", f"Basic {basic}")["token"]
          tags = get(f"{registry}/v2/{repository}/tags/list?n=1000", f"Bearer {token}").get("tags") or []
          fits = [t for t in tags if re.fullmatch(r"\d+\.\d+\.\d+", t) and key(t) <= key(version)]
          if not fits:
              sys.exit(f"no published PostgreSQL image is {version} or older")
          print(max(fits, key=key))
          PY
          )"
          echo "PostgreSQL image for ${VERSION}: ${REGISTRY}/${IMAGE_NAMESPACE}/postgres:${tag}"
          echo "image=${REGISTRY}/${IMAGE_NAMESPACE}/postgres:${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: the build starts this image's PostgreSQL to prove
      # the recovery wait (test.sh), which an emulated arm64 build cannot do
      # in reasonable time, and managed instances run on amd64.
      - name: Build and push the export runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/export-runner
          file: ./deploy/export-runner/Dockerfile
          build-args: |
            POSTGRES_IMAGE=${{ steps.postgres.outputs.image }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/export-runner:${{ steps.postgres.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.postgres.outputs.version }}
            org.opencontainers.image.description=The data export runner for Managed Trenova
          platforms: linux/amd64
          sbom: true
          provenance: mode=max

      - name: Check the pushed image answers
        env:
          REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/export-runner:${{ steps.postgres.outputs.version }}
        run: docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}'
