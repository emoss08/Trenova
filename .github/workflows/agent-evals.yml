name: Agent Evals

# A real model against the red-team suite: how often it declines the injected
# instruction at all. Run it by hand (Actions -> Agent Evals -> Run workflow),
# on a branch to measure a change; it needs the TRENOVA_EVAL_API_KEY secret.
# The deterministic gates (prompt and tool catalog snapshots, ranking floors,
# argument parsing, the red-team suite and recorded replays) need no model and
# run with every other package in Test Go's Unit Tests.
# See https://github.com/emoss08/trenova-documentation/blob/main/docs/engineering/agent-evals.md.

on:
  workflow_dispatch:
    inputs:
      record:
        description: Record each live run as a cassette and upload them
        type: boolean
        default: false
      update-baseline:
        description: Write the measured live pass rate as the new baseline and upload it
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches test-tms.yml. Steps that pass -tags spell nomsgpack out
  # themselves, because -tags replaces GOFLAGS' tags.
  GOFLAGS: -tags=nomsgpack
  APP_ENV: test

jobs:
  live:
    name: Live
    runs-on: ubuntu-latest
    env:
      EVAL_KEY: ${{ secrets.TRENOVA_EVAL_API_KEY }}
      EVAL_MODEL: ${{ vars.TRENOVA_EVAL_MODEL || 'claude-sonnet-5' }}
      EVAL_PROVIDER_KIND: ${{ vars.TRENOVA_EVAL_PROVIDER_KIND }}
      EVAL_BASE_URL: ${{ vars.TRENOVA_EVAL_BASE_URL }}

    steps:
      - name: Report a missing key
        if: env.EVAL_KEY == ''
        run: |
          echo "::notice::TRENOVA_EVAL_API_KEY is not set, so the live agent evaluation was skipped"

      - name: Checkout code
        if: env.EVAL_KEY != ''
        uses: actions/checkout@v5

      - name: Set up Go
        if: env.EVAL_KEY != ''
        uses: ./.github/actions/setup-go
        with:
          cache-key: agent-evals-live

      - name: Live red-team pass rate
        if: env.EVAL_KEY != ''
        working-directory: ./services/tms
        env:
          EVAL_REPORT: ${{ runner.temp }}/live-eval.json
          RECORD: ${{ inputs.record && '-record' || '' }}
          UPDATE_BASELINE: ${{ inputs.update-baseline && '-update-baseline' || '' }}
        run: |
          set -euo pipefail
          go test -tags=nomsgpack,liveeval -count=1 -v -timeout 30m \
            -run 'TestLiveRedTeam' ./internal/modules/agent/app/agentredteam/ \
            -args $RECORD $UPDATE_BASELINE

      - name: Summarize the live run
        if: always() && env.EVAL_KEY != ''
        run: |
          report="$RUNNER_TEMP/live-eval.json"
          if [ -f "$report" ]; then
            {
              echo "## Live agent evaluation"
              echo
              echo '```json'
              cat "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the live report and recordings
        if: always() && env.EVAL_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: agent-evals-live
          path: |
            ${{ runner.temp }}/live-eval.json
            services/tms/internal/modules/agent/app/agentredteam/testdata/cassettes/live_*.json
            services/tms/internal/modules/agent/app/agentredteam/testdata/live-baseline.json
          if-no-files-found: ignore
