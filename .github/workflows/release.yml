name: Release

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: emoss08/trenova
  TMS_IMAGE_NAME: emoss08/trenova/tms
  TMS_DB_IMAGE_NAME: emoss08/trenova/tms-db
  CLIENT_IMAGE_NAME: emoss08/trenova/client
  IMAGING_IMAGE_NAME: emoss08/trenova/imaging
  OPERATOR_IMAGE_NAME: emoss08/trenova/operator

jobs:
  verify-source:
    name: Refuse a release from outside the default branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the released commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on $DEFAULT_BRANCH."
            exit 1
          fi

  detect-postgres-changes:
    needs: verify-source
    name: Detect Postgres Image Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      previous_tag: ${{ steps.detect.outputs.previous_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Postgres image changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          current_ref="${GITHUB_REF_NAME}"
          previous_tag="$(git tag --sort=-v:refname | grep -v "^${current_ref}$" | head -n 1 || true)"

          if [[ -z "${previous_tag}" ]]; then
            echo "No previous tag found; building Postgres image."
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "previous_tag=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${previous_tag}" "${current_ref}" -- deploy/Dockerfile.postgres)"
          if [[ -n "${changed_files}" ]]; then
            echo "Postgres image inputs changed since ${previous_tag}:"
            echo "${changed_files}"
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Postgres image inputs did not change since ${previous_tag}; skipping Postgres image build."
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "previous_tag=${previous_tag}" >> "${GITHUB_OUTPUT}"

  build-and-push-tms:
    needs: verify-source
    name: Build and Push TMS Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.TMS_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push TMS image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/Dockerfile.tms
          target: tms
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          sbom: true
          provenance: mode=max

      # trenova-db applies the migrations before each rollout; the TMS image
      # carries none of them.
      - name: Extract metadata (trenova-db)
        id: meta-db
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.TMS_DB_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push trenova-db image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/Dockerfile.tms
          target: trenova-db
          push: true
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          sbom: true
          provenance: mode=max

  build-and-push-client:
    needs: verify-source
    name: Build and Push Client Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Client image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/Dockerfile.client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          build-args: |
            VITE_API_URL=/api/v1

  build-and-push-imaging:
    needs: verify-source
    name: Build and Push Imaging Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGING_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The build context is services/ (the Rust workspace and its contracts). The image
      # carries an SBOM and provenance attestation.
      - name: Build and push imaging image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./services
          file: ./deploy/Dockerfile.imaging
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=imaging-release
          cache-to: type=gha,scope=imaging-release,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          build-args: |
            CARGO_BUILD_JOBS=4

  build-and-push-postgres:
    name: Build and Push Postgres Image
    runs-on: ubuntu-latest
    needs: detect-postgres-changes
    if: needs.detect-postgres-changes.outputs.should_build == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/postgres
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Postgres image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy
          file: ./deploy/Dockerfile.postgres
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          sbom: true
          provenance: mode=max

  # The Trenova Cloud operator (services/operator, its own module).
  build-and-push-operator:
    needs: verify-source
    name: Build and Push Operator Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push operator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/Dockerfile.operator
          target: operator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,scope=operator,mode=max
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max

  # The Helm charts, versioned with the release, as OCI artifacts beside the
  # images: oci://ghcr.io/emoss08/charts/trenova and trenova-operator.
  # Published once every image they name exists.
  publish-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-latest
    needs:
      - detect-postgres-changes
      - build-and-push-tms
      - build-and-push-client
      - build-and-push-imaging
      - build-and-push-postgres
      - build-and-push-operator
    if: >-
      ${{ !cancelled()
      && needs.build-and-push-tms.result == 'success'
      && needs.build-and-push-client.result == 'success'
      && needs.build-and-push-imaging.result == 'success'
      && needs.build-and-push-operator.result == 'success'
      && (needs.build-and-push-postgres.result == 'success' || needs.build-and-push-postgres.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
      # Keyless signing: the chart signature names this workflow at this tag.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /tmp/cosign' | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign

      - name: Install Helm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum -c -
          tar xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      # The PostgreSQL image is published only when it changes; a release
      # that built one points the chart at it.
      - name: Point the chart at this release's PostgreSQL image
        if: needs.detect-postgres-changes.outputs.should_build == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import re, sys
          path = "deploy/helm/trenova/values.yaml"
          text = open(path).read()
          block = re.search(r"^postgres:\n(?:  .*\n|\n)*?    tag: \"[^\"]*\"", text, re.M)
          if not block:
              sys.exit("postgres.image.tag not found in values.yaml")
          updated = re.sub(r'tag: "[^"]*"$', f'tag: "{sys.argv[1]}"', block.group(0), flags=re.M)
          open(path, "w").write(text.replace(block.group(0), updated, 1))
          PY
          grep -n -A4 '^postgres:' deploy/helm/trenova/values.yaml

      # Every image a chart names, resolved to the digest it has now, inside the
      # chart and so inside its signature: a tag moved after this release changes
      # nothing on an instance.
      - name: Pin the charts' images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          for chart in trenova trenova-operator; do
            yq -o=json "deploy/helm/${chart}/values.yaml" > "${RUNNER_TEMP}/${chart}-values.json"
            python3 - "$version" "${RUNNER_TEMP}/${chart}-values.json" "deploy/helm/${chart}/image-digests.yaml" <<'PY'
          import json, re, subprocess, sys

          version, values, out = sys.argv[1:4]

          def images(node):
              if isinstance(node, dict):
                  if "repository" in node and "tag" in node:
                      yield node
                  for child in node.values():
                      yield from images(child)
              elif isinstance(node, list):
                  for child in node:
                      yield from images(child)

          pins = {}
          for image in images(json.load(open(values))):
              tag = image["tag"] or version
              if "@" in tag:
                  continue
              ref = f'{image["repository"]}:{tag}'
              digest = subprocess.check_output(
                  ["docker", "buildx", "imagetools", "inspect", ref, "--format", "{{.Manifest.Digest}}"],
                  text=True,
              ).strip()
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  sys.exit(f"{ref}: no digest ({digest!r})")
              pins[ref] = digest
          if not pins:
              sys.exit("no image to pin")
          with open(out, "w") as f:
              for ref, digest in sorted(pins.items()):
                  f.write(f'"{ref}": "{digest}"\n')
          PY
            cat "deploy/helm/${chart}/image-digests.yaml"
          done

      # The signature travels in the chart's own provenance layer: helm push takes
      # <archive>.prov from beside the archive, and the operator refuses a chart
      # without one (services/operator/internal/release/provenance.go, which holds
      # the same signer pattern).
      - name: Package, sign and push the charts
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHART_SIGNER: '^https://github\.com/emoss08/[Tt]renova/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "${GHCR_TOKEN}" | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          helm lint deploy/helm/trenova --set domain=trenova.example.com --set storageDomain=storage.trenova.example.com
          helm lint deploy/helm/trenova-operator
          for chart in trenova trenova-operator; do
            archive="${RUNNER_TEMP}/${chart}-${version}.tgz"
            helm package "deploy/helm/${chart}" --version "${version}" --app-version "${version}" -d "${RUNNER_TEMP}"
            cosign sign-blob --yes --bundle "${archive}.prov" "${archive}"
            cosign verify-blob --bundle "${archive}.prov" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "${CHART_SIGNER}" "${archive}"
            helm push "${archive}" "oci://${REGISTRY}/emoss08/charts"
          done
