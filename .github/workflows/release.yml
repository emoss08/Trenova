name: Release

# A release builds only the images whose inputs changed since the previous
# release (deploy/release/images.yaml) and gives every other image this
# release's tags as aliases of the digest it already has, then publishes the
# release manifest and the signed charts (docs/engineering/releases.md).
#
# A release is made by publishing a GitHub release for a vX.Y.Z tag on the
# default branch. To run one again, for example to rebuild an image whose
# inputs did not change, dispatch this workflow ON THE RELEASE'S TAG (the
# chart's signature names the workflow at a tag, and the operator refuses any
# other):
#
#   gh workflow run release.yml --ref v0.13.1 -f rebuild=imaging
#
# To retry a run whose jobs failed, use "Re-run failed jobs" on that run.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      rebuild:
        description: >-
          Images to build even when their inputs did not change: comma-separated
          names from deploy/release/images.yaml, or `all` (which also looks the
          charts' third-party images up again)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify-source:
    name: Refuse a release from outside the default branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check the released commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$GITHUB_REF is not a release tag such as refs/tags/v0.13.1; dispatch a re-run with --ref v<version>."
            exit 1
          fi
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_SHA is not on $DEFAULT_BRANCH."
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" --json tagName > /dev/null

  # Which images this release builds and which it carries forward, and why
  # (the run's summary shows the table).
  plan:
    name: Plan the release
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      build_late: ${{ steps.plan.outputs.build_late }}
      reuse: ${{ steps.plan.outputs.reuse }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Plan
        id: plan
        env:
          REBUILD: ${{ inputs.rebuild }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python3 tools/release/release.py plan --tag "$GITHUB_REF_NAME" --rebuild "${REBUILD:-}" \
            --out "$RUNNER_TEMP/plan.json"

  # Every image the plan builds, at once. The export runner, built FROM this
  # release's PostgreSQL image, waits for it (build-late).
  build:
    name: Build ${{ matrix.image }}
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/release-image
        with:
          image: ${{ matrix.image }}
          plan: ${{ needs.plan.outputs.plan }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-late:
    name: Build ${{ matrix.image }}
    needs: [plan, build]
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && needs.plan.outputs.build_late != '[]'
      && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.build_late) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/release-image
        with:
          image: ${{ matrix.image }}
          plan: ${{ needs.plan.outputs.plan }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # An image the release does not rebuild gets the release's tags on the
  # digest it already has: a registry write of seconds. The digest keeps its
  # own SBOM and provenance, which name the commit it was built from.
  alias:
    name: Tag the images carried forward
    needs: plan
    if: needs.plan.outputs.reuse != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag them
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python3 tools/release/release.py aliases --plan "$RUNNER_TEMP/plan.json" --run

  # The release manifest, once every image is on the registry: each image's
  # digest and the version it was built under, read back from the registry
  # and checked against the plan.
  manifest:
    name: Release manifest
    needs: [plan, build, build-late, alias]
    if: >-
      ${{ !cancelled()
      && needs.plan.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.build-late.result == 'success' || needs.build-late.result == 'skipped')
      && (needs.alias.result == 'success' || needs.alias.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      manifest: ${{ steps.manifest.outputs.manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assemble and validate
        id: manifest
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python3 tools/release/release.py manifest --plan "$RUNNER_TEMP/plan.json" \
            --out "$RUNNER_TEMP/release-manifest.json"
          {
            echo "manifest<<EOF_MANIFEST"
            cat "$RUNNER_TEMP/release-manifest.json"
            echo "EOF_MANIFEST"
          } >> "$GITHUB_OUTPUT"

  # The Helm charts, versioned with the release, as OCI artifacts beside the
  # images: oci://ghcr.io/emoss08/charts/trenova and trenova-operator. Each
  # carries the release manifest, so it runs every Trenova image by the digest
  # the manifest gives it, and image-digests.yaml for the third-party images
  # it names; both are inside the chart's signature.
  publish-chart:
    name: Publish Helm Chart
    needs: [plan, manifest]
    if: ${{ !cancelled() && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: the chart signature names this workflow at this tag.
      id-token: write
    env:
      CHART_SIGNER: '^https://github\.com/emoss08/[Tt]renova/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Cosign
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /tmp/cosign' | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign

      - name: Install Helm
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          echo 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496  /tmp/helm.tar.gz' | sha256sum -c -
          tar xzf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Log in to the registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          echo "${GHCR_TOKEN}" | helm registry login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      # The previous release's charts, signature checked, for the digests they
      # pinned for third-party images: a floating tag (redis:8) that moved
      # upstream between two releases is carried forward, so it restarts
      # nothing. Without them (none, or unsigned) every tag is looked up.
      - name: The previous release's charts
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          previous="$(jq -r '.previous // empty' <<< "$PLAN")"
          mkdir -p "$RUNNER_TEMP/previous"
          if [ -z "$previous" ]; then
            echo "No previous release."
            exit 0
          fi
          for chart in trenova trenova-operator; do
            dir="$RUNNER_TEMP/pulled/$chart"
            mkdir -p "$dir"
            if ! helm pull "oci://${REGISTRY}/emoss08/charts/${chart}" --version "$previous" --prov -d "$dir"; then
              echo "::warning::${chart} ${previous} could not be pulled; its third-party images are looked up again."
              continue
            fi
            archive="$dir/${chart}-${previous}.tgz"
            if ! cosign verify-blob --bundle "${archive}.prov" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "${CHART_SIGNER}" "${archive}"; then
              echo "::warning::${chart} ${previous} is not signed by this workflow; its third-party images are looked up again."
              continue
            fi
            tar xzf "$archive" -C "$RUNNER_TEMP/previous"
          done

      # The manifest into both charts, the third-party images' digests beside
      # it, and the chart's PostgreSQL tag set to the manifest's: values.yaml in
      # the repository names an older one, which no release updates.
      - name: Pin the charts' images
        env:
          MANIFEST: ${{ needs.manifest.outputs.manifest }}
          PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
          refresh=()
          if [ "$(jq -r '.refreshPins' <<< "$PLAN")" = true ]; then refresh=(--refresh); fi
          python3 tools/release/release.py pin-charts --manifest "$RUNNER_TEMP/release-manifest.json" \
            --previous "$RUNNER_TEMP/previous" "${refresh[@]}"
          grep -n -A9 '^postgres:' deploy/helm/trenova/values.yaml

      # The signature travels in the chart's own provenance layer: helm push takes
      # <archive>.prov from beside the archive, and the operator refuses a chart
      # without one (services/operator/internal/release/provenance.go, which holds
      # the same signer pattern).
      - name: Package, sign and push the charts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm lint deploy/helm/trenova --set domain=trenova.example.com --set storageDomain=storage.trenova.example.com
          helm lint deploy/helm/trenova-operator
          for chart in trenova trenova-operator; do
            archive="${RUNNER_TEMP}/${chart}-${version}.tgz"
            helm package "deploy/helm/${chart}" --version "${version}" --app-version "${version}" -d "${RUNNER_TEMP}"
            cosign sign-blob --yes --bundle "${archive}.prov" "${archive}"
            cosign verify-blob --bundle "${archive}.prov" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "${CHART_SIGNER}" "${archive}"
            helm push "${archive}" "oci://${REGISTRY}/emoss08/charts"
          done

  # Last: the control plane lists a release once its manifest is on the
  # GitHub release, so it is uploaded only when the charts it names exist.
  publish-manifest:
    name: Publish the release manifest
    needs: [manifest, publish-chart]
    if: ${{ !cancelled() && needs.publish-chart.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Upload release-manifest.json
        env:
          MANIFEST: ${{ needs.manifest.outputs.manifest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-manifest.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
