name: Test Client

on:
  push:
    branches:
      - master
    paths:
      - "client/**"
      - "services/tms/internal/api/graphql/schema/**"
      - "services/tms/internal/api/graphql/persisted-documents.json"
      # The error taxonomy is generated from these two files into
      # client/packages/shared/src/types/generated. Without them here a Go-side enum
      # change would never run codegen:check and the drift would land unnoticed.
      - "services/tms/pkg/errortypes/enums.go"
      - "services/tms/internal/api/helpers/problemtypes.go"
      - "services/tms/internal/modules/identity/domain/permission/resource_gen.go"
      # The product guide is generated from the app and these two, into a file
      # the server embeds; a guide or catalog edited alone must still be checked.
      - "docs/product-guide/**"
      - "services/tms/pkg/productguide/catalog_gen.json"
      - "services/tms/pkg/pageaccess/screens_gen.json"
      - "i18n/messages.en.json"
      - ".github/workflows/test-client.yml"
      - ".github/actions/setup-client/**"
      # The self-hosting client image (built and pushed on release).
      - "deploy/Dockerfile.client"
      - "deploy/Caddyfile"
  pull_request:
    branches:
      - master
    paths:
      - "client/**"
      - "services/tms/internal/api/graphql/schema/**"
      - "services/tms/internal/api/graphql/persisted-documents.json"
      # The error taxonomy is generated from these two files into
      # client/packages/shared/src/types/generated. Without them here a Go-side enum
      # change would never run codegen:check and the drift would land unnoticed.
      - "services/tms/pkg/errortypes/enums.go"
      - "services/tms/internal/api/helpers/problemtypes.go"
      - "services/tms/internal/modules/identity/domain/permission/resource_gen.go"
      # The product guide is generated from the app and these two, into a file
      # the server embeds; a guide or catalog edited alone must still be checked.
      - "docs/product-guide/**"
      - "services/tms/pkg/productguide/catalog_gen.json"
      - "services/tms/pkg/pageaccess/screens_gen.json"
      - "i18n/messages.en.json"
      - ".github/workflows/test-client.yml"
      - ".github/actions/setup-client/**"
      # The self-hosting client image (built and pushed on release).
      - "deploy/Dockerfile.client"
      - "deploy/Caddyfile"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The quick checks share one job: each is seconds of work after the
  # toolchain set-up. Every step after the set-up runs even when an earlier
  # one failed, so one run reports every failing check.
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up client toolchain
        id: setup
        uses: ./.github/actions/setup-client

      - name: Check GraphQL generated artifacts
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm --filter @trenova/graphql codegen:check

      # Every routed page needs a guide, every bold label in one must be text
      # the app shows, and the catalog the server embeds must match the guides.
      - name: Check the product guide
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm --filter @trenova/web guide:check

      # The screens half of the page access manifest: each route's operations
      # and REST endpoints, read from its module graph. The Go test
      # TestPageAccessManifestIsGenerated checks the half refgen writes.
      - name: Check the page access screens
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm --filter @trenova/web access:check

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm lint -- --format=github

      - name: Design tokens
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm lint:design -- --format=github

      - name: Loading skeletons
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm lint:skeletons -- --format=github

      - name: Single copies
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm check:single-copies

      # tsc -b is incremental: with the build info from an earlier run it checks again only
      # what changed since, rather than every project from cold. It compares file contents,
      # not times, so a restored build info is never trusted for a file that changed, and a
      # TypeScript upgrade discards it. It is saved only when the typecheck passes.
      - name: Restore TypeScript build info
        id: tsbuildinfo
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            client/apps/*/node_modules/.tmp
            client/packages/*/node_modules/.tmp
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm typecheck

      - name: Save TypeScript build info
        if: ${{ !cancelled() && steps.typecheck.outcome == 'success' && steps.tsbuildinfo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            client/apps/*/node_modules/.tmp
            client/packages/*/node_modules/.tmp
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}

      # The budget reads the web build the step before it wrote: what a first visit
      # downloads before anything renders.
      - name: Build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: ./client
        run: pnpm build && pnpm --filter @trenova/web bundle:check

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up client toolchain
        uses: ./.github/actions/setup-client

      - name: Test
        working-directory: ./client
        run: pnpm test

  # The release builds and pushes the self-hosting client image from
  # deploy/Dockerfile.client. It loads the vite config differently from the
  # Build step above, so it is built here too (not pushed) to fail before a
  # release rather than at it.
  client-image:
    name: Client image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.client
          push: false
          cache-from: type=gha
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=/api/v1

  storybook:
    name: Storybook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up client toolchain
        uses: ./.github/actions/setup-client

      # Browsers are pinned by the lockfile, so keying on it avoids a ~100MB
      # download on every run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        working-directory: ./client/apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook tests
        working-directory: ./client/apps/web
        run: pnpm test:storybook
