name: Test ML Pipelines

on:
  push:
    branches:
      - master
    paths:
      - "tools/extraction-finetune/**"
      - ".github/workflows/test-ml.yml"
  pull_request:
    branches:
      - master
    paths:
      - "tools/extraction-finetune/**"
      - ".github/workflows/test-ml.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extraction-finetune:
    name: Extraction fine-tuning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/extraction-finetune

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
