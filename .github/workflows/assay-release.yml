name: Assay Release

# Tag a commit on the default branch as assay/vX.Y.Z and this publishes a
# GitHub release with binaries for every supported platform. Go cross-compiles
# without CGO, so one job builds everything.

on:
  push:
    tags:
      - "assay/v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: assay-release

      - name: Test before shipping
        working-directory: tools/assay
        run: go test -count=1 ./...

      - name: Build binaries
        working-directory: tools/assay
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#assay/v}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            name="assay_${version}_${goos}_${goarch}"
            binary="assay"
            if [ "$goos" = "windows" ]; then
              binary="assay.exe"
            fi

            GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/emoss08/assay/internal/cli.Version=${version}" \
              -o "dist/${name}/${binary}" ./cmd/assay

            cp README.md "dist/${name}/"
            cp ../../LICENSE "dist/${name}/"

            if [ "$goos" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "${name}")
            fi
            rm -r "dist/${name}"
          done
          (cd dist && sha256sum -- * > "assay_${version}_checksums.txt")

      - name: Publish release
        working-directory: tools/assay
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#assay/v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "assay v${version}" \
            --notes "assay v${version} — see tools/assay/README.md for what it does and tools/assay/BENCHMARKS.md for what it costs." \
            dist/*
