name: Test Go

on:
  push:
    branches:
      - master
    paths:
      - "services/**"
      - "shared/**"
      # Go tests read the client's operations: the reference view checks
      # (gqlext) and the page access manifest (pagemanifest).
      - "client/packages/graphql/src/operations/**"
      - "dev/samsara-sim/**"
      - "dev/edi-partner-sim/**"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - "services/tms/.go-arch-lint.yml"
      - "services/tms/.go-pkgsize.yml"
      - ".github/workflows/test-tms.yml"
      - ".github/actions/setup-go/**"
      - "deploy/Dockerfile.postgres"
      - "deploy/Dockerfile.imaging"
      - "deploy/Dockerfile.imaging.dockerignore"
      - "docs/engineering/ai-tool-safety.md"
      - "docs/engineering/agent-write-coverage.md"
  pull_request:
    branches:
      - master
    paths:
      - "services/**"
      - "shared/**"
      # Go tests read the client's operations: the reference view checks
      # (gqlext) and the page access manifest (pagemanifest).
      - "client/packages/graphql/src/operations/**"
      - "dev/samsara-sim/**"
      - "dev/edi-partner-sim/**"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - "services/tms/.go-arch-lint.yml"
      - "services/tms/.go-pkgsize.yml"
      - ".github/workflows/test-tms.yml"
      - ".github/actions/setup-go/**"
      - "deploy/Dockerfile.postgres"
      - "deploy/Dockerfile.imaging"
      - "deploy/Dockerfile.imaging.dockerignore"
      - "docs/engineering/ai-tool-safety.md"
      - "docs/engineering/agent-write-coverage.md"
  # Race Detection only, weekly: it takes about 90 minutes.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The image the "Build the imaging worker image" steps load.
  TRENOVA_IMAGING_TEST_IMAGE: trenova-imaging:ci
  # Must match GO_TAGS in services/tms/Taskfile.yml. 769 of 832 packages depend
  # on gin, so a job that builds under a different tag set shares no build cache
  # with the others. Steps passing -tags on the command line override this
  # rather than merging, so they spell nomsgpack out themselves.
  GOFLAGS: -tags=nomsgpack
  # Both test harnesses reuse this server, so the migrated template database is
  # built once for the whole run instead of once per package.
  TRENOVA_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/trenova_test?sslmode=disable
  TRENOVA_TEST_REDIS_ADDR: localhost:6379
  APP_ENV: test

jobs:
  unit-tests:
    name: Unit Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    env:
      # The agent eval gates' hybrid ranking reads
      # evals/embeddings/nomic-embed-text.json and skips until it is recorded;
      # set the repository variable TRENOVA_EVAL_REQUIRE_HYBRID to true once it
      # is, so a missing fixture fails.
      TRENOVA_EVAL_REQUIRE_HYBRID: ${{ vars.TRENOVA_EVAL_REQUIRE_HYBRID || 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: ./.github/actions/setup-go

      # Also the build check: -coverprofile compiles every package of the four
      # modules, test-less and main packages included. If coverage is ever
      # dropped here, add `go build ./...` for each module in its place.
      - name: Run unit tests
        run: |
          set -euo pipefail
          for module in shared services/tms dev/samsara-sim dev/edi-partner-sim; do
            echo "::group::${module}"
            (cd "$module" && go test -coverprofile=coverage-unit.out -covermode=atomic ./...)
            echo "::endgroup::"
          done

      # The agent eval gates ran above with the rest of the module; this writes
      # what they measured to the run summary.
      - name: Agent eval summary
        if: ${{ !cancelled() }}
        working-directory: ./services/tms
        run: |
          set -euo pipefail
          go test -v -run 'AgainstFloors' ./internal/modules/agent/app/agentevalgate/ \
            > "$RUNNER_TEMP/selection.log"
          go test -v ./internal/modules/agent/app/agentredteam/ > "$RUNNER_TEMP/redteam.log"
          {
            echo "## Tool selection, development and held-out"
            echo
            grep -oE '(find_tools|agent_find_page) by [^:]+: recall@5 [0-9.]+, top-1 [0-9.]+ over [0-9]+ requests' \
              "$RUNNER_TEMP/selection.log" | sed 's/^/- /' || echo "Not reported."
            echo
            echo "## Red-team known gaps"
            echo
            if grep -q 'KNOWN GAP' "$RUNNER_TEMP/redteam.log"; then
              grep -o 'KNOWN GAP [a-z-]*' "$RUNNER_TEMP/redteam.log" | sort | uniq -c \
                | sed 's/^/- /'
            else
              echo "None reproduced."
            fi
            echo
            echo "## Stale recordings"
            echo
            if grep -q 'stale recording' "$RUNNER_TEMP/redteam.log"; then
              grep -o 'stale recording: [^ ]*' "$RUNNER_TEMP/redteam.log" | sort -u \
                | sed 's/^/- /'
            else
              echo "None."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-unit-coverage
          path: |
            shared/coverage-unit.out
            services/tms/coverage-unit.out
          if-no-files-found: error

  integration-tests:
    name: Integration Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    # Postgres is not a service container here: it runs the image built from
    # deploy/Dockerfile.postgres (PostGIS + pg_cron + pgvector), which only
    # exists once a step has built it. Nothing is pushed to a registry.
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Vector tests fail rather than skip when the capability is missing, so a
      # broken image cannot turn this job into a second fallback run.
      TRENOVA_TEST_EXPECT_VECTOR: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Postgres image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile.postgres
          push: false
          load: true
          tags: trenova-postgres:ci
          cache-from: type=gha,scope=trenova-postgres
          cache-to: type=gha,mode=max,scope=trenova-postgres

      - name: Start Postgres
        run: |
          set -euo pipefail
          docker run -d --name trenova-test-postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=trenova_test \
            -p 5432:5432 \
            trenova-postgres:ci \
            postgres -c max_connections=300
          for _ in $(seq 1 60); do
            if docker exec trenova-test-postgres pg_isready -U postgres -d trenova_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs trenova-test-postgres
          echo "::error::Postgres did not become ready"
          exit 1

      - name: Build the imaging worker image
        # The imaging integration tests start it with testcontainers
        # (internal/testutil/imagingtest). It reads the cache rust.yml writes.
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./deploy/Dockerfile.imaging
          target: runtime
          push: false
          load: true
          tags: trenova-imaging:ci
          cache-from: type=gha,scope=imaging-runtime

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: integration

      - name: Run integration tests
        working-directory: ./services/tms
        env:
          # Every distinct statement the suite sends, for the plan guard below.
          KEEL_SHAPES: ${{ runner.temp }}/keel-shapes.jsonl
        run: |
          set -euo pipefail
          # Only packages that actually carry integration-tagged files; the rest
          # already ran in the unit job and re-running them wastes minutes.
          mapfile -t packages < <(
            git grep -l 'go:build integration' -- '*_test.go' \
              | xargs -n1 dirname | sort -u | sed 's|^|./|'
          )
          printf 'integration packages: %d\n' "${#packages[@]}"
          # Cap package parallelism: every process creates databases on the one
          # shared server, and the runner only has two cores anyway.
          go test -p 4 -tags=integration,nomsgpack -coverprofile=coverage-integration.out \
            -covermode=atomic "${packages[@]}"

      - name: Plan guard
        working-directory: ./services/tms
        # Explains every statement the suite above sent against a database with
        # volume data and fresh statistics (PostgreSQL 18 here; keel plans needs
        # 16+), and fails on a sequential scan of a large table or a page sorted
        # without an index. Locally: task db-plans.
        env:
          KEEL_SHAPES: ${{ runner.temp }}/keel-shapes.jsonl
          PLANS_CONTAINER: trenova-test-postgres
          PLANS_SHIPMENTS: "20000"
          TRENOVA_DATABASE_HOST: localhost
          TRENOVA_DATABASE_PORT: "5432"
          TRENOVA_DATABASE_USER: postgres
          TRENOVA_DATABASE_PASSWORD: postgres
          TRENOVA_DATABASE_SSLMODE: disable
        run: ./scripts/dbplans/dbplans.sh

      - name: Run shared test utility integration tests
        working-directory: ./shared
        # After the service packages, because these tests hold every leasable
        # Redis database for a moment.
        run: go test -tags=integration ./testutil/...

      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-integration-coverage
          path: services/tms/coverage-integration.out
          if-no-files-found: error

      # The tail only: the server log runs to thousands of lines, and a full dump
      # pushes the failing step's output (the plan guard's findings) out of the
      # job log's tail.
      - name: Postgres logs
        if: failure()
        run: docker logs --tail 300 trenova-test-postgres || true

  # The keyword-only fallback: every migration applies on plain PostGIS with no
  # pgvector, and the retrieval storage reports itself unavailable instead of
  # failing. This is what an installation without the extension runs.
  integration-tests-fallback:
    name: Integration Tests (no pgvector)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    services:
      # The base image of deploy/Dockerfile.postgres without the extensions
      # built on top, so the fallback runs on the same server version.
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trenova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TRENOVA_TEST_EXPECT_VECTOR: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: integration

      - name: Run retrieval storage tests without pgvector
        working-directory: ./services/tms
        run: |
          set -euo pipefail
          go test -p 2 -tags=integration,nomsgpack \
            ./internal/modules/agent/adapters/postgres/airetrievalrepository/... \
            ./internal/infrastructure/postgres/schemalint/...

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Go
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-key: lint
          save-build-cache: "false"

      # golangci-lint-action keys its analysis cache by go.mod and a 7-day
      # interval and skips the save on a primary-key hit, so the first run of
      # an interval fixes the cache for a week: on this repository a 6 KB stub
      # that held no analysis. The analysis cache lives beside the build cache
      # here, restored from the newest run and saved by every run, failed or
      # not, so a run that times out still leaves the next one warm.
      - name: Restore golangci-lint analysis cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: Determine lint base
        id: lint-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
            echo "value=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ./services/tms
          verify: false
          skip-cache: true
          # Typechecking the whole module is unavoidable even with
          # --new-from-rev. With both caches warm a run takes about 5 minutes
          # (the analyzers about 1.5 of them); cold, compiling the module alone
          # takes about 14 minutes on four cores, so 20 minutes left no room
          # for the analysis. 40 covers a cold run with margin.
          args: --timeout=40m --new-from-rev=${{ steps.lint-base.outputs.value }}

      - name: Save golangci-lint analysis cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ github.sha }}

      # The steps below run even when golangci-lint failed, so one run reports
      # every failing check.
      - name: Run go-arch-lint
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        working-directory: ./services/tms
        run: go run ./scripts/archlint

      - name: Run pkgsizelint
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        working-directory: ./services/tms
        run: go run ./scripts/pkgsizelint

      # Generated code is up to date: each step regenerates one artifact and
      # fails when the result differs from what is committed.
      - name: GraphQL server generated code
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        working-directory: ./services/tms
        run: |
          set -euo pipefail
          # The same generator `task gqlgen` runs: models, resolver stubs and
          # the sharded executor, followed by a build of the result.
          go run ./internal/api/graphql/gqlexec/gen
          # The executor's own end-to-end fixture is generated by the same
          # templates, so a template change must regenerate it too.
          (cd internal/api/graphql/gqlexec/internal/e2e && go run github.com/emoss08/trenova/internal/api/graphql/gqlexec/gen)
          # The agent read path's executor and tool bindings are written from the
          # executor above and the persisted operations.
          go run ./internal/api/graphql/agentread/gen
          # Each schema file gets its own executor package, so a new schema file
          # produces new *untracked* generated files that git diff cannot see.
          PATHS="internal/api/graphql/generated internal/api/graphql/gqlmodel internal/api/graphql/resolver internal/api/graphql/gqlexec/internal/e2e internal/api/graphql/agentread internal/modules/agent/app/querytools/graphqlread/graphqlreads_gen.go"
          if [ -n "$(git status --porcelain -- $PATHS)" ]; then
            echo "::error::GraphQL server code is stale - run 'task gqlgen' and commit"
            git status --porcelain -- $PATHS
            exit 1
          fi

      - name: GraphQL schema breaking changes
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' && github.event_name == 'pull_request' }}
        working-directory: ./services/tms
        env:
          BASE_REF: ${{ github.base_ref }}
          # A PR labelled graphql-breaking-approved still reports every change as an
          # annotation but no longer fails on breaking ones; use it for deliberate
          # redesigns that ship with the regenerated client in the same PR.
          BREAKING_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'graphql-breaking-approved') }}
        run: |
          set -euo pipefail
          # The checkout is shallow, so fetch just the tip of the base branch
          # for git archive to read the base schema from.
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE_DIR="$(mktemp -d)"
          git archive "origin/$BASE_REF" internal/api/graphql/schema | tar -x -C "$BASE_DIR"
          if go run ./internal/api/graphql/schemadiff/cmd -github-annotations -base "$BASE_DIR/internal/api/graphql/schema" -head internal/api/graphql/schema; then
            exit 0
          fi
          if [ "$BREAKING_APPROVED" = "true" ]; then
            echo "::notice::Breaking GraphQL schema changes accepted via the graphql-breaking-approved label"
            exit 0
          fi
          exit 1

      - name: Schema version stamp
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        working-directory: ./services/tms
        run: |
          set -euo pipefail
          # The API and worker refuse a database behind schema.Version, so the
          # stamp must name the newest migration.
          if ! go run ./cmd/db migrate stamp -check -plain; then
            echo "::error::services/tms/schema/version_gen.go is stale - run 'task db-stamp' and commit"
            exit 1
          fi

      - name: Migrations against the base branch
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' && github.event_name == 'pull_request' }}
        working-directory: ./services/tms
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:services/tms/schema/migrations" 2>/dev/null; then
            echo "::notice::The base branch has no keel migrations yet; nothing to compare"
            exit 0
          fi
          BASE_DIR="$(mktemp -d)"
          git archive "origin/$BASE_REF" schema/migrations | tar -x -C "$BASE_DIR"
          # Fails on a migration older than the newest one on the base branch,
          # and on an edited or deleted migration the base branch already has.
          if ! go run ./cmd/db migrate check -plain -base-dir "core=$BASE_DIR/schema/migrations"; then
            echo "::error::Give a new migration a version newer than every migration on $BASE_REF, and fix an applied one with a new migration rather than an edit"
            exit 1
          fi

      - name: GraphQL projections
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        working-directory: ./services/tms
        run: |
          set -euo pipefail
          go generate ./internal/api/graphql/projection/...
          if ! git diff --quiet -- internal/api/graphql/projection/specs_gen.go; then
            echo "::error::GraphQL projection specs are stale - run 'go generate ./internal/api/graphql/projection/...' and commit"
            git diff --stat -- internal/api/graphql/projection/specs_gen.go
            exit 1
          fi

      - name: keel tables
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        working-directory: ./services/tms
        run: |
          set -euo pipefail
          if ! go tool keel gen -check -acronyms ID,URL,API,JSON,UUID,GL,IFTA,BOL,EDI,PRO,DOT,MC,PDF,VIN,CDL,TWIC,MVR,PTO,YTD,SCAC,ETA,CSV,UN,FX,ELD,SFTP,NOA,ACH,EIN,FLSA -kinds pkg/keelkinds -tables internal/keeltables ./internal/modules/.../domain/...; then
            echo "::error::keel table packages are stale - run 'task keel-gen' in services/tms and commit"
            exit 1
          fi

      - name: AI tool safety document
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        working-directory: ./services/tms
        run: |
          set -euo pipefail
          go generate ./internal/modules/agent/app/agenttoolpolicy/safetydoc/...
          if ! git diff --exit-code -- ../../docs/engineering/ai-tool-safety.md; then
            echo "::error::docs/engineering/ai-tool-safety.md is stale - run 'go generate ./internal/modules/agent/app/agenttoolpolicy/safetydoc/...' in services/tms and commit"
            exit 1
          fi

      - name: Agent write coverage
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        working-directory: ./services/tms/internal/api/writecoverage
        run: |
          set -euo pipefail
          # Fails when a mutation or write route has no decision in
          # writecoverage.yml, an entry names a missing write or tool, an
          # exemption has no reason, or the document is stale. Pending writes
          # are counted, never failed.
          if ! go run -tags nomsgpack ./gen -check -output=../../../../../docs/engineering/agent-write-coverage.md; then
            echo "::error::Agent write coverage needs attention - fix services/tms/internal/api/writecoverage/writecoverage.yml as the messages above say, run 'go generate ./internal/api/writecoverage/...' in services/tms and commit"
            exit 1
          fi

      # Last, so the cache holds what golangci-lint and the generators compiled.
      - name: Save Go build output
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-1.26-lint-${{ github.sha }}

  race-detection:
    name: Race Detection
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trenova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the imaging worker image
        # The imaging integration tests start it with testcontainers
        # (internal/testutil/imagingtest). It reads the cache rust.yml writes.
        uses: docker/build-push-action@v6
        with:
          context: ./services
          file: ./deploy/Dockerfile.imaging
          target: runtime
          push: false
          load: true
          tags: trenova-imaging:ci
          cache-from: type=gha,scope=imaging-runtime

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: race

      - name: Run shared module race tests
        working-directory: ./shared
        run: go test -race ./...

      - name: Run TMS race tests
        working-directory: ./services/tms
        run: go test -p 4 -race -tags=integration,nomsgpack ./...
