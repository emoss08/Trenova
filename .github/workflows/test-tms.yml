name: Test Go

on:
  push:
    branches:
      - master
      - main
      - develop
      - "claude/**"
    paths:
      - "services/**"
      - "shared/**"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - ".github/workflows/test-tms.yml"
      - ".github/actions/setup-go/**"
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - "services/**"
      - "shared/**"
      - "go.work"
      - "go.work.sum"
      - ".golangci.yml"
      - ".github/workflows/test-tms.yml"
      - ".github/actions/setup-go/**"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Both test harnesses reuse this server, so the migrated template database is
  # built once for the whole run instead of once per package.
  TRENOVA_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/trenova_test?sslmode=disable
  TRENOVA_TEST_REDIS_ADDR: localhost:6379
  APP_ENV: test

jobs:
  unit-tests:
    name: Unit Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Run unit tests
        run: |
          set -euo pipefail
          for module in shared services/tms services/gtc services/samsara-sim services/edi-partner-sim; do
            echo "::group::${module}"
            (cd "$module" && go test -coverprofile=coverage-unit.out -covermode=atomic ./...)
            echo "::endgroup::"
          done

      - name: Upload unit coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-unit-coverage
          path: |
            shared/coverage-unit.out
            services/tms/coverage-unit.out
            services/gtc/coverage-unit.out
          if-no-files-found: error

  integration-tests:
    name: Integration Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    services:
      # PostGIS, not plain postgres: the migrations create spatial types.
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: integration

      - name: Run integration tests
        working-directory: ./services/tms
        run: |
          set -euo pipefail
          # Only packages that actually carry integration-tagged files; the rest
          # already ran in the unit job and re-running them wastes minutes.
          mapfile -t packages < <(
            git grep -l 'go:build integration' -- '*_test.go' \
              | xargs -n1 dirname | sort -u | sed 's|^|./|'
          )
          printf 'integration packages: %d\n' "${#packages[@]}"
          # Cap package parallelism: every process creates databases on the one
          # shared server, and the runner only has two cores anyway.
          go test -p 4 -tags=integration -coverprofile=coverage-integration.out \
            -covermode=atomic "${packages[@]}"

      - name: Upload integration coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-integration-coverage
          path: services/tms/coverage-integration.out
          if-no-files-found: error

  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: lint

      - name: Determine lint base
        id: lint-base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
            echo "value=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ./services/tms
          verify: false
          # Typechecking the whole module is unavoidable even with
          # --new-from-rev, so the timeout has to cover a cold analysis cache.
          args: --timeout=20m --new-from-rev=${{ steps.lint-base.outputs.value }}

  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build every workspace module
        run: |
          set -euo pipefail
          for module in shared services/tms services/gtc services/samsara-sim services/edi-partner-sim; do
            echo "::group::${module}"
            (cd "$module" && go build ./...)
            echo "::endgroup::"
          done

  race-detection:
    name: Race Detection
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trenova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-key: race

      - name: Run shared module race tests
        working-directory: ./shared
        run: go test -race ./...

      - name: Run TMS race tests
        working-directory: ./services/tms
        run: go test -p 4 -race -tags=integration ./...
