name: Dependency scan

# A pull request is refused when it adds a dependency with a known high or
# critical vulnerability. Every lockfile is also checked against OSV when one
# changes on master and each week, because an advisory can land on a dependency
# nobody touched.

on:
  pull_request:
    branches:
      - master
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - "**/Cargo.lock"
      - "**/bun.lock"
      - ".github/workflows/dependency-scan.yml"
  push:
    branches:
      - master
    paths:
      - "**/go.mod"
      - "**/go.sum"
      - "**/Cargo.lock"
      - "**/bun.lock"
      - ".github/workflows/dependency-scan.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: New dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  osv:
    name: Known vulnerabilities
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OSV-Scanner
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner' | sha256sum -c -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner

      # The operator is its own Go module outside go.work, so its call analysis
      # (govulncheck) runs with the workspace off; inside the workspace it
      # cannot load the module and reports every advisory as reachable.
      - name: Scan every lockfile
        run: |
          status=0
          osv-scanner scan source \
            --lockfile services/tms/go.mod \
            --lockfile shared/go.mod \
            --lockfile client/bun.lock \
            --lockfile services/Cargo.lock \
            --lockfile desktop/capture/Cargo.lock || status=$?
          GOWORK=off osv-scanner scan source \
            --lockfile services/operator/go.mod || status=$?
          exit "$status"
