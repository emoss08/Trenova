coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 5%
    patch:
      default:
        target: 60%

ignore:
  - "services/tms/cmd/**/*"
  - "services/tms/internal/seeds/fixtures/**/*"
  - "services/tms/internal/seeds/volume/**/*"
  - "services/tms/internal/infrastructure/observability/**/*"
  - "services/tms/internal/pkg/domainregistry/**/*"

  - "services/tms/internal/modules/*/domain/**/*"
  - "shared/testutil/**/*"
  - "**/*_gen.go"
  - "**/*_generated.go"
  - "**/mocks/**/*"
  - "**/*_mock.go"
