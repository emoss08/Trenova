name: a 214 the partner rejects escalates
within: 10s
steps:
  - send: { set: "204", as: t1 }
  - trenova: { decide: t1, decision: accept }
  - acks: { about: t1, set: "214", action: reject }
  - trenova: { dispatch: t1 }
  - trenova: { arrive: t1, stop: 1 }
  - expect: { wire: "214", about: t1, statuses: [X3] }
  - expect: { flow: t1, status: Escalated, why: rejected }
