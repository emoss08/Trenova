name: a tender over SFTP is accepted, delivered and invoiced, every document 999-acknowledged
description: >
  Tamberlane drops a 204 in its SFTP mailbox; Trenova picks it up, answers with a 999 and, once a
  planner accepts, a 990. The load's stop events go out as 214s with AT7 codes and the posted
  invoice as a 210, and Tamberlane's 999s reconcile each of them.
within: 4m
steps:
  - send: { set: "204", as: t1, load: { maxWeight: 43500 } }
  - expect: { ack: t1, accepted: true }
  - expect: { wire: "999", about: t1, count: 1 }
  - trenova: { decide: t1, decision: accept }
  - expect: { wire: "990", about: t1, elements: { B1-04: A } }
  - trenova: { dispatch: t1 }
  - trenova: { deliver: t1 }
  - advance: { about: t1, by: 15m }
  - expect: { wire: "214", about: t1, statuses: [X3, AF, X1, D1] }
  - trenova: { invoice: t1 }
  - expect: { wire: "210", about: t1, total: tendered }
  - expect: { reconciled: t1, within: 8m }
