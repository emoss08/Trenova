name: a 214 Tamberlane rejects with IK5 R escalates at once
steps:
  - send: { set: "204", as: t1, load: { maxWeight: 43500 } }
  - expect: { ack: t1 }
  - trenova: { decide: t1, decision: accept }
  - expect: { wire: "990", about: t1 }
  - acks: { about: t1, set: "214", action: reject }
  - trenova: { dispatch: t1 }
  - trenova: { arrive: t1, stop: 1 }
  - advance: { about: t1, by: 15m }
  - expect: { wire: "214", about: t1 }
  - expect: { flow: t1, status: Escalated, why: rejected, within: 8m }
