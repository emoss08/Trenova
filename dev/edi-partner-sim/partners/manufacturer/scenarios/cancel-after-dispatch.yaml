name: a cancellation after dispatch is held, and the load keeps moving
steps:
  - send: { set: "204", as: t1 }
  - expect: { ack: t1 }
  - trenova: { decide: t1, decision: accept }
  - expect: { wire: "990", about: t1 }
  - trenova: { dispatch: t1 }
  - send: { set: "204", variation: cancel, of: t1 }
  - expect: { ack: t1 }
  - expect: { flow: t1, status: Held, why: after dispatch }
  - expect: { trenova: { shipment: t1, status: Assigned } }
