name: a cancellation before dispatch cancels the load
steps:
  - send: { set: "204", as: t1 }
  - expect: { ack: t1 }
  - trenova: { decide: t1, decision: accept }
  - expect: { wire: "990", about: t1, elements: { B1-04: A } }
  - send: { set: "204", variation: cancel, of: t1 }
  - expect: { ack: t1 }
  - expect: { trenova: { shipment: t1, status: Canceled } }
  - expect: { wire: "214", about: t1, none: true, within: 1m }
