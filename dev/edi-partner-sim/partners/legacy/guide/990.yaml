set: "990"
version: "004010"
group: GF
title: "Ashgrove Industrial Supply Tender Response (1998)"

segments:
  ST:
    name: Transaction Set Header
    elements:
      - { pos: 1, name: Transaction Set Identifier Code, type: ID, min: 3, max: 3, usage: M, fixed: "990" }
      - { pos: 2, name: Transaction Set Control Number, type: AN, min: 4, max: 9, usage: M }
  B1:
    name: Beginning Segment for Booking or Pick-up/Delivery
    elements:
      - { pos: 1, name: Standard Carrier Alpha Code, type: ID, min: 2, max: 4, usage: M, fixed: TRNV }
      - { pos: 2, name: Ashgrove Load Number, type: AN, min: 7, max: 7, usage: M }
      - { pos: 3, name: Response Date, type: DT, min: 8, max: 8, usage: M }
      - { pos: 4, name: Reservation Action Code, type: ID, min: 1, max: 1, usage: M, codes: [A, D] }
  SE:
    name: Transaction Set Trailer
    elements:
      - { pos: 1, name: Number of Included Segments, type: N0, min: 1, max: 10, usage: M }
      - { pos: 2, name: Transaction Set Control Number, type: AN, min: 4, max: 9, usage: M }

structure:
  - { seg: ST, usage: M }
  - { seg: B1, usage: M }
  - { seg: SE, usage: M }
