name: the same tender resent byte for byte builds one load and one answer
description: >
  Ashgrove resends a tender with the original's exact bytes and control numbers. Trenova still
  follows one flow, and the planner's acceptance is answered once.
steps:
  - send: { set: "204", as: t1 }
  - expect: { ack: t1 }
  - send: { set: "204", variation: duplicate, of: t1 }
  - expect: { flow: t1, count: 1, within: 1m }
  - trenova: { decide: t1, decision: accept }
  - expect: { wire: "990", about: t1, elements: { B1-04: A } }
  - expect: { wire: "990", about: t1, none: true, within: 1m }
  - expect: { flow: t1, count: 1 }
