# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  tms:
    taskfile: ./services/tms/Taskfile.yml
    dir: ./services/tms
  samsara:
    taskfile: ./dev/samsara-sim/Taskfile.yml
    dir: ./dev/samsara-sim

tasks:
  default:
    desc: Show available top-level tasks
    cmds:
      - task --list

  help:
    desc: Show available top-level tasks
    cmds:
      - task --list

  list:
    desc: Show namespaced service tasks
    cmds:
      - task --list-all
      - echo ''
      - echo 'Examples:'
      - echo '  task tms:run'
      - echo '  task tms:test'

  i18n:
    desc: Extract user-facing strings, refresh the translation catalogs and emit the runtime catalogs
    dir: '{{.ROOT_DIR}}'
    cmds:
      - node i18n/tools/i18n.mjs sync
      - node i18n/tools/i18n.mjs emit

  i18n-report:
    desc: Show the translation inventory (add --rejected to audit the string filter)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - node i18n/tools/i18n.mjs report {{.CLI_ARGS}}

  i18n-codemod:
    desc: 'Wrap user-facing literals in t() under a directory: task i18n-codemod -- <dir> --write'
    dir: '{{.ROOT_DIR}}'
    cmds:
      - node i18n/tools/i18n.mjs codemod {{.CLI_ARGS}}

  i18n-test:
    desc: Run the extraction and codemod tool tests
    dir: '{{.ROOT_DIR}}'
    cmds:
      - node --test 'i18n/tools/*.test.mjs'

  i18n-check:
    desc: Verify every locale catalog is complete and up to date
    dir: '{{.ROOT_DIR}}'
    cmds:
      - node i18n/tools/i18n.mjs check

  imaging:corpus:
    desc: Generate the imaging benchmark corpus into .imagingbench/corpus
    dir: '{{.ROOT_DIR}}'
    cmds:
      - uv run -q --with pillow --with pillow-heif --with reportlab --with qrcode --with numpy python3 -I tools/docling-fixtures/corpus.py .imagingbench/corpus

  imaging:bench-go:
    desc: Run the Go imaging benchmark in a 4-CPU container and write .imagingbench/results/go.json
    dir: '{{.ROOT_DIR}}'
    vars:
      RESULTS: '{{.RESULTS | default "go.json"}}'
      LABEL: '{{.LABEL | default "Go"}}'
    cmds:
      - mkdir -p .imagingbench/bin .imagingbench/results
      - docker build -q -t trenova-imagingbench-go:local -f services/tms/internal/testutil/imagingbench/runner.Dockerfile services/tms/internal/testutil/imagingbench
      - cd services/tms && CGO_ENABLED=0 nice go test -p 4 -c -tags imagingbench,nomsgpack -o ../../.imagingbench/bin/gobench.test {{.PACKAGES | default "./internal/testutil/imagingbench/..."}}
      - >-
        docker run --rm --cpus 4 --memory 8g -u "$(id -u):$(id -g)" -e HOME=/tmp -e GOMAXPROCS=4
        -e TRENOVA_IMAGING_CORPUS=/corpus -e TRENOVA_IMAGING_RESULTS=/results/{{.RESULTS}}
        -e "TRENOVA_IMAGING_LABEL={{.LABEL}}" {{.DOCKER_ARGS}}
        -v "$PWD/.imagingbench/corpus:/corpus:ro" -v "$PWD/.imagingbench/results:/results"
        -v "$PWD/.imagingbench/bin:/bench-bin:ro" trenova-imagingbench-go:local
        /bench-bin/gobench.test -test.v -test.timeout 90m {{.CLI_ARGS}}
