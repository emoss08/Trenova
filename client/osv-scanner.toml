[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2027-02-05
reason = "picomatch has no fixed release (4.0.7 is the latest and last affected); 2.3.2 and 4.0.7 are reached only through build, lint and test tooling (Vite, Vitest, Storybook, ESLint, GraphQL Codegen, the shadcn CLI, lint-staged) that matches globs written in this repository against its own paths; the client ships as static files served by Caddy, so no glob a person controls ever reaches picomatch; the fix is a picomatch release that analyzes single-branch repeated extglobs"
