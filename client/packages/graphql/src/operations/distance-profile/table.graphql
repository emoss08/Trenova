fragment DistanceProfileTableRowFields on DistanceProfile {
  id
  businessUnitId
  organizationId
  name
  description
  status
  isDefault
  provider
  dataVersion
  region
  routingType
  distanceUnits
  locationGranularity
  profileName
  highwayOnly
  tollRoads
  bordersOpen
  includeTollData
  version
  createdAt
  updatedAt
}

query DistanceProfileTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  distanceProfiles(input: $input) {
    edges {
      node {
        ...DistanceProfileTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
