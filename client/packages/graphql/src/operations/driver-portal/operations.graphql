    createdAt
    updatedAt
    worker {
      id
      firstName
      lastName
    }
    settlement {
      id
      settlementNumber
      status
      periodStart
      periodEnd
      netPayMinor
      grossEarningsMinor
      deductionsMinor
      currencyCode
    }
    settlementLine {
      id
      lineNumber
      category
      description
      amountMinor
      proNumber
    }
    resolvedBy {
      id
      name
    }
  }
}

