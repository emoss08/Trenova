query SettlementDisputeTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  settlementDisputes(input: $input) {
    edges {
      node {
        id
        settlementId
        settlementLineId
        workerId
        status
        category
        description
        resolutionNote
        resolvedAt
        createdAt
        updatedAt
        version
        worker {
          id
          firstName
          lastName
        }
        settlement {
          id
          settlementNumber
          netPayMinor
          currencyCode
          status
        }
        resolvedBy {
          id
          name
        }
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query SettlementDisputeDetail($id: ID!) {
  settlementDispute(id: $id) {
