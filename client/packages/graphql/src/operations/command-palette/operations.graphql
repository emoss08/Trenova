# The command palette's customer preview: who the customer is, where they
# stand on credit and who their invoices go to, without the rest of the
# billing and email profiles the edit panel loads.
query CommandPaletteCustomerPreview($id: ID!) {
  customer(id: $id) {
    id
    status
    code
    name
    addressLine1
    city
    postalCode
    updatedAt
    state {
      abbreviation
    }
    billingProfile {
      paymentTerm
      creditStatus
      creditLimit
      creditBalance
      invoiceDelivery
      billingCycle
    }
    emailProfile {
      toRecipients
    }
  }
}
