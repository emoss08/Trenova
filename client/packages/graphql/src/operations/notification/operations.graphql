fragment NotificationFields on Notification {
  id
  organizationId
  businessUnitId
  targetUserId
  eventType
  priority
  channel
  title
  message
  data
  relatedEntities
  source
  readAt
  dismissedAt
  createdAt
  reason
  occurrenceCount
  surfacesAt
  resolvedAt
  resolution
}

query NotificationList(
  $input: DataTableConnectionInput!
  $filter: NotificationFilterInput
  $includeTotalCount: Boolean = true
) {
  notifications(input: $input, filter: $filter) {
    edges {
      node {
        ...NotificationFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query NotificationCounts {
  notificationCounts {
    forYou
    forYouUnread
    team
    teamUnread
    later
  }
}

query MyNotificationList(
  $input: DataTableConnectionInput!
  $filter: NotificationFilterInput
  $includeTotalCount: Boolean = true
) {
  myNotifications(input: $input, filter: $filter) {
    edges {
      node {
        ...NotificationFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query MyNotificationUnreadCount {
  myNotificationUnreadCount
}

mutation MarkAllMyNotificationsRead {
  markAllMyNotificationsRead
}

mutation MarkMyNotificationsRead($ids: [ID!]!) {
  markMyNotificationsRead(ids: $ids)
}

mutation MarkMyNotificationsUnread($ids: [ID!]!) {
  markMyNotificationsUnread(ids: $ids)
}

mutation DismissMyNotifications($ids: [ID!]!) {
  dismissMyNotifications(ids: $ids)
}

mutation RestoreMyNotifications($ids: [ID!]!) {
  restoreMyNotifications(ids: $ids)
}

mutation MarkNotificationsRead($ids: [ID!]!) {
  markNotificationsRead(ids: $ids)
}

mutation MarkNotificationsUnread($ids: [ID!]!) {
  markNotificationsUnread(ids: $ids)
}

mutation DismissAllNotifications($lens: NotificationLens!) {
  dismissAllNotifications(lens: $lens)
}

mutation SnoozeNotifications($ids: [ID!]!, $until: Timestamp!) {
  snoozeNotifications(ids: $ids, until: $until)
}

mutation WakeNotifications($ids: [ID!]!) {
  wakeNotifications(ids: $ids)
}

mutation DismissNotifications($ids: [ID!]!) {
  dismissNotifications(ids: $ids)
}

mutation RestoreNotifications($ids: [ID!]!) {
  restoreNotifications(ids: $ids)
}
