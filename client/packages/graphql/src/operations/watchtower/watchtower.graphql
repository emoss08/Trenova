fragment WatchtowerItemFields on WatchtowerItem {
  id
  sourceKind
  sourceId
  severity
  title
  summary
  subjectType
  subjectId
  eventKind
  path
  occurredAt
  resolvedAt
  seen
  kindLabel
  version
  status
  assigneeId
  assignee {
    id
    name
  }
  dueAt
  overdue
  snoozedUntil
  acknowledgedAt
  resolutionCode
  resolutionNote
  resolvedById
  resolvedBy {
    id
    name
  }
  sourceClearedAt
  escalationLevel
  lastEscalatedAt
  dueLabel
  dueSource
  record {
    kind
    noun
    label
  }
  facts {
    label
    value
    at
  }
  impact
  trail {
    at
    text
  }
  panel {
    kind
    stop {
      role
      verdict
      place
      windowEnd
      estimatedAt
      arrivedAt
      lastHeardAt
      milesRemaining
      stale
    }
    clock {
      place
      customer
      arrivedAt
      freeEndsAt
      departedAt
      freeMinutes
      billableMinutes
      accrued
    }
    paper {
      customer
      deliveredAt
      papers {
        name
        onFile
      }
      holds
    }
    message {
      fromName
      fromAddress
      subject
      readAs
      why
      receivedAt
      held
    }
    expiry {
      who
      papers {
        name
        expiresAt
        daysLeft
      }
    }
    coverage {
      startsAt
      reason
      exhausted
      endedAt
    }
    contact {
      who
      lastHeardAt
      everyHours
      dueAt
    }
    run {
      agent
      reason
      failedAt
    }
    books {
      system
      count
      since
      expiresAt
      down
    }
    money {
      stake
      party
      amount
      count
      dueAt
      reason
    }
    change {
      who
      what
      from
      to
      ref
      at
    }
    ask {
      category
      tried
    }
    finding {
      advice
      detail
    }
    file {
      name
      reason
      receivedAt
    }
    sighting {
      departure
      place
      seenAt
      why
    }
  }
  suggestedAgentId
  suggestedAgent {
    id
    name
    description
    icon
    accent
    template
  }
  agentWork {
    agentId
    runId
    status
    step
    steps
    note
    failed
    handedAt
    agent {
      id
      name
      description
      icon
      accent
      template
    }
  }
}

fragment WatchtowerAgentFields on AgentDefinition {
  id
  name
  description
  icon
  accent
  template
}

fragment WatchtowerCountsFields on WatchtowerCounts {
  unresolved
  critical
  active
  activeCritical
  unseen
  unseenCritical
  overdue
  unassigned
  mine
  mineOverdue
  withAgents
  seenAt
  byKind {
    kind
    label
    count
    deskLens
  }
}

query WatchtowerFeed($input: WatchtowerItemsInput!) @requiresRead(kind: "agent_definition") {
  watchtowerItems(input: $input) {
    edges {
      cursor
      node {
        ...WatchtowerItemFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    seenAt
  }
}

query WatchtowerCounts {
  watchtowerCounts {
    ...WatchtowerCountsFields
  }
}

mutation HandOffWatchtowerItem($id: ID!, $input: HandOffWatchtowerItemInput!) @requiresRead(kind: "agent_definition") {
  handOffWatchtowerItem(id: $id, input: $input) {
    item {
      ...WatchtowerItemFields
    }
    run {
      id
    }
    subscribers {
      id
      name
      icon
      accent
      template
    }
    candidates {
      id
      name
      icon
      accent
      template
    }
    templates
  }
}

query WatchtowerItemDetail($id: ID!) @requiresRead(kind: "agent_definition") {
  watchtowerItem(id: $id) {
    ...WatchtowerItemFields
  }
}

mutation AcknowledgeWatchtowerItem($id: ID!) {
  acknowledgeWatchtowerItem(id: $id) {
    id
    status
    version
  }
}

mutation SnoozeWatchtowerItem($id: ID!, $input: SnoozeWatchtowerItemInput!) @requiresRead(kind: "agent_definition") {
  snoozeWatchtowerItem(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}

mutation ResolveWatchtowerItem($id: ID!, $input: ResolveWatchtowerItemInput!) @requiresRead(kind: "agent_definition") {
  resolveWatchtowerItem(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}

query WatchtowerCleared($since: Timestamp!) {
  watchtowerCleared(since: $since)
}

query WatchtowerHandOffAgents {
  watchtowerHandOffAgents {
    ...WatchtowerAgentFields
  }
}

mutation MarkWatchtowerItemSeen($id: ID!) @requiresRead(kind: "agent_definition") {
  markWatchtowerItemSeen(id: $id) {
    ...WatchtowerItemFields
  }
}

query WatchtowerPlay($itemId: ID!) {
  watchtowerPlay(itemId: $itemId) {
    itemId
    kind
    channel
    recipient
    sender
    subject
    message
    messageLimit
    summary
    canReword
  }
}

mutation RewordWatchtowerPlay($itemId: ID!, $input: RewordWatchtowerPlayInput!) {
  rewordWatchtowerPlay(itemId: $itemId, input: $input)
}

mutation SendWatchtowerPlay($itemId: ID!, $input: SendWatchtowerPlayInput!) @requiresRead(kind: "agent_definition") {
  sendWatchtowerPlay(itemId: $itemId, input: $input) {
    ...WatchtowerItemFields
  }
}
