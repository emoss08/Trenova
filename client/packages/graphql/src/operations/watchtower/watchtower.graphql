fragment WatchtowerItemFields on WatchtowerItem {
  id
  sourceKind
  sourceId
  severity
  title
  summary
  subjectType
  subjectId
  eventKind
  path
  occurredAt
  resolvedAt
  seen
  kindLabel
  version
  status
  assigneeId
  assignee {
    id
    name
  }
  dueAt
  overdue
  snoozedUntil
  acknowledgedAt
  resolutionCode
  resolutionNote
  resolvedById
  resolvedBy {
    id
    name
  }
  sourceClearedAt
  escalationLevel
  lastEscalatedAt
}

fragment WatchtowerItemEventFields on WatchtowerItemEvent {
  id
  itemId
  kind
  actorId
  actor {
    id
    name
  }
  fromValue
  toValue
  note
  createdAt
}

fragment WatchtowerCountsFields on WatchtowerCounts {
  unresolved
  critical
  unseen
  unseenCritical
  overdue
  unassigned
  mine
  mineOverdue
  seenAt
  byKind {
    kind
    label
    count
  }
}

query WatchtowerFeed($input: WatchtowerItemsInput!) {
  watchtowerItems(input: $input) {
    edges {
      cursor
      node {
        ...WatchtowerItemFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    seenAt
  }
}

query WatchtowerCounts {
  watchtowerCounts {
    ...WatchtowerCountsFields
  }
}

mutation MarkWatchtowerSeen($seenAt: Timestamp) {
  markWatchtowerSeen(seenAt: $seenAt) {
    ...WatchtowerCountsFields
  }
}

mutation DismissWatchtowerItem($id: ID!) {
  dismissWatchtowerItem(id: $id) {
    ...WatchtowerItemFields
  }
}

mutation HandOffWatchtowerItem($id: ID!, $input: HandOffWatchtowerItemInput!) {
  handOffWatchtowerItem(id: $id, input: $input) {
    item {
      ...WatchtowerItemFields
    }
    run {
      id
      status
    }
    subscribers {
      id
      name
      icon
      accent
      template
    }
    candidates {
      id
      name
      icon
      accent
      template
    }
    templates
  }
}

query WatchtowerItemDetail($id: ID!) {
  watchtowerItem(id: $id) {
    ...WatchtowerItemFields
  }
}

query WatchtowerItemHistory($id: ID!, $limit: Int) {
  watchtowerItemHistory(id: $id, limit: $limit) {
    ...WatchtowerItemEventFields
  }
}

query WatchtowerResolutionCodes {
  watchtowerResolutionCodes {
    code
    label
    requiresNote
  }
}

mutation AssignWatchtowerItem($id: ID!, $input: AssignWatchtowerItemInput!) {
  assignWatchtowerItem(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}

mutation AcknowledgeWatchtowerItem($id: ID!, $expectedVersion: Int) {
  acknowledgeWatchtowerItem(id: $id, expectedVersion: $expectedVersion) {
    ...WatchtowerItemFields
  }
}

mutation StartWatchtowerItem($id: ID!, $expectedVersion: Int) {
  startWatchtowerItem(id: $id, expectedVersion: $expectedVersion) {
    ...WatchtowerItemFields
  }
}

mutation SnoozeWatchtowerItem($id: ID!, $input: SnoozeWatchtowerItemInput!) {
  snoozeWatchtowerItem(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}

mutation SetWatchtowerItemDue($id: ID!, $input: SetWatchtowerItemDueInput!) {
  setWatchtowerItemDue(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}

mutation CommentOnWatchtowerItem($id: ID!, $body: String!) {
  commentOnWatchtowerItem(id: $id, body: $body) {
    ...WatchtowerItemEventFields
  }
}

mutation ResolveWatchtowerItem($id: ID!, $input: ResolveWatchtowerItemInput!) {
  resolveWatchtowerItem(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}

mutation ReopenWatchtowerItem($id: ID!, $input: ReopenWatchtowerItemInput!) {
  reopenWatchtowerItem(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}
