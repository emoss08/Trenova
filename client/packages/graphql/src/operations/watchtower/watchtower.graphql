fragment WatchtowerItemFields on WatchtowerItem {
  id
  sourceKind
  sourceId
  severity
  title
  summary
  subjectType
  subjectId
  eventKind
  path
  occurredAt
  resolvedAt
  seen
  kindLabel
  version
  status
  assigneeId
  assignee {
    id
    name
  }
  dueAt
  overdue
  snoozedUntil
  acknowledgedAt
  resolutionCode
  resolutionNote
  resolvedById
  resolvedBy {
    id
    name
  }
  sourceClearedAt
  escalationLevel
  lastEscalatedAt
  dueLabel
  dueSource
  record {
    kind
    noun
    label
  }
  facts {
    label
    value
    at
  }
  impact
  trail {
    at
    text
  }
  suggestedAgentId
  suggestedAgent {
    id
    name
    description
    icon
    accent
    template
  }
  agentWork {
    agentId
    runId
    status
    step
    steps
    note
    failed
    handedAt
    agent {
      id
      name
      description
      icon
      accent
      template
    }
  }
}

fragment WatchtowerAgentFields on AgentDefinition {
  id
  name
  description
  icon
  accent
  template
}

fragment WatchtowerCountsFields on WatchtowerCounts {
  unresolved
  critical
  active
  activeCritical
  unseen
  unseenCritical
  overdue
  unassigned
  mine
  mineOverdue
  seenAt
  byKind {
    kind
    label
    count
  }
}

query WatchtowerFeed($input: WatchtowerItemsInput!) @requiresRead(kind: "agent_definition") {
  watchtowerItems(input: $input) {
    edges {
      cursor
      node {
        ...WatchtowerItemFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    seenAt
  }
}

query WatchtowerCounts {
  watchtowerCounts {
    ...WatchtowerCountsFields
  }
}

mutation HandOffWatchtowerItem($id: ID!, $input: HandOffWatchtowerItemInput!) @requiresRead(kind: "agent_definition") {
  handOffWatchtowerItem(id: $id, input: $input) {
    item {
      ...WatchtowerItemFields
    }
    run {
      id
      status
    }
    subscribers {
      id
      name
      icon
      accent
      template
    }
    candidates {
      id
      name
      icon
      accent
      template
    }
    templates
  }
}

query WatchtowerItemDetail($id: ID!) @requiresRead(kind: "agent_definition") {
  watchtowerItem(id: $id) {
    ...WatchtowerItemFields
  }
}

mutation SnoozeWatchtowerItem($id: ID!, $input: SnoozeWatchtowerItemInput!) @requiresRead(kind: "agent_definition") {
  snoozeWatchtowerItem(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}

mutation ResolveWatchtowerItem($id: ID!, $input: ResolveWatchtowerItemInput!) @requiresRead(kind: "agent_definition") {
  resolveWatchtowerItem(id: $id, input: $input) {
    ...WatchtowerItemFields
  }
}

query WatchtowerCleared($since: Timestamp!) {
  watchtowerCleared(since: $since)
}

query WatchtowerHandOffAgents {
  watchtowerHandOffAgents {
    ...WatchtowerAgentFields
  }
}

mutation MarkWatchtowerItemSeen($id: ID!) @requiresRead(kind: "agent_definition") {
  markWatchtowerItemSeen(id: $id) {
    ...WatchtowerItemFields
  }
}
