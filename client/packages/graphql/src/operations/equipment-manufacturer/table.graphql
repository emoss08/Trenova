fragment EquipmentManufacturerTableRowFields on EquipmentManufacturer {
  id
  businessUnitId
  organizationId
  status
  name
  description
  version
  createdAt
  updatedAt
}

query EquipmentManufacturerTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  equipmentManufacturers(input: $input) {
    edges {
      node {
        ...EquipmentManufacturerTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
