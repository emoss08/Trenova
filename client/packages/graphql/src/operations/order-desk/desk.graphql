# The Desk's order card: where the order stands, who it is for, what it is
# worth and the charges on it. Its legs are read a page at a time through
# shipments, so this query leaves them out.
query DeskOrderCard($id: ID!) {
  order(id: $id) {
    id
    status
    orderNumber
    poNumber
    bol
    currencyCode
    quotedAmount
    baseAmount
    totalAmount
    createdAt
    updatedAt
    customer {
      id
      code
      name
    }
    charges {
      id
      description
      amount
      invoiceId
      invoicedAt
      allocations {
        id
      }
    }
  }
}

# One order as the Desk's agent reads it: the card's fields with every leg it
# groups, so a question about the order's shipments is answered in one read.
query DeskOrder($id: ID!) {
  order(id: $id) {
    id
    status
    orderNumber
    poNumber
    bol
    currencyCode
    quotedAmount
    baseAmount
    totalAmount
    createdAt
    updatedAt
    customer {
      ...CustomerReference
    }
    legs {
      id
      proNumber
      status
      bol
    }
    charges {
      id
      description
      amount
      invoiceId
      invoicedAt
      allocations {
        id
      }
    }
  }
}
