fragment AIProviderFailureFields on AIProviderFailure {
  providerId
  name
  failedCalls
  lastFailureAt
}

query AIControlSummary($tab: AIControlTab!) {
  aiControlSummary(tab: $tab) {
    tab
    narrated
    pending
    factsHash
    generatedAt
    segments {
      text
      strong
      target
      providerId
      tone
    }
    facts {
      providersOn
      uncovered
      paused
      agents {
        total
        on
        working
        waiting
        shadow
        shadowRecorded
      }
      failing {
        ...AIProviderFailureFields
      }
    }
    visibleFailures {
      ...AIProviderFailureFields
    }
  }
}

mutation DismissAIProviderFailure($providerId: ID!, $lastFailureAt: Timestamp!) {
  dismissAIProviderFailure(providerId: $providerId, lastFailureAt: $lastFailureAt)
}

mutation RestoreAIProviderFailure($providerId: ID!) {
  restoreAIProviderFailure(providerId: $providerId)
}

query AgentPromotionPreview($threshold: Int!) {
  agentPromotionPreview(threshold: $threshold) {
    agentDefinitionId
    agentName
    toolName
    streak
    from
    to
  }
}

query AIUsageDaily($days: Int, $timezone: String) {
  aiUsageDaily(days: $days, timezone: $timezone) {
    day
    calls
    failed
    inputTokens
    outputTokens
    costUsd
    pricedCalls
    latencyP50Ms
    latencyP95Ms
  }
}

query AIUsageFeatures(
  $input: DataTableConnectionInput!
  $days: Int
  $includeTotalCount: Boolean = true
) {
  aiUsageFeatures(input: $input, days: $days) {
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
    edges {
      cursor
      node {
        feature
        calls
        failed
        inputTokens
        outputTokens
        costUsd
        pricedCalls
        latencyP50Ms
        latencyP95Ms
      }
    }
  }
}

fragment AITuneUpFields on AITuneUp {
  id
  kind
  agent {
    id
    name
    icon
    accent
  }
  provider {
    id
    name
    kind
  }
  otherProvider {
    id
    name
    kind
  }
  toolName
  task
  evidence {
    fromTier
    toTier
    streak
    approvals
    approvalsPerWeek
    rejections
    calls
    failed
    rescued
    recorded
    matchRate
    wouldFail
    tasks
    model
    lastRunAt
    idleSince
    tools
  }
  status
  dismissedUntil
  computedAt
  version
}

query AITuneUps {
  aiTuneUps {
    computedAt
    windowDays
    items {
      ...AITuneUpFields
    }
  }
}

mutation ApplyAITuneUp($id: ID!, $version: Int!) {
  applyAITuneUp(id: $id, version: $version) {
    ...AITuneUpFields
  }
}

mutation DismissAITuneUp($id: ID!, $version: Int!, $days: Int) {
  dismissAITuneUp(id: $id, version: $version, days: $days) {
    ...AITuneUpFields
  }
}

mutation RestoreAITuneUp($id: ID!, $version: Int!) {
  restoreAITuneUp(id: $id, version: $version) {
    ...AITuneUpFields
  }
}
