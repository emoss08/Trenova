fragment AgentMemoryTableRowFields on AgentMemory {
  id
  organizationId
  businessUnitId
  kind
  source
  status
  subjectType
  subjectId
  subjectLabel
  toolName
  content
  agentDefinitionId
  tainted
  sourceRunId
  sourceProposalId
  sourceThreadId
  reflectionId
  supersedesId
  supersedes {
    id
    content
    status
  }
  replacedBy {
    id
    content
    status
    createdAt
  }
  createdByUserId
  retiredByUserId
  retiredAt
  expiresAt
  useCount
  lastUsedAt
  evidence {
    feedbackIds
    patternKey
    ratingCount
    distinctUsers
    distinctThreads
    reason
    quotes
    firstRatedAt
    lastRatedAt
    signals
  }
  version
  createdAt
  updatedAt
}

query AgentMemoryTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  agentMemories(input: $input) {
    edges {
      node {
        ...AgentMemoryTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query AgentMemoryCount($input: DataTableConnectionInput!) {
  agentMemories(input: $input) {
    totalCount
  }
}

query AgentMemoryUsage {
  agentMemoryUsage {
    activeCount
    activeSoftCap
    warnAt
  }
}

mutation CreateAgentMemory($input: AgentMemoryInput!) {
  createAgentMemory(input: $input) {
    ...AgentMemoryTableRowFields
  }
}

mutation UpdateAgentMemory($id: ID!, $input: AgentMemoryInput!) {
  updateAgentMemory(id: $id, input: $input) {
    ...AgentMemoryTableRowFields
  }
}

mutation SetAgentMemoryStatus($id: ID!, $status: AgentMemoryStatus!) {
  setAgentMemoryStatus(id: $id, status: $status) {
    ...AgentMemoryTableRowFields
  }
}

mutation ApproveAgentMemorySuggestion($id: ID!, $input: ApproveAgentMemorySuggestionInput!) {
  approveAgentMemorySuggestion(id: $id, input: $input) {
    ...AgentMemoryTableRowFields
  }
}

mutation DismissAgentMemorySuggestion($id: ID!, $version: Int!) {
  dismissAgentMemorySuggestion(id: $id, version: $version) {
    ...AgentMemoryTableRowFields
  }
}

fragment AgentReflectionRowFields on AgentReflection {
  id
  agentDefinitionId
  subjectType
  threadId
  runId
  userId
  fromSequence
  throughSequence
  status
  skipReason
  signals {
    kind
    count
    detail
  }
  changes {
    action
    memoryId
    supersedesId
    kind
    scope
    content
    reason
  }
  notes
  tainted
  model
  inputTokens
  outputTokens
  errorMessage
  finishedAt
  createdAt
}

query AgentReflections($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  agentReflections(input: $input) {
    edges {
      node {
        ...AgentReflectionRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
