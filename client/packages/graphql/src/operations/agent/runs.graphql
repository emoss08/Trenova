fragment AgentRunTableRowFields on AgentRun {
  id
  organizationId
  businessUnitId
  agentType
  agentDefinitionId
  trigger
  summary
  subjectType
  subjectId
  status
  workflowId
  modelIdentifier
  promptVersion
  startedAt
  completedAt
  errorMessage
  traceId
  traceUrl
  parentOwnerKind
  delegateCallId
  handedBy {
    id
    name
  }
  version
  createdAt
  updatedAt
}

query AgentRunTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  agentRuns(input: $input) {
    edges {
      node {
        ...AgentRunTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

fragment AgentRunTranscriptFields on AgentRunTranscript {
  omittedMessages
  omittedAt
  messages {
    role
    kind
    content
    reasoning
    toolCalls {
      id
      name
      arguments
    }
    toolCallId
    toolName
    toolFailed
    toolVerdict
    toolSummary
    agentDefinitionId
    delegateCallId
    omitted
    createdAt
  }
}

query AgentRunDetail($id: ID!) {
  agentRun(id: $id) {
    ...AgentRunTableRowFields
    inputContextHash
    transcript {
      ...AgentRunTranscriptFields
    }
  }
}

query AgentActivitySummary($since: Timestamp!) {
  agentActivitySummary(since: $since) {
    since
    runs
    runsFailed
    runsWorking
    runsAwaiting
    pendingProposals
    oldestPendingAt
    openExceptions
    decisionWindowDays
    decided
    approvedAsProposed
  }
}
