fragment AgentControlFields on AgentControl {
  id
  organizationId
  businessUnitId
  shadowMode
  earnedAutonomy
  promotionThreshold
  personMonthlyMessages
  learningOff
  autoChaptersOff
  agentMoneyCallCeiling
  agentMoneyRunCalls
  agentMoneyRunAmount
  agentMoneyDayCalls
  agentMoneyDayAmount
  agentMoneyCurrency
  aiTrainingConsent
  aiTrainingConsentChangedAt
  version
  createdAt
  updatedAt
}

query AgentControlSettings {
  agentControl {
    ...AgentControlFields
  }
}

mutation UpdateAgentControl($input: AgentControlInput!) {
  updateAgentControl(input: $input) {
    ...AgentControlFields
  }
}

query AITrainingExportHistory {
  aiTrainingExportHistory {
    exportId
    examples
    trainExamples
    validationExamples
    consentGrantedAt
    exportedAt
  }
}
