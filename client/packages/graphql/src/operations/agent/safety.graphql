fragment AgentToolPolicyFields on AgentToolPolicy {
  id
  name
  title
  kind
  needs {
    resource
    operation
  }
  scope
  defaultTier
  maxTier
  promotableTier
  egress
  leavesOrganization
  hasClassify
  hasCondition
  conditionDescription
  personalExemption
  effect
  artifact
  reversible
  idempotent
  readsExternal
  source
  carriesTaint
  rationale
  explanation
  declaredMaxTier
  declaredReadsExternal
  ruleVersion
  rule {
    maxTier
    readsExternal
    reason
    updatedAt
    updatedBy {
      id
      name
    }
  }
}

fragment AgentToolRuleImpactFields on AgentToolRuleImpact {
  agentId
  agentName
  before
  after
}

fragment AgentToolAutonomyFields on AgentToolAutonomy {
  answer
  tier
  heldBy
  earned
  approvalsToNext
}

fragment AgentSafetyHeaderFields on AgentSafety {
  agentId
  organizationShadow
  agent {
    id
    name
    enabled
    shadowMode
    simulationMode
    autonomyCeiling
    triggerMode
  }
  reach {
    accessMode
    roles {
      id
      name
    }
    warnings {
      kind
      tools
    }
  }
}

fragment AgentToolSafetyRowFields on AgentToolSafety {
  id
  agentId
  agentName
  policyName
  policy {
    ...AgentToolPolicyFields
  }
  clean {
    ...AgentToolAutonomyFields
  }
  tainted {
    ...AgentToolAutonomyFields
  }
}

query AgentToolRuleTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  agentToolRuleConnection(input: $input) {
    edges {
      node {
        ...AgentToolPolicyFields
        runsWithoutPerson
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query AgentToolSafetyTable(
  $agentIds: [ID!]!
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  agentToolSafetyConnection(agentIds: $agentIds, input: $input) {
    edges {
      node {
        ...AgentToolSafetyRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query AgentSafetySummary {
  agentSafetySummary {
    toolCount
    runWithoutPerson
    leaveOrganization
    openWithSensitive
    resources
    egressCounts {
      egress
      count
    }
    unattendedTools
    openSensitiveAgentIds
  }
}

query AgentSafety($agentIds: [ID!]) {
  agentSafety(agentIds: $agentIds) {
    ...AgentSafetyHeaderFields
  }
}

query AgentToolHolders {
  agentToolHolders {
    policyName
    agentIds
  }
}

query AgentToolRuleImpact($name: String!, $input: AgentToolRuleInput!) {
  agentToolRuleImpact(name: $name, input: $input) {
    ...AgentToolRuleImpactFields
  }
}

mutation SaveAgentToolRule($name: String!, $version: Int!, $input: AgentToolRuleInput!) {
  saveAgentToolRule(name: $name, version: $version, input: $input) {
    tool {
      ...AgentToolPolicyFields
    }
    affected {
      ...AgentToolRuleImpactFields
    }
  }
}
