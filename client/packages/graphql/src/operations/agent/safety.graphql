fragment AgentToolPolicyFields on AgentToolPolicy {
  name
  title
  kind
  needs {
    resource
    operation
  }
  scope
  defaultTier
  maxTier
  promotableTier
  egress
  leavesOrganization
  hasClassify
  hasCondition
  conditionDescription
  personalExemption
  effect
  artifact
  reversible
  idempotent
  readsExternal
  source
  carriesTaint
  rationale
  explanation
}

fragment AgentToolAutonomyFields on AgentToolAutonomy {
  answer
  tier
  heldBy
  earned
  approvalsToNext
}

fragment AgentSafetyFields on AgentSafety {
  agentId
  organizationShadow
  agent {
    id
    name
    enabled
    shadowMode
    simulationMode
    autonomyCeiling
    triggerMode
  }
  tools {
    policyName
    policy {
      ...AgentToolPolicyFields
    }
    clean {
      ...AgentToolAutonomyFields
    }
    tainted {
      ...AgentToolAutonomyFields
    }
  }
  reach {
    accessMode
    roles {
      id
      name
    }
    warnings {
      kind
      tools
    }
  }
}

query AgentToolPolicyConnection(
  $input: AgentToolPolicyConnectionInput!
  $includeTotalCount: Boolean = false
) {
  agentToolPolicyConnection(input: $input) {
    edges {
      cursor
      node {
        ...AgentToolPolicyFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query AgentSafetySummary {
  agentSafetySummary {
    toolCount
    runWithoutPerson
    leaveOrganization
    openWithSensitive
    resources
  }
}

query AgentSafety($agentIds: [ID!]) {
  agentSafety(agentIds: $agentIds) {
    ...AgentSafetyFields
  }
}
