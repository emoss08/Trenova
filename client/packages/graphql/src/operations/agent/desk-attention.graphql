fragment DeskRecordFields on DeskRecord {
  kind
  noun
  id
  label
  subtitle
  status
  readable
}

fragment DeskAttentionGroupFields on DeskAttentionGroup {
  key
  record {
    ...DeskRecordFields
  }
  severity
  dueAt
  dueLabel
  unseen
  items {
    ...WatchtowerItemFields
    deskLens
    aboutId
  }
  ownership {
    owner {
      id
      name
    }
    auto
    canWork
  }
}

query DeskAttention($input: DeskAttentionInput!) {
  deskAttention(input: $input) {
    groups {
      ...DeskAttentionGroupFields
    }
    counts {
      everything
      watchtower
      triage
      decisions
    }
    kinds {
      kind
      label
      lens
      count
    }
    hasMore
    seenAt
    seesEveryone
  }
}

fragment DeskActivityEntryFields on DeskActivityEntry {
  id
  outcome
  at
  agent {
    ...WatchtowerAgentFields
  }
  runId
  planId
  title
  detail
  count
  records {
    ...DeskRecordFields
  }
  recordsMore
  decidedBy {
    id
    name
  }
  proposalIds
}

query DeskActivityEntry($id: ID!) {
  deskActivityEntry(id: $id) {
    entry {
      ...DeskActivityEntryFields
    }
    tool
    changes {
      proposalId
      record {
        ...DeskRecordFields
      }
      what
      why
      proposedAt
      at
      outcome
      error
    }
    ranBefore
    ranSince
  }
}

query DeskActivity($since: Timestamp!, $first: Int) {
  deskActivity(since: $since, first: $first) {
    entries {
      ...DeskActivityEntryFields
    }
    hasMore
  }
}
