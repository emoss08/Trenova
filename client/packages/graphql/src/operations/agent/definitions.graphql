fragment AgentDefinitionCardFields on AgentDefinition {
  id
  organizationId
  businessUnitId
  name
  description
  template
  icon
  accent
  instructions
  guardrails
  toolNames
  toolTiers
  autonomyCeiling
  enabled
  shadowMode
  decisionTimeoutSeconds
  triggerMode
  cronExpression
  cronTimezone
  eventKinds
  intervalSeconds
  endsAt
  maxConcurrentRuns
  runTimeoutSeconds
  maxToolCalls
  monthlyBudgetUsd
  dailyRunLimit
  toolDailyLimits
  simulationMode
  contextProviders
  outputMode
  preferredProviderId
  systemKey
  starters {
    label
    prompt
  }
  delegateIds
  delegates {
    id
    name
    icon
    accent
    enabled
    triggerMode
  }
  lastRunAt
  nextRunAt
  pendingProposals
  openRuns
  version
  createdAt
  updatedAt
}

query AgentDefinitionCards($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  agentDefinitions(input: $input) {
    edges {
      node {
        ...AgentDefinitionCardFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

fragment AgentChoiceFields on AgentDefinition {
  id
  name
  description
  template
  icon
  accent
  toolNames
  systemKey
  starters {
    label
    prompt
  }
}

query AgentChoices($input: DataTableConnectionInput!, $includeTotalCount: Boolean = false) {
  agentDefinitions(input: $input) {
    edges {
      node {
        ...AgentChoiceFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query AgentDefinitionCount($input: DataTableConnectionInput!) {
  agentDefinitions(input: $input) {
    totalCount
  }
}

query AgentRunCount($input: DataTableConnectionInput!) {
  agentRuns(input: $input) {
    totalCount
  }
}

query AgentProposalCount($input: DataTableConnectionInput!) {
  agentProposals(input: $input) {
    totalCount
  }
}
