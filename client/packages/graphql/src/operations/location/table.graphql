fragment LocationTableRowFields on Location {
  id
  businessUnitId
  organizationId
  locationCategoryId
  stateId
  status
  code
  name
  description
  addressLine1
  addressLine2
  city
  postalCode
  isGeocoded
  latitude
  longitude
  placeId
  version
  createdAt
  updatedAt
  state {
    id
    name
    abbreviation
  }
  locationCategory {
    id
    name
    color
  }
}

query LocationTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  locations(input: $input) {
    edges {
      node {
        ...LocationTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
