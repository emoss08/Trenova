query WorkerChecklistTemplateTable(
  $input: WorkerChecklistTemplatesInput!
  $includeTotalCount: Boolean = true
) {
  workerChecklistTemplates(input: $input) {
    edges {
      node {
        ...WorkerChecklistTemplateFields
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount @include(if: $includeTotalCount)
  }
}

query ActiveWorkerChecklistTemplates {
  activeWorkerChecklistTemplates {
    ...WorkerChecklistTemplateFields
  }
}

query WorkerChecklists($workerId: ID!, $includeClosed: Boolean) {
  workerChecklists(workerId: $workerId, includeClosed: $includeClosed) {
    ...WorkerChecklistFields
  }
}

