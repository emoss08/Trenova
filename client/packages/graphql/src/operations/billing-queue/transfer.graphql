}

query BillingTransferRunItems(
  $runId: ID!
  $input: DataTableConnectionInput!
  $filter: BillingTransferRunItemsFilterInput
  $includeTotalCount: Boolean = true
) {
  billingTransferRunItems(runId: $runId, input: $input, filter: $filter) {
    edges {
      node {
        id
        shipmentId
        sequence
        proNumber
        status
        failureCode
        errorMessage
        markedReadyToInvoice
        billingQueueNumber
        billingQueueStatus
        missingRequirements {
          documentTypeId
          documentTypeCode
          documentTypeName
        }
        validationFailures {
          field
          code
          message
        }
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

