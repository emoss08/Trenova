query BillingTransferCandidates($input: ShipmentsInput!, $includeTotalCount: Boolean = true) {
  shipments(input: $input) {
    edges {
      node {
        id
        proNumber
        bol
        status
        billingTransferStatus
        totalChargeAmount
        actualDeliveryDate
        customer {
          id
          code
          name
        }
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query BillingTransferCandidateIds($input: ShipmentBillingTransferCandidateIdsInput!) {
  shipmentBillingTransferCandidateIds(input: $input) {
    ids
    totalCount
    truncated
  }
}

query BillingTransferRun($id: ID!) {
  billingTransferRun(id: $id) {
    id
    status
    scope
    billType
    searchQuery
    shipmentStatus
    sourceRunId
    totalCount
    processedCount
    transferredCount
    notTransferredCount
    skippedCount
    markedReadyToInvoiceCount
    retryableCount
    unmatchedCount
    failureMessage
    cancelRequestedAt
    queuedAt
    startedAt
    completedAt
  }
}

query MyActiveBillingTransferRun {
  myActiveBillingTransferRun {
