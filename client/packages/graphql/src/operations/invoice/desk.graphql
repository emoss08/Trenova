# The Desk's invoice card: what is owed and when, the charges summed by how
# each was billed, what settled it, its disputes, and where it went. The
# shipments it bills are read a page at a time through shipments, and the
# lines themselves stay on the invoice's page.
query DeskInvoiceCard($id: ID!) @requiresRead(kind: "invoice_dispute") {
  invoice(id: $id) {
    id
    number
    billType
    status
    scope
    currencyCode
    paymentTerm
    invoiceDate
    dueDate
    postedAt
    periodStart
    periodEnd
    shipmentCount
    shipmentProNumber
    shipmentBol
    orderId
    orderNumber
    billToName
    isSplitBill
    factoringCompanyId
    subtotalAmount
    otherAmount
    totalAmount
    appliedAmount
    openBalance
    creditRemaining
    daysPastDue
    settlementStatus
    disputeStatus
    sendStatus
    sentAt
    voidedAt
    voidReason
    voidDisposition
    memoReason
    memoKind
    ratingNotes
    ediSendStatus
    ediSentAt
    pdfDocumentId
    lastEdiError
    lastEdiMessageId
    createdAt
    updatedAt
    customer {
      id
      code
      name
    }
    voidedBy {
      id
      name
    }
    referenceInvoice {
      ...DeskInvoiceNeighbor
    }
    relatedInvoices {
      ...DeskInvoiceNeighbor
    }
    chargeSummary {
      type
      description
      chargeCode
      chargeMethod
      rateUnit
      rate
      rateBasisAmount
      quantity
      formulaTemplateId
      formulaTemplateName
      lineCount
      shipmentCount
      amount
    }
    paymentApplications {
      id
      appliedAmountMinor
      shortPayAmountMinor
      createdAt
      payment {
        id
        paymentDate
        status
        paymentMethod
        referenceNumber
      }
    }
    creditApplications {
      id
      appliedAmountMinor
      accountingDate
      status
      unappliedAt
      unappliedReason
      creditMemo {
        id
        number
      }
      invoice {
        id
        number
      }
    }
    disputes {
      id
      status
      reasonCode
      disputedAmount
      notes
      openedAt
      resolvedAt
      resolution
      resolutionNotes
      openedBy {
        id
        name
      }
      resolvedBy {
        id
        name
      }
    }
    ediSendPlan {
      enabled
      partnerName
      communicationMethod
      status
      lastMessageId
      lastError
      sentAt
      blockers
    }
  }
}

# Another invoice the card names: the one a memo corrects, or a split bill's
# sibling.
fragment DeskInvoiceNeighbor on Invoice {
  id
  number
  billType
  status
  totalAmount
  openBalance
  currencyCode
  settlementStatus
  daysPastDue
  postedAt
  billToName
}

# The Desk's invoice list: what a register row says about each invoice, for
# finding what is unpaid, overdue or in dispute. Amounts follow the reader's
# data access.
query DeskInvoices($input: DataTableConnectionInput!, $includeTotalCount: Boolean = false) {
  invoices(input: $input) {
    edges {
      node {
        id
        number
        status
        settlementStatus
        disputeStatus
        billType
        customerId
        billToName
        shipmentProNumber
        totalAmount
        currencyCode
        invoiceDate
        dueDate
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

# One invoice as the Desk reads it to act on it: its state, totals, what is
# still owed, and every line by id, which an adjustment names. The card above
# leaves the lines to the invoice's page.
query DeskInvoiceDetail($id: ID!) {
  invoice(id: $id) {
    id
    number
    status
    billType
    scope
    settlementStatus
    disputeStatus
    sendStatus
    ediSendStatus
    paymentTerm
    currencyCode
    customerId
    billToName
    billToCode
    billToCity
    billToState
    shipmentId
    shipmentProNumber
    shipmentBol
    orderId
    orderNumber
    shipmentCount
    invoiceDate
    dueDate
    serviceDate
    postedAt
    sentAt
    voidedAt
    isAdjustmentArtifact
    supersedesInvoiceId
    supersededByInvoiceId
    pdfDocumentId
    subtotalAmount
    otherAmount
    totalAmount
    appliedAmount
    openBalance
    memo
    remittanceInstructions
    voidReason
    lastSendError
    lastEdiError
    lines {
      id
      lineNumber
      type
      description
      chargeCode
      accessorialChargeId
      shipmentProNumber
      quantity
      unitPrice
      amount
    }
  }
}

# The dispute cases on the invoices named, open and closed, each invoice's
# newest first.
query DeskInvoiceDisputes($invoiceIds: [ID!]!) {
  invoiceDisputes(invoiceIds: $invoiceIds) {
    id
    invoiceId
    customerId
    status
    reasonCode
    disputedAmount
    notes
    openedAt
    resolution
    resolutionAdjustmentId
    resolutionNotes
    resolvedAt
  }
}
