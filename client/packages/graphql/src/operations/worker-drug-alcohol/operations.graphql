}

mutation FinalizeDotRandomDraw($id: ID!) {
  finalizeDotRandomDraw(id: $id) {
    ...DotRandomDrawFields
  }
}

mutation CancelDotRandomDraw($id: ID!, $reason: String!) {
  cancelDotRandomDraw(id: $id, reason: $reason) {
    ...DotRandomDrawFields
