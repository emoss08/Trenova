    ...ClearinghouseQueryFields
  }
}

mutation CreateDotRandomPool($input: DOTRandomPoolInput!) {
  createDotRandomPool(input: $input) {
    ...DotRandomPoolFields
  }
}

mutation UpdateDotRandomPool(
  $id: ID!
  $version: Int!
  $input: DOTRandomPoolInput!
) {
  updateDotRandomPool(id: $id, version: $version, input: $input) {
    ...DotRandomPoolFields
  }
}

