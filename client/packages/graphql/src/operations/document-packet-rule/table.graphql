fragment DocumentPacketRuleTableRowFields on DocumentPacketRule {
  id
  businessUnitId
  organizationId
  resourceType
  documentTypeId
  required
  allowMultiple
  displayOrder
  expirationRequired
  expirationWarningDays
  version
  createdAt
  updatedAt
}

query DocumentPacketRuleTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  documentPacketRules(input: $input) {
    edges {
      node {
        ...DocumentPacketRuleTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
