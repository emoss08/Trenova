fragment ServiceFailureReasonCodeTableRowFields on ServiceFailureReasonCode {
  id
  businessUnitId
  organizationId
  code
  label
  description
  category
  appliesTo
  defaultStatusCode
  defaultReasonCode
  defaultExceptionCode
  defaultNote
  active
  sortOrder
  externalMap
  version
  createdAt
  updatedAt
}

query ServiceFailureReasonCodeTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  serviceFailureReasonCodes(input: $input) {
    edges {
      node {
        ...ServiceFailureReasonCodeTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
