fragment WorkerEmploymentEventFields on WorkerEmploymentEvent {
  id
  workerId
  kind
  effectiveAt
  reason
  notes
  fromValues {
    key
    value
  }
  toValues {
    key
    value
  }
  documentId
  document {
    id
    fileName
    originalName
    fileType
    fileSize
    createdAt
  }
  recordedById
  recordedBy {
    id
    name
  }
  amendedById
  amendedBy {
    id
    name
  }
  amendedAt
  amendmentNote
  version
  createdAt
  updatedAt
}

query WorkerEmploymentEvents(
  $workerId: ID!
  $kinds: [WorkerEmploymentEventKind!]
  $first: Int
  $after: String
  $includeTotalCount: Boolean = true
) {
  workerEmploymentEvents(workerId: $workerId, kinds: $kinds, first: $first, after: $after) {
    edges {
      cursor
      node {
        ...WorkerEmploymentEventFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
  }
}

fragment WorkerEmploymentEffectFields on WorkerEmploymentEffect {
  kind
  name
  count
  days
  ptoType
  startDate
  endDate
  failed
}

mutation RecordWorkerEmploymentEvent($input: RecordWorkerEmploymentEventInput!) {
  recordWorkerEmploymentEvent(input: $input) {
    event {
      ...WorkerEmploymentEventFields
    }
    effects {
      ...WorkerEmploymentEffectFields
    }
  }
}

mutation AmendWorkerEmploymentEvent($input: AmendWorkerEmploymentEventInput!) {
  amendWorkerEmploymentEvent(input: $input) {
    ...WorkerEmploymentEventFields
  }
}

query WorkerEmploymentEventOptions($workerId: ID!) {
  workerEmploymentEventOptions(workerId: $workerId) {
    recordableKinds
    reasonRequiredKinds
  }
}

query PreviewWorkerEmploymentEvent($input: RecordWorkerEmploymentEventInput!) {
  previewWorkerEmploymentEvent(input: $input) {
    kind
    effectiveAt
    fromValues {
      key
      value
    }
    toValues {
      key
      value
    }
    effects {
      ...WorkerEmploymentEffectFields
    }
  }
}

query WorkerEmploymentEvent($id: ID!) {
  workerEmploymentEvent(id: $id) {
    ...WorkerEmploymentEventFields
  }
}
