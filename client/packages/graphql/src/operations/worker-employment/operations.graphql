fragment WorkerEmploymentEventFields on WorkerEmploymentEvent {
  id
  workerId
  kind
  effectiveAt
  reason
  notes
  fromValues {
    key
    value
  }
  toValues {
    key
    value
  }
  documentId
  document {
    id
    fileName
    originalName
    fileType
    fileSize
    createdAt
  }
  recordedById
  recordedBy {
    id
    name
  }
  amendedById
  amendedBy {
    id
    name
  }
  amendedAt
  amendmentNote
  version
  createdAt
  updatedAt
}

query WorkerEmploymentEvents($workerId: ID!, $kinds: [WorkerEmploymentEventKind!]) {
  workerEmploymentEvents(workerId: $workerId, kinds: $kinds) {
    ...WorkerEmploymentEventFields
  }
}

fragment WorkerEmploymentEffectFields on WorkerEmploymentEffect {
  kind
  name
  count
  days
  ptoType
  startDate
  endDate
  failed
}

mutation RecordWorkerEmploymentEvent($input: RecordWorkerEmploymentEventInput!) {
  recordWorkerEmploymentEvent(input: $input) {
    event {
      ...WorkerEmploymentEventFields
    }
    effects {
      ...WorkerEmploymentEffectFields
    }
  }
}

mutation AmendWorkerEmploymentEvent($input: AmendWorkerEmploymentEventInput!) {
  amendWorkerEmploymentEvent(input: $input) {
    ...WorkerEmploymentEventFields
  }
}

query WorkerEmploymentEventOptions($workerId: ID!) {
  workerEmploymentEventOptions(workerId: $workerId) {
    recordableKinds
    reasonRequiredKinds
  }
}

query PreviewWorkerEmploymentEvent($input: RecordWorkerEmploymentEventInput!) {
  previewWorkerEmploymentEvent(input: $input) {
    kind
    effectiveAt
    fromValues {
      key
      value
    }
    toValues {
      key
      value
    }
    effects {
      ...WorkerEmploymentEffectFields
    }
  }
}
