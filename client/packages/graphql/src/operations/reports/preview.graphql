fragment ReportPreviewFields on ReportPreview {
  columns {
    id
    label
    type
    sensitivity
    display {
      style
      decimals
      grouping
      currency
      negative
      notation
      prefix
      suffix
      dateStyle
      boolStyle
      durationUnit
      durationStyle
      nullText
      rules {
        op
        value
        upper
        tone
      }
      band {
        width
        edges
      }
      labels
    }
  }
  rows
  levels
  totals
  truncated
  cursor
  timezone
  rollup
}

query PreviewReport(
  $definition: JSON!
  $params: JSON
  $supersede: Boolean
  $cursor: String
  $pageSize: Int
) {
  previewReport(
    definition: $definition
    params: $params
    supersede: $supersede
    cursor: $cursor
    pageSize: $pageSize
  ) {
    ...ReportPreviewFields
  }
}

query DrillThroughReport($input: ReportDrillInput!) {
  drillThroughReport(input: $input) {
    ...ReportPreviewFields
  }
}
