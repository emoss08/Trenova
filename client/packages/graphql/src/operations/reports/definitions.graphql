fragment ReportDefinitionFields on ReportDefinition {
  id
  name
  description
  category
  tags
  kind
  cannedKey
  cannedVersion
  ownerId
  visibility
  status
  diagnostics
  catalogVersion
  definition
  defaultFormat
  currentRevision
  lastRunAt
  version
  createdAt
  updatedAt
}

query ReportDefinitionsTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  reportDefinitions(input: $input) {
    edges {
      node {
        ...ReportDefinitionFields
      }
      cursor
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query ReportDefinitionById($id: ID!) {
  reportDefinition(id: $id) {
    ...ReportDefinitionFields
  }
}

query ReportDefinitionRevisions($definitionId: ID!, $limit: Int) {
  reportDefinitionRevisions(definitionId: $definitionId, limit: $limit) {
    id
    definitionId
    revisionNumber
    catalogVersion
    definition
    createdById
    createdAt
  }
}

mutation CreateReportDefinition($input: SaveReportDefinitionInput!) {
  createReportDefinition(input: $input) {
    ...ReportDefinitionFields
  }
}

mutation UpdateReportDefinition($input: UpdateReportDefinitionInput!) {
  updateReportDefinition(input: $input) {
    ...ReportDefinitionFields
  }
}

mutation DeleteReportDefinition($id: ID!) {
  deleteReportDefinition(id: $id)
}

mutation ForkCannedReport($input: ForkCannedReportInput!) {
  forkCannedReport(input: $input) {
    ...ReportDefinitionFields
  }
}

mutation ResetCannedFork($id: ID!) {
  resetCannedFork(id: $id) {
    ...ReportDefinitionFields
  }
}

fragment ReportDefinitionOptionFields on ReportDefinition {
  id
  name
  description
  category
  kind
  status
  visibility
  lastRunAt
  updatedAt
}

# The picker's own read of the report library. It deliberately omits totalCount
# — the GraphQL layer gates the COUNT on that selection — and the definition
# blob, which is megabytes across a full library and is only needed once a
# report has actually been chosen.
query ReportDefinitionOptions($input: DataTableConnectionInput!) {
  reportDefinitions(input: $input) {
    edges {
      node {
        ...ReportDefinitionOptionFields
      }
      cursor
    }
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
