query DeskReportRuns($input: DataTableConnectionInput!, $includeTotalCount: Boolean = false) {
  reportRuns(input: $input) {
    edges {
      node {
        id
        definitionId
        cannedKey
        status
        format
        rowCount
        truncated
        rowsStored
        createdAt
        completedAt
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query DeskReportSchedules($definitionId: ID, $enabledOnly: Boolean, $limit: Int) {
  reportSchedules(definitionId: $definitionId, enabledOnly: $enabledOnly, limit: $limit) {
    id
    definitionId
    cronExpression
    timezone
    formats
    emailRecipients
    enabled
    mine
    nextRunAt
    consecutiveFailures
  }
}

query DeskReportRunCard($id: ID!) {
  reportRunDeskCard(id: $id) {
    run {
      ...ReportRunFields
    }
    report {
      name
      description
      category
      definitionId
      cannedKey
    }
    parameters {
      name
      label
      type
      value
      isDefault
      entity
      windowStart
      windowEnd
    }
    timezone
    sample {
      ...ReportPreviewFields
    }
    withheld
    previous {
      runId
      completedAt
      rowCount
      columnIds
      totals
    }
    schedule {
      id
      cronExpression
      timezone
      nextRunAt
    }
    chart {
      type
      x
      series
    }
    sort {
      column
      desc
    }
  }
}
