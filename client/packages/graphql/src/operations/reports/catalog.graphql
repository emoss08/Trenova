query ReportCatalog {
  reportCatalog {
    version
    entities {
      key
      resource
      label
      pluralLabel
      description
      category
      ownScopeSupported
      readable
      exportable
      fields {
        key
        label
        description
        type
        format
        nullable
        enumValues {
          value
          label
        }
        aggregations
        filterable
        groupable
        access
        inReferenceView
        protection {
          group
          held
        }
        sensitivity
      }
      edges {
        name
        label
        target
        cardinality
        traversable
        access
        inReferenceView
        needsReadOf {
          resource
          label
        }
      }
    }
  }
}
