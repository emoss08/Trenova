mutation ExportTableView($input: ExportTableViewInput!) {
  exportTableView(input: $input) {
    definitionId
    skippedColumns
    run {
      id
    }
  }
}

mutation ScheduleTableView($input: ScheduleTableViewInput!) {
  scheduleTableView(input: $input) {
    definitionId
    skippedColumns
    schedule {
      id
    }
  }
}
