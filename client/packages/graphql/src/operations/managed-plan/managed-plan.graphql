query ManagedPlan {
  managedPlan {
    managed
    manageUrl
    endsAt
    finalBackupDays
    usage {
      periodStart
      periodEnd
      meters {
        key
        name
        unit
        used
        included
        hardCap
        stopped
      }
    }
    base {
      key
      name
    }
    included {
      key
      name
      endsAt
      features {
        key
        name
      }
    }
    available {
      key
      name
      endsAt
      features {
        key
        name
      }
    }
    changes {
      changedAt
      starting
      left {
        key
        name
      }
      joined {
        key
        name
      }
      ending {
        endsAt
        addOn {
          key
          name
        }
      }
      kept {
        key
        name
      }
    }
  }
}
