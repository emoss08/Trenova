# One credential as the agent's worker_get_credential reads it: what it is,
# whose, its dates and health, who issued and verified it, and whether a scan
# is on file. The number is never selected.
query DeskWorkerCredential($id: ID!) {
  workerCredential(id: $id) {
    id
    workerId
    credentialTypeId
    status
    issuingAuthority
    issuedAt
    expiresAt
    daysUntilExpiry
    health
    verifiedAt
    documentId
    notes
    archivedAt
    archiveReason
    version
    credentialType {
      ...WorkerCredentialTypeReference
    }
    worker {
      ...WorkerReference
    }
  }
}

query DeskWorkerCredentialList(
  $workerIds: [ID!]
  $includeArchived: Boolean
  $expiringWithinDays: Int
  $includeExpired: Boolean
  $credentialTypeCode: String
  $requiredOnly: Boolean
  $limit: Int
  $offset: Int
) {
  workerCredentials(
    workerIds: $workerIds
    includeArchived: $includeArchived
    expiringWithinDays: $expiringWithinDays
    includeExpired: $includeExpired
    credentialTypeCode: $credentialTypeCode
    requiredOnly: $requiredOnly
    limit: $limit
    offset: $offset
  ) {
    id
    workerId
    credentialTypeId
    status
    issuingAuthority
    issuedAt
    expiresAt
    daysUntilExpiry
    health
    verifiedAt
    documentId
    credentialType {
      ...WorkerCredentialTypeReference
    }
    worker {
      ...WorkerReference
      canBeAssigned
      assignmentBlocked
      profile {
        complianceStatus
      }
    }
  }
}

query DeskWorkerCredentialTypes($input: WorkerCredentialTypesInput!) {
  workerCredentialTypes(input: $input) {
    edges {
      node {
        id
        code
        name
        category
        isRequired
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
