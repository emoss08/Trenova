query JournalReviewSummary {
  journalReviewSummary {
    awaitingApproval
    readyToPost
    oldestAccountingDate
    postingMode
    requiresApproval
  }
}

query JournalReviewTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  journalReviewTable(input: $input) {
    edges {
      node {
        id
        entryNumber
        entryType
        status
        accountingDate
        description
        referenceType
        referenceNumber
        referenceId
        totalDebit
        totalCredit
        isAutoGenerated
        requiresApproval
        isApproved
        approvedById
        approvedAt
        createdById
        createdAt
        version
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

fragment JournalReviewResultFields on JournalReviewResult {
  changed
  failed
  outcomes {
    entryId
    entryNumber
    status
    changed
    error
  }
}

mutation ApproveJournalEntries($input: JournalReviewInput!) {
  approveJournalEntries(input: $input) {
    ...JournalReviewResultFields
  }
}

mutation PostJournalEntries($input: JournalReviewInput!) {
  postJournalEntries(input: $input) {
    ...JournalReviewResultFields
  }
}
