fragment DeskJournalCardLineFields on JournalCardLine {
  lineNumber
  glAccountId
  accountCode
  accountName
  category
  description
  debitAmount
  creditAmount
  customerId
  customerName
  locationId
  locationName
}

fragment DeskJournalCardPeriodFields on FiscalPeriod {
  id
  name
  periodNumber
  status
  startDate
  endDate
  closedAt
}

fragment DeskJournalCardPostingFields on JournalCardPosting {
  period {
    ...DeskJournalCardPeriodFields
  }
  accountingDate
  refusal
}

fragment DeskJournalCardPersonFields on User {
  id
  name
}

fragment DeskJournalCardEntryFields on JournalEntry {
  id
  entryNumber
  entryType
  status
  description
  accountingDate
  totalDebit
  totalCredit
  isPosted
  isReversal
  isAutoGenerated
  requiresApproval
  isApproved
  approvedAt
  postedAt
  createdAt
  reversalDate
  reversalReason
}

query DeskJournalEntryCard($id: ID!) @requiresRead(kind: "fiscal_period") {
  journalEntryCard(id: $id) {
    entry {
      ...DeskJournalCardEntryFields
      referenceType
      referenceId
      referenceNumber
      fiscalPeriodId
      reversalOfId
      reversedById
      entryDate
      approvalNotes
      rejectedAt
      rejectionReason
    }
    lines {
      ...DeskJournalCardLineFields
      isReconciled
    }
    period {
      ...DeskJournalCardPeriodFields
    }
    posting {
      ...DeskJournalCardPostingFields
    }
    source {
      id
      sourceObjectType
      sourceObjectId
      sourceEventType
      sourceDocumentNumber
      status
      batchNumber
    }
    createdBy {
      ...DeskJournalCardPersonFields
    }
    approvedBy {
      ...DeskJournalCardPersonFields
    }
    postedBy {
      ...DeskJournalCardPersonFields
    }
    rejectedBy {
      ...DeskJournalCardPersonFields
    }
    reversalOf {
      ...DeskJournalCardEntryFields
    }
    reversedBy {
      ...DeskJournalCardEntryFields
    }
    reversal {
      id
      status
      reasonCode
      reasonText
      requestedAccountingDate
      rejectionReason
      cancelReason
      createdAt
      approvedAt
      postedAt
    }
    reversalRequestedBy {
      ...DeskJournalCardPersonFields
    }
  }
}

query DeskJournalEntries($input: DataTableConnectionInput!) {
  journalEntries(input: $input) {
    edges {
      node {
        id
        entryNumber
        entryDate
        accountingDate
        entryType
        status
        fiscalPeriodId
        referenceType
        referenceNumber
        description
        isReversal
        isAutoGenerated
        totalDebit
        totalCredit
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
