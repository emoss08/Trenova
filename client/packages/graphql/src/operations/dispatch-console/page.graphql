mutation DispatchAssignMoves($input: [DispatchAssignMoveInput!]!) {
  dispatchAssignMoves(input: $input) {
    succeeded
    failed
    results {
      moveId
      success
      assignmentId
      error
      findings {
        code
        severity
        field
        message
        regulation
      }
    }
  }
}

mutation DispatchUnassignMoves($moveIds: [ID!]!) {
  dispatchUnassignMoves(moveIds: $moveIds) {
    succeeded
    failed
    results {
      moveId
      success
      assignmentId
      error
      findings {
        code
        severity
        field
        message
        regulation
      }
    }
  }
}

query DispatchCarrierAssignmentPreview($input: DispatchCarrierAssignmentPreviewInput!) {
  dispatchCarrierAssignmentPreview(input: $input) {
    blockers
    warnings
  }
}

mutation DispatchAssignMoveToCarrier($input: DispatchAssignMoveToCarrierInput!) {
  dispatchAssignMoveToCarrier(input: $input) {
    id
    shipmentMoveId
    carrierId
    status
    rateMethod
    baseRate
    baseAmount
    fuelSurcharge
    accessorialTotal
    totalCost
    currencyCode
    proNumber
    externalDriverName
    externalDriverPhone
    externalTractorNumber
    externalTrailerNumber
    confirmedAt
    canceledAt
    cancellationReason
    carrier {
      id
      name
      scac
    }
    accessorials {
      id
      accessorialChargeId
      description
      amount
    }
  }
}

mutation DispatchCancelCarrierAssignment($moveId: ID!, $reason: String!) {
  dispatchCancelCarrierAssignment(moveId: $moveId, reason: $reason)
}

mutation DispatchPlanAutoAssign($input: DispatchPlanInput!) {
  dispatchPlanAutoAssign(input: $input) {
    runId
    shadowMode
    autonomyTier
    totalScore
    generatedAt
    assignments {
      moveId
      proNumber
      workerId
      workerName
      tractorId
      trailerId
      confidence
      rationale
      autoExecutable
      proposalId
      score {
        workerId
        workerName
        tractorId
        trailerId
        moveId
        score
        verdict
        blocked
        deadheadMiles
        estimatedDriveMs
        projectedArrival
        minutesOfSlack
        driveRemainingMs
        shiftRemainingMs
        cycleRemainingMs
        projectedTimeAvailable
        hosStrategy
        hosRestStartDeadline
        hosProjectedDriveMs
        hosProjectedShiftMs
        hosProjectedCycleMs
        findings {
          code
          severity
          field
          message
          regulation
        }
        factors {
          key
          label
          raw
          weight
          contribution
          detail
        }
      }
    }
    uncovered {
      moveId
      proNumber
      reason
      bestBlockedFindings {
        code
        severity
        field
        message
        regulation
      }
    }
  }
}
