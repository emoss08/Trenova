fragment DispatchBoardMoveFields on DispatchBoardMove {
  moveId
  shipmentId
  proNumber
  bol
  moveStatus
  shipmentStatus
  sequence
  moveCount
  loaded
  distance
  revenue
  customerId
  customerName
  serviceTypeId
  serviceTypeCode
  requiredTractorTypeId
  requiredTrailerTypeId
  temperatureMin
  temperatureMax
  hasHazmat
  hasActiveHold
  urgency
  minutesToPickup
  isCovered
  originStopId
  originLocationId
  originName
  originCity
  originState
  originLatitude
  originLongitude
  originWindowStart
  originWindowEnd
  originActualArrival
  destinationStopId
  destinationLocationId
  destinationName
  destinationCity
  destinationState
  destinationLatitude
  destinationLongitude
  destinationWindowStart
  destinationWindowEnd
  assignmentId
  assignedWorkerId
  assignedWorkerName
  assignedTractorId
  assignedTractorCode
  assignedTrailerId
  assignedTrailerCode
  assignmentAckStatus
  previousMoveTrailerId
  coverageType
  carrierAssignmentId
  assignedCarrierId
  assignedCarrierName
  carrierTotalCost
  liveTender {
    id
    status
    mode
    currentRank
    offerCount
    currentCarrierName
    currentOfferExpiresAt
  }
  pendingProposal {
    id
    workerId
    workerName
    tractorId
    trailerId
    confidence
    rationale
    createdAt
    expiresAt
    stale
  }
  failedProposal {
    id
    workerId
    workerName
    reason
    failedAt
  }
  planPrice {
    workerId
    workerName
    costCents
    preferenceFloorCents
    coveragePriceCents
    driverValueCents
    uncoveredReason
    alternatives {
      workerId
      workerName
      extraCents
    }
    generatedAt
  }
}

query DispatchMove($moveId: ID!) {
  dispatchMove(moveId: $moveId) {
    ...DispatchBoardMoveFields
  }
}

query DispatchBoard($input: DispatchBoardInput!) {
  dispatchBoard(input: $input) {
    driversTruncated
    windowStart
    windowEnd
    generatedAt
    summary {
      uncoveredMoves
      coveredMoves
      lateMoves
      atRiskMoves
      unseatedDrivers
      availableDrivers
      assignedToday
      averageDeadheadMiles
      utilizationPercent
    }
    moves {
      ...DispatchBoardMoveFields
    }
    drivers {
      workerId
      firstName
      lastName
      workerType
      driverType
      fleetCodeId
      fleetCodeName
      city
      stateAbbreviation
      postalCode
      profilePicUrl
      assignmentBlocked
      availableForDispatch
      tractorId
      tractorCode
      tractorTypeId
      tractorAvailable
      openAssignments
      availability
      dutyStatus
      driveRemainingMs
      shiftRemainingMs
      cycleRemainingMs
      breakRemainingMs
      hosRecordedAt
      hosIsStale
      latitude
      longitude
      formattedLocation
      positionRecordedAt
      projectedTimeAvailable
      committedMiles
      committedRevenue
      commitments {
        moveId
        shipmentId
        proNumber
        moveStatus
        windowStart
        windowEnd
        destinationCity
        destinationState
        destinationLatitude
        destinationLongitude
        trailerId
      }
      timeOff {
        startDate
        endDate
        type
      }
      findings {
        code
        severity
        field
        message
        regulation
      }
      lastHomeAt
      plannedMove {
        moveId
        proNumber
        costCents
        valueCents
        generatedAt
      }
    }
  }
}

query DispatchMoveCandidates($input: DispatchMoveCandidatesInput!) {
  dispatchMoveCandidates(input: $input) {
    ...DispatchCandidateFields
  }
}

query DispatchDriverMoves($input: DispatchDriverMovesInput!) {
  dispatchDriverMoves(input: $input) {
    move {
      ...DispatchBoardMoveFields
    }
    candidate {
      ...DispatchCandidateFields
    }
  }
}

query DispatchAssignmentPreview($input: DispatchAssignmentPreviewInput!) {
  dispatchAssignmentPreview(input: $input) {
    moveId
    workerId
    tractorId
    trailerId
    blocked
    requiresOverride
    candidate {
      ...DispatchCandidateFields
    }
  }
}

mutation DispatchAssignMoves($input: [DispatchAssignMoveInput!]!) {
  dispatchAssignMoves(input: $input) {
    succeeded
    failed
    results {
      moveId
      success
      assignmentId
      error
      findings {
        code
        severity
        field
        message
        regulation
      }
    }
  }
}

mutation DispatchUnassignMoves($moveIds: [ID!]!) {
  dispatchUnassignMoves(moveIds: $moveIds) {
    succeeded
    failed
    results {
      moveId
      success
      assignmentId
      error
      findings {
        code
        severity
        field
        message
        regulation
      }
    }
  }
}

query DispatchCarrierAssignmentPreview($input: DispatchCarrierAssignmentPreviewInput!) {
  dispatchCarrierAssignmentPreview(input: $input) {
    blockers
    warnings
    advisories
    findings {
      code
      source
      severity
      message
      requiresOverride
    }
  }
}

mutation DispatchAssignMoveToCarrier($input: DispatchAssignMoveToCarrierInput!) {
  dispatchAssignMoveToCarrier(input: $input) {
    id
    shipmentMoveId
    carrierId
    status
    rateMethod
    baseRate
    baseAmount
    fuelSurcharge
    accessorialTotal
    totalCost
    currencyCode
    proNumber
    externalDriverName
    externalDriverPhone
    externalTractorNumber
    externalTrailerNumber
    confirmedAt
    canceledAt
    cancellationReason
    carrier {
      id
      name
      scac
    }
    accessorials {
      id
      accessorialChargeId
      description
      amount
    }
  }
}

mutation DispatchCancelCarrierAssignment($moveId: ID!, $reason: String!) {
  dispatchCancelCarrierAssignment(moveId: $moveId, reason: $reason)
}

mutation DispatchPlanAutoAssign($input: DispatchPlanInput!) {
  dispatchPlanAutoAssign(input: $input) {
    runId
    shadowMode
    autonomyTier
    planningMode
    costCents
    uncoveredCents
    generatedAt
    assignments {
      moveId
      proNumber
      workerId
      workerName
      tractorId
      trailerId
      confidence
      rationale
      autoExecutable
      proposalId
      candidate {
        ...DispatchCandidateFields
      }
      planCostCents
      coveragePriceCents
      driverValueCents
      alternatives {
        workerId
        workerName
        extraCents
      }
    }
    uncovered {
      moveId
      proNumber
      reason
      explanation
      planCostCents
      coveragePriceCents
      bestCandidate {
        ...DispatchCandidateFields
      }
    }
  }
}

fragment DispatchCandidateFields on DispatchCandidate {
  workerId
  workerName
  tractorId
  trailerId
  moveId
  costCents
  costLines {
    component
    cents
    soft
  }
  verdict
  blocked
  deadheadMiles
  originSource
  loadedMiles
  estimatedDriveMs
  restMs
  projectedArrival
  projectedDelivery
  projectedFreeAt
  minutesOfSlack
  slackKnown
  hosKnown
  deliveryLateMinutes
  driveRemainingMs
  shiftRemainingMs
  cycleRemainingMs
  projectedTimeAvailable
  hosStrategy
  hosRestStartDeadline
  hosProjectedDriveMs
  hosProjectedShiftMs
  hosProjectedCycleMs
  findings {
    code
    severity
    field
    message
    regulation
  }
}
