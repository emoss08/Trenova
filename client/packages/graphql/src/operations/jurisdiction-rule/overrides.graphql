fragment JurisdictionRuleOverrideTableRowFields on JurisdictionRuleOverride {
  id
  businessUnitId
  organizationId
  stateId
  maxWidthFeet
  maxHeightFeet
  maxLengthFeet
  maxWeightPounds
  permitLeadTimeDays
  daylightOnly
  holidayRestricted
  reason
  version
  createdAt
  updatedAt
  state {
    id
    name
    abbreviation
  }
}

query JurisdictionRuleOverrideTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  jurisdictionRuleOverrides(input: $input) {
    edges {
      node {
        ...JurisdictionRuleOverrideTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
