fragment SCIMGroupRoleMappingTableRowFields on SCIMGroupRoleMapping {
  id
  directoryId
  externalGroupId
  displayName
  roleId
  version
  role {
    id
    name
  }
}

query SCIMGroupRoleMappingsTable(
  $input: DataTableConnectionInput!
  $directoryId: ID!
  $includeTotalCount: Boolean = true
) {
  scimGroupRoleMappings(input: $input, directoryId: $directoryId) {
    edges {
      node {
        ...SCIMGroupRoleMappingTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
