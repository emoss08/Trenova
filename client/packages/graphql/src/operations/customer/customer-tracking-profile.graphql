fragment CustomerTrackingProfileFields on CustomerTrackingProfile {
  id
  customerId
  linkEnabled
  visibleFields
  linkTtlDays
  notifyPickedUp
  notifyDelayed
  notifyDelivered
  notifyPodReady
  includeLink
  recipients
  notificationsEnabledAt
  updatedAt
}

query CustomerTrackingProfile($customerId: ID!) {
  customer(id: $customerId) {
    id
    trackingProfile {
      ...CustomerTrackingProfileFields
    }
  }
}
