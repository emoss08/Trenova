query TendersByShipment($shipmentId: ID!) {
  tendersByShipment(shipmentId: $shipmentId) {
    id
    shipmentId
    shipmentMoveId
    routingGuideId
    mode
    status
    currentRank
    cancellationReason
    acceptedOfferId
    acceptedAt
    exhaustedAt
    canceledAt
    createdAt
    updatedAt
    routingGuide {
      id
      name
      specificity
    }
    offers {
      id
      tenderId
      carrierId
      rank
      rateMethod
      rate
      offerTtlSeconds
      channel
      status
      recipientEmail
      sentAt
      expiresAt
      respondedAt
      responseSource
      declineReason
      deliveryError
      createdAt
      updatedAt
      carrier {
        id
        name
        scac
      }
    }
  }
}

