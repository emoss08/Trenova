fragment CustomerTrackingLinkFields on CustomerTrackingLink {
  id
  shipmentId
  customerId
  purpose
  recipientEmail
  expiresAt
  revokedAt
  lastViewedAt
  viewCount
  createdById
  createdAt
}

fragment CustomerStatusNotificationFields on CustomerStatusNotification {
  id
  shipmentId
  event
  stopId
  occurredAt
  estimatedAt
  status
  skipReason
  recipients
  attempts
  lastError
  sentAt
  createdAt
}

query CustomerTrackingLinks($shipmentId: ID!) {
  customerTrackingLinks(shipmentId: $shipmentId) {
    ...CustomerTrackingLinkFields
  }
}

query CustomerStatusNotifications($shipmentId: ID!) {
  customerStatusNotifications(shipmentId: $shipmentId) {
    ...CustomerStatusNotificationFields
  }
}

mutation IssueCustomerTrackingLink($input: IssueCustomerTrackingLinkInput!) {
  issueCustomerTrackingLink(input: $input) {
    link {
      ...CustomerTrackingLinkFields
    }
    url
    emailed
    emailError
  }
}

mutation RevokeCustomerTrackingLink($shipmentId: ID!, $linkId: ID) {
  revokeCustomerTrackingLink(shipmentId: $shipmentId, linkId: $linkId)
}

query ShipmentCustomerTrackingPreview($shipmentId: ID!) {
  shipmentCustomerTrackingPreview(shipmentId: $shipmentId) {
    companyName
    shipmentProNumber
    fields
    expiresAt
    closed
    status
    bol
    customerReference
    carrierName
    equipment
    pieces
    weight
    lastLocation {
      city
      stateCode
      reportedAt
    }
    stops {
      sequence
      type
      city
      stateCode
      locationName
      addressLine
      windowStart
      windowEnd
      arrivedAt
      departedAt
      estimatedArrival
      running
    }
    holds {
      type
      label
      startedAt
    }
    notes {
      text
      postedAt
    }
    proofOfDelivery {
      documentId
      fileName
      filedAt
    }
  }
}
