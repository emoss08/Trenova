query ManualJournal($id: ID!) {
  manualJournal(id: $id) {
    id
    businessUnitId
    organizationId
    requestNumber
    status
    description
    reason
    accountingDate
    requestedFiscalYearId
    requestedFiscalPeriodId
    currencyCode
    totalDebit
    totalCredit
    approvedAt
    approvedById
    rejectedAt
    rejectedById
    rejectionReason
    cancelledAt
    cancelledById
    cancelReason
    postedBatchId
    createdById
    updatedById
    version
    createdAt
    updatedAt
    lines {
      id
      manualJournalRequestId
      lineNumber
      glAccountId
      description
      debitAmount
      creditAmount
      customerId
      locationId
      glAccount {
        id
        accountCode
        name
      }
      createdAt
      updatedAt
    }
  }
}

