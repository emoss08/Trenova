query DeskManualJournalCard($id: ID!) @requiresRead(kind: "fiscal_period") {
  manualJournalCard(id: $id) {
    journal {
      id
      requestNumber
      status
      description
      reason
      accountingDate
      currencyCode
      totalDebit
      totalCredit
      isBalanced
      postedBatchId
      approvedAt
      rejectedAt
      rejectionReason
      cancelledAt
      cancelReason
      createdAt
      updatedAt
    }
    lines {
      ...DeskJournalCardLineFields
    }
    requestedPeriod {
      ...DeskJournalCardPeriodFields
    }
    posting {
      ...DeskJournalCardPostingFields
    }
    createdBy {
      ...DeskJournalCardPersonFields
    }
    approvedBy {
      ...DeskJournalCardPersonFields
    }
    rejectedBy {
      ...DeskJournalCardPersonFields
    }
    cancelledBy {
      ...DeskJournalCardPersonFields
    }
    postedBy {
      ...DeskJournalCardPersonFields
    }
    postedAt
    entries {
      ...DeskJournalCardEntryFields
    }
  }
}

query DeskManualJournals($input: DataTableConnectionInput!, $includeTotalCount: Boolean = false) {
  manualJournals(input: $input) {
    edges {
      cursor
      node {
        id
        requestNumber
        status
        description
        reason
        accountingDate
        requestedFiscalPeriodId
        currencyCode
        totalDebit
        totalCredit
        isBalanced
        approvedAt
        rejectionReason
        cancelReason
        postedBatchId
        createdAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
  }
}
