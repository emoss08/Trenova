fragment CustomFieldDefinitionTableRowFields on CustomFieldDefinition {
  id
  businessUnitId
  organizationId
  resourceType
  name
  label
  description
  fieldType
  isRequired
  isActive
  displayOrder
  color
  options {
    value
    label
    color
    description
  }
  validationRules {
    minLength
    maxLength
    min
    max
    pattern
  }
  defaultValue
  uiAttributes {
    placeholder
    helpText
    width
  }
  version
  createdAt
  updatedAt
}

query CustomFieldDefinitionTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  customFieldDefinitions(input: $input) {
    edges {
      node {
        ...CustomFieldDefinitionTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
