fragment WorkerSafetyEventFields on WorkerSafetyEvent {
  id
  businessUnitId
  organizationId
  workerId
  kind
  severity
  status
  occurredAt
  location
  description
  preventable
  points
  pointsExpireAt
  activePoints
  referenceNumber
  shipmentId
  inspectionLevel
  inspectionResult
  outOfService
  fineAmount
  costAmount
  documentId
  document {
    id
    fileName
    originalName
    fileType
    fileSize
    previewStatus
    createdAt
  }
  recordedById
  recordedBy {
    id
    name
  }
  closedById
  closedBy {
    id
    name
  }
  closedAt
  resolution
  version
  createdAt
  updatedAt
  violations {
    id
    safetyEventId
    workerId
    basic
    code
    description
    severityWeight
    outOfService
    version
  }
}

fragment WorkerDisciplinaryActionFields on WorkerDisciplinaryAction {
  id
  businessUnitId
  organizationId
  workerId
  level
  status
  reason
  details
  occurredAt
  issuedAt
  expiresAt
  suspensionDays
  safetyEventId
  safetyEvent {
    ...WorkerSafetyEventReference
  }
  documentId
  issuedById
  issuedBy {
    id
    name
  }
  acknowledgedAt
  workerComment
  rescindedAt
  rescindedById
  rescindReason
  active
  version
  createdAt
  updatedAt
}

fragment WorkerRecognitionFields on WorkerRecognition {
  id
  businessUnitId
  organizationId
  workerId
  kind
  title
  message
  occurredAt
  awardedById
  awardedBy {
    id
    name
  }
  visibleToWorker
  version
  createdAt
  updatedAt
}

fragment SafetyScorecardFields on SafetyScorecard {
  workerId
  asOf
  score
  rating
  activePoints
  pointsWatchThreshold
  pointsAtRiskThreshold
  accidents
  preventableAccidents
  incidents
  nearMisses
  citations
  inspections
  inspectionsPassed
  inspectionsFailed
  outOfServiceOrders
  cleanInspectionRate
  openEvents
  activeDiscipline
  highestDiscipline
  daysSinceLastEvent
  lastEventAt
  recognitions
}

query WorkerSafetyEvents($workerId: ID!, $openOnly: Boolean) {
  workerSafetyEvents(workerId: $workerId, openOnly: $openOnly) {
    ...WorkerSafetyEventFields
  }
}

query WorkerSafetyScorecard($workerId: ID!) {
  workerSafetyScorecard(workerId: $workerId) {
    ...SafetyScorecardFields
    activePointEvents {
      id
      kind
      severity
      preventable
      inspectionResult
      inspectionLevel
      occurredAt
      activePoints
      pointsExpireAt
    }
  }
}

query WorkerDisciplinaryActions(
  $workerId: ID!
  $first: Int
  $after: String
  $includeTotalCount: Boolean = true
) {
  workerDisciplinaryActions(workerId: $workerId, first: $first, after: $after) {
    edges {
      cursor
      node {
        ...WorkerDisciplinaryActionFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
  }
}

query WorkerDisciplinaryLadder($workerId: ID!) {
  workerDisciplinaryLadder(workerId: $workerId) {
    highestLevel
    suggestedLevel
    atFinalStep
    activeActions {
      id
      level
      status
      reason
      issuedAt
      expiresAt
      active
      suspensionDays
      acknowledgedAt
      issuedBy {
        id
        name
      }
    }
  }
}

query WorkerRecognitions($workerId: ID!) {
  workerRecognitions(workerId: $workerId) {
    ...WorkerRecognitionFields
  }
}

query DefaultSafetyPoints(
  $kind: SafetyEventKind!
  $severity: SafetySeverity!
  $preventable: Boolean
  $inspectionResult: InspectionResult
) {
  defaultSafetyPoints(
    kind: $kind
    severity: $severity
    preventable: $preventable
    inspectionResult: $inspectionResult
  )
}

mutation CreateWorkerSafetyEvent($input: WorkerSafetyEventInput!) {
  createWorkerSafetyEvent(input: $input) {
    ...WorkerSafetyEventFields
  }
}

mutation UpdateWorkerSafetyEvent($input: UpdateWorkerSafetyEventInput!) {
  updateWorkerSafetyEvent(input: $input) {
    ...WorkerSafetyEventFields
  }
}

mutation CloseWorkerSafetyEvent($input: SafetyEventStatusInput!) {
  closeWorkerSafetyEvent(input: $input) {
    ...WorkerSafetyEventFields
  }
}

mutation ReviewWorkerSafetyEvent($input: SafetyEventStatusInput!) {
  reviewWorkerSafetyEvent(input: $input) {
    ...WorkerSafetyEventFields
  }
}

mutation ReopenWorkerSafetyEvent($input: SafetyEventStatusInput!) {
  reopenWorkerSafetyEvent(input: $input) {
    ...WorkerSafetyEventFields
  }
}

mutation DeleteWorkerSafetyEvent($id: ID!) {
  deleteWorkerSafetyEvent(id: $id)
}

mutation IssueDisciplinaryAction($input: IssueDisciplinaryActionInput!) {
  issueDisciplinaryAction(input: $input) {
    action {
      ...WorkerDisciplinaryActionFields
    }
    employmentEvent {
      id
    }
  }
}

mutation RescindDisciplinaryAction($input: RescindDisciplinaryActionInput!) {
  rescindDisciplinaryAction(input: $input) {
    ...WorkerDisciplinaryActionFields
  }
}

mutation GiveWorkerRecognition($input: WorkerRecognitionInput!) {
  giveWorkerRecognition(input: $input) {
    ...WorkerRecognitionFields
  }
}

mutation DeleteWorkerRecognition($id: ID!) {
  deleteWorkerRecognition(id: $id)
}

query WorkerSafetyEvent($id: ID!) {
  workerSafetyEvent(id: $id) {
    ...WorkerSafetyEventFields
  }
}

query WorkerDisciplinaryAction($id: ID!) {
  workerDisciplinaryAction(id: $id) {
    ...WorkerDisciplinaryActionFields
  }
}
