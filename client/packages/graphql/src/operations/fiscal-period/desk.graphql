query DeskFiscalPeriods($input: DataTableConnectionInput!, $includeTotalCount: Boolean = false) {
  fiscalPeriods(input: $input) {
    edges {
      cursor
      node {
        id
        fiscalYearId
        name
        periodNumber
        periodType
        status
        startDate
        endDate
        isAdjusting
        lockedAt
        closedAt
        reopenedAt
        reopenReason
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
  }
}
