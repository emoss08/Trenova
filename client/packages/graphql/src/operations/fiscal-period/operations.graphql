query FiscalPeriodCloseBlockers($id: ID!) {
  fiscalPeriodCloseBlockers(id: $id) {
    canClose
    blockers {
      field
      code
      message
      category
    }
  }
}

mutation ActivateFiscalPeriod($id: ID!) {
  activateFiscalPeriod(id: $id) {
    id
    businessUnitId
    organizationId
    fiscalYearId
    periodNumber
    periodType
    status
    name
    startDate
    endDate
    isAdjusting
    allowAdjustingEntries
    adjustmentDeadline
    lockedAt
    closedAt
    reopenedAt
    reopenReason
    version
    createdAt
    updatedAt
  }
}

