fragment DeskFuelCardPurchaseFields on FuelPurchase {
  id
  purchasedAt
  vendor
  vendorCity
  fuelType
  gallons
  totalAmount
  currencyCode
  taxPaid
  jurisdiction {
    id
    code
  }
}

query DeskFuelCardCard($id: ID!) {
  fuelCardDeskCard(id: $id) {
    card {
      ...FuelCardFields
      assignedTractor {
        id
        code
        make
        model
      }
    }
    monthStart
    year
    quarter
    month {
      currencyCode
      purchaseCount
      gallons
      untaxedGallons
      totalAmount
    }
    quarterByJurisdiction {
      jurisdictionId
      jurisdiction {
        id
        code
        name
        countryCode
      }
      gallons
      purchaseCount
    }
    purchaseCount
    lastPurchasedAt
    recent {
      ...DeskFuelCardPurchaseFields
    }
    held {
      id
      rowNumber
      status
      error
      importBatchId
      resolutionNotes
      parsed {
        purchasedAt
        vendor
        vendorCity
        jurisdictionCode
        fuelType
        gallons
        totalAmount
        currencyCode
        tractorCode
      }
    }
    heldCount
    heldSpend {
      currencyCode
      gallons
      totalAmount
    }
    heldBatches {
      id
      version
      provider
      origin
    }
    feed {
      lastPolledAt
      lastSuccessAt
      failureCount
      lastError
    }
    successors {
      ...FuelCardFields
    }
  }
}

# The Desk's fuel card list, read by the agent's fuel_list_cards: each card's
# provider, last four, status, expiry and who carries it, without the
# provider's own card id, the notes and the cancellation reason the edit panel
# loads.
query DeskFuelCards($input: FuelCardsInput!, $includeTotalCount: Boolean = false) {
  fuelCards(input: $input) {
    edges {
      node {
        id
        provider
        lastFour
        label
        status
        expiresAt
        discoveredAt
        cancelledAt
        assignedTractorId
        assignedWorkerId
        assignedTractor {
          id
          code
        }
        assignedWorker {
          id
          wholeName
        }
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
