fragment WorkerFleetCodeFields on FleetCode {
  id
  code
  color
}

fragment WorkerUsStateFields on UsState {
  id
  name
  abbreviation
}

fragment WorkerProfileTableFields on WorkerProfile {
  id
  workerId
  businessUnitId
  organizationId
  licenseStateId
  dob
  licenseNumber
  cdlClass
  cdlRestrictions
  endorsement
  hazmatExpiry
  licenseExpiry
  medicalCardExpiry
  medicalExaminerName
  medicalExaminerNpi
  twicCardNumber
  twicExpiry
  hireDate
  terminationDate
  physicalDueDate
  mvrDueDate
  complianceStatus
  trainingHealth
  safetyRating
  safetyScore
  nextCredentialExpiry
  nextTrainingDue
  drugAlcoholStatus
  isQualified
  disqualificationReason
  lastComplianceCheck
  lastMvrCheck
  lastDrugTest
  eldExempt
  shortHaulExempt
  version
  createdAt
  updatedAt
  licenseState {
    ...WorkerUsStateFields
  }
}

fragment WorkerTableRowFields on Worker {
  id
  businessUnitId
  organizationId
  stateId
  fleetCodeId
  managerId
  status
  type
  driverType
  leaveType
  profilePicUrl
  firstName
  lastName
  wholeName
  addressLine1
  addressLine2
  city
  postalCode
  email
  phoneNumber
  emergencyContactName
  emergencyContactPhone
  externalId
  assignmentBlocked
  gender
  canBeAssigned
  availableForDispatch
  version
  createdAt
  updatedAt
  customFields
  fleetCode {
    ...WorkerFleetCodeFields
  }
  state {
    ...WorkerUsStateFields
  }
  profile {
    ...WorkerProfileTableFields
  }
}

fragment WorkerPtoWorkerFields on Worker {
  id
  firstName
  lastName
  wholeName
  profilePicUrl
}

fragment WorkerPtoActorFields on User {
  id
  name
}

fragment WorkerPtoRowFields on WorkerPTO {
  id
  workerId
  organizationId
  businessUnitId
  approverId
  rejectorId
  cancelledById
  status
  type
  startDate
  endDate
  reason
  rejectionReason
  cancellationReason
  days
  balanceAfterDays
  autoApproved
  version
  createdAt
  updatedAt
  worker {
    ...WorkerPtoWorkerFields
  }
  approver {
    ...WorkerPtoActorFields
  }
  rejector {
    ...WorkerPtoActorFields
  }
  cancelledBy {
    ...WorkerPtoActorFields
  }
}

fragment WorkerDataTablePageInfoFields on PageInfo {
  hasNextPage
  endCursor
}

query WorkerTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  workers(input: $input) {
    edges {
      node {
        ...WorkerTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...WorkerDataTablePageInfoFields
    }
  }
}

query WorkerPtoTable($input: WorkerPTOEntriesInput!, $includeTotalCount: Boolean = true) {
  workerPTOEntries(input: $input) {
    edges {
      node {
        ...WorkerPtoRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...WorkerDataTablePageInfoFields
    }
  }
}

query UpcomingWorkerPto($input: UpcomingWorkerPTOInput!) {
  upcomingWorkerPTO(input: $input) {
    edges {
      node {
        ...WorkerPtoRowFields
      }
    }
    totalCount
    pageInfo {
      ...WorkerDataTablePageInfoFields
    }
  }
}

query WorkerPtoChartData($input: WorkerPTOChartInput!) {
  workerPTOChartData(input: $input) {
    date
    vacation
    sick
    holiday
    bereavement
    maternity
    paternity
    personal
    workers
  }
}

mutation PatchWorker(
  $id: ID!
  $input: WorkerPatchInput!
) {
  patchWorker(id: $id, input: $input) {
    ...WorkerTableRowFields
  }
}

mutation CreateWorkerPto($input: CreateWorkerPTOInput!) {
  createWorkerPTO(input: $input) {
    ...WorkerPtoRowFields
  }
}

mutation UpdateWorkerPto($input: UpdateWorkerPTOInput!) {
  updateWorkerPTO(input: $input) {
    ...WorkerPtoRowFields
  }
}

mutation ApproveWorkerPto($id: ID!) {
  approveWorkerPTO(id: $id) {
    ...WorkerPtoRowFields
  }
}

mutation RejectWorkerPto($id: ID!, $reason: String!) {
  rejectWorkerPTO(id: $id, reason: $reason) {
    ...WorkerPtoRowFields
  }
}

mutation CancelWorkerPto($id: ID!, $reason: String) {
  cancelWorkerPTO(id: $id, reason: $reason) {
    ...WorkerPtoRowFields
  }
}

mutation BulkWorkerPtoAction($input: BulkWorkerPTOActionInput!) {
  bulkWorkerPTOAction(input: $input) {
    results {
      ptoId
      success
      error
    }
    successCount
    failureCount
  }
}
