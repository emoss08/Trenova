# Everything the worker record page draws outside its tabs: the header's
# standing, the tab marks, each section strip's state line, the attention list,
# the clearance runway and the file grid. Fields are inlined rather than spread
# from the per-area fragments: a nested fragment spread returns a masked
# $fragmentRefs type, and the page reads these values directly. It carries the
# headline figures only, never the lists behind them.
query WorkerOverview($workerId: ID!) @requiresRead(kind: "performance_review") @requiresRead(kind: "worker_checklist") {
  workerOverview(workerId: $workerId) {
    asOf
    standing
    concernCount
    concerns {
      severity
      code
      subject
      count
      occurredAt
      dueAt
      daysUntil
      stopsAssignment
      destination {
        tab
        view
        record
        recordId
      }
    }
    clearance {
      cleared
      clearedThrough
      notClearedSince
      blocks
      itemsTruncated
      firstStop {
        key
        name
        source
        dueAt
        daysUntil
      }
      items {
        key
        lane
        source
        name
        dueAt
        daysUntil
        effect
        rule
        hazmatOnly
        regulation
        required
        destination {
          tab
          view
          record
          recordId
        }
      }
    }
    worker {
      id
      firstName
      lastName
      status
      canBeAssigned
      availableForDispatch
      type
      driverType
      lastHomeAt
      fleetCode {
        id
        code
        color
      }
      profile {
        hireDate
        terminationDate
        complianceStatus
        isQualified
        eldExempt
      }
    }
    credentials {
      complianceStatus
      requiredCount
      validCount
      expiringCount
      expiredCount
      missingCount
    }
    qualificationFile {
      complete
      missingRequired
      expiringSoon
      expired
      outstanding
      safetyHistoryLate
    }
    drugAlcohol {
      nextQueryDaysUntil
      standing {
        status
        returnToDuty
        lastClearinghouseQueryAt
        nextClearinghouseQueryDue
        openTestCount
      }
    }
    training {
      compliant
      requiredCount
      currentCount
      dueCount
      overdueCount
      expiringCount
      expiredCount
      missingCount
    }
    safety {
      score
      rating
      activePoints
      pointsWatchThreshold
      pointsAtRiskThreshold
      accidents
      preventableAccidents
      citations
      outOfServiceOrders
      openEvents
      activeDiscipline
      highestDiscipline
      recognitions
      daysSinceLastEvent
    }
    employment {
      eventCount
      hiredAt
      openChecklistCount
      closedChecklistCount
    }
    checklist {
      id
      name
      kind
      status
      dueAt
      progress {
        requiredTotal
        requiredDone
        overdue
        percent
      }
    }
    pto {
      ptoType
      tracked
      balanceDays
      pendingDays
      availableDays
    }
    leave {
      openCaseCount
      remainingHours
      totalHours
      exhausted
    }
    openReview {
      id
      title
      status
      periodEnd
      overallScore
    }
    lastReview {
      id
      title
      status
      periodEnd
      overallScore
    }
    nextReviewAt
    schedule {
      currentShiftName
    }
    hos {
      link
      dutyStatus
      dutyStatusSince
      driveRemainingMs
      driveLimitMs
      shiftRemainingMs
      shiftLimitMs
      cycleRemainingMs
      cycleLimitMs
      breakRemainingMs
      breakLimitMs
      tractorCode
      recordedAt
    }
    pay {
      profileName
      classification
      effectiveFrom
      headline {
        kind
        method
        rate
        overridden
      }
    }
    benefits {
      coveredCount
      notStartedCount
      employeeCostPerPeriodMinor
    }
    portal {
      access
      pendingProfileChangeCount
      lastSignInAt
    }
    nextTimeOff {
      id
      status
      type
      startDate
      endDate
      days
    }
    documentCount
    agentMemoryCount
  }
}

query WorkerRosterAttention {
  workerRosterAttention {
    activeWorkers
    nonCompliant
    trainingOverdue
    atRisk
    expiringSoon
    reviewsAwaitingSignOff
    ptoLiabilityDays
    leaveCertificationsOutstanding
  }
}
