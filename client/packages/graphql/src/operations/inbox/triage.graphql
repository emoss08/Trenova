fragment InboundSnoozeFields on InboundSnooze {
  until
  event
  watchShipment {
    ...InboundShipmentRefFields
  }
  documentTypeId
  documentTypeName
  snoozedAt
  snoozedBy {
    ...TriageUserFields
  }
}

fragment InboundReplyFields on InboundReply {
  id
  messageId
  status
  fromAddress
  toAddress
  ccAddresses
  subject
  body
  draftedByNova
  templateId
  failureText
  suggestedAddress
  sentBy {
    ...TriageUserFields
  }
  sentAt
  attachments {
    ...InboundReplyAttachmentFields
  }
  createdAt
  updatedAt
}

fragment InboundReplyAttachmentFields on InboundReplyAttachment {
  documentId
  fileName
  contentType
  byteSize
}

fragment InboundReplyAttachableFields on InboundReplyAttachable {
  id
  fileName
  contentType
  documentType
  byteSize
  createdAt
  source
}

fragment TriageActionFields on TriageAction {
  id
  kind
  done
  novaCanDo
  attachment {
    id
    fileName
    kind
    documentId
    filedShipmentId
    filedAs
    pageCount
  }
  shipment {
    ...InboundShipmentRefFields
  }
  replyPurpose
  refusedFileName
  reply {
    id
    status
    sentAt
    draftedByNova
  }
  loadDrafted
  createdShipment {
    ...InboundShipmentRefFields
  }
  stopsDecision
  exceptionKind
  completedAt
}

fragment TriageFactFields on TriageFact {
  key
  label
  value
  quote
  tone
  flagged
}

fragment TriageConflictFields on TriageConflict {
  id
