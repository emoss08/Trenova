    suggestedType
  }
  splitDocuments {
    fromPage
    toPage
    documentId
    documentType
  }
  reading {
    documentType
    confidence
    pageCount
    fields {
      label
      value
      tone
    }
  }
}

fragment TriageSampleFields on TriageSample {
  messageId
