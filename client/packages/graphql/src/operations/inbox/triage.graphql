query InboundThread($threadKey: String!) {
  inboundThread(threadKey: $threadKey) {
    ...InboundMessageListFields
    textBody
    reviewNote
    reviewer {
      ...TriageUserFields
    }
  }
}

query TriageBriefing {
  triageBriefing {
    generatedAt
    dayStart
    phase
    firstDay
    novaEnabled
    activeSources
    waiting
    overdue
    closedByPeopleToday
    handledByNovaToday
    handledByNova {
      action
      classification
      count
      samples {
        ...TriageSampleFields
      }
    }
    arrivals {
      hourStart
      handledByNova
      leftForPerson
    }
    novaPoints {
      ...TriageRiverPointFields
    }
    yours {
      ...TriageRiverPointFields
    }
    deck {
      group
      count
      estimateMinutes
      messageIds
      items {
        ...TriageDeckItemFields
      }
    }
    longestWaiting {
      ...TriageDeckItemFields
    }
    estimateMinutes
    corrections {
      thisWeek
      accuracyChange
      accuracy
    }
    comingBack
    unhealthySources {
      ...InboundMailboxFields
    }
    suggestion {
      classification
      senderScope
      sender
      mailboxId
      action
      handledByHand
      total
    }
    onCall {
      ...TriageUserFields
    }
    carryOver {
      ...TriageDeckItemFields
    }
  }
}

