fragment TriageUserFields on User {
  id
  name
  emailAddress
  thumbnailUrl
}

fragment InboundAttachmentFields on InboundAttachment {
  id
  fileName
  contentType
  byteSize
  kind
  documentId
  failureText
  filedShipmentId
  filedAs
  filedAt
  pageCount
  createdAt
}

fragment InboundShipmentRefFields on InboundShipmentRef {
  id
  proNumber
  bol
  poNumber
  originCity
  originState
  destinationCity
  destinationState
}

fragment InboundMailboxFields on InboundMailbox {
  id
  name
  address
  provider
  purpose
  reviewPolicy
  minConfidence
  status
  hasSigningSecret
  hasApiKey
  lastReceivedAt
  health
  testSentAt
  testReceivedAt
  blockedSenders
  version
  createdAt
  updatedAt
}

fragment InboundMailboxCredentialsFields on InboundMailboxCredentials {
  token
  webhookPath
  mailbox {
    ...InboundMailboxFields
  }
}

fragment InboundMessageListFields on InboundMessage {
  id
  mailboxId
  fromAddress
  fromName
  subject
  receivedAt
  classification
  confidence
  status
  matchedShipmentId
  matchedCustomerId
  matchReason
  needsReview
  failureText
  preview
  attachmentCount
  matchedShipment {
    ...InboundShipmentRefFields
  }
  matchedCustomer {
    id
    code
    name
  }
  threadKey
  threadCount
  senderDomain
  ownerId
  owner {
    ...TriageUserFields
  }
  dueAt
  responseTargetMinutes
  snooze {
    ...InboundSnoozeFields
  }
  awaitingReply {
    since
    until
  }
  novaRead
  handledByNova
  actions {
    ...TriageActionFields
  }
  version
}

fragment InboundMessageDetailFields on InboundMessage {
  ...InboundMessageListFields
  toAddresses
  ccAddresses
  textBody
  spamScore
  matchedCarrierId
  runId
  reviewedBy
  reviewedAt
  reviewNote
  failureCode
  createdAt
  updatedAt
  handledByRuleId
  handledAction
  classificationCorrected
  reviewer {
    ...TriageUserFields
  }
  mailbox {
    ...InboundMailboxFields
  }
  attachments {
    ...InboundAttachmentDetailFields
  }
  facts {
    ...TriageFactFields
  }
  conflicts {
    ...TriageConflictFields
  }
  activity {
    ...InboundActivityFields
  }
  replies {
    ...InboundReplyFields
  }
  replyDraft {
    ...InboundReplyFields
  }
  loadDraft {
    ...TriageLoadDraftFields
  }
}

query InboundMessages($input: InboundMessagesInput!) {
  inboundMessages(input: $input) {
    edges {
      cursor
      node {
        ...InboundMessageListFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query InboundMessage($id: ID!) {
  inboundMessage(id: $id) {
    ...InboundMessageDetailFields
  }
}

query InboundMessageCounts {
  inboundMessageCounts {
    waiting
    waitingOnThem
    snoozed
    assignedToMe
    overdue
    processing
    handled
    ignored
    quarantined
    total
    byClassification {
      classification
      total
      waiting
    }
    byMailbox {
      mailboxId
      total
      waiting
    }
  }
}

query InboundMailboxes {
  inboundMailboxes {
    ...InboundMailboxFields
  }
}

mutation ReviewInboundMessage($id: ID!, $input: ReviewInboundMessageInput!) {
  reviewInboundMessage(id: $id, input: $input) {
    ...InboundMessageDetailFields
  }
}

mutation LinkInboundMessage($id: ID!, $input: LinkInboundMessageInput!) {
  linkInboundMessage(id: $id, input: $input) {
    ...InboundMessageDetailFields
  }
}

mutation CreateInboundMailbox(
  $input: InboundMailboxInput!
  $signingSecret: String
  $apiKey: String
) {
  createInboundMailbox(input: $input, signingSecret: $signingSecret, apiKey: $apiKey) {
    ...InboundMailboxCredentialsFields
  }
}

mutation UpdateInboundMailbox($id: ID!, $version: Int!, $input: InboundMailboxInput!) {
  updateInboundMailbox(id: $id, version: $version, input: $input) {
    ...InboundMailboxFields
  }
}

mutation RotateInboundMailboxToken($id: ID!) {
  rotateInboundMailboxToken(id: $id) {
    ...InboundMailboxCredentialsFields
  }
}

mutation SetInboundMailboxSigningSecret($id: ID!, $secret: String!) {
  setInboundMailboxSigningSecret(id: $id, secret: $secret) {
    ...InboundMailboxFields
  }
}

mutation SetInboundMailboxApiKey($id: ID!, $apiKey: String!) {
  setInboundMailboxApiKey(id: $id, apiKey: $apiKey) {
    ...InboundMailboxFields
  }
}
