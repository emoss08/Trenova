# The Desk's IFTA return list, read by the agent's fuel_list_ifta_returns: each
# quarter's return, where it stands, its miles, gallons and net tax due, and
# the problems it carries, without the per-jurisdiction lines the return page
# loads.
query DeskIftaReturns($input: IFTAReturnsInput!, $includeTotalCount: Boolean = false) {
  iftaReturns(input: $input) {
    edges {
      cursor
      node {
        id
        year
        quarter
        status
        amendmentNumber
        totalMiles
        totalGallons
        totalTaxPaidGallons
        netDue
        currencyCode
        finalizedAt
        filedAt
        filingReference
        problems {
          code
          message
          jurisdictionCode
          fuelType
        }
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}

# The Desk's IFTA return card, read by the agent's fuel_get_ifta_return: the
# quarter and its filing date, where the return stands, its totals, the
# problems it carries and every jurisdiction line with its net tax, owed or
# credit.
query DeskIftaReturnCard($id: ID!) {
  iftaReturn(id: $id) {
    id
    year
    quarter
    period {
      label
      end
      dueDate
    }
    amendmentNumber
    status
    totalMiles
    totalTaxableMiles
    totalGallons
    totalTaxPaidGallons
    netTaxableGallons
    taxDue
    surchargeDue
    netDue
    currencyCode
    unattributedMiles
    unattributedMoveCount
    noTractorMiles
    noTractorMoveCount
    problems {
      code
      message
      jurisdictionCode
      fuelType
      amount
    }
    computedAt
    finalizedAt
    filedAt
    filingReference
    lines {
      id
      fuelType
      isIftaMember
      totalMiles
      taxableMiles
      taxPaidGallons
      netTaxableGallons
      ratePerGallon
      rateMissing
      taxDue
      surchargeDue
      lineTotal
      sortOrder
      jurisdiction {
        id
        code
        name
      }
    }
  }
}
