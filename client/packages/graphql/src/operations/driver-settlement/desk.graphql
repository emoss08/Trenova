# The Desk's worker settlement card: where the statement stands and who moved
# it, the flags the run raised, how it adds up, its lines summed by how each
# was paid, each load's share, and the worker's disputes. The loads it pays are
# read a page at a time through shipments.
query DeskDriverSettlementCard($id: ID!) @requiresRead(kind: "escrow_account") @requiresRead(kind: "pay_advance") {
  driverSettlement(id: $id) {
    id
    settlementNumber
    status
    classification
    payProfileName
    periodStart
    periodEnd
    payDate
    grossEarningsMinor
    reimbursementsMinor
    deductionsMinor
    carryForwardInMinor
    carryForwardOutMinor
    netPayMinor
    totalMiles
    shipmentCount
    currencyCode
    exceptions {
      code
      severity
      message
    }
    submittedAt
    approvedAt
    postedAt
    paidAt
    paymentMethod
    paymentReference
    voidedAt
    voidReason
    createdAt
    updatedAt
    worker {
      id
      firstName
      lastName
      wholeName
    }
    submittedBy {
      id
      name
    }
    approvedBy {
      id
      name
    }
    postedBy {
      id
      name
    }
    paidBy {
      id
      name
    }
    voidedBy {
      id
      name
    }
    lineSummary {
      category
      componentKind
      method
      description
      rate
      quantity
      amountMinor
      lineCount
      shipmentCount
      advanceId
      escrowAccountId
      recurringDeductionId
      manual
      advance {
        id
        reference
        amountMinor
        outstandingMinor
      }
      escrowAccount {
        id
        balanceMinor
        targetAmountMinor
      }
    }
    loadShares {
      shipmentId
      proNumber
      amountMinor
    }
    disputes {
      id
      status
      category
      description
      resolutionNote
      resolvedAt
      createdAt
      settlementLine {
        description
        proNumber
      }
    }
  }
}

# A worker settlement as the Desk's agent reads it: the statement and its
# totals, the flags it raised, each line by id (the adjustment tools take a
# line's id), and the disputes raised on it.
query DeskDriverSettlementStatement($id: ID!) {
  driverSettlement(id: $id) {
    id
    workerId
    settlementNumber
    status
    classification
    payProfileName
    periodStart
    periodEnd
    payDate
    grossEarningsMinor
    reimbursementsMinor
    deductionsMinor
    carryForwardInMinor
    carryForwardOutMinor
    netPayMinor
    totalMiles
    shipmentCount
    currencyCode
    hasExceptions
    exceptions {
      code
      severity
      message
    }
    notes
    submittedAt
    approvedAt
    postedAt
    paidAt
    paymentMethod
    voidedAt
    voidReason
    worker {
      ...WorkerReference
    }
    lines {
      id
      lineNumber
      category
      description
      proNumber
      shipmentId
      payEventId
      quantity
      rate
      amountMinor
    }
    disputes {
      id
      status
      category
      settlementLineId
      resolvedAt
      createdAt
    }
  }
}

# The active pay codes a settlement line, an adjustment or a recurring pay
# schedule posts under, each with the id of the GL account it maps to.
query DeskPayCodeOptions($direction: PayCodeDirection) {
  payCodeOptions(direction: $direction) {
    id
    code
    name
    description
    direction
    taxable
    countsTowardGuarantee
    isSystem
    glAccountId
  }
}
