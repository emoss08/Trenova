# The Desk's IFTA mileage entry list, read by the agent's
# fuel_list_ifta_mileage_entries: the miles a tractor ran in a jurisdiction that
# routing did not capture, the day and quarter they count in, without the
# audit fields the edit panel loads.
query DeskIftaMileageEntries(
  $input: IFTAMileageEntriesInput!
  $includeTotalCount: Boolean = false
) {
  iftaMileageEntries(input: $input) {
    edges {
      node {
        id
        tractorId
        jurisdictionId
        traveledAt
        year
        quarter
        miles
        loaded
        source
        shipmentMoveId
        notes
        tractor {
          id
          code
        }
        jurisdiction {
          id
          code
        }
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
