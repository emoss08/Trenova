# The sending profiles an agent picks one from: what each is called and who
# the mail comes from and goes back to.
query DeskEmailProfiles($input: DataTableConnectionInput!, $includeTotalCount: Boolean = false) {
  emailProfiles(input: $input) {
    edges {
      cursor
      node {
        id
        name
        description
        senderName
        senderEmail
        replyToEmail
        status
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
  }
}
