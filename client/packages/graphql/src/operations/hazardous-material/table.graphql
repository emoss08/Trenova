fragment HazardousMaterialTableRowFields on HazardousMaterial {
  id
  businessUnitId
  organizationId
  status
  code
  name
  description
  class
  unNumber
  packingGroup
  subsidiaryHazardClass
  ergGuideNumber
  labelCodes
  specialProvisions
  properShippingName
  handlingInstructions
  emergencyContact
  emergencyContactPhoneNumber
  quantityThreshold
  placardRequired
  isReportableQuantity
  marinePollutant
  inhalationHazard
  version
  createdAt
  updatedAt
}

query HazardousMaterialTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  hazardousMaterials(input: $input) {
    edges {
      cursor
      node {
        ...HazardousMaterialTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
