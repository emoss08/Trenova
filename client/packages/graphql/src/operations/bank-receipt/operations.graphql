query BankReceiptMatchSuggestions($id: ID!) {
  bankReceiptMatchSuggestions(id: $id) {
    customerPaymentId
    referenceNumber
    amountMinor
    customerId
    score
    reason
  }
}

query BankReceiptSummary($asOfDate: Timestamp) {
  bankReceiptSummary(asOfDate: $asOfDate) {
    asOfDate
    importedCount
    importedAmount
    matchedCount
    matchedAmount
    exceptionCount
    exceptionAmount
    activeWorkItemCount
    assignedWorkItemCount
    inReviewWorkItemCount
    exceptionAging {
      currentCount
      currentAmount
      days1To3Count
      days1To3Amount
      days4To7Count
      days4To7Amount
      daysOver7Count
      daysOver7Amount
    }
  }
}

mutation MatchBankReceipt($id: ID!, $paymentId: ID!) {
  matchBankReceipt(id: $id, paymentId: $paymentId) {
    id
    organizationId
    businessUnitId
    receiptDate
    amountMinor
    referenceNumber
    memo
    status
    importBatchId
    matchedCustomerPaymentId
    matchedAt
    matchedById
    exceptionReason
    createdById
    updatedById
    version
    createdAt
    updatedAt
  }
}

