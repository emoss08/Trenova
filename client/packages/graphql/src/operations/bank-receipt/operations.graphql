query BankReceiptBatches {
  bankReceiptBatches {
    id
    organizationId
    businessUnitId
    source
    reference
    status
    importedCount
    matchedCount
    exceptionCount
    importedAmountMinor
    matchedAmountMinor
    exceptionAmountMinor
    createdById
    updatedById
    version
    createdAt
    updatedAt
  }
}

query BankReceiptBatch($id: ID!) {
  bankReceiptBatch(id: $id) {
    batch {
      id
      organizationId
      businessUnitId
      source
      reference
      status
      importedCount
      matchedCount
      exceptionCount
      importedAmountMinor
      matchedAmountMinor
      exceptionAmountMinor
      createdById
      updatedById
      version
      createdAt
      updatedAt
    }
    receipts {
      id
      organizationId
      businessUnitId
      receiptDate
      amountMinor
      referenceNumber
      memo
      status
      importBatchId
      matchedCustomerPaymentId
      matchedAt
      matchedById
      exceptionReason
      createdById
      updatedById
      version
      createdAt
      updatedAt
    }
  }
}

mutation ImportBankReceiptBatch($input: ImportBankReceiptBatchInput!) {
  importBankReceiptBatch(input: $input) {
    batch {
      id
      organizationId
      businessUnitId
      source
      reference
      status
      importedCount
      matchedCount
      exceptionCount
      importedAmountMinor
      matchedAmountMinor
      exceptionAmountMinor
      createdById
      updatedById
      version
      createdAt
      updatedAt
    }
    receipts {
      id
      organizationId
      businessUnitId
      receiptDate
      amountMinor
      referenceNumber
      memo
      status
      importBatchId
      matchedCustomerPaymentId
      matchedAt
      matchedById
      exceptionReason
      createdById
      updatedById
      version
      createdAt
      updatedAt
    }
  }
}

