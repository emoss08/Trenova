fragment FormulaTemplateTableRowFields on FormulaTemplate {
  id
  businessUnitId
  organizationId
  name
  description
  type
  expression
  status
  schemaId
  variableDefinitions {
    name
    type
    description
    required
    defaultValue
    source
  }
  breakdownDefinitions {
    name
    label
    expression
  }
  minCharge
  maxCharge
  roundingMode
  roundingPrecision
  sourceTemplateId
  sourceVersionNumber
  version
  currentVersionNumber
  createdAt
  updatedAt
}

query FormulaTemplateTable($input: DataTableConnectionInput!) {
  formulaTemplates(input: $input) {
    edges {
      node {
        ...FormulaTemplateTableRowFields
      }
    }
    totalCount
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
