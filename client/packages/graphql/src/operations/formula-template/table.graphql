fragment FormulaTemplateTableRowFields on FormulaTemplate {
  id
  businessUnitId
  organizationId
  name
  description
  status
  testCount
  imports {
    path
    version
  }
  sourceTemplateId
  sourceVersionNumber
  version
  currentVersionNumber
  approvedAt
  usageCount
  createdAt
  updatedAt
}

query FormulaTemplateTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  formulaTemplates(input: $input) {
    edges {
      node {
        ...FormulaTemplateTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
