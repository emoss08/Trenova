fragment OrderTableRowFields on Order {
  id
  ownerId
  businessUnitId
  organizationId
  customerId
  status
  orderNumber
  poNumber
  bol
  currencyCode
  quotedAmount
  baseAmount
  totalAmount
  version
  createdAt
  updatedAt
  customer {
    id
    name
    code
  }
}

query OrderTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) {
  orders(input: $input) {
    edges {
      node {
        ...OrderTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
