# The stacks waiting in intake, each with the documents it was split into and
# what each was matched to, without page images or the device's settings.
fragment DeskCaptureBatchFields on CaptureBatch {
  id
  version
  status
  source
  sourceName
  jobName
  receivedPageCount
  itemCount
  filedItemCount
  openItemCount
  failureMessage
  isEditable
  createdAt
  items {
    id
    version
    position
    status
    pageCount
    suggestedType
    suggestedId
    suggestedDocumentTypeId
    suggestionConfidence
    suggestionReason
    detectedKind
    filedType
    filedId
    failureMessage
  }
}

query DeskCaptureBatches($input: CaptureBatchesInput!, $includeTotalCount: Boolean = false) {
  captureBatches(input: $input) {
    edges {
      cursor
      node {
        ...DeskCaptureBatchFields
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
  }
}

query DeskCaptureBatch($id: ID!) {
  captureBatch(id: $id) {
    ...DeskCaptureBatchFields
  }
}
