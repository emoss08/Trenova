# The Desk's worker card, which the agent's worker_get reads too: who the
# worker is, how to reach them, whether they can be dispatched, and the
# license, medical and review dates their qualification hangs on, without the
# PTO, custom fields and tenant details the edit panel loads.
query DeskWorkerCard($id: ID!) {
  worker(id: $id) {
    id
    status
    type
    driverType
    firstName
    lastName
    phoneNumber
    email
    city
    postalCode
    emergencyContactName
    emergencyContactPhone
    externalId
    assignmentBlocked
    canBeAssigned
    availableForDispatch
    leaveType
    createdAt
    state {
      abbreviation
    }
    fleetCode {
      id
      code
    }
    manager {
      id
      name
    }
    profile {
      licenseNumber
      cdlClass
      cdlRestrictions
      endorsement
      licenseExpiry
      hazmatExpiry
      medicalCardExpiry
      twicExpiry
      physicalDueDate
      mvrDueDate
      lastMvrCheck
      nextTrainingDue
      hireDate
      terminationDate
      complianceStatus
      isQualified
      disqualificationReason
      safetyRating
      eldExempt
      shortHaulExempt
      licenseState {
        abbreviation
      }
    }
  }
}

# The driver's clocks as telematics last reported them, and the latest
# violations, for the card's hours-of-service section.
query DeskWorkerHos($workerId: ID!, $violations: Int!) {
  workerHosState(workerId: $workerId) {
    dutyStatus
    driveRemainingMs
    driveLimitMs
    shiftRemainingMs
    shiftLimitMs
    cycleRemainingMs
    cycleLimitMs
    breakRemainingMs
    breakLimitMs
    currentTractorId
    rulesetCycle
    recordedAt
  }
  workerHosViolations(workerId: $workerId, limit: $violations) {
    violationType
    description
    durationMs
    violationStartAt
  }
}

# Whether the worker is in good standing, and what stands against them, ranked
# worst first.
query DeskWorkerStanding($workerId: ID!) {
  workerOverview(workerId: $workerId) {
    standing
    concerns {
      severity
      code
      headline
      detail
    }
  }
}

# The worker's credentials beyond the license and medical dates on their
# profile, each with how it stands.
query DeskWorkerCredentials($workerId: ID!) {
  workerCredentialSummary(workerId: $workerId) {
    items {
      health
      daysUntilExpiry
      required
      credentialType {
        id
        name
        profileField
      }
      credential {
        id
        expiresAt
      }
    }
  }
}

# The Desk's worker list, read by the agent's worker_list: who each worker
# is, whether they can be dispatched, and the credentials their qualification
# hangs on, without the contact, address and personnel fields an agent at its
# default data access is never shown.
query DeskWorkers($input: DataTableConnectionInput!) {
  workers(input: $input) {
    edges {
      node {
        id
        status
        type
        driverType
        firstName
        lastName
        wholeName
        city
        externalId
        assignmentBlocked
        canBeAssigned
        availableForDispatch
        createdAt
        fleetCodeId
        fleetCode {
          id
          code
        }
        profile {
          cdlClass
          cdlRestrictions
          endorsement
          complianceStatus
          isQualified
          eldExempt
          shortHaulExempt
          licenseExpiry
          hazmatExpiry
          medicalCardExpiry
          twicExpiry
          physicalDueDate
          mvrDueDate
          lastMvrCheck
          lastComplianceCheck
        }
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
