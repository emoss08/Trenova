fragment ServiceFailureTableRowFields on ServiceFailure {
  id
  shipmentId
  shipmentMoveId
  number
  type
  source
  status
  stopType
  stopId
  scheduledCutoff
  actualArrival
  gracePeriodMinutes
  lateMinutes
  reasonCodeId
  notes
  internalNotes
  x12StatusCodeOverride
  x12ReasonCodeOverride
  x12ExceptionCode
  detectedAt
  version
  shipment {
    id
    proNumber
    bol
  }
  stop {
    id
    type
    sequence
    locationId
    location {
      id
      name
      code
      city
      state {
        abbreviation
      }
    }
  }
  reasonCode {
    id
    code
    label
  }
}

query ServiceFailureTable(
  $input: DataTableConnectionInput!
  $shipmentId: ID
  $includeTotalCount: Boolean = true
) {
  serviceFailures(input: $input, shipmentId: $shipmentId) {
    edges {
      node {
        ...ServiceFailureTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
