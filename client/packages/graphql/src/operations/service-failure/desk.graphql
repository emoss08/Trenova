# The Desk's service failure card: what was late and by how much, at which
# stop on which load, why, and who has looked at it.
query DeskServiceFailureCard($id: ID!) @requiresRead(kind: "service_failure_reason_code") @requiresRead(kind: "shipment") {
  serviceFailure(id: $id) {
    id
    shipmentId
    number
    type
    source
    status
    stopType
    scheduledCutoff
    actualArrival
    gracePeriodMinutes
    lateMinutes
    notes
    internalNotes
    x12StatusCodeOverride
    x12ReasonCodeOverride
    x12ExceptionCode
    detectedAt
    reviewedAt
    resolvedAt
    voidedAt
    voidReason
    createdAt
    updatedAt
    createdBy {
      id
      name
    }
    reviewedBy {
      id
      name
    }
    resolvedBy {
      id
      name
    }
    voidedBy {
      id
      name
    }
    shipment {
      id
      proNumber
      bol
      customer {
        id
        code
        name
      }
    }
    stop {
      id
      type
      sequence
      location {
        id
        code
        name
        addressLine1
        city
        postalCode
        latitude
        longitude
        state {
          abbreviation
        }
      }
    }
    reasonCode {
      id
      code
      label
      description
      category
    }
  }
}

# The service failures at stops made at a location, or on one shipment, newest
# first, a page at a time. The count is read with the first page only.
query DeskRecordFailures(
  $locationId: ID
  $shipmentId: ID
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean!
) {
  serviceFailures(input: $input, locationId: $locationId, shipmentId: $shipmentId) {
    edges {
      node {
        id
        number
        type
        status
        stopType
        lateMinutes
        actualArrival
        shipment {
          id
          proNumber
        }
        stop {
          id
          location {
            id
            name
            city
            state {
              abbreviation
            }
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
  }
}
