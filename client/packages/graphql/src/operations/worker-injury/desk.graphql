query DeskWorkerInjuries(
  $workerId: ID
  $caseYear: Int
  $recordableOnly: Boolean
  $openOnly: Boolean
  $first: Int
  $after: String
) {
  workerInjuries(
    workerId: $workerId
    caseYear: $caseYear
    recordableOnly: $recordableOnly
    openOnly: $openOnly
    first: $first
    after: $after
  ) {
    edges {
      cursor
      node {
        id
        workerId
        caseNumber
        caseYear
        classification
        illnessType
        treatment
        status
        recordable
        occurredAt
        returnedToWorkAt
        description
        bodyPart
        daysAway
        daysRestricted
        privacyCase
        logName
        claimStatus
        worker {
          ...WorkerReference
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
