query CollectionWorklist($input: CollectionWorklistInput!) {
  collectionWorklist(input: $input) {
    rows {
      customerId
      customerName
      customerCode
      creditStatus
      currencyCode
      totalOpenMinor
      overdueMinor
      oldestDaysPastDue
      openInvoiceCount
      disputedInvoiceCount
      collectorId
      collectorName
      nextFollowUpOn
      followUpDue
      lastActivityAt
      lastActivityKind
      lastActivitySummary
      promise {
        activityId
        amountMinor
        currencyCode
        promisedOn
        madeAt
        madeByName
        paidSinceMinor
        status
      }
      priority
    }
    total
    summary {
      accounts
      overdue {
        currencyCode
        amountMinor
      }
      followUpsDue
      brokenPromises
      unassigned
    }
  }
}

query CollectionAccount($customerId: ID!, $before: CollectionActivityCursorInput) {
  collectionAccount(customerId: $customerId, before: $before) {
    row {
      customerId
      customerName
      customerCode
      creditStatus
      currencyCode
      totalOpenMinor
      overdueMinor
      oldestDaysPastDue
      openInvoiceCount
      disputedInvoiceCount
      collectorId
      collectorName
      nextFollowUpOn
      followUpDue
      lastActivityAt
      lastActivityKind
      lastActivitySummary
      promise {
        activityId
        amountMinor
        currencyCode
        promisedOn
        madeAt
        madeByName
        paidSinceMinor
        status
      }
      priority
    }
    activities {
      id
      customerId
      kind
      summary
      contactName
      invoiceId
      invoiceNumber
      promisedAmountMinor
      promisedOn
      currencyCode
      followUpOn
      collectorId
      collectorName
      createdById
      createdByName
      createdAt
    }
    hasMore
  }
}

