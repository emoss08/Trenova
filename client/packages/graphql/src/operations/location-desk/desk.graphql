# The Desk's location card: where the place is, its fence and what kind of
# facility it is, without the organization and business unit the edit panel
# loads.
query DeskLocationCard($id: ID!) @requiresRead(kind: "location_category") {
  location(id: $id) {
    id
    status
    code
    name
    description
    addressLine1
    addressLine2
    city
    postalCode
    timezone
    isGeocoded
    latitude
    longitude
    geofenceType
    geofenceRadiusMeters
    geofenceVertices {
      latitude
      longitude
    }
    createdAt
    state {
      abbreviation
    }
    locationCategory {
      id
      name
      type
      facilityType
      hasSecureParking
      requiresAppointment
      allowsOvernight
      hasRestroom
    }
  }
}

# How long trucks waited at the location over a window, from the detention
# record of every closed stop made there.
query DeskLocationDwell($locationId: ID!, $from: Timestamp!, $to: Timestamp!) {
  detentionFacilityStats(input: { from: $from, to: $to, locationId: $locationId, limit: 1 }) {
    locationId
    stopCount
    breachCount
    avgDwellMinutes
    medianDwellMinutes
    p90DwellMinutes
    billedAmount
    waivedAmount
    disputeCount
  }
}

# The detention policies written for the location itself, highest priority
# first, and how many there are in all.
query DeskLocationPolicies($input: DataTableConnectionInput!) {
  detentionPolicies(input: $input) {
    totalCount
    totalCountExact
    edges {
      node {
        id
        name
        code
        status
        priority
        customerId
        stopTypes
        appointmentStopsOnly
        billingFreeMinutes
        pickupFreeMinutes
        deliveryFreeMinutes
        effectiveStartDate
        effectiveEndDate
      }
    }
  }
}
