}

query CurrentCarrierSettlementPeriod {
  currentCarrierSettlementPeriod {
    periodStart
    periodEnd
    payDate
  }
}

query CarrierSettlementWorkspaceSummary($periodStart: Int, $periodEnd: Int) {
  carrierSettlementWorkspaceSummary(periodStart: $periodStart, periodEnd: $periodEnd) {
    periodStart
    periodEnd
    payDate
    draftCount
    pendingApprovalCount
    approvedCount
    postedCount
    paidCount
    totalNetMinor
    totalGrossMinor
    pendingEventCount
    pendingAmountMinor
    pendingCarrierCount
    openBatchId
  }
}

query CarrierLedgerEntries($carrierId: ID!, $limit: Int) {
  carrierLedgerEntries(carrierId: $carrierId, limit: $limit) {
    id
    carrierId
    entryType
    sourceObjectType
    sourceObjectId
    sourceEventType
    relatedSettlementId
    journalBatchId
    documentNumber
    transactionDate
    lineNumber
    amountMinor
    createdAt
  }
}

query CarrierInvoiceMatches(
  $status: CarrierInvoiceMatchStatus
  $carrierId: ID
  $limit: Int
  $offset: Int
) {
  carrierInvoiceMatches(status: $status, carrierId: $carrierId, limit: $limit, offset: $offset) {
    items {
      id
      ediCarrierInvoiceId
      documentAiExtractionId
      carrierId
      carrierAssignmentId
      carrierSettlementId
      adjustmentCostEventId
      status
      invoiceNumber
      invoiceTotalMinor
      expectedTotalMinor
      varianceMinor
      currencyCode
      resolutionNote
      resolvedById
      resolvedAt
      version
      createdAt
      updatedAt
      carrier {
        id
        code
        name
        scac
      }
      carrierAssignment {
        id
        shipmentMoveId
        status
        rateMethod
        baseRate
        baseAmount
        fuelSurcharge
        accessorialTotal
        totalCost
        currencyCode
        proNumber
        accessorials {
          id
          description
          amount
        }
      }
    }
    totalCount
  }
}

query EdiCarrierInvoices($reconciliationStatus: String, $limit: Int, $offset: Int) {
  ediCarrierInvoices(reconciliationStatus: $reconciliationStatus, limit: $limit, offset: $offset) {
    items {
      id
      carrierId
      shipmentId
      invoiceNumber
      invoiceDate
      deliveryDate
      shipmentReference
      bol
      proNumber
      billToName
      currencyCode
      totalAmount
      expectedAmount
      varianceAmount
      reconciliationStatus
      reconciliationNotes
      version
      createdAt
      updatedAt
    }
    totalCount
  }
}

