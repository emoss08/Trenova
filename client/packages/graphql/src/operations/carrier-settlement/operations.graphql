query CarrierSettlementControl {
  carrierSettlementControl {
    id
    organizationId
    businessUnitId
    payTrigger
    payPeriodFrequency
    periodEndDayOfWeek
    payDelayDays
    autoGenerateBatches
    autoPostOnApprove
    varianceToleranceMinor
    autoMatchInboundInvoices
    autoAcceptWithinTolerance
    defaultApAccountId
