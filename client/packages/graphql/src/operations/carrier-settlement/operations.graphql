query CarrierSettlementTable($input: DataTableConnectionInput!) {
  carrierSettlements(input: $input) {
    edges {
      node {
        id
        carrierId
        batchId
        settlementNumber
        status
        periodStart
        periodEnd
        payDate
        grossCostMinor
        adjustmentsMinor
        netPayableMinor
        shipmentCount
        currencyCode
        paymentMethod
        paymentReference
        version
        createdAt
        updatedAt
        carrier {
          id
          code
          name
          scac
        }
      }
    }
    totalCount
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query CarrierSettlementDetail($id: ID!) {
  carrierSettlement(id: $id) {
    id
    carrierId
    batchId
    settlementNumber
    status
    periodStart
    periodEnd
    payDate
    grossCostMinor
    adjustmentsMinor
    netPayableMinor
    shipmentCount
    currencyCode
    notes
    submittedById
    submittedAt
    approvedById
    approvedAt
    postedById
    postedAt
    postedJournalBatchId
    paidAt
    paidById
    paymentMethod
    paymentReference
    paidJournalBatchId
    voidedById
    voidedAt
    voidReason
    voidJournalBatchId
    version
    createdAt
    updatedAt
    carrier {
      id
      code
      name
      scac
      paymentMethod
      paymentTermDays
      remitToName
      remitAddressLine1
      remitAddressLine2
      remitCity
      remitPostalCode
      remitState {
        id
        abbreviation
      }
    }
    lines {
      id
      lineNumber
      eventType
      description
      amountMinor
      costEventId
      glAccountId
      shipmentId
      moveId
      proNumber
    }
  }
}

