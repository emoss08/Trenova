fragment AuditLogTableRowFields on AuditEntry {
  id
  userId
  timestamp
  resource
  operation
  action
  resourceId
  entityRef
  correlationId
  comment
  ipAddress
  category
  retentionClass
  channel
  principalType
  principalId
  actorName
  aiRunId
  sensitiveData
  critical
  user {
    id
    name
    username
    emailAddress
    profilePicUrl
    thumbnailUrl
  }
}

query AuditLogTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) @requiresRead(kind: "user") {
  auditEntries(input: $input) {
    edges {
      node {
        ...AuditLogTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

query AuditEntryDetail($id: ID!) @requiresRead(kind: "user") {
  auditEntry(id: $id) {
    ...AuditLogTableRowFields
    userAgent
    traceId
    apiKeyId
    changes
    previousState
    currentState
    metadata
  }
}

query AuditRequestEntries($input: DataTableConnectionInput!) @requiresRead(kind: "user") {
  auditEntries(input: $input) {
    edges {
      node {
        id
        timestamp
        resource
        operation
        action
        resourceId
        entityRef
        comment
      }
    }
  }
}

query AuditFieldHistory($resourceId: ID!, $field: String!, $input: DataTableConnectionInput!) @requiresRead(kind: "user") {
  auditEntriesByResourceId(resourceId: $resourceId, field: $field, input: $input) {
    edges {
      node {
        id
        timestamp
        actorName
        changes
      }
    }
  }
}
