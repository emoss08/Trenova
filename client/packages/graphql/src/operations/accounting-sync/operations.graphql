fragment AccountingConnectionFields on AccountingConnection {
  id
  integrationType
  status
  appSource
  appEnvironment
  externalCompanyName
  externalLegalName
  externalCountry
  externalHomeCurrency
  externalMultiCurrencyEnabled
  externalBooksClosedThrough
  lastCheckedAt
  lastSuccessAt
  lastFailureAt
  consecutiveFailures
  lastErrorCategory
  lastErrorMessage
  lastWebhookAt
  refreshTokenAbsoluteExpiresAt
  connectedAt
  disconnectedAt
  setupStep
  referenceRefreshStartedAt
  referenceRefreshedAt
  referenceRefreshError
  version
  updatedAt
}

fragment AccountingMappingFields on AccountingMapping {
  id
  targetType
  trenovaObjectId
  trenovaKey
  targetLabel
  providerKind
  externalId
  externalName
  state
  source
  confidence
  reason
  required
  prechecked
  candidates {
    externalId
    name
    score
    reason
  }
  confirmedBy {
    id
    name
  }
  confirmedAt
  version
  updatedAt
}

fragment AccountingReferenceObjectFields on AccountingReferenceObject {
  id
  kind
  externalId
  label
  number
  accountType
  accountSubType
  itemType
  companyName
  city
  state
  postalCode
  dueDays
  active
  usable
}

fragment AccountingAppSettingsFields on AccountingAppSettings {
  activeSource
  instanceAppAvailable
  instanceEnvironment
  redirectUrl
  webhookPath
  tenantApp {
    id
    integrationType
    environment
    clientId
    hasWebhookVerifier
    version
    updatedAt
  }
}

fragment AccountingSyncStatusFields on AccountingSyncStatus {
  integrationType
  providerName
  available
  app {
    ...AccountingAppSettingsFields
  }
  connection {
    ...AccountingConnectionFields
  }
}

query AccountingSyncStatus($integrationType: AccountingSystem!) {
  accountingSyncStatus(integrationType: $integrationType) {
    ...AccountingSyncStatusFields
  }
}

mutation SaveAccountingApp($input: SaveAccountingAppInput!) {
  saveAccountingApp(input: $input) {
    ...AccountingSyncStatusFields
  }
}

mutation RemoveAccountingApp($integrationType: AccountingSystem!) {
  removeAccountingApp(integrationType: $integrationType) {
    ...AccountingSyncStatusFields
  }
}

query AccountingMappingSummary($integrationType: AccountingSystem!) {
  accountingMappingSummary(integrationType: $integrationType) {
    integrationType
    providerName
    connection {
      ...AccountingConnectionFields
    }
    groups {
      targetType
      unmatched
      proposed
      confirmed
    }
    requiredTotal
    requiredConfirmed
    canCompleteSetup
  }
}

query AccountingMappings(
  $integrationType: AccountingSystem!
  $first: Int
  $after: String
  $filter: AccountingMappingFilterInput
) {
  accountingMappings(
    integrationType: $integrationType
    first: $first
    after: $after
    filter: $filter
  ) {
    edges {
      node {
        ...AccountingMappingFields
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query AccountingReferenceObjects(
  $integrationType: AccountingSystem!
  $kind: AccountingReferenceKind!
  $query: String
  $usableOnly: Boolean
  $limit: Int
) {
  accountingReferenceObjects(
    integrationType: $integrationType
    kind: $kind
    query: $query
    usableOnly: $usableOnly
    limit: $limit
  ) {
    ...AccountingReferenceObjectFields
  }
}

mutation ConfirmAccountingMappings($input: [ConfirmAccountingMappingInput!]!) {
  confirmAccountingMappings(input: $input) {
    ...AccountingMappingFields
  }
}

mutation RejectAccountingMapping($id: ID!) {
  rejectAccountingMapping(id: $id) {
    ...AccountingMappingFields
  }
}

mutation SetAccountingMapping($input: SetAccountingMappingInput!) {
  setAccountingMapping(input: $input) {
    ...AccountingMappingFields
  }
}

mutation ClearAccountingMapping($id: ID!) {
  clearAccountingMapping(id: $id) {
    ...AccountingMappingFields
  }
}

mutation CreateAccountingReferenceRecord($input: CreateAccountingReferenceRecordInput!) {
  createAccountingReferenceRecord(input: $input) {
    ...AccountingMappingFields
  }
}

mutation RefreshAccountingReferenceData($integrationType: AccountingSystem!) {
  refreshAccountingReferenceData(integrationType: $integrationType) {
    ...AccountingConnectionFields
  }
}

mutation CompleteAccountingSetup($integrationType: AccountingSystem!) {
  completeAccountingSetup(integrationType: $integrationType) {
    ...AccountingConnectionFields
  }
}

mutation StartAccountingAuthorization($integrationType: AccountingSystem!) {
  startAccountingAuthorization(integrationType: $integrationType) {
    authorizeUrl
    expiresAt
  }
}

mutation CompleteAccountingAuthorization($input: CompleteAccountingAuthorizationInput!) {
  completeAccountingAuthorization(input: $input) {
    ...AccountingConnectionFields
  }
}

mutation DisconnectAccountingSystem($integrationType: AccountingSystem!) {
  disconnectAccountingSystem(integrationType: $integrationType) {
    ...AccountingConnectionFields
  }
}

mutation CheckAccountingConnection($integrationType: AccountingSystem!) {
  checkAccountingConnection(integrationType: $integrationType) {
    ...AccountingConnectionFields
  }
}
