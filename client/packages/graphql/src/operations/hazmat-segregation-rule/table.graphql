fragment HazmatSegregationRuleTableRowFields on HazmatSegregationRule {
  id
  businessUnitId
  organizationId
  status
  name
  description
  exceptionNotes
  referenceCode
  regulationSource
  distanceUnit
  classA
  classB
  segregationType
  hasExceptions
  hazmatAId
  hazmatBId
  minimumDistance
  version
  createdAt
  updatedAt
}

query HazmatSegregationRuleTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  hazmatSegregationRules(input: $input) {
    edges {
      node {
        ...HazmatSegregationRuleTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
