query ProvisioningAuditRecords($directoryId: ID, $limit: Int) {
  provisioningAuditRecords(directoryId: $directoryId, limit: $limit) {
    id
    organizationId
    directoryId
    action
    resourceType
    externalId
    resourceId
    status
    errorMessage
    createdAt
  }
}

query SecurityBriefing {
  securityBriefing {
    generatedAt
    signInWindowDays
    dormantAfterDays
    apiKeyUnusedAfterDays
    apiKeyExpiringWithinDays
    findings {
      code
      severity
      count
      total
    }
    session {
      maxAgeSeconds
      idleTimeoutSeconds
      idleWarningSeconds
    }
    members {
      active
      locked
      neverSignedIn
      dormant
      mustChangePassword
    }
    mfa {
      enrolled
      total
      unenrolled {
        userId
        name
        emailAddress
        lastLoginAt
      }
    }
    signIns {
      succeeded
      failed
      denied
      throttled
      riskDenied
    }
    apiKeys {
      active
      withoutExpiry
      unused
      expiringSoon
    }
    sso {
      enabledProviders
      enforced
      enforcedProviderName
      trustsFederatedMfa
    }
    provisioning {
      activeDirectories
    }
    policies {
      enabled
      requiringMfa
      roleActivationRequired
    }
  }
}

query RecentAuthEvents($first: Int!) {
  authEvents(input: { first: $first, sort: [{ field: "occurredAt", direction: "desc" }] }) {
    edges {
      node {
        id
        userId
        identityProviderId
        provider
        outcome
        ipAddress
        userAgent
        authenticatorAal
        federationFal
        mfaState
        riskOutcome
        riskSignals
        errorCode
        occurredAt
        createdAt
      }
    }
  }
}

query RecentRiskDecisions($first: Int!) {
  riskDecisions(input: { first: $first, sort: [{ field: "createdAt", direction: "desc" }] }) {
    edges {
      node {
        id
        userId
        outcome
        signals
        reason
        createdAt
      }
    }
  }
}
