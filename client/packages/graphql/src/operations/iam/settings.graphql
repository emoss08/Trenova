fragment SCIMTokenFields on SCIMToken {
  id
  organizationId
  directoryId
  name
  prefix
  status
  lastUsedAt
  expiresAt
  createdAt
  updatedAt
}

query SCIMTokens($directoryId: ID!) {
  scimTokens(directoryId: $directoryId) {
    ...SCIMTokenFields
  }
}

mutation CreateSCIMToken($directoryId: ID!, $input: CreateSCIMTokenInput!) {
  createSCIMToken(directoryId: $directoryId, input: $input) {
    token
    scimToken {
      ...SCIMTokenFields
    }
  }
}

mutation RevokeSCIMToken($id: ID!) {
  revokeSCIMToken(id: $id) {
    ...SCIMTokenFields
  }
}

