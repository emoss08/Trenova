fragment IdentityProviderFields on IdentityProvider {
  id
  organizationId
  businessUnitId
  name
  slug
  protocol
  enabled
  enforceSso
  autoProvision
  allowFederatedMfa
  federatedMfaAcrValues
  allowedDomains
  attributeMap
  oidcIssuerUrl
  oidcClientId
  oidcRedirectUrl
  oidcScopes
  version
  createdAt
  updatedAt
}

query IdentityProviders {
  identityProviders {
    ...IdentityProviderFields
  }
}

mutation CreateIdentityProvider($input: IdentityProviderInput!) {
  createIdentityProvider(input: $input) {
    ...IdentityProviderFields
  }
}

mutation UpdateIdentityProvider($id: ID!, $input: IdentityProviderInput!) {
  updateIdentityProvider(id: $id, input: $input) {
    ...IdentityProviderFields
  }
}

mutation DeleteIdentityProvider($id: ID!) {
  deleteIdentityProvider(id: $id)
}

