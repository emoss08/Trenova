fragment SecurityActivityUserFields on User {
  id
  name
  emailAddress
  profilePicUrl
  thumbnailUrl
}

fragment AuthEventTableRowFields on AuthEvent {
  id
  userId
  identityProviderId
  provider
  outcome
  ipAddress
  userAgent
  authenticatorAal
  federationFal
  mfaState
  riskOutcome
  riskSignals
  errorCode
  occurredAt
  createdAt
  user {
    ...SecurityActivityUserFields
  }
}

query AuthEventsTable($input: DataTableConnectionInput!, $includeTotalCount: Boolean = true) @requiresRead(kind: "user") {
  authEvents(input: $input) {
    edges {
      node {
        ...AuthEventTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}

