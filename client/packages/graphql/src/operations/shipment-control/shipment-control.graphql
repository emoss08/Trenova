query ShipmentControl {
  shipmentControl {
    id
    organizationId
    businessUnitId
    maxShipmentWeightLimit
    autoDelayShipments
    autoDelayShipmentsThreshold
    detentionThreshold
    autoCancelShipmentsThreshold
    autoCancelShipments
    trackDetentionTime
    autoGenerateDetentionCharges
    detentionChargeId
    useDetentionPolicyEngine
    defaultDetentionPolicyId
    trackCustomerRejections
    checkForDuplicateBols
    allowMoveRemovals
    checkHazmatSegregation
    version
    createdAt
    updatedAt
  }
}

mutation UpdateShipmentControl($input: UpdateShipmentControlInput!) {
  updateShipmentControl(input: $input) {
    id
    organizationId
    businessUnitId
    maxShipmentWeightLimit
    autoDelayShipments
    autoDelayShipmentsThreshold
    detentionThreshold
    autoCancelShipmentsThreshold
    autoCancelShipments
    trackDetentionTime
    autoGenerateDetentionCharges
    detentionChargeId
    useDetentionPolicyEngine
    defaultDetentionPolicyId
    trackCustomerRejections
    checkForDuplicateBols
    allowMoveRemovals
    checkHazmatSegregation
    version
    createdAt
    updatedAt
  }
}
