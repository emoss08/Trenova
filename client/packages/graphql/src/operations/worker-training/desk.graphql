query DeskWorkerTrainingRecords($workerId: ID!, $includeClosed: Boolean) {
  workerTrainingRecords(workerId: $workerId, includeClosed: $includeClosed) {
    id
    courseId
    course {
      id
      code
      name
    }
    status
    assignedAt
    dueAt
    completedAt
    expiresAt
    score
    passed
  }
}
