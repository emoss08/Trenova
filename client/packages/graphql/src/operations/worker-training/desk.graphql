query DeskWorkerTrainingRecords($workerId: ID!, $includeClosed: Boolean, $first: Int, $after: String) {
  workerTrainingRecords(workerId: $workerId, includeClosed: $includeClosed, first: $first, after: $after) {
    edges {
      cursor
      node {
        id
        courseId
        course {
          ...TrainingCourseReference
        }
        status
        assignedAt
        dueAt
        completedAt
        expiresAt
        score
        passed
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
