fragment AccessorialChargeTableRowFields on AccessorialCharge {
  id
  businessUnitId
  organizationId
  status
  code
  description
  method
  rateUnit
  amount
  version
  createdAt
  updatedAt
}

query AccessorialChargeTable(
  $input: DataTableConnectionInput!
  $includeTotalCount: Boolean = true
) {
  accessorialCharges(input: $input) {
    edges {
      cursor
      node {
        ...AccessorialChargeTableRowFields
      }
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
    pageInfo {
      ...DataTablePageInfoFields
    }
  }
}
