mutation CreateJournalReversal($input: CreateJournalReversalInput!) {
  createJournalReversal(input: $input) {
    id
    status
    originalJournalEntryId
    reversalJournalEntryId
    requestedAccountingDate
    resolvedFiscalPeriodId
    reasonCode
    reasonText
    rejectionReason
    cancelReason
    version
    updatedAt
  }
}

