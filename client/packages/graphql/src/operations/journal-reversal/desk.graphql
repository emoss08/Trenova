query DeskJournalReversals($input: DataTableConnectionInput!, $includeTotalCount: Boolean = false) {
  journalReversals(input: $input) {
    edges {
      cursor
      node {
        id
        status
        originalJournalEntryId
        reversalJournalEntryId
        requestedAccountingDate
        resolvedFiscalPeriodId
        reasonCode
        reasonText
        approvedAt
        postedAt
        rejectionReason
        cancelReason
        createdAt
      }
    }
    pageInfo {
      endCursor
      hasNextPage
    }
    totalCount @include(if: $includeTotalCount)
    totalCountExact @include(if: $includeTotalCount)
  }
}
