  documentId: ID
  fineAmount: Decimal
  id: ID!
  inspectionLevel: Int
  inspectionResult: InspectionResult
  kind: SafetyEventKind!
  location: String
  occurredAt: Timestamp!
  organizationId: ID!
  outOfService: Boolean!
  points: Int!
  pointsExpireAt: Timestamp
  preventable: Boolean!
  recordedBy: User
  recordedById: ID
  referenceNumber: String
  resolution: String
  severity: SafetySeverity!
  shipmentId: ID
  status: SafetyEventStatus!
  updatedAt: Timestamp!
  version: Int!
  """
  The roadside violations cited on the event, by BASIC and then the heaviest
  first.
  """
  violations: [WorkerSafetyViolation!]!
  worker: Worker
  workerId: ID!
}

input WorkerSafetyEventInput {
  costAmount: Decimal
  description: String!
  documentId: ID
  fineAmount: Decimal
  inspectionLevel: Int
  inspectionResult: InspectionResult
  kind: SafetyEventKind!
  location: String
  occurredAt: Timestamp!
  outOfService: Boolean
  """Leave null to take the default for the kind and severity."""
  points: Int
  pointsExpireAt: Timestamp
  preventable: Boolean
  referenceNumber: String
  severity: SafetySeverity!
  shipmentId: ID
  workerId: ID!
}

"""
One violation cited on a safety event. A roadside inspection routinely produces
several, in different BASICs, so they are rows rather than a column on the
event.
"""
type WorkerSafetyViolation @kind(resource: "worker_safety_event") {
  basic: CSABasic!
  businessUnitId: ID!
  code: String
  createdAt: Timestamp!
  description: String!
  id: ID!
  organizationId: ID!
  outOfService: Boolean!
  safetyEventId: ID!
  """
  The FMCSA severity weight, 1 to 10. Out of service adds two more when the
  BASIC is scored, which is why the flag is kept beside it rather than folded
  in.
  """
  severityWeight: Int!
  updatedAt: Timestamp!
  version: Int!
  workerId: ID!
}

"""Which pattern a worker is on, for which period."""
type WorkerShiftAssignment @kind(resource: "worker_schedule") {
  assignedById: ID
  businessUnitId: ID!
  createdAt: Timestamp!
  """Which week of the template's cycle this worker starts on."""
  cycleOffsetWeeks: Int!
  effectiveFrom: Timestamp!
  effectiveTo: Timestamp
  id: ID!
  notes: String
  organizationId: ID!
  shiftTemplate: ShiftTemplate
  shiftTemplateId: ID!
  updatedAt: Timestamp!
  version: Int!
  worker: Worker
  workerId: ID!
}

"""
The one-word answer to whether a worker is in good standing right now.
Blocked means they cannot be put on a load today; AtRisk means something on the
record has already lapsed; Watch means something is about to.
"""
enum WorkerStanding {
  AtRisk
  Blocked
  Good
  Watch
}

"""
Evaluated state of one course slot. Missing only appears on a summary item for
a required course the worker has no usable record for.
"""
enum WorkerTrainingHealth {
  Current
  DueSoon
  Expired
  ExpiringSoon
  Failed
  Missing
  Overdue
  Scheduled
}

type WorkerTrainingRecord {
  acknowledgedAt: Timestamp
  assignedAt: Timestamp!
  assignedBy: User
  assignedById: ID
  businessUnitId: ID!
  completedAt: Timestamp
  course: TrainingCourse
  courseId: ID!
  createdAt: Timestamp!
  daysUntilDue: Int
  daysUntilExpiry: Int
  document: WorkerCredentialDocument
  documentId: ID
  dueAt: Timestamp
  expiresAt: Timestamp
  health: WorkerTrainingHealth!
  id: ID!
  notes: String
  organizationId: ID!
  passed: Boolean
  recordedBy: User
  recordedById: ID
  score: Decimal
  startedAt: Timestamp
  status: WorkerTrainingStatus!
  updatedAt: Timestamp!
  version: Int!
  waivedReason: String
  worker: Worker
  workerId: ID!
}

enum WorkerTrainingStatus {
  Assigned
  Cancelled
  Completed
  Expired
  Failed
  InProgress
  Waived
}

type WorkerTrainingSummary {
  compliant: Boolean!
  currentCount: Int!
  dueCount: Int!
  expiredCount: Int!
  expiringCount: Int!
  items: [WorkerTrainingSummaryItem!]!
  missingCount: Int!
  overdueCount: Int!
  requiredCount: Int!
  workerId: ID!
}

type WorkerTrainingSummaryItem {
  course: TrainingCourse!
  daysUntilDue: Int
  daysUntilExpiry: Int
  health: WorkerTrainingHealth!
  record: WorkerTrainingRecord
  required: Boolean!
}

enum WorkerType {
  Contractor
  Employee
}

"""
Year-to-date pay totals per driver. Gross and deductions are accumulated
independently so owner-operator 1099-NEC reporting uses true gross (before
chargebacks), not net.
"""
type WorkerYTDPaySummary {
  classification: PayeeClassification!
  deductionsMinor: Int!
  grossEarningsMinor: Int!
  netPayMinor: Int!
  reimbursementsMinor: Int!
  settlementCount: Int!
  workerId: ID!
  workerName: String!
  year: Int!
}

enum WorkersCompClaimStatus {
  Accepted
  Closed
  Denied
  Filed
  NotFiled
}

input WriteOffPayAdvanceInput {
  advanceId: ID!
  reason: String!
}