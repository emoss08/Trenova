"""
An agent as the person asking it sees it: who it is and what to ask it. Its
instructions, tools' settings and budget are an administrator's, and are not
here.
"""
type MyAgent {
  """
  Chosen accent name; empty falls back to an accent derived from the agent id.
  """
  accent: String!
  """
  The agents this one may hand a task to that the caller may use themselves:
  enabled, talked to, and open to them. In the order configured. Only who
  each is and how it is drawn; never what it is set up to do.
  """
  delegates: [MyAgent!]!
  description: String!
  """
  Chosen icon name; empty falls back to the icon the starter template implies.
  """
  icon: String!
  id: ID!
  name: String!
  """Up to four opening questions the agent can answer with its tools."""
  starters: [AgentStarter!]!
  """Set on the agents the platform itself creates and fires."""
  systemKey: String!
  """The starter this agent was created from, if any."""
  template: AgentTemplate
  toolNames: [String!]!
}

type MyAgentConnection {
  edges: [MyAgentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type MyAgentEdge {
  cursor: String!
  node: MyAgent!
}

type MyAgentMatch {
  """The agent, for BetterAgent and CurrentAgent; null otherwise."""
  agent: MyAgent
  outcome: AgentMatchOutcome!
  """
  For BetterAgent and CurrentAgent, the agent's tools that matched; for
  NoAgent, the tools that would answer it. Best first, at most three.
  """
  tools: [AgentMatchTool!]!
}

input MyAgentMatchInput {
  """
  The kinds of record the question is about: the records it mentions and the
  record or list page it is asked from. At most 11. Tools that work on them
  rank higher; a kind the server does not know is ignored.
  """
  contextKinds: [String!]
  """
  The agent the question would go to now, kept when it fits as well as any.
  """
  currentAgentId: ID
  """What the caller is about to ask. At most 4000 characters."""
  text: String!
}

"""Where an agent came from."""
enum MyAgentOrigin {
  All
  """Built by hand."""
  Custom
  """Made from one of the platform's templates."""
  Template
}

input MyAgentsInput {
  after: String
  """Agents already shown, so a page never repeats them. At most 100."""
  excludeIds: [ID!]
  first: Int = 20
  """Only these agents. At most 100."""
  ids: [ID!]
  origin: MyAgentOrigin = All
  """Matched against the agent's name and description."""
  search: String
}

