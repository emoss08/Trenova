input MyAIFeedbackInput {
  """At most 200 targets."""
  targets: [AIFeedbackTargetInput!]!
}

"""
An agent as the person asking it sees it: who it is and what to ask it. Its
instructions, tools' settings and budget are an administrator's, and are not
here.
"""
type MyAgent {
  """
  Chosen accent name; empty falls back to an accent derived from the agent id.
  """
  accent: String!
  """
  The agents this one may hand a task to that the caller may use themselves:
  enabled, talked to, and open to them. In the order configured. Only who
  each is and how it is drawn; never what it is set up to do.
  """
  delegates: [MyAgent!]!
  description: String!
  """
  Chosen icon name; empty falls back to the icon the starter template implies.
  """
  icon: String!
  id: ID!
  name: String!
  """Up to four opening questions the agent can answer with its tools."""
  starters: [AgentStarter!]!
  """Set on the agents the platform itself creates and fires."""
  systemKey: String!
  """The starter this agent was created from, if any."""
  template: AgentTemplate
  toolNames: [String!]!
}

type MyAgentConnection {
  edges: [MyAgentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type MyAgentEdge {
  cursor: String!
  node: MyAgent!
}

"""Where an agent came from."""
enum MyAgentOrigin {
  All
  """Built by hand."""
  Custom
  """Made from one of the platform's templates."""
  Template
}

input MyAgentsInput {
  after: String
  """Agents already shown, so a page never repeats them. At most 100."""
  excludeIds: [ID!]
  first: Int = 20
  """Only these agents. At most 100."""
  ids: [ID!]
  origin: MyAgentOrigin = All
  """Matched against the agent's name and description."""
  search: String
}

type MyCarrierIntelligence {
  configured: Boolean!
  dotNumber: String
  snapshot: CarrierIntelSnapshot
}

type MyPTOBalance {
  accruedYtdDays: Decimal!
  availableDays: Decimal!
