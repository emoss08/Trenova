  """
  manual: Boolean!
  method: PayCalcMethod
  payCodeId: ID
  quantity: Decimal!
  """The rate when every line shares it."""
  rate: Decimal
  recurringDeductionId: ID
  recurringEarningId: ID
  shipmentCount: Int!
}

