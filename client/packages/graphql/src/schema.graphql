}

"""
What one tool has earned on this agent.

The ladder is not windowed: a tier is earned over the agent's whole life and
taken back the same way, so a thirty-day view of it would describe a
different ladder from the one deciding what runs without asking.
"""
type AgentToolTrust {
  approvals: Int!
  demotedAt: Timestamp
  """
  The tier the ledger granted, when the tool's tier was earned rather than chosen.
  """
  earnedTier: AgentAutonomyTier
  executionFailures: Int!
  lastDecisionAt: Timestamp
  modifications: Int!
  promotedAt: Timestamp
  rejections: Int!
  """
  Clean approvals in a row. A modification, a rejection or a failure sends it back to zero.
  """
  streak: Int!
  toolName: String!
}

"""
How often one tool's calls ended one way over the window, counted from every
call that reached the tool, refusals included. A call the runtime refused
never became a proposal, so the proposal counts cannot show it.
"""
type AgentToolVerdict {
  calls: Int!
  toolName: String!
  """
  The reasons given most often, most frequent first. A call that ran gives none.
  """
  topReasons: [AgentToolVerdictReason!]!
  """
  ran, proposed, simulated, denied, invalid, duplicate, over_budget, failed or unknown.
  """
  verdict: String!
