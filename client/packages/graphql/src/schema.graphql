"""
One organization's stricter posture on a jurisdiction.

Unlike JurisdictionRule these rows are tenant data. Every field is optional —
an unset field defers to the statutory rule — and the engine applies a value
only when it is stricter than the statute, so a permissive override cannot make
an illegal load look legal.
"""
type JurisdictionRuleOverride {
  businessUnitId: ID!
  createdAt: Timestamp!
  daylightOnly: Boolean
  holidayRestricted: Boolean
  id: ID!
  maxHeightFeet: Float
  maxLengthFeet: Float
  maxWeightPounds: Int
  maxWidthFeet: Float
  organizationId: ID!
  permitLeadTimeDays: Int
  """
  Why this organization runs tighter than the statute. Required, minimum ten characters.
  """
  reason: String!
  state: UsState
  stateId: ID!
  updatedAt: Timestamp!
  version: Int!
}

type JurisdictionRuleOverrideConnection {
  edges: [JurisdictionRuleOverrideEdge!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type JurisdictionRuleOverrideEdge {
  cursor: String!
  node: JurisdictionRuleOverride!
}

enum JurisdictionRuleStatus {
  Active
  Draft
  Inactive
}

enum JurisdictionVerificationState {
  Disputed
  Unverified
  Verified
}

enum LeaveCaseStatus {
  Approved
  Closed
  Denied
  Pending
}

enum LeaveCertificationStatus {
  Insufficient
  NotRequired
  Overdue
  Received
  Requested
  Waived
}

"""
The organisation's leave settings. There is one per organisation because the
measurement method has to be applied consistently (29 CFR 825.200(e)).
"""
type LeaveControl {
  certificationDueDays: Int!
  eligibilityHours: Int!
  eligibilityMonths: Int!
  entitlementWeeks: Decimal!
  id: ID!
  measurementMethod: LeaveMeasurementMethod!
  militaryCaregiverWeeks: Decimal!
  version: Int!
  """
  What a week of entitlement is worth. Intermittent leave is taken in hours, so
  weeks only become a usable balance once there is a week's length to convert
  them with.
  """
  workweekHours: Decimal!
}

"""
A worker's FMLA standing: what they are entitled to, what they have used inside
the measurement window, and what is left. Derived on read — the window moves,
so a stored balance would be wrong by tomorrow.
"""
type LeaveEntitlement {
  """
  Whether the worker has been employed long enough. The hours-worked half of the
  eligibility test cannot be answered from tenure, so it is reported separately
  where the office has recorded it on the case.
  """
  eligibleOnTenure: Boolean!
  exhausted: Boolean!
  method: LeaveMeasurementMethod!
  militaryCaregiver: Boolean!
  monthsEmployed: Int!
  openCaseCount: Int!
  remainingHours: Decimal!
  remainingWeeks: Decimal!
  totalHours: Decimal!
  totalWeeks: Decimal!
  usedHours: Decimal!
  usedWeeks: Decimal!
  window: LeaveWindow!
}

enum LeaveFrequency {
  Continuous
  Intermittent
  ReducedSchedule
}

"""
How the twelve-month period is measured. An employer picks one of the four in
29 CFR 825.200(b) and must apply it to every employee alike.
"""
enum LeaveMeasurementMethod {
  CalendarYear
  ForwardFromFirstUse
  HireAnniversary
  RollingBackward
}

"""The twelve-month period a balance is measured over."""
type LeaveWindow {
  from: Timestamp!
  through: Timestamp!
}

