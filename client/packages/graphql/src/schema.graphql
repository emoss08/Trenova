"""
How an embedding endpoint is told whether a text is a stored document or a
search query. None sends both the same way; VoyageInputType sends Voyage's
input_type field; NomicPrefix adds the search_document and search_query
prefixes nomic-embed-text expects.
"""
enum AIEmbeddingInputStyle {
  NomicPrefix
  None
  VoyageInputType
}

"""A person's thumbs up or down on something an AI wrote for them."""
type AIFeedback {
  """The agent the rating is credited to."""
  agentDefinitionId: ID
  businessUnitId: ID!
  """What the person wrote; evidence, never an instruction."""
  comment: String!
  createdAt: Timestamp!
  definitionVersion: Int
  """The insight detector the rating is credited to."""
  detectorKey: String!
  evalCaseId: ID
  fingerprintSource: AIFeedbackFingerprintSource!
  id: ID!
  model: String!
  organizationId: ID!
  patternKey: String!
  promptHash: String!
  providerId: ID
  """1 for a thumbs up, -1 for a thumbs down."""
  rating: Int!
  reasons: [AIFeedbackReason!]!
  runId: ID
  targetId: ID!
  """
  The part of the target rated, such as a briefing section key; empty for the whole target.
  """
  targetPart: String!
  targetType: AIFeedbackTargetType!
  task: String!
  threadId: ID
  toolSpecHash: String!
  turnId: ID
  turnSnapshot: AIFeedbackTurnSnapshot
  updatedAt: Timestamp!
  userId: ID!
  version: Int!
}

type AIFeedbackConnection {
  edges: [AIFeedbackEdge!]!
