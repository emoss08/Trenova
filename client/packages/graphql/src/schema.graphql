input WorkerPatchInput {
  """Omit to leave unchanged; null is rejected."""
  driverType: DriverType @goField(omittable: true)
  """Omit to leave unchanged; null is rejected."""
  status: EntityStatus @goField(omittable: true)
  """Omit to leave unchanged; null is rejected."""
  type: WorkerType @goField(omittable: true)
}

"""
Links a worker to a pay profile for a date range. A worker's pay is always
resolved through their assignment effective on the shipment's delivery date.
Assigning a new profile automatically ends the previous open assignment, so the
history is a contiguous, auditable record of how the driver was paid over time.
"""
type WorkerPayAssignment {
  businessUnitId: ID!
  createdAt: Timestamp!
  createdById: ID
  """Unix date the assignment starts applying (inclusive)."""
  effectiveFrom: Timestamp!
  """
  Unix date the assignment stops applying (exclusive). Null while current.
  """
  effectiveTo: Timestamp
  id: ID!
  notes: String!
  organizationId: ID!
  payProfile: PayProfile
  payProfileId: ID!
  """Driver-specific rate overrides applied on top of the shared profile."""
  rateOverrides: [PayRateOverride!]
  """
  Share of computed pay this worker receives (100 = full pay; 50/50 for teams).
  """
  splitPercent: Decimal!
  updatedAt: Timestamp!
  version: Int!
  worker: Worker
  workerId: ID!
}

"""
A handbook, a policy, or a notice the carrier needs people to have read. Either
a short text or an attached document — never neither.

The version label is the load-bearing field: an acknowledgement records the
version it was given for, so changing the text under a signed policy without
changing the version is refused.
"""
type WorkerPolicy {
  appliesTo: PolicyAudience!
  body: String
  businessUnitId: ID!
  code: String!
  createdAt: Timestamp!
  createdById: ID
  documentId: ID
  effectiveFrom: Timestamp!
  id: ID!
  organizationId: ID!
  requiresSignature: Boolean!
  status: EntityStatus!
  summary: String
  title: String!
  updatedAt: Timestamp!
  version: Int!
  versionLabel: String!
}

"""
One worker's signature on one version of a policy. It copies what was signed —
the version and the document checksum — because the policy row will move on
and the signature must not.
"""
type WorkerPolicyAcknowledgement {
  acknowledgedAt: Timestamp!
  businessUnitId: ID!
  documentChecksum: String
  id: ID!
  organizationId: ID!
  policy: WorkerPolicy
  policyId: ID!
  signatureIp: String
  signatureName: String
  signatureUserAgent: String
  version: Int!
  versionLabel: String!
  worker: Worker
  workerId: ID!
}

input WorkerPolicyInput {
  appliesTo: PolicyAudience!
  body: String
  code: String!
  documentId: ID
  effectiveFrom: Timestamp
  requiresSignature: Boolean!
  status: EntityStatus
  summary: String
  title: String!
  versionLabel: String!
}

"""
Portal access state for one worker: whether they have a linked portal login,
the linked user if so, and their invitation history.
"""
type WorkerPortalStatus {
  invitations: [PortalInvitation!]!
  linked: Boolean!
  pendingInvitation: PortalInvitation
  portalUser: User
}

type WorkerProfile {
  businessUnitId: ID!
  cdlClass: CDLClass!
  cdlRestrictions: String!
  complianceStatus: ComplianceStatus!
  createdAt: Timestamp!
  disqualificationReason: String!
  dob: Timestamp!
  """
  The worker's drug and alcohol testing standing, denormalised from the testing
  ledgers so the roster can filter and sort on it. Only Prohibited blocks
  dispatch; Unknown and Pending warn.
  """
  drugAlcoholStatus: DrugAlcoholStatus!
  eldExempt: Boolean!
  endorsement: EndorsementType!
  hazmatExpiry: Timestamp
  hireDate: Timestamp!
  id: ID!
  isQualified: Boolean!
  lastComplianceCheck: Timestamp!
  lastDrugTest: Timestamp!
  lastMvrCheck: Timestamp!
  licenseExpiry: Timestamp!
  licenseNumber: String!
  licenseState: UsState
  licenseStateId: ID
  medicalCardExpiry: Timestamp
  medicalExaminerName: String!
  medicalExaminerNpi: String!
  mvrDueDate: Timestamp
  """
  When the worker's soonest required credential expires, and when their soonest
  required course falls due. Null when nothing does.
  """
  nextCredentialExpiry: Timestamp
  nextTrainingDue: Timestamp
  organizationId: ID!
  physicalDueDate: Timestamp
  safetyRating: SafetyRating!
  safetyScore: Int!
  shortHaulExempt: Boolean!
  terminationDate: Timestamp
  """
  Roster roll-ups: the worker's training and safety standing denormalised onto
  the profile so the workers list can filter and sort on them. They are a cache
  of the training records and safety events, refreshed when those change and
  re-checked by the nightly compliance sweep. Read the worker overview or the
  per-area summaries for the live answer.
  """
  trainingHealth: WorkerTrainingHealth!
  twicCardNumber: String!
  twicExpiry: Timestamp
  updatedAt: Timestamp!
  version: Int!
  workerId: ID!
}

