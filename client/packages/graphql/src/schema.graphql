type AgentRun {
  """
  The agent definition this run belongs to; absent for runs of the retired built-in agents.
  """
  agentDefinitionId: ID!
  agentType: AgentType!
  businessUnitId: ID!
  completedAt: Timestamp
  createdAt: Timestamp!
  """
  The agent definition behind the run; absent for runs of the retired built-in agents.
  """
  definition: AgentDefinition
  """
  The delegate_task call that handed the run its task. Empty for a run nothing handed a task.
  """
  delegateCallId: String!
  errorMessage: String!
  """
  The agent that handed the run its task, for the run of an agent a conversation's agent asked; absent otherwise, and for an agent deleted since.
  """
  handedBy: AgentDefinition
  id: ID!
  inputContextHash: String!
  modelIdentifier: String!
  organizationId: ID!
  """
  The turn or run that handed the run its task. Empty for a run nothing handed a task.
  """
  parentOwnerId: ID!
  """
  What handed the run its task: AssistantTurn for a task a conversation's agent handed to this one. Absent for a run nothing handed a task.
  """
  parentOwnerKind: AgentRunEventOwnerKind
  promptVersion: String!
  startedAt: Timestamp
  status: AgentRunStatus!
  subjectId: ID!
  subjectType: AgentSubjectType!
  summary: String!
  """What outside content the run read, and where from."""
  taint: AgentRunTaint
  """
  The run read content written outside the organization, so no write of it that leaves the organization ran without a person's approval.
  """
  tainted: Boolean!
  """When the run first read outside content."""
  taintedAt: Timestamp
  """
  The trace the run's work was recorded in. Empty for a run recorded before traces were kept.
  """
  traceId: String!
  """
  The run's trace in the tracing backend, when one is configured and the run has a trace.
  """
  traceUrl: String
  """
  What the run's model said and the tools it called, bounded, read with the same permission as the run. Absent for a run filed before transcripts were kept or one that produced no messages.
  """
  transcript: AgentRunTranscript @goField(forceResolver: true)
  trigger: AgentRunTrigger!
  updatedAt: Timestamp!
  version: Int!
  workflowId: String!
}

type AgentRunConnection {
  edges: [AgentRunEdge!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type AgentRunEdge {
  cursor: String!
  node: AgentRun!
}

"""
One thing an agent did, in the order it did it.

The runtime has always said this aloud; these are the rows that keep it. A
background run's durable record used to be its final reply cut to two thousand
characters, which answered what the agent concluded but never what it did.
"""
type AgentRunEvent {
  businessUnitId: ID!
  """Pairs a tool's start with its finish without opening the payload."""
  callId: String!
  createdAt: Timestamp!
  id: ID!
  """The runtime's own event name, unchanged."""
  kind: String!
  occurredAt: Timestamp!
  organizationId: ID!
  ownerId: ID!
  """Whether this belongs to a background run or a conversation turn."""
  ownerKind: AgentRunEventOwnerKind!
  payload: JSON!
  """
  The event's place in its owner's account of itself. Ordering by time will not
  do: several events share a second easily, and a trajectory read back in the
  wrong order reports the agent doing things in an order it never did.
  """
  sequence: Int!
  """
  Joins a tool event to the ledger row that claimed it. Empty for everything
  that is not a tool call.
  """
  stepKey: String!
  """
  Whether the payload was too large to keep. A reader that cannot tell a short
  payload from a shortened one will eventually mistake one for the other.
  """
  truncated: Boolean!
  updatedAt: Timestamp!
}

type AgentRunEventConnection {
  edges: [AgentRunEventEdge!]!
  pageInfo: PageInfo!
  totalCount: Int
}

type AgentRunEventEdge {
  cursor: String!
  node: AgentRunEvent!
}

enum AgentRunEventOwnerKind {
  AgentRun
  AssistantTurn
}

enum AgentRunStatus {
  AwaitingDecision
  Completed
  Diagnosing
  Failed
  GatheringContext
  Pending
  ShadowCompleted
}

"""
The outside content a run read, one mark per place it came from, at most sixteen.
"""
type AgentRunTaint {
  marks: [AgentTaintMark!]!
}

"""
What a finished run's model said and the tools it called, in order. A message
over 64 KiB keeps only who said it and what it called, and past 256 KiB the
middle of the run is left out and counted, so the record stays bounded.
"""
type AgentRunTranscript {
  messages: [AgentRunTranscriptMessage!]!
  """
  Where the left-out messages fell: the index in messages of the first message after them.
  """
  omittedAt: Int!
  """
  How many messages from the middle of the run were left out to keep the transcript bounded.
  """
  omittedMessages: Int!
}

"""
One message of a run's transcript: the model's words and calls, or a tool's result.
"""
type AgentRunTranscriptMessage {
  """On a delegated step: the agent that took it. Empty otherwise."""
  agentDefinitionId: ID!
  content: String!
  createdAt: Timestamp!
  """
  On a delegated step: the delegate_task call it answers. Empty otherwise.
  """
  delegateCallId: String!
  """
  Delegated for a step another agent took on a task the run handed it; Message otherwise.
  """
  kind: String!
  """
  The message was too large to keep whole: its words, reasoning and call arguments were left out.
  """
  omitted: Boolean!
  """
  What the model thought before it answered, when the provider let it through.
  """
  reasoning: String!
  """Assistant for the model, Tool for a tool's result."""
  role: String!
  """On a tool result: the call it answers."""
  toolCallId: String!
  toolCalls: [AgentRunTranscriptToolCall!]!
  toolFailed: Boolean!
  toolName: String!
  """On a tool result: the server's one-line account of it, in English."""
  toolSummary: String!
  """
  On a tool result: how the runtime judged the call, such as ran, proposed, denied, invalid, duplicate, over_budget or failed. Empty when it was not recorded.
  """
  toolVerdict: String!
}

"""A tool call the model asked for in a run's transcript."""
type AgentRunTranscriptToolCall {
  """
  The arguments as the model sent them; absent when the message was too large to keep whole.
  """
  arguments: JSON
  id: String!
  name: String!
}

enum AgentRunTrigger {
  Chat
  Continuous
  Event
  Manual
  Scheduled
  Wait
}

