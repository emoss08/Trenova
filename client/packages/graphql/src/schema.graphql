  """
  The worker's disputes against this settlement, newest first; empty for someone who may not read settlement disputes.
  """
  disputes: [SettlementDispute!]!
  exceptions: [SettlementException!]
  """
  Units of the organization's functional currency per one unit of the
  settlement currency, fixed when the settlement posted. Null when both are the same.
  """
  exchangeRate: Decimal
  """The day the posting exchange rate was quoted for."""
  exchangeRateDate: Timestamp
  grossEarningsMinor: Int!
  hasExceptions: Boolean!
  id: ID!
  """
  The lines summed by how each was paid: one row per pay component, deduction, advance, escrow account or line added by hand. Null when the lines were not read.
  """
  lineSummary: [DriverSettlementLineGroup!]
  lines: [DriverSettlementLine!]
  """
  What each load came to on the statement, every line tied to it summed, in the order the loads first appear. Null when the lines were not read.
  """
  loadShares: [SettlementLoadShare!]
  netPayMinor: Int
  notes: String!
  organizationId: ID!
  paidAt: Timestamp
  paidBy: User
  paidById: ID
  """The exchange rate fixed when the settlement was paid."""
  paidExchangeRate: Decimal
  """The day the payment exchange rate was quoted for."""
  paidExchangeRateDate: Timestamp
  payDate: Timestamp!
  payProfileId: ID
  payProfileName: String!
  paymentMethod: String!
  paymentReference: String!
  periodEnd: Timestamp!
  periodStart: Timestamp!
  postedAt: Timestamp
  postedBy: User
  postedById: ID
  reimbursementsMinor: Int!
  settlementNumber: String!
  shipmentCount: Int!
  status: DriverSettlementStatus!
  submittedAt: Timestamp
  submittedBy: User
  submittedById: ID
  totalMiles: Decimal!
  updatedAt: Timestamp!
  version: Int!
  voidReason: String!
