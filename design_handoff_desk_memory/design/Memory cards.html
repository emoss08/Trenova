<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design_doc_mode" content="canvas">
<title>Memory cards v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
.dsk{--canvas:oklch(1 0 0);--card:oklch(1 0 0);--raised:oklch(1 0 0);--sunken:oklch(0.961 0 0);--hover:oklch(0.961 0 0);--fg:oklch(0.205 0 0);--fg2:oklch(0.301 0 0);--muted:oklch(0.42 0 0);--subtle:oklch(0.51 0 0);--faint:oklch(0.65 0 0);--b-sub:oklch(0.94 0 0);--b:oklch(0.922 0 0);--b-strong:oklch(0.836 0 0);--ink:oklch(0.205 0 0);--ink-hover:oklch(0.341 0 0);--ink-fg:oklch(1 0 0);--mem:oklch(0.55 0.185 306);--mem-sub:oklch(0.952 0.029 306);--mem-on-sub:oklch(0.42 0.165 306);--r-control:6px;--r-surface:8px;--lift:0 0 0 1px color-mix(in oklch,var(--fg) 8%,transparent),0 4px 8px -4px oklch(0.2 0 0/.12),0 16px 40px -16px oklch(0.2 0 0/.18);--settle:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.4,.64,1)}
.dsk.dk{--canvas:oklch(0.145 0 0);--card:oklch(0.145 0 0);--raised:oklch(0.178 0 0);--sunken:oklch(0.218 0 0);--hover:oklch(0.239 0 0);--fg:oklch(0.946 0 0);--fg2:oklch(0.87 0 0);--muted:oklch(0.709 0 0);--subtle:oklch(0.709 0 0);--faint:oklch(0.545 0 0);--b-sub:oklch(0.239 0 0);--b:oklch(0.301 0 0);--b-strong:oklch(0.39 0 0);--ink:oklch(0.946 0 0);--ink-hover:oklch(0.845 0 0);--ink-fg:oklch(0.145 0 0);--mem:oklch(0.72 0.157 306);--mem-sub:oklch(0.285 0.064 306);--mem-on-sub:oklch(0.85 0.093 306);--lift:0 0 0 1px color-mix(in oklch,var(--fg) 12%,transparent),0 4px 8px -4px oklch(0 0 0/.5),0 16px 40px -16px oklch(0 0 0/.6)}
body{margin:0}
a{color:var(--fg)}a:hover{color:var(--muted)}
.frame{position:absolute;width:720px;border-radius:var(--r-surface,8px);overflow:hidden}
.dsk{background:var(--canvas);color:var(--fg);font:400 13px/1.45 'Geist',system-ui,sans-serif;letter-spacing:-0.005em;-webkit-font-smoothing:antialiased;padding:40px 60px 56px}
.dsk *,.dsk *::before,.dsk *::after{box-sizing:border-box}
.dsk :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.dsk svg{flex:none}
.dsk code{font:500 .86em 'Geist Mono',ui-monospace,monospace;padding:1px 5px;border-radius:4px;background:var(--sunken);border:1px solid var(--b-sub);color:var(--fg)}
.r+.r{margin-top:48px}
.q{margin:0;font-size:18px;line-height:1.4;font-weight:500;letter-spacing:-0.014em;text-wrap:balance}
.prose{margin:14px 0 0;font-size:14px;line-height:1.6;color:var(--fg2);text-wrap:pretty}
/* memory note */
.mm{margin-top:14px;border-radius:var(--r-surface);background:var(--card);box-shadow:0 0 0 1px var(--b);animation:mmin 420ms var(--settle) both;transition:box-shadow 240ms}
.mm.saved{box-shadow:0 0 0 1px var(--b-sub)}
.mm-h{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 11px}
.mm-ic{display:grid;place-items:center;color:var(--mem)}
.mm-ic svg path:first-child{fill:transparent;transition:fill 260ms}
.mm.saved .mm-ic svg path:first-child,.mm.kept .mm-ic svg path:first-child{fill:var(--mem-sub)}
.mm.kept .mm-ic{animation:pop 520ms var(--spring)}
.mm-t{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;font-size:12.5px;white-space:nowrap}
.mm-t b{font-weight:500;color:var(--fg)}
.mm-t span{color:var(--subtle);overflow:hidden;text-overflow:ellipsis}
.who{position:relative;display:inline-flex}
.who-b{display:inline-flex;align-items:center;gap:2px;font-weight:500;color:var(--fg);text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--b-strong);text-underline-offset:3px;transition:text-decoration-color 140ms}
.who-b:hover,.who.open .who-b{text-decoration-color:currentColor}

.menu{position:absolute;left:-10px;top:calc(100% + 8px);z-index:9;width:248px;padding:4px;border-radius:var(--r-surface);background:var(--raised);box-shadow:var(--lift);display:none;flex-direction:column;white-space:normal}
.who.open .menu{display:flex;animation:mmin 200ms var(--settle) both}
.menu button{display:grid;grid-template-columns:14px minmax(0,1fr);column-gap:8px;padding:7px 8px;border-radius:var(--r-control);text-align:left}
.menu button:hover{background:var(--hover)}
.menu b{font-weight:500;font-size:12.5px;color:var(--fg)}
.menu em{grid-column:2;font-style:normal;font-size:11.5px;color:var(--subtle)}
.menu svg{margin-top:3px;color:var(--fg);visibility:hidden}.menu [aria-checked="true"] svg{visibility:visible}
.mm-a{display:flex;align-items:center;gap:2px}
.bt{white-space:nowrap;height:26px;display:inline-flex;align-items:center;padding:0 9px;border-radius:var(--r-control);font-size:12px;font-weight:500;color:var(--muted);transition:background 140ms,color 140ms,transform 160ms}
.bt:hover{background:var(--hover);color:var(--fg)}
.bt.ink{background:var(--ink);color:var(--ink-fg);padding:0 11px}
.bt.ink:hover{background:var(--ink-hover)}.bt:active{transform:scale(.96)}
.ib{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r-control);color:var(--subtle);transition:background 140ms,color 140ms}
.ib:hover{background:var(--hover);color:var(--fg)}
.mm.saved .mm-a{opacity:0;transition:opacity 160ms}.mm.saved:hover .mm-a,.mm.saved .mm-a:focus-within{opacity:1}
.lk{font-size:12px;color:var(--muted);text-decoration:underline;text-decoration-color:var(--b-strong);text-underline-offset:2px;padding:0 6px}
.lk:hover{color:var(--fg);text-decoration-color:currentColor}
/* body collapses when kept */
.mm-bw{display:grid;grid-template-rows:1fr;transition:grid-template-rows 360ms var(--settle),opacity 240ms}
.mm-bw>div{min-height:0;overflow:hidden}
.mm.kept .mm-bw,.mm.no .mm-bw{grid-template-rows:0fr;opacity:0}
.mm-b{padding:0 14px 12px 33px}
.st{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;counter-reset:s;border-radius:6px;outline:none;transition:background 140ms,box-shadow 140ms}
.st li{counter-increment:s;display:grid;grid-template-columns:16px minmax(0,1fr);font-size:13px;line-height:1.55;color:var(--fg2);text-wrap:pretty}
.st li::before{content:counter(s);font:500 11px/20px 'Geist Mono',monospace;color:var(--faint)}
.st[contenteditable="true"]{box-shadow:none;background:var(--card)}
.ask .st{cursor:text}.ask .st:hover:not([contenteditable="true"]){background:color-mix(in srgb,var(--hover) 60%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--hover) 60%,transparent)}
.mm-sa{max-height:172px;overflow-y:auto;margin:-4px -8px -4px -4px;padding:4px 8px 4px 4px;scrollbar-width:thin;scrollbar-color:var(--b-strong) transparent;--fade:14px}
.mm-sa.ov-b{mask-image:linear-gradient(#000 calc(100% - var(--fade)),transparent)}.mm-sa.ov-t{mask-image:linear-gradient(transparent,#000 var(--fade))}.mm-sa.ov-t.ov-b{mask-image:linear-gradient(transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent)}
.mm-sa::-webkit-scrollbar{width:6px}.mm-sa::-webkit-scrollbar-thumb{background:var(--b-strong);border-radius:6px}.mm-sa::-webkit-scrollbar-track{background:transparent}
.mm-n{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:var(--faint)}
.mm-n button{display:inline-flex;align-items:center;gap:3px;color:var(--subtle)}
.mm-n button:hover{color:var(--fg)}
.mm-n button svg{transition:transform 200ms var(--settle)}
.mm.why-on .mm-n button svg{transform:rotate(90deg)}
.why-w{display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms var(--settle)}
.why-w>div{min-height:0;overflow:hidden}
.mm.why-on .why-w{grid-template-rows:1fr}
.mm-why{margin-top:8px;padding-top:9px;border-top:1px dashed var(--b);display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 10px;font-size:12px;line-height:1.5}
.mm-why dt{color:var(--subtle)}
.mm-why dd{margin:0;color:var(--fg2);text-wrap:pretty}
.mm-why .st li{font-size:12px;color:var(--faint);text-decoration:line-through;text-decoration-color:var(--b-strong)}
.mm-why .st li::before{line-height:18px}
.mm-why .st code{color:var(--subtle)}
/* states the header swaps between */
.s-ask{display:contents}.s-kept,.s-no{display:none}.who{align-items:baseline}.qm{font-weight:500;color:var(--fg)}
.mm.kept .s-ask,.mm.no .s-ask{display:none}
.mm.kept .s-kept{display:contents}.mm.no .s-no{display:contents}
.mm.no{box-shadow:0 0 0 1px var(--b-sub)}.mm.no .mm-ic{color:var(--faint)}
@keyframes mmin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.mm,.menu,.mm-ic{animation:none!important}.mm-bw,.why-w{transition:none}}
</style>
</head>
<body>
<template id="tpl">
<div class="r">
<p class="q">Which Acme shipments moved last week?</p>
<p class="prose">Three loads moved between Sep 29 and Oct 5. The first lookup timed out, so I re-ran it with the same filters before answering.</p>
<section class="mm ask" data-screen-label="Keep steps">
<header class="mm-h">
<span class="mm-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10a2 2 0 0 1 2 2v14l-7-3.5L5 20V6a2 2 0 0 1 2-2z"></path><path d="M12 8.5v4M10 10.5h4"></path></svg></span>
<span class="mm-t">
<span class="s-ask"><b>Keep these steps for</b><span class="who" style="overflow:visible"><button class="who-b" data-who="">everyone</button><b class="qm">?</b>
<span class="menu" role="radiogroup">
<button role="radio" aria-checked="false" data-pick="you"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg><b>Just you</b><em>Only in your conversations</em></button>
<button role="radio" aria-checked="false" data-pick="Dispatch"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg><b>Dispatch</b><em>Your team</em></button>
<button role="radio" aria-checked="true" data-pick="everyone"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg><b>Everyone</b><em>Anyone using this agent</em></button>
</span></span></span>
<span class="s-kept"><b>Kept for <span data-who-label="">everyone</span></b><span>· Desk will follow these next time</span></span>
<span class="s-no"><span>Not kept</span></span>
</span>
<span class="mm-a">
<span class="s-ask"><button class="bt" data-no="">Not now</button><button class="bt ink" data-keep="">Keep</button></span>
<span class="s-kept"><button class="lk" data-undo="">Undo</button></span>
<span class="s-no"><button class="lk" data-undo="">Undo</button></span>
</span>
</header>
<div class="mm-bw"><div><div class="mm-b">
<div class="mm-sa" data-scroll-area=""><ol class="st" data-edit="" title="Click to edit">
<li><span>If <code>list_shipments</code> stops before returning, retry the same read-only query with the same filters.</span></li>
<li><span>Treat the retry as unconfirmed until it returns, then answer from what it returned.</span></li>
</ol></div>
<div class="mm-n">From the retry that worked<span>·</span><button data-why="">Why<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button></div>
<div class="why-w"><div><dl class="mm-why"><dt>Why</dt><dd>The first call timed out; re-running it unchanged returned results, and the answer used only those.</dd></dl></div></div>
</div></div></div>
</section>
</div>
<div class="r">
<p class="q">Is PRO 40211 still out?</p>
<p class="prose">No — it’s <code>Delivered</code>. The status-filtered search missed it, so I looked it up by PRO number across every status.</p>
<section class="mm saved" data-screen-label="Learned steps">
<header class="mm-h">
<span class="mm-ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10a2 2 0 0 1 2 2v14l-7-3.5L5 20V6a2 2 0 0 1 2-2z"></path><path d="M12 8.5v4M10 10.5h4"></path></svg></span>
<span class="mm-t"><b>Learned steps</b><span>Everyone · just now</span></span>
<span class="mm-a"><button class="ib" title="Edit" aria-label="Edit" data-edit-btn=""><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button><button class="ib" title="Undo" aria-label="Undo"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button></span>
</header>
<div class="mm-bw"><div><div class="mm-b">
<div class="mm-sa" data-scroll-area=""><ol class="st">
<li><span>If <code>search_shipments</code> finds nothing with a status filter, don’t conclude the shipment is absent.</span></li>
<li><span>Call <code>list_shipments</code> with no status filter, matching <code>proNumber</code> with <code>eq</code> when exact or <code>contains</code> when partial.</span></li>
<li><span>Check the returned shipment and its status before answering.</span></li>
<li><span>If more than one shipment matches a partial <code>proNumber</code>, list each with its customer and pickup date and ask which one was meant.</span></li>
<li><span>If nothing matches across every status, say so plainly and offer to search by BOL or reference number instead.</span></li>
</ol></div>
<div class="mm-n">Replaces earlier steps<span>·</span><button data-why="">Why<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></button></div>
<div class="why-w"><div><dl class="mm-why"><dt>Why</dt><dd>Catches shipments in a status the first search left out, and matches exactly when the PRO is known.</dd><dt>Before</dt><dd><ol class="st"><li><span>If <code>search_shipments</code> finds nothing with a status filter, don’t conclude it’s absent.</span></li><li><span>Use <code>list_shipments</code> with <code>proNumber</code> <code>contains</code>, without a status filter.</span></li></ol></dd></dl></div></div>
</div></div></div>
</section>
</div>
</template>
<div class="frame" style="left:0;top:0"><div class="dsk" data-screen-label="Light"></div></div>
<div class="frame" style="left:760px;top:0"><div class="dsk dk" data-screen-label="Dark"></div></div>
<script>
const tpl=document.getElementById('tpl');
document.querySelectorAll('.dsk').forEach(d=>d.append(tpl.content.cloneNode(true)));
const label={you:'just you',Dispatch:'Dispatch',everyone:'everyone'};
const stopEdit=()=>document.querySelectorAll('.st[contenteditable="true"]').forEach(o=>o.removeAttribute('contenteditable'));
document.addEventListener('click',e=>{
const t=e.target.closest('button,.st[data-edit]');
document.querySelectorAll('.who.open').forEach(w=>{if(!t||!w.contains(t))w.classList.remove('open')});
if(!e.target.closest('.st'))stopEdit();
if(!t)return;
const m=t.closest('.mm');
if(t.matches('.st[data-edit]')){if(!m.classList.contains('kept')){t.contentEditable='true';t.focus()}return}
if(t.hasAttribute('data-who'))t.parentElement.classList.toggle('open');
if(t.hasAttribute('data-pick')){const w=t.closest('.who'),v=label[t.dataset.pick];w.querySelector('.who-b').firstChild.textContent=v;w.querySelectorAll('[data-pick]').forEach(b=>b.setAttribute('aria-checked',b===t));w.classList.remove('open');m.querySelector('[data-who-label]').textContent=v}
if(t.hasAttribute('data-keep')){stopEdit();m.classList.remove('why-on');m.classList.add('kept')}
if(t.hasAttribute('data-no')){stopEdit();m.classList.add('no')}
if(t.hasAttribute('data-undo'))m.classList.remove('kept','no');
if(t.hasAttribute('data-why'))m.classList.toggle('why-on');
if(t.hasAttribute('data-edit-btn')){const o=m.querySelector('.mm-b>.st');o.contentEditable='true';o.focus()}
});
const fade=s=>{s.classList.toggle('ov-t',s.scrollTop>1);s.classList.toggle('ov-b',s.scrollTop+s.clientHeight<s.scrollHeight-1)};
document.querySelectorAll('[data-scroll-area]').forEach(s=>{fade(s);s.addEventListener('scroll',()=>fade(s));new ResizeObserver(()=>fade(s)).observe(s.firstElementChild)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stopEdit();document.querySelectorAll('.who.open').forEach(w=>w.classList.remove('open'))}});
</script>
</body>
</html>
