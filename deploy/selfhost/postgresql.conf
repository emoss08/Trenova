# PostgreSQL for a self-hosted Trenova.
#
# Sized for a single host with 8 GB of RAM that also runs Redis, MinIO,
# Meilisearch, Temporal and the TMS API and worker. On a larger host raise
# shared_buffers to about a quarter of RAM and effective_cache_size to about
# half, then restart postgres (docker compose restart postgres).
#
# cron.database_name is passed on the command line in compose.yml so it always
# names TRENOVA_DATABASE_NAME.

listen_addresses = '*'
max_connections = 200
max_locks_per_transaction = 256

# TLS. The Trenova postgres image ships a certificate; the API connects with
# sslmode=require, which production configuration insists on.
ssl = on
ssl_cert_file = '/etc/postgresql/ssl/server.crt'
ssl_key_file = '/etc/postgresql/ssl/server.key'

shared_buffers = 1GB
work_mem = 16MB
maintenance_work_mem = 256MB
effective_cache_size = 3GB
wal_buffers = 16MB

random_page_cost = 1.1
effective_io_concurrency = 200

max_worker_processes = 16
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# GTC tails logical replication, so the WAL must be logical and a slot must
# never be allowed to fill the disk.
wal_level = logical
wal_compression = on
wal_keep_size = 512MB
max_replication_slots = 10
max_wal_senders = 15
max_logical_replication_workers = 10
logical_decoding_work_mem = 128MB
max_slot_wal_keep_size = 4GB

checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
min_wal_size = 512MB
max_wal_size = 2GB

autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_insert_scale_factor = 0.05

shared_preload_libraries = 'pg_stat_statements, pg_prewarm, pg_cron'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
pg_prewarm.autoprewarm = on
pg_prewarm.autoprewarm_interval = 300

idle_in_transaction_session_timeout = 30s
lock_timeout = 10s
deadlock_timeout = 1s

log_min_duration_statement = 1000
log_temp_files = 0
log_lock_waits = on
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

track_activities = on
track_counts = on
track_io_timing = on
