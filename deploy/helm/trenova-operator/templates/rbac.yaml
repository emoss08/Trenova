apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "operator.name" . }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Its own namespace: the enrolment bundle, read only, and its own identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "operator.name" . }}-identity
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.enrolmentSecret | quote }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.identitySecret | quote }}]
    verbs: [get, update]
  # Creating a Secret cannot be limited by name; the operator creates only its
  # identity Secret, once.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  # The Lease that lets one operator pod run the instance at a time. Creating
  # one cannot be limited by name either.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [{{ include "operator.name" . | quote }}]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  # Its own Deployment, read while it upgrades itself: a new version that
  # never becomes ready is rolled back.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [{{ include "operator.name" . | quote }}]
    verbs: [get]
---
{{- if .Values.selfUpgrade.enabled }}
# helm-controller's namespace: the operator's own HelmChart, whose version it
# moves to the instance's release, and the Job that installs it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "operator.name" . }}-self
  namespace: {{ .Values.selfUpgrade.helmChartNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [helm.cattle.io]
    resources: [helmcharts]
    resourceNames: [{{ .Release.Name | quote }}]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [{{ printf "helm-install-%s" .Release.Name | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "operator.name" . }}-self
  namespace: {{ .Values.selfUpgrade.helmChartNamespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "operator.name" . }}-self
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.name" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "operator.name" . }}-identity
  labels:
    {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "operator.name" . }}-identity
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.name" . }}
    namespace: {{ .Release.Namespace }}
---
# The target namespace: exactly the kinds the Trenova chart renders, Helm's
# release records and the escrow Secret the operator keeps (Secrets), and what
# readiness is read from.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "operator.name" . }}-release
  namespace: {{ .Values.target.namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  # Log keeping (the chart's logs.enabled): Loki's volume, and Alloy's
  # ServiceAccount and the namespaced Role that lets it read pods and their
  # logs. The operator holds those two permissions itself (below), so it can
  # grant them without the escalate or bind verbs.
  - apiGroups: [""]
    resources: [persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  # A component's recent log lines, for a collect_logs command from the
  # control plane (services/operator/internal/commands).
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters, imagecatalogs]
    verbs: [get, list, watch, create, update, patch, delete]
  # Backups: the chart's daily schedule, and the base backups the operator
  # takes itself (before an update, and the final one); the Barman Cloud
  # object store they go to, whose status says how far back they reach.
  - apiGroups: [postgresql.cnpg.io]
    resources: [scheduledbackups, backups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "operator.name" . }}-release
  namespace: {{ .Values.target.namespace }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "operator.name" . }}-release
subjects:
  - kind: ServiceAccount
    name: {{ include "operator.name" . }}
    namespace: {{ .Release.Namespace }}
