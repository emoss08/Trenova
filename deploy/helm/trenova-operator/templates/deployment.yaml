apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operator.name" . }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
  annotations:
    # The release the operator runs: read from here, never from the pod, so a
    # release that did not rebuild the operator moves it without a restart
    # (services/operator/internal/selfupgrade).
    trenova.app/operator-version: {{ .Chart.Version | quote }}
spec:
  # One operator runs the instance at a time: the pods take a Lease, and only
  # its holder reconciles. A new version starts beside the old one, which keeps
  # the instance until the new pod is ready (it can read its identity and reach
  # the control plane); one that never gets there is rolled back by the old one
  # after progressDeadlineSeconds (services/operator/internal/selfupgrade).
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "operator.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "operator.selector" . | nindent 8 }}
      annotations:
        checksum/values: {{ toYaml .Values.trenovaValues | sha256sum }}
    spec:
      serviceAccountName: {{ include "operator.name" . }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TRENOVA_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TRENOVA_OPERATOR_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TRENOVA_OPERATOR_DEPLOYMENT
              value: {{ include "operator.name" . | quote }}
            - name: TRENOVA_OPERATOR_LEASE
              value: {{ include "operator.name" . | quote }}
            {{- if .Values.selfUpgrade.enabled }}
            # k3s's helm-controller names the release after its HelmChart.
            - name: TRENOVA_OPERATOR_HELMCHART
              value: {{ .Release.Name | quote }}
            - name: TRENOVA_OPERATOR_HELMCHART_NAMESPACE
              value: {{ .Values.selfUpgrade.helmChartNamespace | quote }}
            {{- end }}
            - name: TRENOVA_OPERATOR_TARGET_NAMESPACE
              value: {{ .Values.target.namespace | quote }}
            - name: TRENOVA_OPERATOR_RELEASE
              value: {{ .Values.target.release | quote }}
            # The release's Loki (the Trenova chart's logs.enabled).
            - name: TRENOVA_OPERATOR_LOKI_URL
              value: {{ include "operator.lokiURL" . | quote }}
            - name: TRENOVA_OPERATOR_ENROLMENT_SECRET
              value: {{ .Values.enrolmentSecret | quote }}
            - name: TRENOVA_OPERATOR_IDENTITY_SECRET
              value: {{ .Values.identitySecret | quote }}
            - name: TRENOVA_OPERATOR_CHART
              value: {{ .Values.chart.ref | quote }}
            - name: TRENOVA_OPERATOR_CHART_PLAIN_HTTP
              value: {{ .Values.chart.plainHTTP | quote }}
            - name: TRENOVA_OPERATOR_CHART_VERIFY
              value: {{ .Values.chart.verify | quote }}
            - name: TRENOVA_OPERATOR_VALUES_FILE
              value: /etc/trenova-operator/trenova-values.yaml
            - name: TRENOVA_OPERATOR_POLL_INTERVAL
              value: {{ .Values.pollInterval | quote }}
            - name: TRENOVA_OPERATOR_REPORT_INTERVAL
              value: {{ .Values.reportInterval | quote }}
            - name: TRENOVA_OPERATOR_USAGE_INTERVAL
              value: {{ .Values.usageInterval | quote }}
            - name: TRENOVA_OPERATOR_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: TRENOVA_OPERATOR_STORAGE_PRIVATE_ENDPOINT
              value: {{ .Values.storage.privateEndpoint | quote }}
            - name: TRENOVA_OPERATOR_STORAGE_BUCKET_CORS
              value: {{ .Values.storage.bucketCORS | quote }}
            - name: TRENOVA_OPERATOR_NODE_VCPU
              value: {{ .Values.node.vcpu | int64 | quote }}
            - name: TRENOVA_OPERATOR_NODE_MEMORY_GIB
              value: {{ .Values.node.memoryGiB | int64 | quote }}
            - name: TRENOVA_OPERATOR_NODE_DISK_GIB
              value: {{ .Values.node.diskGiB | int64 | quote }}
            # Helm keeps its registry login and cache under these.
            - name: HOME
              value: /tmp
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: values
              mountPath: /etc/trenova-operator
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Log bundles are written here, then uploaded and removed
            # (TRENOVA_OPERATOR_SCRATCH_DIR, default /scratch).
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: values
          configMap:
            name: {{ include "operator.name" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # At most 256 MiB of lines held while a bundle is shared out, plus the
        # zip of them (services/operator/internal/logs, DefaultCaps).
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
