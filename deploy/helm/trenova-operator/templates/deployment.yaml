apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "operator.name" . }}
  labels:
    {{- include "operator.labels" . | nindent 4 }}
spec:
  # One operator per instance: two would apply the same release at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "operator.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "operator.selector" . | nindent 8 }}
      annotations:
        checksum/values: {{ toYaml .Values.trenovaValues | sha256sum }}
    spec:
      serviceAccountName: {{ include "operator.name" . }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TRENOVA_OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TRENOVA_OPERATOR_TARGET_NAMESPACE
              value: {{ .Values.target.namespace | quote }}
            - name: TRENOVA_OPERATOR_RELEASE
              value: {{ .Values.target.release | quote }}
            - name: TRENOVA_OPERATOR_ENROLMENT_SECRET
              value: {{ .Values.enrolmentSecret | quote }}
            - name: TRENOVA_OPERATOR_IDENTITY_SECRET
              value: {{ .Values.identitySecret | quote }}
            - name: TRENOVA_OPERATOR_CHART
              value: {{ .Values.chart.ref | quote }}
            - name: TRENOVA_OPERATOR_CHART_PLAIN_HTTP
              value: {{ .Values.chart.plainHTTP | quote }}
            - name: TRENOVA_OPERATOR_VALUES_FILE
              value: /etc/trenova-operator/trenova-values.yaml
            - name: TRENOVA_OPERATOR_POLL_INTERVAL
              value: {{ .Values.pollInterval | quote }}
            - name: TRENOVA_OPERATOR_REPORT_INTERVAL
              value: {{ .Values.reportInterval | quote }}
            - name: TRENOVA_OPERATOR_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # Helm keeps its registry login and cache under these.
            - name: HOME
              value: /tmp
            - name: HELM_CACHE_HOME
              value: /tmp/helm/cache
            - name: HELM_CONFIG_HOME
              value: /tmp/helm/config
            - name: HELM_DATA_HOME
              value: /tmp/helm/data
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: values
              mountPath: /etc/trenova-operator
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: values
          configMap:
            name: {{ include "operator.name" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
