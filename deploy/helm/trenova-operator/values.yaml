# The Trenova Cloud operator (services/operator). Install it once per instance
# cluster, after the CloudNativePG operator, with the instance's enrolment
# bundle in a Secret (docs/engineering/operator.md):
#
#   kubectl create namespace trenova-system
#   kubectl -n trenova-system create secret generic trenova-operator-enrolment \
#     --from-file=enrolment.json=enrolment-<instance id>.json
#   helm install trenova-operator oci://ghcr.io/emoss08/charts/trenova-operator \
#     -n trenova-system --version <version>

image:
  repository: ghcr.io/emoss08/trenova/operator
  # Empty: a published chart runs the version and digest its release manifest
  # gives the operator image; a chart from a checkout runs its appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The Secret holding the enrolment bundle the admin issued, as enrolment.json.
# The operator reads it on first start and when staff issue a new one, and
# keeps its own key and certificate in identitySecret, which it creates.
enrolmentSecret: trenova-operator-enrolment
identitySecret: trenova-operator-identity

# Where the Trenova release runs, and its name. The operator reads the
# release's logs from its Loki, http://<fullname>-loki.<namespace>.svc:3100,
# derived from these (TRENOVA_OPERATOR_LOKI_URL).
target:
  namespace: trenova
  release: trenova
  # Create the namespace with this chart. Turn off when something else owns it.
  createNamespace: true

# The Trenova chart, pulled at the version the spec pins.
chart:
  ref: oci://ghcr.io/emoss08/charts/trenova
  # A registry served over plain HTTP; only for a registry inside the cluster
  # (the CI install).
  plainHTTP: false
  # Refuse a chart the release workflow did not sign (a Sigstore bundle in the
  # chart's provenance layer). Turn off only for a chart built inside the cluster
  # (the CI install): the operator would then run whatever the registry serves.
  verify: true

# Where the operator and the release's pods reach the instance's object
# storage, when not at the address the control plane gives (which browsers
# use): a private endpoint inside the provider's network, http or https, such
# as a local instance's MinIO on its Docker network. Empty: the control
# plane's address for both.
storage:
  privateEndpoint: ""
  # Whether the operator sets the documents bucket's CORS rules so browsers
  # can read it from the instance's own address. True for a store that keeps
  # CORS on each bucket (OVH). False for one that keeps it for the whole
  # server and gives buckets no say, such as a local instance's MinIO: asking
  # there is refused, and the operator would warn about it for good.
  bucketCORS: true

# The machine the cluster really runs on, when it is smaller than the plan
# the spec names: a local development instance, where every plan runs on the
# same small machine. Workloads are sized for the smaller of the two in each
# dimension. Zero: the plan's size.
node:
  vcpu: 0
  memoryGiB: 0
  diskGiB: 0

# Values every release of the Trenova chart gets on this cluster, under what
# the spec decides: the hostname, the size, the lifecycle, the components and
# the version. The ingress, storage classes and image overrides belong here.
# ClamAV is part of the machine's sizing: changing clamav.enabled here divides
# every instance's resources again and restarts its PostgreSQL once, which a
# component the spec turns on (docling) never does.
trenovaValues:
  clamav:
    enabled: true
  ingress:
    enabled: true
    className: traefik

# The operator follows the release its instance runs: when the spec names a
# new one, it asks k3s's helm-controller to install its own chart at that
# version (patching its HelmChart in helmChartNamespace, named after this
# release) before it brings Trenova there. An operator installed some other
# way (helm install) finds no HelmChart and leaves its version alone.
selfUpgrade:
  enabled: true
  helmChartNamespace: kube-system

pollInterval: 15s
# At most 1m: the control plane expects a report every minute.
reportInterval: 1m
# How often usage is relayed from the TMS to the control plane, and its answer
# back; at most 15m: a usage window is billed 30 minutes after it ends.
usageInterval: 15m
logLevel: info

resources:
  requests: { cpu: 50m, memory: 96Mi }
  limits: { memory: 512Mi }
nodeSelector: {}
tolerations: []
affinity: {}
