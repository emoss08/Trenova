{{- $cluster := include "trenova.postgresCluster" . -}}
{{- $catalog := include "trenova.postgresClusterOf" (dict "root" . "generation" "") -}}
{{- if and .Values.postgres.generation (not .Values.postgres.restoredFrom) -}}
{{- fail "postgres.generation needs postgres.restoredFrom: the generation and time it was restored from" -}}
{{- end -}}
{{- if le (int .Values.postgres.stopDelay) (int .Values.postgres.smartShutdownTimeout) -}}
{{- fail "postgres.stopDelay must exceed postgres.smartShutdownTimeout: CloudNativePG skips the smart wait otherwise, and the fast shutdown needs time of its own" -}}
{{- end -}}
{{- /*
The Trenova image's tag is its own version, not PostgreSQL's, so the operator
learns the major version from a catalog instead of the tag. Every generation
of the database uses the one catalog.
*/ -}}
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: {{ $catalog }}
  labels:
    {{- include "trenova.labels" (dict "root" . "component" "postgres") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  images:
    - major: {{ .Values.postgres.majorVersion }}
      image: {{ include "trenova.image" (dict "root" . "image" .Values.postgres.image) }}
---
{{ include "trenova.postgresClusterResource" (dict "root" . "name" $cluster "recovery" .Values.postgres.restoredFrom "candidate" false) }}
{{- with .Values.postgres.restore }}
{{- if not $.Values.backup.enabled }}
{{- fail "postgres.restore needs backup.enabled: a database is restored from the backups" }}
{{- end }}
{{- if ne .generation ($.Values.postgres.generation | default "") }}
---
{{ include "trenova.postgresClusterResource" (dict "root" $ "name" (include "trenova.postgresClusterOf" (dict "root" $ "generation" .generation)) "recovery" . "candidate" true) }}
{{- end }}
{{- end }}
