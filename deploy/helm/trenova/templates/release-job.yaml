{{- /*
The release step, once per Helm revision (install, upgrade, rollback), in the
order the database needs it:

  prepare        superuser: the owner, Temporal's and GTC's roles, the temporal databases
  migrate        trenova-db up, as the owner: migrations and reference seeds
  rls-roles      the application and system roles
  publication    superuser: GTC's publication and its grants
  bootstrap      the first organization and administrator, when configured

Every step is idempotent. The API and worker start alongside it and wait for
their role and their schema version, so `helm upgrade --wait --wait-for-jobs`
waits for both without ordering hooks. A stopped release runs no Job.
*/ -}}
{{- if not .Values.stopped }}
{{- $c := dict "root" . "component" "release" -}}
{{- $db := include "trenova.dbSecret" . -}}
{{- $app := include "trenova.appSecret" . -}}
{{- $superuser := printf "%s-superuser" (include "trenova.postgresCluster" .) -}}
{{- $files := include "trenova.name" (dict "root" . "component" "files") -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%d" (include "trenova.name" $c) .Release.Revision }}
  labels:
    {{- include "trenova.labels" $c | nindent 4 }}
spec:
  backoffLimit: 4
  activeDeadlineSeconds: {{ .Values.tms.release.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "trenova.podLabels" $c | nindent 8 }}
      annotations:
        {{- include "trenova.podAnnotations" (dict "root" .) | indent 8 }}
    spec:
      restartPolicy: Never
      {{- include "trenova.podCommon" . | nindent 6 }}
      {{- include "trenova.podSecurity" (dict "uid" 65532) | nindent 6 }}
      initContainers:
        - name: prepare
          image: {{ include "trenova.image" (dict "root" . "image" .Values.postgres.image) }}
          command: [sh, /files/db-prepare.sh]
          env:
            - name: PGHOST
              value: {{ include "trenova.postgresHost" . }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database }}
            {{- include "trenova.secretEnv" (dict "name" "PGUSER" "secret" $superuser "key" "username") | nindent 12 }}
            {{- include "trenova.secretEnv" (dict "name" "PGPASSWORD" "secret" $superuser "key" "password") | nindent 12 }}
            {{- include "trenova.postgresTlsEnv" . | nindent 12 }}
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: OWNER
              value: {{ .Values.postgres.owner }}
            {{- include "trenova.secretEnv" (dict "name" "OWNER_PASSWORD" "secret" $db "key" "password") | nindent 12 }}
            - name: TEMPORAL_ROLE
              value: {{ .Values.postgres.temporalRole }}
            {{- include "trenova.secretEnv" (dict "name" "TEMPORAL_PASSWORD" "secret" $db "key" "temporalPassword") | nindent 12 }}
            - name: GTC_ROLE
              value: {{ .Values.postgres.gtcRole }}
            {{- include "trenova.secretEnv" (dict "name" "GTC_PASSWORD" "secret" $db "key" "gtcPassword") | nindent 12 }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /files
              readOnly: true
            {{- include "trenova.postgresCaMount" . | nindent 12 }}
        - name: migrate
          image: {{ include "trenova.image" (dict "root" . "image" .Values.tms.dbImage) }}
          imagePullPolicy: {{ include "trenova.pullPolicy" .Values.tms.dbImage }}
          args: [up, -env, production]
          env:
            {{- include "trenova.tmsEnv" . | nindent 12 }}
            {{- include "trenova.migratorEnv" . | nindent 12 }}
          {{- with .Values.tms.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            {{- include "trenova.tmsVolumeMounts" . | nindent 12 }}
        - name: rls-roles
          image: {{ include "trenova.image" (dict "root" . "image" .Values.tms.image) }}
          imagePullPolicy: {{ include "trenova.pullPolicy" .Values.tms.image }}
          args: [db, rls, provision-roles]
          env:
            {{- include "trenova.tmsEnv" . | nindent 12 }}
            {{- include "trenova.migratorEnv" . | nindent 12 }}
          {{- with .Values.tms.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            {{- include "trenova.tmsVolumeMounts" . | nindent 12 }}
        - name: publication
          image: {{ include "trenova.image" (dict "root" . "image" .Values.postgres.image) }}
          command: [sh, /files/db-publication.sh]
          env:
            - name: PGHOST
              value: {{ include "trenova.postgresHost" . }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database }}
            {{- include "trenova.secretEnv" (dict "name" "PGUSER" "secret" $superuser "key" "username") | nindent 12 }}
            {{- include "trenova.secretEnv" (dict "name" "PGPASSWORD" "secret" $superuser "key" "password") | nindent 12 }}
            {{- include "trenova.postgresTlsEnv" . | nindent 12 }}
            - name: SINKS_FILE
              value: /files/gtc-sinks.yaml
            - name: GTC_ROLE
              value: {{ .Values.postgres.gtcRole }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /files
              readOnly: true
            {{- include "trenova.postgresCaMount" . | nindent 12 }}
      containers:
        - name: bootstrap
          image: {{ include "trenova.image" (dict "root" . "image" .Values.tms.image) }}
          imagePullPolicy: {{ include "trenova.pullPolicy" .Values.tms.image }}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              if [ -z "${TRENOVA_BOOTSTRAP_ADMIN_EMAIL:-}" ]; then
                echo "Skipping bootstrap: bootstrap.adminEmail is not set"
                exit 0
              fi
              exec trenova db bootstrap
          env:
            {{- include "trenova.tmsEnv" . | nindent 12 }}
            {{- include "trenova.migratorEnv" . | nindent 12 }}
            {{- with .Values.bootstrap }}
            - name: TRENOVA_BOOTSTRAP_ADMIN_SETUP
              value: {{ .adminSetup | default "password" | quote }}
            - name: TRENOVA_BOOTSTRAP_ORG_NAME
              value: {{ .orgName | quote }}
            - name: TRENOVA_BOOTSTRAP_ADMIN_NAME
              value: {{ .adminName | quote }}
            - name: TRENOVA_BOOTSTRAP_ADMIN_EMAIL
              value: {{ .adminEmail | quote }}
            - name: TRENOVA_BOOTSTRAP_TIMEZONE
              value: {{ .timezone | quote }}
            - name: TRENOVA_BOOTSTRAP_STATE
              value: {{ .state | quote }}
            - name: TRENOVA_BOOTSTRAP_CITY
              value: {{ .city | quote }}
            - name: TRENOVA_BOOTSTRAP_POSTAL_CODE
              value: {{ .postalCode | quote }}
            - name: TRENOVA_BOOTSTRAP_ADDRESS_LINE1
              value: {{ .addressLine1 | quote }}
            - name: TRENOVA_BOOTSTRAP_SCAC
              value: {{ .scac | quote }}
            - name: TRENOVA_BOOTSTRAP_DOT_NUMBER
              value: {{ .dotNumber | quote }}
            {{- end }}
            {{- if and .Values.bootstrap.adminEmail (ne .Values.bootstrap.adminSetup "link") }}
            {{- include "trenova.secretEnv" (dict "name" "TRENOVA_BOOTSTRAP_ADMIN_PASSWORD" "secret" $app "key" "bootstrapAdminPassword") | nindent 12 }}
            {{- end }}
          {{- with .Values.tms.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            {{- include "trenova.tmsVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "trenova.tmsVolumes" . | nindent 8 }}
        - name: files
          configMap:
            name: {{ $files }}
{{- end }}
