{{- /*
The release step, run whenever what it runs changes, in the order the database
needs it:

  prepare        superuser: the owner, Temporal's and GTC's roles, the temporal databases
  migrate        trenova-db up, as the owner: migrations and reference seeds
  rls-roles      the application and system roles
  publication    superuser: GTC's publication and its grants
  bootstrap      the first organization and administrator, when configured
  import         instead of bootstrap, while import.id is set and not settled:
                 the instance's data from a tenant archive (Move to Managed)

Every step is idempotent. The API and worker start alongside it and wait for
their role and their schema version, so `helm upgrade --wait --wait-for-jobs`
waits for both without ordering hooks. A stopped release runs no Job, except
while it carries an import: the database and the import run while the
application stays stopped.

The import reads the instance's backups bucket with the backup Secret and the
region's archive keys from import.keysSecret, a Secret the operator makes and
deletes once the import settles; neither is ever a value or an argument. The
import writes its ImportStatus line to the termination log, where the operator
reads it; exit code 2 (refused) fails the Job at once.

When it runs: trenova.app/release-inputs is a hash of the Job's whole spec,
which names its images by digest (tms-db's among them) and carries the
checksums of the configuration and the scripts it runs. An upgrade that leaves
the hash alone renders the Job that already ran, under its name, so Helm
changes nothing and nothing runs again: a release that did not rebuild tms-db
runs no migration. A new hash, or a Job of the same hash that failed, gets a
new Job named after the revision; Helm deletes the one it replaces. A
rollback applies the revision's stored Job, which runs only if it is not the
Job already there. `helm template` has no cluster to look in and always names
the Job after the revision.
*/ -}}
{{- define "trenova.releaseJobSpec" }}
{{- $import := .Values.import | default dict -}}
{{- $importing := and $import.id (not $import.settled) -}}
{{- $c := dict "root" . "component" "release" -}}
{{- $db := include "trenova.dbSecret" . -}}
{{- $app := include "trenova.appSecret" . -}}
{{- $superuser := printf "%s-superuser" (include "trenova.postgresCluster" .) -}}
{{- $files := include "trenova.name" (dict "root" . "component" "files") }}
  backoffLimit: 4
  {{- if $importing }}
  activeDeadlineSeconds: {{ $import.activeDeadlineSeconds }}
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: import
          operator: In
          values: [2]
  {{- else }}
  activeDeadlineSeconds: {{ .Values.tms.release.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "trenova.podLabels" $c | nindent 8 }}
      annotations:
        {{- include "trenova.tmsChecksums" . | nindent 8 }}
        checksum/files: {{ printf "%s\n%s\n%s" (.Files.Get "files/db-prepare.sh") (.Files.Get "files/db-publication.sh") (.Files.Get "files/gtc-sinks.yaml") | sha256sum }}
        {{- include "trenova.podAnnotations" (dict "root" .) | indent 8 }}
    spec:
      restartPolicy: Never
      {{- include "trenova.podCommon" . | nindent 6 }}
      {{- include "trenova.podSecurity" (dict "uid" 65532) | nindent 6 }}
      initContainers:
        - name: prepare
          image: {{ include "trenova.image" (dict "root" . "image" .Values.postgres.image) }}
          command: [sh, /files/db-prepare.sh]
          env:
            - name: PGHOST
              value: {{ include "trenova.postgresHost" . }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database }}
            {{- include "trenova.secretEnv" (dict "name" "PGUSER" "secret" $superuser "key" "username") | nindent 12 }}
            {{- include "trenova.secretEnv" (dict "name" "PGPASSWORD" "secret" $superuser "key" "password") | nindent 12 }}
            {{- include "trenova.postgresTlsEnv" . | nindent 12 }}
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: OWNER
              value: {{ .Values.postgres.owner }}
            {{- include "trenova.secretEnv" (dict "name" "OWNER_PASSWORD" "secret" $db "key" "password") | nindent 12 }}
            - name: TEMPORAL_ROLE
              value: {{ .Values.postgres.temporalRole }}
            {{- include "trenova.secretEnv" (dict "name" "TEMPORAL_PASSWORD" "secret" $db "key" "temporalPassword") | nindent 12 }}
            - name: GTC_ROLE
              value: {{ .Values.postgres.gtcRole }}
            {{- include "trenova.secretEnv" (dict "name" "GTC_PASSWORD" "secret" $db "key" "gtcPassword") | nindent 12 }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /files
              readOnly: true
            {{- include "trenova.postgresCaMount" . | nindent 12 }}
        - name: migrate
          image: {{ include "trenova.image" (dict "root" . "image" .Values.tms.dbImage) }}
          imagePullPolicy: {{ include "trenova.pullPolicy" .Values.tms.dbImage }}
          args: [up, -env, production]
          env:
            {{- include "trenova.tmsEnv" . | nindent 12 }}
            {{- include "trenova.migratorEnv" . | nindent 12 }}
          {{- with .Values.tms.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            {{- include "trenova.tmsVolumeMounts" . | nindent 12 }}
        - name: rls-roles
          image: {{ include "trenova.image" (dict "root" . "image" .Values.tms.image) }}
          imagePullPolicy: {{ include "trenova.pullPolicy" .Values.tms.image }}
          args: [db, rls, provision-roles]
          env:
            {{- include "trenova.tmsEnv" . | nindent 12 }}
            {{- include "trenova.migratorEnv" . | nindent 12 }}
          {{- with .Values.tms.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            {{- include "trenova.tmsVolumeMounts" . | nindent 12 }}
        - name: publication
          image: {{ include "trenova.image" (dict "root" . "image" .Values.postgres.image) }}
          command: [sh, /files/db-publication.sh]
          env:
            - name: PGHOST
              value: {{ include "trenova.postgresHost" . }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database }}
            {{- include "trenova.secretEnv" (dict "name" "PGUSER" "secret" $superuser "key" "username") | nindent 12 }}
            {{- include "trenova.secretEnv" (dict "name" "PGPASSWORD" "secret" $superuser "key" "password") | nindent 12 }}
            {{- include "trenova.postgresTlsEnv" . | nindent 12 }}
            - name: SINKS_FILE
              value: /files/gtc-sinks.yaml
            - name: GTC_ROLE
              value: {{ .Values.postgres.gtcRole }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /files
              readOnly: true
            {{- include "trenova.postgresCaMount" . | nindent 12 }}
      containers:
        {{- if $importing }}
        {{- $backup := required "import needs backup.existingSecret, the instance's backups bucket credential" .Values.backup.existingSecret }}
        - name: import
          image: {{ include "trenova.image" (dict "root" . "image" .Values.tms.image) }}
          imagePullPolicy: {{ include "trenova.pullPolicy" .Values.tms.image }}
          args:
            - db
            - import-archive
            - --id={{ required "import.id" $import.id }}
            - --endpoint={{ required "import needs backup.endpointURL" .Values.backup.endpointURL }}
            - --region=$(TRENOVA_IMPORT_REGION)
            - --bucket={{ required "import.bucket" $import.bucket }}
            - --access-key-id=$(TRENOVA_IMPORT_ACCESS_KEY_ID)
            - --expect-sha256={{ required "import.expectSha256" $import.expectSha256 }}
            - --status-file=/dev/termination-log
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          env:
            {{- include "trenova.tmsEnv" . | nindent 12 }}
            {{- include "trenova.migratorEnv" . | nindent 12 }}
            {{- include "trenova.secretEnv" (dict "name" "TRENOVA_IMPORT_ACCESS_KEY_ID" "secret" $backup "key" "ACCESS_KEY_ID") | nindent 12 }}
            {{- include "trenova.secretEnv" (dict "name" "TRENOVA_IMPORT_SECRET_ACCESS_KEY" "secret" $backup "key" "ACCESS_SECRET_KEY") | nindent 12 }}
            {{- include "trenova.secretEnv" (dict "name" "TRENOVA_IMPORT_REGION" "secret" $backup "key" "ACCESS_REGION") | nindent 12 }}
            {{- include "trenova.secretEnv" (dict "name" "TRENOVA_IMPORT_ARCHIVE_KEYS" "secret" (required "import.keysSecret" $import.keysSecret) "key" "archiveKeys") | nindent 12 }}
          {{- with .Values.tms.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            {{- include "trenova.tmsVolumeMounts" . | nindent 12 }}
        {{- else }}
        - name: bootstrap
          image: {{ include "trenova.image" (dict "root" . "image" .Values.tms.image) }}
          imagePullPolicy: {{ include "trenova.pullPolicy" .Values.tms.image }}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              if [ -z "${TRENOVA_BOOTSTRAP_ADMIN_EMAIL:-}" ]; then
                echo "Skipping bootstrap: bootstrap.adminEmail is not set"
                exit 0
              fi
              exec trenova db bootstrap
          env:
            {{- include "trenova.tmsEnv" . | nindent 12 }}
            {{- include "trenova.migratorEnv" . | nindent 12 }}
            {{- with .Values.bootstrap }}
            - name: TRENOVA_BOOTSTRAP_ADMIN_SETUP
              value: {{ .adminSetup | default "password" | quote }}
            - name: TRENOVA_BOOTSTRAP_ORG_NAME
              value: {{ .orgName | quote }}
            - name: TRENOVA_BOOTSTRAP_ADMIN_NAME
              value: {{ .adminName | quote }}
            - name: TRENOVA_BOOTSTRAP_ADMIN_EMAIL
              value: {{ .adminEmail | quote }}
            - name: TRENOVA_BOOTSTRAP_TIMEZONE
              value: {{ .timezone | quote }}
            - name: TRENOVA_BOOTSTRAP_STATE
              value: {{ .state | quote }}
            - name: TRENOVA_BOOTSTRAP_CITY
              value: {{ .city | quote }}
            - name: TRENOVA_BOOTSTRAP_POSTAL_CODE
              value: {{ .postalCode | quote }}
            - name: TRENOVA_BOOTSTRAP_ADDRESS_LINE1
              value: {{ .addressLine1 | quote }}
            - name: TRENOVA_BOOTSTRAP_SCAC
              value: {{ .scac | quote }}
            - name: TRENOVA_BOOTSTRAP_DOT_NUMBER
              value: {{ .dotNumber | quote }}
            {{- end }}
            {{- if and .Values.bootstrap.adminEmail (ne .Values.bootstrap.adminSetup "link") }}
            {{- include "trenova.secretEnv" (dict "name" "TRENOVA_BOOTSTRAP_ADMIN_PASSWORD" "secret" $app "key" "bootstrapAdminPassword") | nindent 12 }}
            {{- end }}
          {{- with .Values.tms.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "trenova.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          resources:
            {{- toYaml .Values.tms.release.resources | nindent 12 }}
          volumeMounts:
            {{- include "trenova.tmsVolumeMounts" . | nindent 12 }}
        {{- end }}
      volumes:
        {{- include "trenova.tmsVolumes" . | nindent 8 }}
        - name: files
          configMap:
            name: {{ $files }}
{{- end }}
{{- define "trenova.jobFailed" -}}
{{- range (dig "status" "conditions" list .) -}}
{{- if and (eq (toString (get . "type")) "Failed") (eq (toString (get . "status")) "True") -}}
failed
{{- end -}}
{{- end -}}
{{- end -}}
{{- $import := .Values.import | default dict -}}
{{- $importing := and $import.id (not $import.settled) -}}
{{- if or (not .Values.stopped) $import.id }}
{{- $c := dict "root" . "component" "release" -}}
{{- $spec := include "trenova.releaseJobSpec" . -}}
{{- $inputs := sha256sum $spec | trunc 16 -}}
{{- $name := printf "%s-%d" (include "trenova.name" $c) .Release.Revision -}}
{{- range $job := get (lookup "batch/v1" "Job" .Release.Namespace "") "items" | default list -}}
{{- $meta := get $job "metadata" | default dict -}}
{{- if and (eq (dig "labels" "app.kubernetes.io/instance" "" $meta) $.Release.Name) (eq (dig "labels" "app.kubernetes.io/component" "" $meta) "release") (eq (dig "annotations" "trenova.app/release-inputs" "" $meta) $inputs) (not (include "trenova.jobFailed" $job)) -}}
{{- $name = get $meta "name" -}}
{{- end -}}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "trenova.labels" $c | nindent 4 }}
  annotations:
    trenova.app/release-inputs: {{ $inputs | quote }}
    {{- if $importing }}
    trenova.app/import: {{ $import.id | quote }}
    {{- end }}
spec:{{ $spec }}
{{- end }}
