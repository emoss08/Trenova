{{- if .Values.ingress.enabled }}
{{- $c := dict "root" . "component" "client" }}
{{- $hosts := list .Values.domain }}
{{- if .Values.minio.enabled }}
{{- $hosts = append $hosts .Values.storageDomain }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trenova.fullname" . }}
  labels:
    {{- include "trenova.labels" $c | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- toYaml $hosts | nindent 8 }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "trenova.fullname" .)) }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "trenova.name" $c }}
                port:
                  name: http
    {{- end }}
{{- end }}
