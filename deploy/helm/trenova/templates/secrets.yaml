{{- /*
Secrets the chart generates when none are supplied. Each is generated once:
an upgrade reads the live Secret back (lookup) and keeps every value, a value
added by a newer chart is generated on the upgrade that adds it, and
resource-policy keep leaves the Secret behind on uninstall, so a reinstall
over the same volumes still reads its data.
*/ -}}
{{- define "trenova.keep" -}}
{{- if hasKey .live .key -}}
{{- index .live .key -}}
{{- else -}}
{{- .value | b64enc -}}
{{- end -}}
{{- end -}}

{{- /*
A private CA and the server and client certificates a component and the TMS
authenticate each other with. Issued once and read back on every upgrade, so
they survive it; delete both Secrets and upgrade to reissue. The server's
certificate also authenticates as a client (sprig issues it for both), which
Temporal's services need to call each other. Call with (dict "root" $
"component" c "tls" .Values.<c>.tls "caName" n "serverSecret" s "clientSecret" s).
*/ -}}
{{- define "trenova.mutualTls" -}}
{{- $root := .root -}}
{{- $tls := .tls -}}
{{- if or (not $tls.existingServerSecret) (not $tls.existingClientSecret) }}
{{- $server := (lookup "v1" "Secret" $root.Release.Namespace .serverSecret).data | default dict }}
{{- $client := (lookup "v1" "Secret" $root.Release.Namespace .clientSecret).data | default dict }}
{{- $issued := dict }}
{{- if and (hasKey $server "tls.crt") (hasKey $client "tls.crt") (eq (index $server "ca.crt") (index $client "ca.crt")) }}
{{- $issued = dict
  "ca" (index $server "ca.crt")
  "serverCert" (index $server "tls.crt") "serverKey" (index $server "tls.key")
  "clientCert" (index $client "tls.crt") "clientKey" (index $client "tls.key") }}
{{- else }}
{{- $days := int $tls.validityDays }}
{{- $ns := $root.Release.Namespace }}
{{- $service := include "trenova.name" (dict "root" $root "component" .component) }}
{{- $caKey := genPrivateKey "ecdsa" }}
{{- $ca := genCAWithKey .caName $days $caKey }}
{{- $serverKey := genPrivateKey "ecdsa" }}
{{- $serverCert := genSignedCertWithKey $service nil (list $service (printf "%s.%s" $service $ns) (printf "%s.%s.svc" $service $ns) (printf "%s.%s.svc.cluster.local" $service $ns)) $days $ca $serverKey }}
{{- $clientKey := genPrivateKey "ecdsa" }}
{{- $clientCert := genSignedCertWithKey "trenova-tms" nil nil $days $ca $clientKey }}
{{- $issued = dict
  "ca" ($ca.Cert | b64enc)
  "serverCert" ($serverCert.Cert | b64enc) "serverKey" ($serverCert.Key | b64enc)
  "clientCert" ($clientCert.Cert | b64enc) "clientKey" ($clientCert.Key | b64enc) }}
{{- end }}
{{- if not $tls.existingServerSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .serverSecret }}
  labels:
    {{- include "trenova.labels" (dict "root" $root "component" .component) | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $issued.ca }}
  tls.crt: {{ $issued.serverCert }}
  tls.key: {{ $issued.serverKey }}
{{- end }}
{{- if not $tls.existingClientSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .clientSecret }}
  labels:
    {{- include "trenova.labels" (dict "root" $root "component" .component) | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $issued.ca }}
  tls.crt: {{ $issued.clientCert }}
  tls.key: {{ $issued.clientKey }}
{{- end }}
{{- end }}
{{- end -}}

{{- if not .Values.secrets.existingSecret }}
{{- $name := include "trenova.appSecret" . }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "trenova.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  sessionSecret: {{ include "trenova.keep" (dict "live" $live "key" "sessionSecret" "value" (randAlphaNum 64)) }}
  encryptionKey: {{ include "trenova.keep" (dict "live" $live "key" "encryptionKey" "value" (randAlphaNum 64)) }}
  mfaRecoveryCodePepper: {{ include "trenova.keep" (dict "live" $live "key" "mfaRecoveryCodePepper" "value" (randAlphaNum 64)) }}
  systemUserPassword: {{ include "trenova.keep" (dict "live" $live "key" "systemUserPassword" "value" (randAlphaNum 32)) }}
  redisPassword: {{ include "trenova.keep" (dict "live" $live "key" "redisPassword" "value" (randAlphaNum 40)) }}
  meiliMasterKey: {{ include "trenova.keep" (dict "live" $live "key" "meiliMasterKey" "value" (randAlphaNum 40)) }}
  rlsScopeKeyId: {{ include "trenova.keep" (dict "live" $live "key" "rlsScopeKeyId" "value" (printf "k%s" (now | date "20060102"))) }}
  rlsScopeKey: {{ include "trenova.keep" (dict "live" $live "key" "rlsScopeKey" "value" (randBytes 48)) }}
  storageAccessKey: {{ include "trenova.keep" (dict "live" $live "key" "storageAccessKey" "value" "trenova") }}
  storageSecretKey: {{ include "trenova.keep" (dict "live" $live "key" "storageSecretKey" "value" (randAlphaNum 40)) }}
  doclingApiKey: {{ include "trenova.keep" (dict "live" $live "key" "doclingApiKey" "value" (randAlphaNum 40)) }}
  gotenbergPassword: {{ include "trenova.keep" (dict "live" $live "key" "gotenbergPassword" "value" (randAlphaNum 40)) }}
  bootstrapAdminPassword: {{ include "trenova.keep" (dict "live" $live "key" "bootstrapAdminPassword" "value" (randAlphaNum 24)) }}
{{- end }}
{{- if not .Values.postgres.existingSecret }}
{{- $name := include "trenova.dbSecret" . }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "trenova.labels" (dict "root" . "component" "db") | nindent 4 }}
    cnpg.io/reload: "true"
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.postgres.owner | b64enc }}
  password: {{ include "trenova.keep" (dict "live" $live "key" "password" "value" (randAlphaNum 40)) }}
  appPassword: {{ include "trenova.keep" (dict "live" $live "key" "appPassword" "value" (randAlphaNum 40)) }}
  systemPassword: {{ include "trenova.keep" (dict "live" $live "key" "systemPassword" "value" (randAlphaNum 40)) }}
  temporalPassword: {{ include "trenova.keep" (dict "live" $live "key" "temporalPassword" "value" (randAlphaNum 40)) }}
  gtcPassword: {{ include "trenova.keep" (dict "live" $live "key" "gtcPassword" "value" (randAlphaNum 40)) }}
{{- end }}
{{ include "trenova.mutualTls" (dict
  "root" . "component" "imaging" "tls" .Values.imaging.tls "caName" "Trenova imaging CA"
  "serverSecret" (include "trenova.imagingServerSecret" .)
  "clientSecret" (include "trenova.imagingClientSecret" .)) }}
{{ include "trenova.mutualTls" (dict
  "root" . "component" "temporal" "tls" .Values.temporal.tls "caName" "Trenova Temporal CA"
  "serverSecret" (include "trenova.temporalServerSecret" .)
  "clientSecret" (include "trenova.temporalClientSecret" .)) }}
