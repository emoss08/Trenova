<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trenova — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
@property --beam{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:oklch(0 0 0);--panel:oklch(0.055 0 0);--card:oklch(0.14 0 0);--card-2:oklch(0.18 0 0);--fg:oklch(1 0 0);--muted-fg:oklch(0.72 0 0);--subtle-fg:oklch(0.68 0 0);--border:oklch(0.26 0 0);--border-2:oklch(0.20 0 0);--input:oklch(0.32 0 0);--field:oklch(0.11 0 0);--ring:oklch(1 0 0/0.22);--danger:oklch(0.68 0.19 27);--shadow:0 1px 2px oklch(0 0 0/.5),0 30px 70px -30px oklch(0 0 0/.9);--ease:cubic-bezier(.2,.8,.2,1)}
.theme-light{--bg:oklch(0.985 0 0);--panel:oklch(0.965 0 0);--card:oklch(1 0 0);--card-2:oklch(0.975 0 0);--fg:oklch(0.145 0 0);--muted-fg:oklch(0.48 0 0);--subtle-fg:oklch(0.52 0 0);--border:oklch(0.91 0 0);--border-2:oklch(0.94 0 0);--input:oklch(0.88 0 0);--field:oklch(0.99 0 0);--ring:oklch(0.145 0 0/0.14);--danger:oklch(0.55 0.22 27);--shadow:0 1px 2px oklch(0 0 0/.05),0 24px 50px -28px oklch(0 0 0/.3)}
.motion-off *,.motion-off *::before,.motion-off *::after{animation:none!important;transition:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Geist',system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-0.006em}
#root{height:100%}
.m{font-family:'Geist Mono',ui-monospace,monospace;font-feature-settings:"tnum"}
a{color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in oklch,var(--fg) 35%,transparent)}
a:hover{text-decoration-color:var(--fg)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
::selection{background:color-mix(in oklch,var(--fg) 18%,transparent)}

/* shell */
.shell{height:100%;display:grid;grid-template-columns:1fr clamp(440px,42%,560px);overflow:hidden}
.shell.solo{grid-template-columns:1fr}
@media (max-width:900px){.shell{grid-template-columns:1fr}.aside{display:none!important}}

/* left panel */
.aside{position:relative;background:var(--panel);border-right:1px solid var(--border-2);padding:40px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;min-width:0}
.aside .weave{position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(to right,color-mix(in oklch,var(--fg) 5%,transparent) 1px,transparent 1px),linear-gradient(to bottom,color-mix(in oklch,var(--fg) 5%,transparent) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(85% 65% at 18% 28%,#000,transparent 76%)}
.aura{position:absolute;width:120%;aspect-ratio:1;left:-30%;top:-30%;pointer-events:none;background:radial-gradient(circle,color-mix(in oklch,var(--fg) 7%,transparent),transparent 62%);transition:transform 900ms var(--ease),opacity 900ms var(--ease)}
.aside[data-step="org"] .aura{transform:translate(18%,26%)}
.aside[data-step="role"] .aura{transform:translate(30%,48%)}
.aside[data-step="done"] .aura{transform:translate(24%,40%) scale(1.15);opacity:1.4}
.metrics{position:relative;display:flex;gap:40px;white-space:nowrap}
.metrics b{display:block;font-size:24px;font-weight:500;letter-spacing:-0.035em;font-variant-numeric:tabular-nums;line-height:1.1}
.metrics span{display:block;font-size:11.5px;color:var(--subtle-fg);margin-top:2px}
.lanes{position:relative;display:flex;flex-direction:column;gap:8px;mask-image:linear-gradient(to right,transparent,#000 8%,#000 82%,transparent)}
.lane-track{display:flex;gap:8px;width:max-content;animation:drift 34s linear infinite}
.lane-track.rev{animation-direction:reverse;animation-duration:44s}
@keyframes drift{to{transform:translateX(-50%)}}
.lane{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--border-2);border-radius:999px;font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--subtle-fg);white-space:nowrap;background:color-mix(in oklch,var(--card) 40%,transparent)}
.lane em{font-style:normal;color:var(--muted-fg)}
.lane i{width:4px;height:4px;border-radius:50%;background:var(--muted-fg);flex:none}
@media (max-height:620px){.lanes,.metrics{display:none}}
.scan{position:absolute;left:0;right:0;height:140px;pointer-events:none;background:linear-gradient(to bottom,transparent,color-mix(in oklch,var(--fg) 5%,transparent),transparent);animation:scan 13s linear infinite}
@keyframes scan{0%{transform:translateY(-160px)}100%{transform:translateY(110vh)}}
.brandline{position:relative;display:flex;align-items:center;gap:10px}
.brandline img{width:24px;height:24px;object-fit:contain}
.env{font-family:'Geist Mono',monospace;font-size:10.5px;color:var(--subtle-fg);border-left:1px solid var(--border);padding-left:10px;margin-left:2px}
.wordmark{font-size:14px;font-weight:600;letter-spacing:-0.02em;color:var(--fg)}
.pitch{position:relative;max-width:19ch;font-size:31px;line-height:1.14;letter-spacing:-0.038em;font-weight:500;text-wrap:balance;margin:0}
.pitch span{color:var(--subtle-fg)}

/* receipt */
.receipt{position:relative;width:100%;max-width:392px;border:1px solid var(--border-2);border-radius:12px;background:color-mix(in oklch,var(--card) 60%,transparent);backdrop-filter:blur(6px)}
.rrow .v.pending{position:relative;display:block;height:15px}
.rrow .v.pending::after{content:'';position:absolute;left:0;top:50%;width:52px;height:1px;background:linear-gradient(90deg,transparent,color-mix(in oklch,var(--fg) 45%,transparent),transparent);animation:sweep 2.6s var(--ease) infinite}
@keyframes sweep{0%{transform:translateX(-10px);opacity:0}30%{opacity:1}100%{transform:translateX(70px);opacity:0}}
.receipt-h{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px dashed var(--border-2)}
.rcap{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:0;color:var(--subtle-fg);white-space:nowrap}
.rrow{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:baseline;padding:10px 14px;border-bottom:1px dashed var(--border-2)}
.rrow:last-child{border-bottom:0}
.rrow .k{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:0;color:var(--subtle-fg)}
.rrow .v{font-size:12.5px;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .v.pending{color:var(--subtle-fg);font-family:'Geist Mono',monospace;font-size:11px}
.rrow .v.fill{animation:fill 420ms var(--ease) both}
@keyframes fill{from{opacity:0;transform:translateY(5px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.stamp{position:absolute;right:14px;bottom:12px;font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--fg);border-radius:4px;padding:3px 7px;transform:rotate(-4deg);animation:stamp 380ms var(--ease) both}
@keyframes stamp{from{opacity:0;transform:rotate(-4deg) scale(1.5)}to{opacity:1;transform:rotate(-4deg) scale(1)}}
.foot{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap;white-space:nowrap;font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:0;color:var(--subtle-fg)}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:5px;height:5px;border-radius:50%;background:var(--fg);animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}

/* right */
.main{position:relative;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;justify-items:center;padding:40px 24px;overflow:auto;scrollbar-gutter:stable}
.col{width:min(400px,100%);max-width:100%;display:flex;flex-direction:column;gap:16px}
.solo .col .mobile-brand{display:flex}
.mobile-brand{display:none;align-items:center;gap:10px;justify-content:center;margin-bottom:4px}
@media (max-width:900px){.mobile-brand{display:flex}}

.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.card>.inner{border-radius:14px;overflow:hidden}
.card-h{transition:height 320ms var(--ease)}
.beamring{position:absolute;inset:-1px;border-radius:15px;padding:1px;background:conic-gradient(from var(--beam),transparent 0deg,var(--fg) 26deg,transparent 64deg);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;opacity:0;transition:opacity 240ms;pointer-events:none}
.card.busy .beamring{opacity:.85;animation:spinbeam 1.3s linear infinite}
@keyframes spinbeam{to{--beam:360deg}}
.pad{padding:22px}
.crumbs{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.count{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:0;color:var(--subtle-fg)}
.title{font-size:17px;font-weight:600;letter-spacing:-0.028em;margin:0}
.sub{margin:4px 0 0;font-size:12.5px;color:var(--muted-fg)}
.enter{animation:enter 300ms var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* segmented audience */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;position:relative;background:var(--field);border:1px solid var(--border-2);border-radius:9px;padding:3px;margin:16px 0 18px}
.seg button{position:relative;z-index:1;background:none;border:0;border-radius:6px;padding:7px 0;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--subtle-fg);transition:color 180ms var(--ease)}
.seg button.on{color:var(--fg)}
.seg .knob{position:absolute;top:3px;bottom:3px;border-radius:6px;background:var(--card-2);border:1px solid var(--border);transition:transform 320ms var(--ease),width 320ms var(--ease)}

.field{display:flex;flex-direction:column;gap:6px}
.lab{font-size:11.5px;font-weight:500;color:var(--muted-fg);white-space:nowrap}
.lab i{font-style:normal;color:var(--danger)}
.ctl{position:relative;display:flex;align-items:center;background:var(--field);border:1px solid var(--border);border-radius:9px;transition:border-color 180ms var(--ease),box-shadow 180ms var(--ease)}
.ctl:focus-within{border-color:color-mix(in oklch,var(--fg) 50%,transparent);box-shadow:0 0 0 3px var(--ring)}
.ctl.bad{border-color:color-mix(in oklch,var(--danger) 65%,transparent);animation:shake 260ms var(--ease)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.ctl input{flex:1;min-width:0;background:none;border:0;outline:none;padding:10px 12px;font-size:13px;color:var(--fg)}
.ctl input::placeholder{color:var(--subtle-fg)}
.ghosty{background:none;border:0;padding:0 12px;font-size:11.5px;font-weight:500;color:var(--subtle-fg);transition:color 140ms}
.ghosty:hover{color:var(--fg)}
.err{font-size:11.5px;color:var(--danger);animation:enter 200ms var(--ease) both}

.btn{width:100%;height:40px;border-radius:9px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-size:13px;font-weight:550;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;transition:filter 140ms,transform 140ms var(--ease)}
.btn:hover{filter:opacity(.9)}
.btn:active{transform:scale(.988)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .lbl{display:inline-flex;align-items:center;gap:8px;animation:enter 220ms var(--ease) both}
.btn-2{background:transparent;color:var(--fg);border-color:var(--border)}
.btn-2:hover{background:color-mix(in oklch,var(--fg) 6%,transparent);border-color:var(--input)}
.btn-link{width:auto;height:auto;background:none;border:0;color:var(--muted-fg);font-size:12px;padding:0;display:inline-flex;gap:6px;align-items:center;transition:color 140ms}
.btn-link:hover{color:var(--fg)}
.spin{width:14px;height:14px;border-radius:50%;border:1.5px solid color-mix(in oklch,currentColor 30%,transparent);border-top-color:currentColor;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* option rows */
.stack{display:flex;flex-direction:column;gap:8px}
.opt{position:relative;width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--border-2);background:var(--field);border-radius:10px;text-align:left;transition:border-color 180ms var(--ease),background 180ms var(--ease),transform 180ms var(--ease)}
.opt:hover{border-color:var(--border);background:color-mix(in oklch,var(--fg) 4%,var(--field))}
.opt:focus-visible{outline:none;border-color:color-mix(in oklch,var(--fg) 50%,transparent);box-shadow:0 0 0 3px var(--ring)}
.opt.on{border-color:color-mix(in oklch,var(--fg) 60%,transparent);background:color-mix(in oklch,var(--fg) 7%,var(--field))}
.opt:active{transform:scale(.994)}
.av{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--card-2);border:1px solid var(--border-2);font-family:'Geist Mono',monospace;font-size:11px;font-weight:500;color:var(--muted-fg);transition:color 180ms,border-color 180ms}
.opt.on .av{color:var(--fg);border-color:var(--border)}
.nm{font-size:13px;font-weight:550;letter-spacing:-0.005em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:11.5px;color:var(--subtle-fg);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:10.5px;font-weight:500;letter-spacing:0;color:var(--subtle-fg);border:1px solid var(--border-2);border-radius:999px;padding:2px 8px;white-space:nowrap}
.sk{font-family:'Geist Mono',monospace;font-size:10px;color:var(--subtle-fg);border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;opacity:0;transition:opacity 160ms}
.opt:hover .sk,.opt:focus-visible .sk{opacity:1}
.mk{width:18px;height:18px;flex:none;border-radius:50%;border:1px solid var(--input);display:grid;place-items:center;transition:background 180ms var(--ease),border-color 180ms}
.opt.on .mk{background:var(--fg);border-color:var(--fg)}
.mk svg{opacity:0;transform:scale(.5);transition:opacity 160ms var(--ease),transform 240ms var(--ease);color:var(--bg)}
.opt.on .mk svg{opacity:1;transform:none}

.rule{display:flex;align-items:center;gap:10px;color:var(--subtle-fg);font-size:11px;letter-spacing:0}
.rule::before,.rule::after{content:'';flex:1;height:1px;background:var(--border-2)}
.sso{display:flex;align-items:center;justify-content:center;gap:9px;height:38px;white-space:nowrap;border-radius:9px;border:1px solid var(--border);background:transparent;font-size:12.5px;font-weight:500;transition:background 140ms,border-color 140ms}
.sso:hover{background:color-mix(in oklch,var(--fg) 5%,transparent);border-color:var(--input)}
.sso img{height:14px;width:auto}
.sso img.inv{filter:invert(1) brightness(1.7)}
.theme-light .sso img.inv{filter:none}

.tray{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:11.5px;color:var(--subtle-fg);white-space:nowrap}
.kbd{font-family:'Geist Mono',monospace;font-size:10px;white-space:nowrap;border:1px solid var(--border-2);border-radius:4px;padding:1px 5px;color:var(--subtle-fg)}
.legal{font-size:11.5px;color:var(--subtle-fg);text-align:center;text-wrap:balance}
.legal a{color:var(--muted-fg)}

/* done */
.done{display:flex;flex-direction:column;align-items:center;gap:16px;padding:38px 24px}
.ring{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;animation:pop 460ms var(--ease) both}
.ring::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--fg);opacity:0;animation:halo 900ms var(--ease) 120ms}
@keyframes halo{0%{opacity:.5;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:22;stroke-dashoffset:22;animation:draw 460ms var(--ease) 140ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{width:100%;height:2px;border-radius:2px;background:var(--border-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--fg);width:0;animation:load 1.6s var(--ease) forwards}
@keyframes load{to{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
