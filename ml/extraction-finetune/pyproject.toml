[project]
name = "trenova-extraction-finetune"
version = "1.0.0"
description = "Fine-tune an open model for Trenova's document extraction on anonymized training exports"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
train = [
  "torch>=2.13,<3",
  "transformers>=5.17,<6",
  "trl>=1.14,<2",
  "peft>=0.21,<1",
  "datasets>=5.0,<6",
  "accelerate>=1.0,<2",
  "bitsandbytes>=0.45; platform_system == 'Linux'",
]
predict = [
  "vllm>=0.30,<1",
]
quantize = [
  "llmcompressor>=0.14,<0.15",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.uv]
conflicts = [
  [{ extra = "predict" }, { extra = "quantize" }],
]

[project.scripts]
trenova-finetune = "trenova_finetune.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trenova_finetune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
