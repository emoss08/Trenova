[package]
name = "trenova-capture-update"
description = "The Trenova Capture updater: a Windows service that installs a newer release once it has verified the manifest, the download and the installer's own signature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "trenova_capture_update"
path = "src/lib.rs"

[[bin]]
name = "trenova-capture-update"
path = "src/main.rs"

[dependencies]
capture-protocol.workspace = true
capture-update.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
capture-platform.workspace = true
windows-core.workspace = true
windows-service.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
capture-update.workspace = true
tempfile.workspace = true
wiremock.workspace = true
sha2.workspace = true
hex.workspace = true

[lints]
workspace = true
